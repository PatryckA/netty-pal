<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netty Pal</title>
<meta name="description" content="Court time, positions and live scoring for junior netball teams.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0D">
<link rel="icon" href="icon-netball-192.png">
<link rel="apple-touch-icon" href="icon-netball-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Netty Pal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
:root{
  /* Backstage: black and white with one hot pink. Light mode. */
  --paper:#F5F5F6; --surface:#FFFFFF; --surface-2:#F0F0F2; --line:#E1E1E5;
  --ink:#0B0B0D; --ink-soft:#5F5F66; --accent:#0B0B0D; --accent-strong:#2A2A30;
  --accent-contrast:#FFFFFF; --accent-bg:#FFE3F0; --warm:#C8641C; --warm-bg:#F7E6D6;
  --ok:#2E7550; --ok-bg:#DDEEE3; --critical:#B3261E; --critical-bg:#F6DEDC;
  --shadow:rgba(11,11,13,0.10);
  /* Hot pink: --pop fills (with --pop-ink text), --pop-text for pink words. */
  --pop:#E6006F; --pop-ink:#FFFFFF; --pop-text:#C2005E;
  /* Top bar: black with white text in both modes, and a black and white stripe under it. */
  --bar:#0B0B0D; --bar-ink:#FFFFFF; --bar-soft:#B4B4BC; --bar-line:#0B0B0D;
  /* Corners: crisp, nearly square. */
  --r:4px; --r-sm:3px; --r-pill:3px;
  --font-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0B0D; --surface:#17171A; --surface-2:#1F1F23; --line:#2E2E34;
    --ink:#F5F5F7; --ink-soft:#A6A6AE; --accent:#F5F5F7; --accent-strong:#FFFFFF;
    --accent-contrast:#0B0B0D; --accent-bg:#3A1027; --warm:#F0A060; --warm-bg:#3A2819;
    --ok:#74C497; --ok-bg:#1A3325; --critical:#F08A82; --critical-bg:#3D1F1D;
    --shadow:rgba(0,0,0,0.5);
    --pop:#FF4D9A; --pop-ink:#0B0B0D; --pop-text:#FF6FAE;
    --bar:#000000; --bar-line:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0B0D; --surface:#17171A; --surface-2:#1F1F23; --line:#2E2E34;
  --ink:#F5F5F7; --ink-soft:#A6A6AE; --accent:#F5F5F7; --accent-strong:#FFFFFF;
  --accent-contrast:#0B0B0D; --accent-bg:#3A1027; --warm:#F0A060; --warm-bg:#3A2819;
  --ok:#74C497; --ok-bg:#1A3325; --critical:#F08A82; --critical-bg:#3D1F1D;
  --shadow:rgba(0,0,0,0.5);
  --pop:#FF4D9A; --pop-ink:#0B0B0D; --pop-text:#FF6FAE;
  --bar:#000000; --bar-line:#000000;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-stretch:62%; /* only Archivo (the display face) has narrow widths, so body text is unchanged */
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
h1,h2,h3{font-family:var(--font-display); font-weight:800; margin:0; letter-spacing:0.01em; text-wrap:balance;}
button{font-family:var(--font-body);}
input,select{font-family:var(--font-body); font-size:1rem;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.app-shell{max-width:640px; margin:0 auto; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:10; color:var(--bar-ink); padding-bottom:6px;
  /* The Backstage stripe: a 6px black and white band along the bottom of the bar. */
  background:repeating-linear-gradient(90deg, var(--bar-ink) 0 6px, var(--bar) 6px 12px) bottom / 100% 6px no-repeat, var(--bar);
}
.topbar-inner{
  max-width:640px; margin:0 auto; padding:0.75rem 1rem;
  display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
}
.brand{font-family:var(--font-display); font-size:1.5rem; font-weight:900; letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;
  background:none; border:none; padding:0; color:var(--bar-ink); cursor:pointer; display:flex; align-items:center; gap:0.45rem;}
.brand-ball{width:1.6rem; height:1.6rem; flex:none;}
@media (max-width:520px){ .user-chip .uname{display:none;} }
.topbar :focus-visible{outline-color:var(--bar-ink);}
.topbar .btn.ghost{color:var(--bar-ink); border-color:rgba(255,255,255,0.28);}
.topbar .btn.ghost:hover{color:var(--bar-ink); border-color:var(--bar-ink);}
.user-chip{display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:var(--bar-soft); min-width:0;}
.user-chip .uname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:9rem;}
main{flex:1; padding:1rem 1rem 4rem;}
.loading-state{color:var(--ink-soft); font-size:0.9rem; padding:3rem 1rem; text-align:center;}
/* Loading screen: the logo ball bouncing, with a soft shadow that shrinks as
   it rises. (Reduced-motion settings stop the bounce, leaving a still ball.) */
.splash{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1rem;}
.splash-bounce{animation:splash-bounce 0.9s cubic-bezier(0.25, 0.6, 0.5, 1) infinite alternate;}
.splash-ball{width:64px; height:64px; display:block; animation:splash-spin 1.8s linear infinite;}
.splash-shadow{width:52px; height:8px; margin-top:0.6rem; border-radius:50%; background:var(--ink); opacity:0.15; animation:splash-shadow 0.9s cubic-bezier(0.25, 0.6, 0.5, 1) infinite alternate;}
.splash p{margin:1rem 0 0; color:var(--ink-soft); font-size:0.95rem; font-weight:600;}
@keyframes splash-bounce{ from{transform:translateY(0);} to{transform:translateY(-46px);} }
@keyframes splash-shadow{ from{transform:scaleX(1); opacity:0.18;} to{transform:scaleX(0.55); opacity:0.07;} }
@keyframes splash-spin{ to{transform:rotate(360deg);} }
.offline-banner{background:var(--critical); color:#fff; font-size:0.82rem; font-weight:600; padding:0.6rem 1rem; text-align:center;}

/* ---- Buttons and inputs ---- */
.btn{
  background:var(--accent); color:var(--accent-contrast); border:1px solid var(--accent); border-radius:var(--r-sm);
  padding:0.55rem 0.95rem; font-weight:700; font-size:0.84rem; cursor:pointer;
  text-transform:uppercase; letter-spacing:0.06em;
}
.btn:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn.ghost{background:none; color:var(--ink); border-color:var(--ink);}
.btn.ghost:hover{border-color:var(--pop); color:var(--pop-text);}
.btn.small{padding:0.35rem 0.65rem; font-size:0.78rem;}
.btn.big{padding:0.8rem 1.4rem; font-size:1rem;}
.btn.danger{background:none; color:var(--critical); border-color:var(--critical);}
.btn.time-up{background:var(--pop); color:var(--pop-ink); border-color:var(--pop);}
.btn.danger.armed,.btn.armed{background:var(--critical); color:#fff; border-color:var(--critical);}
.btn:disabled{opacity:0.55; cursor:default;}
.text-input,.select-input{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:0.55rem 0.7rem; color:var(--ink);
}
.text-input:focus,.select-input:focus{border-color:var(--accent); outline:none;}
.field{display:flex; flex-direction:column; gap:0.3rem;}
.field label,.field .label{font-size:0.78rem; font-weight:700; color:var(--ink-soft);}
.field-row{display:flex; gap:0.6rem; flex-wrap:wrap;}
.field-row > .field{flex:1; min-width:130px;}
.hint{font-size:0.75rem; color:var(--ink-soft);}
.segmented{display:flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; width:fit-content;}
.segmented label{position:relative; cursor:pointer;}
.segmented input{position:absolute; opacity:0; pointer-events:none;}
.segmented span{display:block; padding:0.5rem 0.9rem; font-size:0.85rem; font-weight:700; background:var(--surface); color:var(--ink);}
.segmented input:checked + span{background:var(--accent); color:var(--accent-contrast);}
.segmented input:focus-visible + span{outline:2px solid var(--accent); outline-offset:-3px;}
.form-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem;
  display:flex; flex-direction:column; gap:0.8rem; margin-bottom:1rem;
}
.form-card h3{font-size:1.2rem;}
.form-actions{display:flex; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap;}
.check-row{display:flex; align-items:center; gap:0.5rem; font-size:0.88rem;}

/* ---- Sign in ---- */
.hero{text-align:center; padding:3rem 1rem 2rem; display:flex; flex-direction:column; align-items:center; gap:1rem;}
.hero h1{font-size:3.6rem; font-weight:900; text-transform:uppercase; letter-spacing:0.03em; line-height:1;}
.hero p{margin:0; color:var(--ink-soft); max-width:26rem;}
.hero .fine{font-size:0.78rem;}
/* Sign-in welcome: what Netty Pal is for, as a short list. */
.welcome{max-width:22rem; text-align:left; display:flex; flex-direction:column; gap:0.5rem;}
.hero .welcome p{max-width:none;}
.hero .welcome .welcome-lead{color:var(--ink);}
.welcome ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:0.4rem;}
.welcome li{display:flex; gap:0.55rem; align-items:flex-start; color:var(--ink); font-size:0.95rem;}
.welcome li::before{content:''; flex:none; width:0.55rem; height:0.55rem; margin-top:0.45rem; border-radius:50%; background:var(--pop);}
.hero .invite-note{color:var(--ink); background:var(--accent-bg); border-radius:var(--r); padding:0.7rem 1rem;}
.signin-options{display:flex; flex-direction:column; gap:0.6rem; width:100%; max-width:20rem;}
.signin-btn{display:flex; align-items:center; justify-content:center; gap:0.6rem; width:100%; text-transform:none; letter-spacing:0; font-size:0.92rem;}
.signin-btn.google{background:var(--surface); color:var(--ink); border-color:var(--line);}
.signin-btn.google:hover{background:var(--surface-2); border-color:var(--accent);}
.signin-btn.facebook{background:#1877F2; border-color:#1877F2; color:#fff;}
.signin-btn.facebook:hover{background:#166FE5; border-color:#166FE5;}
.signin-btn.email{background:none; color:var(--ink); border-color:var(--line);}
.inapp-note{width:100%; max-width:22rem; text-align:left; background:var(--warm-bg); border:1.5px solid var(--warm); border-radius:var(--r); padding:0.8rem 1rem; display:flex; flex-direction:column; gap:0.5rem;}
.hero .inapp-note p{color:var(--ink); max-width:none;}
.hero .inapp-note p.hint{color:var(--ink-soft);}
.inapp-actions{display:flex; gap:0.5rem; flex-wrap:wrap;}
.inapp-actions a.btn{text-decoration:none;}
.signin-card{
  width:100%; max-width:22rem; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:1rem; display:flex; flex-direction:column; gap:0.7rem;
}
.signin-card h3{font-size:1.3rem;}
.signin-card p{margin:0; color:var(--ink-soft); font-size:0.9rem;}
.hero .fine a{color:var(--ink-soft);}
.panel.invite-panel{border-color:var(--accent); background:var(--accent-bg);}
.invite-panel p{margin:0 0 0.6rem;}
.ball{width:84px; height:84px;}

/* ---- Home ---- */
.section-title{font-size:1.7rem; margin-bottom:0.8rem; text-transform:uppercase;}
.team-list{display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1.2rem;}
.team-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0.9rem 1rem;
  text-align:left; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between;
  align-items:center; gap:0.75rem; width:100%;
}
.team-card:hover{border-color:var(--accent);}
.team-card .tname{font-family:var(--font-display); font-size:1.35rem; font-weight:700; line-height:1.1;}
.team-card .tseason{font-size:0.8rem; color:var(--ink-soft);}
.badges{display:flex; gap:0.3rem; flex-wrap:wrap; justify-content:flex-end;}
.badge{
  font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  padding:0.18rem 0.45rem; border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink-soft);
  border:1px solid var(--line); white-space:nowrap;
}
.badge.none{background:var(--surface-2); color:var(--critical); border-color:var(--critical);}
.badge.owner{background:var(--warm-bg); color:var(--warm); border-color:transparent;}
.badge.coach{background:var(--accent-bg); color:var(--pop-text); border-color:transparent;}
.badge.scorer{background:var(--ok-bg); color:var(--ok); border-color:transparent;}
.home-actions{display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;}
.empty-state{color:var(--ink-soft); font-size:0.9rem; padding:1.5rem 0.5rem; text-align:center;}

/* ---- Season ---- */
.back-link{
  background:none; border:none; color:var(--ink-soft); font-size:0.8rem; font-weight:700;
  padding:0; cursor:pointer; margin-bottom:0.35rem;
}
.back-link:hover{color:var(--accent);}
.season-head{margin-bottom:0.9rem;}
.season-head h2{font-size:2rem; text-transform:uppercase; line-height:1.05;}
.season-meta{font-size:0.82rem; color:var(--ink-soft); margin-top:0.2rem;}
.tabs{display:flex; gap:0.35rem; margin-bottom:1rem; overflow-x:auto; padding-bottom:0.2rem;}
.tab{
  flex:none; background:var(--surface); border:1px solid var(--line); color:var(--ink);
  padding:0.45rem 0.85rem; border-radius:var(--r-pill); font-size:0.84rem; font-weight:700; cursor:pointer;
}
.tab.active{background:var(--pop); color:var(--pop-ink); border-color:var(--pop);}
.list-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:1rem;}
.list-row{display:flex; align-items:center; gap:0.6rem; padding:0.65rem 0.9rem; border-top:1px solid var(--line); flex-wrap:wrap;}
.list-row:first-child{border-top:none;}
.list-row .grow{flex:1; min-width:0;}
.list-row.inactive .pname{color:var(--ink-soft); text-decoration:line-through;}
.pname{font-weight:600;}
.psub{font-size:0.75rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis;}
.row-input{
  flex:1; min-width:0; background:transparent; border:1px solid transparent; border-radius:var(--r-sm);
  padding:0.35rem 0.5rem; color:var(--ink); font-weight:600;
}
.row-input:hover{border-color:var(--line);}
.row-input:focus{border-color:var(--accent); background:var(--surface); outline:none;}
.avatar{
  width:34px; height:34px; border-radius:50%; background:var(--accent-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; flex:none;
  overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.avatar.small{width:26px; height:26px; font-size:0.7rem;}
.role-toggles{display:flex; gap:0.35rem; flex-wrap:wrap;}
.role-toggle{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:var(--r-pill);
  padding:0.3rem 0.7rem; font-size:0.76rem; font-weight:800; cursor:pointer;
}
.role-toggle[aria-pressed="true"].coach{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.role-toggle[aria-pressed="true"].scorer{background:var(--ok); border-color:var(--ok); color:#fff;}
.member-actions{display:flex; gap:0.35rem; flex-wrap:wrap; width:100%; padding-left:calc(34px + 0.6rem);}
/* On a phone, role buttons and badges get their own line under the name,
   so long names and "Coach/Manager" never squash each other. */
@media (max-width:520px){
  .list-row > .role-toggles,.list-row > .badges{width:100%; padding-left:calc(34px + 0.6rem); justify-content:flex-start;}
}
.code-card{
  background:var(--accent); color:var(--accent-contrast); border-radius:var(--r); padding:1rem;
  margin-bottom:1rem; display:flex; flex-direction:column; gap:0.6rem;
}
.code-card .label{font-size:0.75rem; font-weight:700; opacity:0.85; text-transform:uppercase; letter-spacing:0.08em;}
.code-value{font-family:var(--font-display); font-size:2.6rem; font-weight:800; letter-spacing:0.18em; line-height:1;}
.code-card .btn{background:var(--accent-contrast); color:var(--accent); border-color:var(--accent-contrast);}
.code-card .btn.armed{background:var(--critical); color:#fff; border-color:var(--critical);}
.code-actions{display:flex; gap:0.4rem; flex-wrap:wrap;}
.subhead{font-size:1.2rem; text-transform:uppercase; margin:0.2rem 0 0.6rem;}
.placeholder-card{
  background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--r); padding:1.5rem 1rem;
  text-align:center; color:var(--ink-soft); font-size:0.9rem;
}
.add-inline{display:flex; gap:0.5rem; padding:0.75rem 0.9rem; border-top:1px dashed var(--line);}
.add-inline .text-input{flex:1;}
.toast{
  position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:50;
  background:var(--ink); color:var(--paper); padding:0.65rem 1rem; border-radius:var(--r);
  font-size:0.85rem; font-weight:600; box-shadow:0 6px 20px var(--shadow); max-width:calc(100% - 2rem);
}
.toast.error{background:var(--critical); color:#fff;}
.owner-team{display:flex; flex-direction:column; gap:0.4rem;}
.owner-team-tools{display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.4rem;}
.team-card.static{cursor:default;}
.danger-zone{margin-top:1.5rem; padding-top:1rem; border-top:1px dashed var(--line);}
.account-zone{display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:2rem; padding-top:1rem; border-top:1px dashed var(--line);}
.account-links{flex-basis:100%; margin:0.6rem 0 0; font-size:0.78rem; color:var(--ink-soft);}
.account-links a,.link-btn{color:var(--ink-soft); text-decoration:underline;}
.link-btn{background:none; border:0; padding:0; font:inherit; cursor:pointer;}
.hero .install-card{text-align:left; width:100%; max-width:26rem; margin:0;}
.hero .install-card p{max-width:none; color:var(--ink);}
.install-steps{margin:0.4rem 0 0.8rem; padding-left:1.3rem;}
.install-steps li{margin-bottom:0.45rem; font-size:0.92rem;}
.inline-icon{vertical-align:-3px;}
.install-other{margin:0.6rem 0 0.8rem;}
.install-other summary{cursor:pointer; font-weight:700; color:var(--pop-text);}
.delete-list{margin:0.5rem 0 0.8rem; padding-left:1.2rem;}
.delete-list li{margin-bottom:0.5rem; font-size:0.92rem;}
.delete-list .btn{margin-top:0.35rem;}

/* ---- Games ---- */
.game-list{display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1rem;}
.game-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0.75rem 0.9rem;
  text-align:left; color:var(--ink); cursor:pointer; width:100%; display:flex; gap:0.85rem; align-items:center;
}
.game-card:hover{border-color:var(--accent);}
.game-card[data-longpress]{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.game-card.pressing{transform:scale(0.98); border-color:var(--warm); transition:transform 0.5s, border-color 0.5s;}
.game-card.past{opacity:0.8;}
/* A bye: dashed and quieter, since there's no game. */
.game-card.bye{border-style:dashed; background:var(--surface-2);}
.game-card.bye .gopp{color:var(--ink-soft);}
.form-card.is-bye .not-bye{display:none;}
.game-date{flex:none; width:3rem; text-align:center; font-family:var(--font-display); line-height:1;}
.game-date .dw{font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); font-weight:700; letter-spacing:0.05em;}
.game-date .dd{font-size:1.7rem; font-weight:800;}
.game-date .dm{font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
.game-date.tbc .dd{font-size:1.1rem; color:var(--ink-soft);}
.gopp{font-weight:800; font-size:1rem;}
.gmeta{font-size:0.78rem; color:var(--ink-soft);}
.gstatus{font-size:0.75rem; font-weight:700; margin-top:0.15rem;}
.gstatus.todo{color:var(--warm);}
.gstatus.ok{color:var(--ok);}
.list-label{font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin:1.1rem 0 0.5rem;}
.game-head h2{font-size:1.9rem; text-transform:uppercase; line-height:1.05;}
.period-picker{display:flex; gap:0.35rem; margin-bottom:0.8rem; flex-wrap:wrap;}
.period-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:var(--r-sm);
  padding:0.45rem 0.8rem; font-family:var(--font-display); font-size:1.05rem; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:0.35rem;
}
.period-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.period-btn .pdot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.period-btn .pdot.none{background:transparent; border:1.5px solid var(--line);}
.period-btn .pdot.follow{background:transparent; border:1.5px solid var(--ok);}
.follow-note{
  font-size:0.82rem; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--line);
  border-radius:var(--r-sm); padding:0.45rem 0.7rem; margin:0 0 0.7rem;
}
.follow-note.own{border-style:solid;}
.court-tip{font-size:0.82rem; color:var(--ink-soft); text-align:center; margin:0 auto 0.5rem; max-width:320px;}
/* ---- Court ---- */
:root{ --court-bg:#C4DDF2; --court-mid:#DCEBF8; --court-line:#FFFFFF; --chip-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --court-bg:#172B42; --court-mid:#203A57; --court-line:rgba(255,255,255,0.38); --chip-ink:#0D1522; } }
:root[data-theme="dark"]{ --court-bg:#172B42; --court-mid:#203A57; --court-line:rgba(255,255,255,0.38); --chip-ink:#0D1522; }
.sheet .grow{flex:1; min-width:0;}
.court-wrap{max-width:320px; margin:0 auto 1rem;}
.court-end{
  text-align:center; font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--ink-soft); padding:0.3rem 0;
}
.court{position:relative; width:100%; aspect-ratio:100 / 135; background:var(--court-bg); border-radius:var(--r);}
.court-lines{position:absolute; inset:0; width:100%; height:100%;}
.court-lines *{fill:none; stroke:var(--court-line); stroke-width:1; vector-effect:non-scaling-stroke;}
.court-lines rect,.court-lines line,.court-lines path,.court-lines circle{stroke-width:2.5px;}
/* The centre third is a shade lighter so the three zones read at a glance. */
.court-lines .court-mid{fill:var(--court-mid); stroke:none;}
.court-token{
  position:absolute; transform:translate(-50%, -30%); display:flex; flex-direction:column; align-items:center;
  gap:0.2rem; background:none; border:none; padding:0.2rem; cursor:pointer; color:var(--ink); width:6.5rem;
}
div.court-token{cursor:default;}
.court-token .pos-chip{width:2.9rem; height:2.9rem; font-size:1.15rem; box-shadow:0 0 0 3px var(--court-line), 0 2px 6px var(--shadow);}
.court-token.picking .pos-chip{box-shadow:0 0 0 3px var(--ink), 0 2px 6px var(--shadow);}
button.court-token:hover .pos-chip{transform:scale(1.06);}
.token-name{
  max-width:100%; background:var(--surface); border-radius:var(--r-sm); padding:0.1rem 0.45rem; font-size:0.8rem; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 1px 3px var(--shadow);
}
.token-name.empty{color:var(--ink-soft); font-weight:500; font-style:italic;}
/* Drag and drop */
.court[data-dnd] .court-token,.bench-drop[data-dnd] .bench-chip{touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.bench-drop{max-width:340px; margin:-0.4rem auto 1rem; padding:0.6rem 0.7rem; border:1.5px dashed var(--line); border-radius:var(--r); background:var(--surface);}
.bench-label{font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:0.4rem;}
.bench-label span{text-transform:none; letter-spacing:0; font-weight:600;}
.bench-chip{cursor:grab; padding:0.4rem 0.75rem; font-size:0.85rem;}
.drag-ghost{
  position:fixed; z-index:60; pointer-events:none; transform:translate(-50%, -130%); background:var(--accent); color:var(--accent-contrast);
  padding:0.35rem 0.75rem; border-radius:var(--r-pill); font-weight:800; font-size:0.9rem; box-shadow:0 6px 18px var(--shadow); white-space:nowrap;
}
body.dragging{cursor:grabbing;}
.court-token.drop-hover .pos-chip{box-shadow:0 0 0 4px var(--warm), 0 2px 6px var(--shadow); transform:scale(1.1);}
.bench-drop.drop-hover{border-color:var(--warm); background:var(--warm-bg);}
/* Substitution sheet: taller, with the court sized to fit so the bench
   stays in view while dragging. */
.sheet.sub-sheet{max-height:92vh;}
.sub-sheet .court-wrap{max-width:min(300px, 38vh); margin-bottom:0.8rem;}
.sub-sheet .bench-drop{margin-top:0;}
.sheet-backdrop{position:fixed; inset:0; background:rgba(10,15,25,0.45); z-index:40;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:640px; margin:0 auto; max-height:75vh;
  display:flex; flex-direction:column; background:var(--paper); border-radius:6px 6px 0 0;
  box-shadow:0 -8px 30px var(--shadow); padding-bottom:env(safe-area-inset-bottom);
}
.sheet-head{display:flex; align-items:center; gap:0.75rem; padding:0.9rem 1rem; border-bottom:1px solid var(--line);}
.sheet-head h3{font-size:1.35rem; text-transform:uppercase;}
.sheet-body{overflow-y:auto; padding:0 1rem 1rem;}
.sheet-body .list-label{margin-top:0.9rem;}
.pick-row{
  display:flex; align-items:center; gap:0.6rem; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:0.65rem 0.8rem; margin-bottom:0.4rem;
  color:var(--ink); cursor:pointer; font-size:0.95rem;
}
.pick-row:hover{border-color:var(--accent);}
.pick-row.current{border-color:var(--accent); background:var(--accent-bg);}
.pick-row .pname{display:block;}
.pick-row .psub{display:block;}
.pick-count{font-size:0.78rem; font-weight:800; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}
.pick-count.zero{color:var(--warm);}

/* ---- Live game ---- */
.clock{font-family:var(--font-display); font-size:2.3rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05;}
.clock.stopped{color:var(--warm);}
.scorer-bar{
  display:flex; align-items:center; justify-content:space-between; gap:0.5rem; flex-wrap:wrap;
  font-size:0.82rem; color:var(--ink-soft); margin-bottom:0.8rem;
}
.control-row{display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.8rem;}
.control-row .btn{flex:1; min-width:8rem; padding-top:0.75rem; padding-bottom:0.75rem; font-size:0.95rem;}
.btn.go{background:var(--ok); border-color:var(--ok); color:var(--chip-ink);}
.btn.go:hover{filter:brightness(0.95); background:var(--ok);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-top:0.9rem;}
.stat-btn{
  padding:0.95rem 0.5rem; font-size:1.02rem; font-weight:800; border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:0.1rem;
}
.stat-btn small{font-size:0.68rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
.stat-btn:hover{border-color:var(--accent);}
.stat-btn.goal{background:var(--pop); border-color:var(--pop); color:var(--pop-ink);}
.stat-btn.miss{border-color:var(--warm); color:var(--warm);}
.event-row{
  display:flex; gap:0.6rem; align-items:center; padding:0.55rem 0.9rem; border-top:1px solid var(--line);
  font-size:0.88rem; flex-wrap:wrap;
}
.event-row:first-child{border-top:none;}
.event-when{font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:0.78rem; min-width:4.6rem;}
.event-row.opp .event-what{color:var(--ink-soft);}
.event-row .select-input{width:auto; flex:1; min-width:8rem; padding:0.35rem 0.5rem; font-size:0.85rem;}
.stats-table td:first-child{white-space:normal; overflow-wrap:anywhere; min-width:5rem; max-width:9rem;}
.stats-table tr.opp td{color:var(--ink-soft); font-style:italic;}
.game-head.compact{margin-bottom:0.5rem;}
.game-head.compact h2{font-size:1.4rem;}
.live-play{padding-bottom:3rem;}

/* Scoreboard card */
/* The scoreboard is always black, in both modes: it re-sets the colour tokens for everything inside it. */
.sb2{
  --surface:#0B0B0D; --surface-2:#1F1F23; --line:#2E2E34; --ink:#FFFFFF; --ink-soft:#A6A6AE;
  --accent:#FFFFFF; --accent-contrast:#0B0B0D; --warm:#F0A060; --ok:#74C497; --chip-ink:#0B0B0D; --critical:#E5484D;
  --pop:#FF4D9A; --pop-ink:#0B0B0D; --pop-text:#FF6FAE; --shadow:rgba(0,0,0,0.5);
  color:var(--ink); border:1px solid var(--line); border-radius:var(--r); margin-bottom:0.7rem; box-shadow:0 2px 8px var(--shadow);
  padding-bottom:4px;
  background:repeating-linear-gradient(90deg, #FFFFFF 0 5px, #0B0B0D 5px 10px) bottom / 100% 4px no-repeat, var(--surface);
}
.sb2-clock{display:flex; flex-direction:column; align-items:flex-start; min-width:0;}
.sb2-period{font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:var(--pop-text); text-transform:uppercase; line-height:1.1;}
.sb2-phase{font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);}
.sb2-main{display:grid; grid-template-columns:auto minmax(0, 1fr) auto; align-items:center; gap:0.5rem; padding:0.55rem 0.8rem 0.65rem;}
.sb2-clock .clock{font-size:1.6rem; font-weight:700;}
.sb2-score{display:flex; align-items:flex-end; justify-content:center; gap:0.6rem; min-width:0;}
.sb2-team{display:flex; flex-direction:column; align-items:center; min-width:0; flex:1 1 0; max-width:6.5rem;}
.sb2-name{font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); max-width:6.5rem; text-align:center; line-height:1.15; overflow-wrap:anywhere;}
.sb2-team b{font-family:var(--font-display); font-size:2.9rem; line-height:1; font-variant-numeric:tabular-nums;}
.sb2-sep{width:1rem; height:4px; background:var(--line); border-radius:0; margin-bottom:1.3rem;}
.sb2-score.with-cp .sb2-sep{margin-bottom:3.45rem;}
/* Next centre pass: a small netball under a team's score (also used in the
   guide). The button is bigger than the ball so it's easy to tap. */
.cp-mark{display:inline-flex; align-items:center; justify-content:center; width:3rem; height:2rem; margin-top:0.15rem; padding:0;
  border:none; border-radius:var(--r-pill); background:none;}
.cp-ball{width:1.5rem; height:1.5rem;}
button.cp-mark{cursor:pointer;}
.cp-mark.ghost{visibility:hidden;}
.cp-mark.armed{background:var(--critical);}
.cp-switch{font-family:var(--font-body); font-size:0.62rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:#fff;}
.sb2-play{display:flex; justify-content:flex-end;}
.play-btn{width:3.1rem; height:3.1rem; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.play-btn.go{background:var(--ok); border-color:var(--ok); color:var(--chip-ink);}
.play-btn{flex-direction:column; gap:0.05rem; width:3.4rem; height:3.4rem;}
.play-label{font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; line-height:1;}
/* Pause/Resume sits under the clock, so the clock and its control read together. */
.sb2-clock .play-btn{flex-direction:row; gap:0.3rem; width:auto; height:2.1rem; padding:0 0.6rem; margin-top:0.35rem;}
.sb2-clock .play-btn svg{width:16px; height:16px;}
.sub-btn{width:100%; margin:0 0 0.4rem; padding-top:0.7rem; padding-bottom:0.7rem;}
.head-row{display:flex; align-items:center; justify-content:space-between; gap:0.5rem;}
.more-row .btn{padding-top:0.3rem; padding-bottom:0.3rem;}
.practice-banner{display:flex; align-items:center; justify-content:space-between; gap:0.6rem; flex-wrap:wrap; background:var(--accent-bg); border:1.5px dashed var(--accent); border-radius:var(--r); padding:0.6rem 0.8rem; margin-bottom:0.8rem; font-size:0.88rem;}
.practice-banner span{flex:1; min-width:12rem;}
.guide-links{display:flex; gap:0.5rem; flex-wrap:wrap;}
/* Black with white text and a pink edge, so it stands out from the page in
   both modes (in dark mode the page itself is nearly black, so the card is a
   lighter charcoal). ".panel" is included so the general panel colours
   further down can't override it. */
.panel.practice-invite{margin-bottom:1rem; background:var(--invite-bg); color:var(--bar-ink); border:2px solid var(--pop);}
.panel.practice-invite{position:relative;}
.card-x{position:absolute; top:0.3rem; right:0.3rem; width:2.2rem; height:2.2rem; border:none; background:none; color:var(--bar-ink);
  font-size:1.5rem; line-height:1; cursor:pointer; border-radius:var(--r-sm); opacity:0.8; font-family:var(--font-body);}
.card-x:hover{opacity:1;}
:root{ --invite-bg:#0B0B0D; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --invite-bg:#2A2A31; } }
:root[data-theme="dark"]{ --invite-bg:#2A2A31; }
/* Coach/Manager guide */
.mg-step{display:flex; gap:0.7rem; align-items:flex-start; padding:0.7rem 0; border-top:1px solid var(--line);}
.mg-step:first-of-type{border-top:none;}
.mg-num{flex:none; width:1.7rem; height:1.7rem; border-radius:50%; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:0.95rem;}
.mg-num.done{background:var(--ok); color:var(--chip-ink);}
.mg-step p{margin:0.15rem 0 0; font-size:0.9rem; color:var(--ink-soft);}
.mg-step .btn{margin-top:0.45rem;}
.mg-head{font-size:1.05rem; text-transform:uppercase; margin:1rem 0 0.2rem;}
.mg-status{font-size:0.78rem; font-weight:700; color:var(--ok);}
.mg-status.todo{color:var(--warm);}
.unavail-drop{border-style:solid; opacity:0.85;}
.unavail-drop .chip{color:var(--ink-soft); text-decoration:line-through;}
/* Game day reminder for Coach/Managers (pink tint, so it stands out from the black practice box). */
.panel.gameday-nudge{background:var(--accent-bg); border:1.5px solid var(--pop);}
.practice-invite .btn{background:var(--pop); color:var(--pop-ink); border-color:var(--pop);}

/* Scoring modes and position tiles */
.mode-row{display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.3rem;}
.time-up-note{margin:0.2rem 0 0.5rem; padding:0.5rem 0.7rem; border-radius:var(--r-sm); background:var(--pop); color:var(--pop-ink); font-size:0.85rem; font-weight:700; text-align:center;}
.mode-tabs{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:2px;}
.mode-tab{border:none; background:none; padding:0.35rem 0.75rem; border-radius:var(--r-pill); font-size:0.78rem; font-weight:800; color:var(--ink-soft); cursor:pointer; font-family:var(--font-body);}
.mode-tab.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px var(--shadow);}
/* Help on the scoreboard, to the right of the score: pink so it's easy to find. */
.help-btn{
  width:3.4rem; height:3.4rem; flex:none; border-radius:var(--r); border:1.5px solid var(--pop); background:var(--pop);
  color:var(--pop-ink); cursor:pointer; font-family:var(--font-body); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:0.05rem; padding:0;
}
.help-btn b{font-family:var(--font-display); font-size:1.5rem; font-weight:900; line-height:1;}
/* Picture-first scoring guide: mini copies of the real buttons and tiles. */
.guide{display:flex; flex-direction:column; margin:0.8rem 0 0.4rem;}
.g-row{display:grid; grid-template-columns:9.5rem 1fr; align-items:center; gap:0.8rem; padding:0.55rem 0; border-top:1px solid var(--line);}
.g-row:first-child{border-top:none;}
.g-row p{margin:0; font-size:0.92rem; font-weight:600;}
.g-demo{display:flex; align-items:center; gap:0.25rem; flex-wrap:nowrap;}
.g-tile{
  display:inline-flex; align-items:center; justify-content:center; min-width:2.2rem; height:2rem; padding:0 0.35rem;
  border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface); font-family:var(--font-display);
  font-weight:800; font-size:0.95rem;
}
.g-tile.shooter{background:var(--pop); border-color:var(--pop); color:var(--pop-ink);}
.g-tile.opp{background:var(--surface-2); min-width:1.9rem; font-size:0.85rem;}
.g-btn{
  display:inline-flex; align-items:center; height:1.8rem; padding:0 0.5rem; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface); font-size:0.75rem; font-weight:800; white-space:nowrap;
}
.g-btn.go{background:var(--ok); border-color:var(--ok); color:var(--chip-ink);}
.g-btn.goal{background:var(--pop); border-color:var(--pop); color:var(--pop-ink);}
.g-round{
  display:inline-flex; align-items:center; justify-content:center; width:2.1rem; height:2.1rem; border-radius:var(--r);
  border:1px solid var(--line); background:var(--surface); box-shadow:0 2px 6px var(--shadow);
}
.g-round svg{width:18px; height:18px;}
.g-num{
  display:inline-flex; align-items:center; justify-content:center; width:1.5rem; height:1.5rem; border-radius:50%;
  background:var(--ink); color:var(--paper); font-family:var(--font-display); font-weight:800; font-size:0.9rem; margin-right:0.15rem;
}
.g-btn.wide{max-width:9rem; height:auto; min-height:1.8rem; padding-top:0.2rem; padding-bottom:0.2rem; white-space:normal; line-height:1.2; background:var(--surface-2);}
.sec-label{font-size:0.68rem; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft); margin:0.6rem 0 0.4rem;}
.sec-label.done{opacity:0.45;}
/* Step 2 frame: invisible until Goal or Miss is chosen, then pink. The
   negative margin keeps the tiles the same width as everything else. */
.step-frame{margin:0 -0.45rem 0.4rem; padding:0 0.45rem 0.45rem; border:2px solid transparent; border-radius:var(--r); transition:border-color 0.15s;}
.step-frame.active{border-color:var(--pop);}
.step-frame.active .sec-label{color:var(--pop-text);}
.sec-label .hint.gone{visibility:hidden;}
.sec-label .hint{text-transform:none; letter-spacing:0; font-weight:600;}
.pos-row{display:grid; gap:0.45rem; margin-bottom:0.45rem;}
.pos-row.two{grid-template-columns:1fr 1fr;}
.pos-row.three{grid-template-columns:1fr 1fr 1fr;}
.ptile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.1rem; min-height:4.5rem; min-width:0;
  padding:0.45rem 0.3rem; border-radius:var(--r); border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  cursor:pointer; font-family:var(--font-body);
}
div.ptile{cursor:default;}
.ptile.shooter{background:var(--pop); border-color:var(--pop); color:var(--pop-ink);}
.ptile:disabled{opacity:0.4; cursor:default;}
button.ptile:not(:disabled):active{transform:scale(0.97);}
.pt-pos{font-family:var(--font-display); font-size:1.5rem; font-weight:800; line-height:1;}
.pt-name{font-size:0.85rem; font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pt-name.empty{font-style:italic; opacity:0.7;}
.pt-time{font-size:0.72rem; font-variant-numeric:tabular-nums; opacity:0.8; min-height:0.9rem;}
.pt-team{font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ev-grid{display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;}
.evbtn{padding:1rem; font-size:1.2rem; font-weight:800; border-radius:var(--r); border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-family:var(--font-body);}
.evbtn.goal.on{background:var(--pop); border-color:var(--pop); color:var(--pop-ink);}
.evbtn.miss.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.pos-row.one{grid-template-columns:1fr;}
.ptile.opp{background:var(--surface-2); min-height:3.6rem; border-style:dashed; border-color:var(--ink-soft);}
.pt-opp{font-family:var(--font-display); font-size:1.3rem; font-weight:800; line-height:1.1; text-transform:uppercase; text-align:center; overflow-wrap:anywhere;}
.pt-sub{font-size:0.72rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em;}

/* Event log and floating undo */
.event-log{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0.35rem; margin:0.7rem 0 1rem;}
.log-row{display:flex; align-items:center; gap:0.6rem; padding:0.4rem 0.5rem; border-radius:var(--r-sm); font-size:0.9rem;}
.log-row.latest{background:var(--warm-bg);}
button.log-row{width:100%; border:none; background:none; color:var(--ink); text-align:left; cursor:pointer; font-family:var(--font-body);}
button.log-row.latest{background:var(--warm-bg);}
button.log-row:hover{background:var(--surface-2);}
.log-item.sel{background:var(--surface-2); border-radius:var(--r-sm);}

<div id="app"><div class="splash" role="status" aria-live="polite"><div class="splash-bounce"><svg class="splash-ball" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#E0457B" stroke-width="3.5"/><path d="M50 50a40 40 0 0 0 40 20 M27.5 57.5a60 60 0 0 0 42.5 32.5 M50 50a40 40 0 0 0 -37.3 24.6 M54.8 26.8a60 60 0 0 0 -49.4 20.6 M50 50a40 40 0 0 0 -2.7 -44.6 M67.7 65.7a60 60 0 0 0 6.9 -53.1" fill="none" stroke="#E0457B" stroke-width="4" stroke-linecap="round"/></svg></div><div class="splash-shadow" aria-hidden="true"></div><p>Loading Netty Pal…</p></div></div>
<div id="toast-root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, updateProfile,
  reauthenticateWithPopup, deleteUser
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc as fsUpdateDoc, deleteDoc,
  collection, onSnapshot, writeBatch as fsWriteBatch, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* ---------------------------------------------------------------------
   Firebase. This config is not a secret: it only tells the page which
   Firebase project to talk to. Who can read or change what is enforced
   by the Firestore security rules (see firestore.rules), not by this page.
--------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBToJHWizkOtnLXMt4HawIbTBk0cz9cxes",
  authDomain: "netty-pal.firebaseapp.com",
  projectId: "netty-pal",
  storageBucket: "netty-pal.firebasestorage.app",
  messagingSenderId: "614096574186",
  appId: "1:614096574186:web:df6472c29986949ae66993"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

/* ---------------------------------------------------------------------
   Practice game. A pretend game kept only in this phone's memory, so
   parents can try scoring before a real game. Saves for it never reach
   the database: updateDoc and writeBatch below send anything aimed at the
   practice game to practiceWrite instead. It's gone when they leave it.
--------------------------------------------------------------------- */
const PRACTICE_ID = 'practice-game';
const DELETE_FIELD = deleteField();
let PRACTICE = null;   // { game, events } while a practice game is open
function isPracticeRef(ref){ return !!(ref && ref.path && ref.path.split('/').includes(PRACTICE_ID)); }
function isPractice(g){ return !!(g && g.id === PRACTICE_ID); }
function inPractice(){ return UI.view === 'game' && UI.gameId === PRACTICE_ID && !!PRACTICE; }

function updateDoc(ref, data){
  return isPracticeRef(ref) ? practiceWrite([['update', ref, data]]) : fsUpdateDoc(ref, data);
}
function writeBatch(database){
  const ops = [];
  const b = {
    set(ref, data){ ops.push(['set', ref, data]); return b; },
    update(ref, data){ ops.push(['update', ref, data]); return b; },
    delete(ref){ ops.push(['delete', ref]); return b; },
    commit(){
      if (ops.some(([, ref]) => isPracticeRef(ref))) return practiceWrite(ops);
      const real = fsWriteBatch(database);
      ops.forEach(([kind, ref, data]) => kind === 'delete' ? real.delete(ref) : real[kind](ref, data));
      return real.commit();
    }
  };
  return b;
}
// Applies saves to the practice game in memory, the same way the database
// would ("live.phase" style keys, deleteField), then redraws.
function practiceWrite(ops){
  if (!PRACTICE) return Promise.resolve();
  const setPath = (obj, key, val) => {
    const parts = key.split('.');
    let o = obj;
    parts.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });
    const last = parts[parts.length - 1];
    if (val && typeof val.isEqual === 'function' && val.isEqual(DELETE_FIELD)) delete o[last];
    else o[last] = val;
  };
  ops.forEach(([kind, ref, data]) => {
    const parts = ref.path.split('/');
    if (parts[parts.length - 2] === 'events'){
      const id = parts[parts.length - 1];
      if (kind === 'set') PRACTICE.events = [...PRACTICE.events.filter(e => e.id !== id), { ...data, id }];
      else if (kind === 'update') PRACTICE.events = PRACTICE.events.map(e => {
        if (e.id !== id) return e;
        const next = { ...e };
        Object.keys(data).forEach(k => setPath(next, k, data[k]));
        return next;
      });
    } else if (kind === 'update'){
      const g = JSON.parse(JSON.stringify(PRACTICE.game));
      Object.keys(data).forEach(k => setPath(g, k, data[k]));
      PRACTICE.game = g;
    }
  });
  if (CUR.eventsFor === PRACTICE_ID) CUR.events = PRACTICE.events;
  render();
  return Promise.resolve();
}

/* ---------------------------------------------------------------------
   Data layout (Firestore)
     teams/{teamId}                               name, adminUid (who created it; no longer
                                                  gives extra rights), editSeason
       seasons/{seasonId}                         name, competition, format, periodMinutes, joinCode,
                                                  fromSeason (the season it was started from)
         members/{uid}                            name, email, photoURL, roles[], code
         players/{playerId}                       name, active
         games/{gameId}                           round, date, time, opponent, venue, court,
                                                  format, periodMinutes, status,
                                                  available[] (player ids; missing = all active),
                                                  plan { "1": { GS: playerId, ... }, "2": ... }
     joinCodes/{code}                             teamId, seasonId
     users/{uid}/memberships/{seasonId}           teamId, seasonId (so "my teams" can be listed)
--------------------------------------------------------------------- */
const DEFAULT_PERIOD_MINUTES = 7;
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L
const CODE_LENGTH = 6;
const POSITIONS = ['GS','GA','WA','C','WD','GD','GK'];
const POS_ZONE = { GS:'att', GA:'att', WA:'mid', C:'mid', WD:'mid', GD:'def', GK:'def' };
const POS_NAMES = { GS:'Goal Shooter', GA:'Goal Attack', WA:'Wing Attack', C:'Centre', WD:'Wing Defence', GD:'Goal Defence', GK:'Goal Keeper' };
// Where each bib sits on the court drawing, as % across and % down, with
// the attacking end at the top: GS in the goal circle, GA in the attacking
// third, WA, C and WD in the centre third (WA and WD near the transverse
// lines), GD in the defensive third, GK in
// the defending goal circle.
const COURT_SPOTS = { GS:[50,9], GA:[28,20], WA:[76,39], C:[50,50], WD:[24,54], GD:[72,76], GK:[50,89] };

let USER = null;
let authReady = false;
let offlineMode = !navigator.onLine;

// What the screen is showing. form is the name of an open inline form.
// view is 'home', 'season' or 'game'; gameTab and period belong to the game screen.
let UI = { view:'home', teamId:null, seasonId:null, tab:'games', form:null, busy:false,
  gameId:null, gameTab:'lineup', period:1, pickPos:null, pickMode:'plan', statPos:null, statSide:'us',
  liveMode:'event', pendingEvent:null, statsOpen:{} };
// Scoring mode: Goal/Miss first unless this phone chose Player first.
try { if (localStorage.getItem('nettyPalLiveMode') === 'player') UI.liveMode = 'player'; } catch(e){}

// Home screen: one entry per season the user belongs to.
let HOME = { loaded:false, items:[] };

// The season currently open, kept live by onSnapshot listeners.
// events/eventsFor hold the open game's event list (see watchEvents).
let CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{},
  events:[], eventsFor:null, eventsUnsub:null };

let armed = new Map(); // key -> timeout id, for "Confirm [action]" buttons

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function newId(){ return doc(collection(db, '_')).id; }
function randomCode(){
  const bytes = new Uint32Array(CODE_LENGTH);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
}
function normaliseCode(raw){ return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function initials(name){
  const parts = String(name || '?').trim().split(/\s+/);
  return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function formatLabel(season){
  if (!season) return '';
  const n = season.format === 'halves' ? 2 : 4;
  return `${n} × ${season.periodMinutes || DEFAULT_PERIOD_MINUTES} min ${season.format === 'halves' ? 'halves' : 'quarters'}`;
}
function avatarHtml(name, photoURL, cls){
  const inner = photoURL
    ? `<img src="${escapeHtml(photoURL)}" alt="" referrerpolicy="no-referrer">`
    : escapeHtml(initials(name));
  return `<span class="avatar ${cls || ''}" aria-hidden="true">${inner}</span>`;
}
function roleBadges(roles){
  const out = [];
  if (roles && roles.includes('coach')) out.push('<span class="badge coach">Coach/Manager</span>');
  if (roles && roles.includes('scorer')) out.push('<span class="badge scorer">Scorer</span>');
  if (!out.length) out.push('<span class="badge">Viewer</span>');
  return out.join('');
}
function toast(msg, isError){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast${isError ? ' error' : ''}" role="status">${escapeHtml(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { root.innerHTML = ''; }, isError ? 6000 : 3000);
}
function friendlyError(err){
  const code = (err && err.code) || '';
  if (code.includes('permission-denied')) return "You don't have permission to do that.";
  if (code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Sign-in was cancelled.';
  if (code.includes('popup-blocked')) return 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if (code.includes('unauthorized-domain')) return "This web address isn't allowed to sign in yet. Add it under Firebase > Authentication > Settings > Authorised domains.";
  if (code.includes('unavailable') || code.includes('network')) return 'No connection. Check your internet and try again.';
  if (code.includes('account-exists-with-different-credential'))
    return "You've already signed in with this email another way (probably Google or an email link). Please sign in that way instead.";
  if (code.includes('operation-not-allowed')) return "That way of signing in isn't switched on yet. Please use another option for now.";
  if (code.includes('invalid-email')) return "That email address doesn't look right.";
  if (code.includes('invalid-action-code') || code.includes('expired-action-code'))
    return 'That sign-in link has expired or was already used. Ask for a new one.';
  return (err && err.message) || 'Something went wrong.';
}
function fail(err){ console.warn('Netty Pal:', err); toast(friendlyError(err), true); }

// "Confirm [action]" second tap for anything destructive or hard to undo.
function isArmed(key){ return armed.has(key); }
function arm(key){
  clearTimeout(armed.get(key));
  armed.set(key, setTimeout(() => { armed.delete(key); render(); }, 4000));
  render();
}
function disarm(key){ clearTimeout(armed.get(key)); armed.delete(key); }

// Role checks for the open season. The page uses these to decide what to
// show; the security rules enforce the same thing on Google's side.
// Coach/Managers run the team: everything a separate "admin" used to do.
// The app owner can also manage every team, without being listed as a
// member (the same email is checked in firestore.rules).
const OWNER_EMAIL = 'patryck.allen@gmail.com';
function isOwner(){ return !!(USER && USER.emailVerified && String(USER.email || '').toLowerCase() === OWNER_EMAIL); }
function myMember(){ return USER ? CUR.members.find(m => m.id === USER.uid) : null; }
function myRoles(){ const m = myMember(); return (m && m.roles) || []; }
function isManager(){ return isOwner() || myRoles().includes('coach'); }
function canEditRoster(){ return isManager(); }
// Fixtures, availability and lineup plans: Coach/Managers.
function canEditGames(){ return isManager(); }
// Coach/Managers and Scorers see the team's working tabs.
function isStaff(){ return isManager() || myRoles().includes('scorer'); }
function coachCount(){ return CUR.members.filter(m => (m.roles || []).includes('coach')).length; }

/* ---------------------------------------------------------------------
   Game helpers
--------------------------------------------------------------------- */
function findGame(id){ return id === PRACTICE_ID ? (PRACTICE && PRACTICE.game) : CUR.games.find(g => g.id === id); }
function playerName(id){ const p = CUR.players.find(p => p.id === id); return p ? p.name : 'Unknown player'; }
function periodCount(g){ return g && g.format === 'halves' ? 2 : 4; }
function periodName(g, p){ return g.format === 'halves' ? (p === 1 ? '1st half' : '2nd half') : 'Q' + p; }
function periodNoun(g, plural){
  if (g.format === 'halves') return plural ? 'halves' : 'half';
  return plural ? 'quarters' : 'quarter';
}
// Lineups carry forward: a period with no lineup of its own uses the one
// before it. So setting Q1 fills Q2 to Q4, and a change in Q2 flows on to
// Q3 and Q4 unless those have been changed separately.
function ownPlan(g, p){ return g.plan && g.plan[p] ? g.plan[p] : null; }
function planFor(g, p){
  for (let k = p; k >= 1; k--){ const own = ownPlan(g, k); if (own) return own; }
  return {};
}
// The earlier period this one is following, or 0 if it has its own lineup.
function followsPeriod(g, p){
  if (p < 2 || ownPlan(g, p)) return 0;
  for (let k = p - 1; k >= 1; k--) if (ownPlan(g, k)) return k;
  return 0;
}
function isPeriodPlanned(g, p){ return POSITIONS.some(pos => planFor(g, p)[pos]); }
// Once a game has started, a period that has begun has been played (or is
// being played), so the Lineup tab shows what really happened instead of
// the plan.
function periodStarted(g, p){ return !!(g.live && g.live.period && p <= g.live.period); }
// Who was on court at the end of period p (or is on court now, for the
// current period): the last lineup recorded for it. Null if this game's
// events haven't loaded.
function endLineup(g, p){
  if (CUR.eventsFor !== g.id) return null;
  const les = (CUR.events || []).filter(e => !e.undone && e.type === 'lineup' && e.period === p)
    .sort((a, b) => (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  return les.length ? (les[les.length - 1].lineup || {}) : null;
}
// The lineup the Lineup tab shows. Before the game it's the plan. Once the
// game is under way, periods that have started show the real lineup, and
// later periods carry on from it unless they have their own changes (the
// same rule the scorer's screen uses when the next period starts).
function lineupFor(g, p){
  if (!g.live || !g.live.period) return planFor(g, p);
  if (periodStarted(g, p)) return endLineup(g, p) || planFor(g, p);
  const own = ownPlan(g, p);
  if (!own) return lineupFor(g, p - 1);
  const avail = new Set(availableIds(g)), lineup = {};
  POSITIONS.forEach(pos => { if (own[pos] && avail.has(own[pos])) lineup[pos] = own[pos]; });
  return lineup;
}
// Ready to play: someone has ticked who's playing, and every quarter has all
// seven positions filled with players who are playing (a quarter without its
// own plan carries on from the one before, as on the Lineup tab).
function lineupReady(g){
  if (!Array.isArray(g.available)) return false;
  const avail = new Set(availableIds(g));
  for (let p = 1; p <= periodCount(g); p++){
    const plan = planFor(g, p);
    if (!POSITIONS.every(pos => plan[pos] && avail.has(plan[pos]))) return false;
  }
  return true;
}
// Players ticked as playing this game. Until the coach sets it, that's
// every active player.
function availableIds(g){
  if (Array.isArray(g.available)) return g.available.filter(id => CUR.players.some(p => p.id === id));
  return CUR.players.filter(p => p.active !== false).map(p => p.id);
}
function byName(ids){ return ids.slice().sort((a,b) => playerName(a).localeCompare(playerName(b))); }
function pad2(n){ return String(n).padStart(2, '0'); }
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseIsoDate(iso){
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${pad2(m)}${h >= 12 ? 'pm' : 'am'}`;
}
function fmtGameWhen(g){
  const d = parseIsoDate(g.date);
  const date = d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }) : 'Date TBC';
  return g.time ? `${date}, ${fmtTime(g.time)}` : date;
}
// Dated games in date/time order, undated ones last.
function sortGames(games){
  return games.slice().sort((a,b) => {
    if (!a.date && !b.date) return String(a.round || '').localeCompare(String(b.round || ''), undefined, { numeric:true });
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
  });
}
function nextRound(){
  const nums = CUR.games.map(g => parseInt(g.round, 10)).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) + 1 : 1;
}
function gameTitle(g){ return g.bye ? 'Bye' : `vs ${g.opponent || 'TBC'}`; }
function gameFormatLabel(g){ return formatLabel({ format:g.format, periodMinutes:g.periodMinutes }); }

/* ---------------------------------------------------------------------
   Live game helpers
   A game's live state is on the game doc (status, scorerUid, live: period,
   phase, startedAt, elapsedMs, firstCentre). Everything else (score,
   lineups, court time, stats, centre pass) is worked out from its events:
     games/{gameId}/events/{eventId}   type, period, t (ms of play into the
                                       period), at, by, plus per type:
       lineup      lineup { GS: playerId, ... }, start (true at period start)
       goal, miss, intercept, held, obstruction, contact   pos, playerId
       oppGoal, oppMiss
       centre      team ('us' or 'them'): who takes the next centre pass
       periodEnd
     undone: true marks an event as undone or removed.
--------------------------------------------------------------------- */
// Only goals and misses are recorded (by GS and GA, for both teams).
// Games scored before this change may contain other stats; they keep
// their labels here but are no longer offered.
const STATS = [{ key:'goal', label:'Goal' }, { key:'miss', label:'Miss' }];
const STAT_LABEL = { goal:'Goal', miss:'Miss', intercept:'Intercept', held:'Held ball', obstruction:'Obstruction', contact:'Contact' };
const SHOOTERS = ['GS','GA'];

// Anyone who can run a game: Coach/Manager or Scorer.
function canScore(){ return inPractice() || isStaff(); }
function amScorer(g){ return !!(USER && g.scorerUid === USER.uid && canScore()); }
function periodMs(g){ return (g.periodMinutes || DEFAULT_PERIOD_MINUTES) * 60000; }
// Time played so far in the current period, never more than its length.
function elapsedMs(g){
  const L = g.live || {};
  const run = L.phase === 'running' && L.startedAt ? Date.now() - L.startedAt : 0;
  return Math.max(0, Math.min(periodMs(g), (L.elapsedMs || 0) + run));
}
function fmtClock(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; }
function fmtMins(ms){ const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; }
function otherTeam(t){ return t === 'us' ? 'them' : 'us'; }
function teamLabel(g, t){ return t === 'us' ? (CUR.team ? CUR.team.name : 'Us') : (g.opponent || 'Opposition'); }
// Centre passes alternate between periods: the team that didn't take the
// first centre of the previous period takes it in the next.
function periodStartCentre(g, p){
  const first = (g.live && g.live.firstCentre) || 'us';
  return p % 2 === 1 ? first : otherTeam(first);
}
function isInPlay(g){ const ph = g.live && g.live.phase; return g.status === 'live' && (ph === 'running' || ph === 'paused'); }
// The clock has reached 0:00 but the scorer hasn't ended the period yet, so a
// shot that was in the air on the whistle can still be recorded.
function isTimeUp(g){ return isInPlay(g) && elapsedMs(g) >= periodMs(g); }
function isGameOver(g){
  return g.status === 'final' || (g.status === 'live' && !!g.live && g.live.phase === 'ended' && g.live.period >= periodCount(g));
}
// The break after period p: Quarter time, Half time, Three quarter time or Full time.
function breakName(g, p){
  if (p >= periodCount(g)) return 'Full time';
  if (g.format === 'halves') return 'Half time';
  return ['Quarter time', 'Half time', 'Three quarter time'][p - 1] || 'Break';
}
// How far through the game we are, e.g. "Not started", "Q2 in play",
// "Half time" or "Full time".
function gameStage(g){
  const L = g.live;
  if (!L || !L.period || g.status === 'scheduled') return 'Not started';
  if (isGameOver(g)) return 'Full time';
  if (!isInPlay(g)) return breakName(g, L.period);
  return `${periodName(g, L.period)} in play`;
}

// Works out score, centre pass, lineups, court time and player stats from
// the events. Court time counts only time played (the clock running),
// because t is measured in time played, not wall-clock time.
function computeGame(g, events){
  const n = periodCount(g), L = g.live || {};
  const evs = (events || []).filter(e => !e.undone)
    .sort((a,b) => (a.period - b.period) || (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  const res = { us:0, them:0, oppMiss:0, byPeriod:{}, players:{}, lineup:null, centre:null,
    opp:{ GS:{ goal:0, miss:0 }, GA:{ goal:0, miss:0 }, Team:{ goal:0, miss:0 } } };
  const P = id => res.players[id] || (res.players[id] = { ms:0, pos:{}, goal:0, miss:0, intercept:0, held:0, obstruction:0, contact:0 });
  for (let p = 1; p <= n; p++){
    const pe = evs.filter(e => e.period === p);
    const lineups = pe.filter(e => e.type === 'lineup');
    const endEv = pe.find(e => e.type === 'periodEnd');
    const endT = endEv ? endEv.t : (L.period === p ? elapsedMs(g) : 0);
    lineups.forEach((le, i) => {
      const to = Math.min(i + 1 < lineups.length ? lineups[i + 1].t : endT, endT);
      const dt = Math.max(0, to - le.t);
      Object.entries(le.lineup || {}).forEach(([pos, id]) => {
        if (!id) return;
        const r = P(id);
        r.ms += dt;
        r.pos[pos] = (r.pos[pos] || 0) + dt;
      });
    });
    let centre = periodStartCentre(g, p), us = 0, them = 0;
    pe.forEach(e => {
      if (e.type === 'goal'){ us++; centre = otherTeam(centre); }
      else if (e.type === 'oppGoal'){ them++; centre = otherTeam(centre); }
      else if (e.type === 'oppMiss') res.oppMiss++;
      else if (e.type === 'centre') centre = e.team;
      if (e.type === 'oppGoal' || e.type === 'oppMiss')
        res.opp[e.pos === 'GS' || e.pos === 'GA' ? e.pos : 'Team'][e.type === 'oppGoal' ? 'goal' : 'miss']++;
      if (STAT_LABEL[e.type] && e.playerId) P(e.playerId)[e.type]++;
    });
    res.us += us; res.them += them;
    if (lineups.length) res.byPeriod[p] = { us, them };
    if (p === L.period){ res.centre = centre; res.lineup = lineups.length ? lineups[lineups.length - 1].lineup || {} : null; }
  }
  return res;
}

// Kept on the game doc so the game list and fairness table don't need to
// load every game's events.
function gameSummary(g, events){
  const st = computeGame(g, events);
  const courtTime = {};
  Object.entries(st.players).forEach(([id, r]) => { if (r.ms) courtTime[id] = r.pos; });
  return { us:st.us, them:st.them, courtTime };
}

/* ---------------------------------------------------------------------
   Rendering. Live updates re-render the whole screen, so any half-typed
   text in a form is saved first and put back afterwards.
--------------------------------------------------------------------- */
function captureInputs(){
  const saved = {};
  document.querySelectorAll('#app input[id]:not([type=file]), #app select[id], #app textarea[id]').forEach(el => {
    saved[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked:el.checked } : { value:el.value };
  });
  const active = document.activeElement;
  return { saved, focusId: active && active.id ? active.id : null,
    selStart: active && 'selectionStart' in active ? active.selectionStart : null };
}
function restoreInputs(state){
  Object.entries(state.saved).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if ('checked' in v) el.checked = v.checked; else el.value = v.value;
  });
  if (state.focusId){
    const el = document.getElementById(state.focusId);
    if (el){
      el.focus();
      try { if (state.selStart != null) el.setSelectionRange(state.selStart, state.selStart); } catch(e){}
    }
  }
}

function render(){
  const app = document.getElementById('app');
  const keep = captureInputs();
  let body;
  // While the app starts, or a sign-in is finishing, show the bouncing ball
  // rather than the sign-in buttons (which would look like "sign in again").
  if (!authReady) body = splashHtml('Loading Netty Pal…');
  else if (!USER && UI.signingIn) body = splashHtml('Signing you in…');
  else if (!USER) body = renderSignedOut();
  else {
    let main;
    if (UI.view === 'season') main = renderSeason();
    else if (UI.view === 'game') main = renderGame();
    else main = renderHome();
    // The top bar sits outside the 640px column so its colour runs edge to
    // edge on wide screens; its contents line up with the column.
    body = `${offlineMode ? '<div class="offline-banner">You\'re offline. Changes will sync when you reconnect.</div>' : ''}
      ${renderTopbar()}
      <div class="app-shell">
        <main>${main}</main>
      </div>`;
  }
  if (UI.showInstall) body += installSheetHtml();
  app.innerHTML = body;
  restoreInputs(keep);
  // A half-filled fixture form keeps its bye tick (and hidden fields) through a redraw.
  document.querySelectorAll('input[data-field="bye-toggle"]').forEach(syncByeForm);
  showActiveTabs();
}

// "This round is a bye" ticked: hide the fields a bye doesn't need, and the
// opponent is no longer required.
function syncByeForm(el){
  const form = el.closest('form');
  if (!form) return;
  form.classList.toggle('is-bye', el.checked);
  const opp = form.querySelector('input[name="opponent"]');
  if (opp) opp.required = !el.checked;
}

// The tab rows scroll sideways on a phone. Slide each row so the selected
// tab is fully visible (sideways only, so the page itself never jumps).
function showActiveTabs(){
  document.querySelectorAll('.tabs').forEach(row => {
    const tab = row.querySelector('.tab.active');
    if (!tab) return;
    const left = tab.offsetLeft - row.offsetLeft, right = left + tab.offsetWidth;
    if (left < row.scrollLeft) row.scrollLeft = left - 8;
    else if (right > row.scrollLeft + row.clientWidth) row.scrollLeft = right - row.clientWidth + 8;
  });
}

// White netball with pink panel seams (three curved pairs, the classic
// netball panel pattern), matching the app icon and the shared result card.
// Drawn in a 100 x 100 box: ball centred at 50,50 with radius 45.
const BALL_SEAMS = 'M50 50a40 40 0 0 0 40 20 M27.5 57.5a60 60 0 0 0 42.5 32.5 M50 50a40 40 0 0 0 -37.3 24.6 M54.8 26.8a60 60 0 0 0 -49.4 20.6 M50 50a40 40 0 0 0 -2.7 -44.6 M67.7 65.7a60 60 0 0 0 6.9 -53.1';
// The same ball on a canvas, centred at cx,cy with radius r.
function drawBall(x, cx, cy, r){
  const k = r / 45;
  x.save(); x.translate(cx - 50 * k, cy - 50 * k); x.scale(k, k);
  x.fillStyle = '#FFFFFF'; x.strokeStyle = '#E0457B'; x.lineCap = 'round';
  x.beginPath(); x.arc(50, 50, 45, 0, Math.PI * 2); x.fill();
  x.lineWidth = 3.5; x.stroke();
  x.lineWidth = 4; x.stroke(new Path2D(BALL_SEAMS));
  x.restore();
}

// Links tapped in Facebook, Messenger, Instagram and some other apps open
// in that app's own mini browser, where Google blocks signing in. Spot
// that and explain how to get to the phone's real browser.
function inAppBrowser(){
  const ua = navigator.userAgent || '';
  if (/FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua)) return 'Facebook';
  if (/Instagram/i.test(ua)) return 'Instagram';
  if (/MicroMessenger/i.test(ua)) return 'WeChat';
  if (/\bLine\//.test(ua)) return 'LINE';
  if (/Android/.test(ua) && /; wv\)/.test(ua)) return 'another app';
  return '';
}
function inAppBrowserHtml(){
  const app = inAppBrowser();
  if (!app) return '';
  const android = /Android/.test(navigator.userAgent || '');
  const chrome = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
  return `<div class="inapp-note" role="alert">

      <p>This page opened inside ${escapeHtml(app)}, where Google sign-in doesn't work. Tap <b>⋯</b> (top right) and choose <b>Open in browser</b>${android ? '' : ' or <b>Open in Safari</b>'}.</p>

}

/* ---- Email link sign-in ----
   Firebase emails a one-time link. Opening it brings the person back here,
   where the link is checked and they're signed in. The email (and name)
   are remembered on this device in between; if the link is opened on a
   different device, they're asked to type the email again. */
const EMAIL_KEY = 'nettyPalSigninEmail', NAME_KEY = 'nettyPalSigninName';
async function sendEmailLink(fd){
  const email = String(fd.get('email') || '').trim(), name = String(fd.get('name') || '').trim();
  if (!email) return;
  // Come back to the app, keeping any team invite so it isn't lost if the
  // email is opened in a different browser.
  const invite = pendingInvite();
  const url = `${location.origin}${location.pathname}${invite ? '?join=' + encodeURIComponent(invite) : ''}`;
  await sendSignInLinkToEmail(auth, email, { url, handleCodeInApp:true });
  try { localStorage.setItem(EMAIL_KEY, email); if (name) localStorage.setItem(NAME_KEY, name); } catch(e){}
  UI.signin = 'sent'; UI.signinEmail = email;
}
async function finishEmailLink(email, name){
  const cred = await signInWithEmailLink(auth, email, location.href);
  try { localStorage.removeItem(EMAIL_KEY); localStorage.removeItem(NAME_KEY); } catch(e){}
  // Tidy the sign-in code out of the address bar.
  history.replaceState(null, '', location.pathname);
  if (name && cred.user && !cred.user.displayName){
    await updateProfile(cred.user, { displayName:name });
    USER = auth.currentUser;
  }
  UI.signin = null;
}
// Runs once when the page opens: is this the link from the email?
async function checkEmailLink(){
  if (!isSignInWithEmailLink(auth, location.href)) return;
  let email = '', name = '';
  try { email = localStorage.getItem(EMAIL_KEY) || ''; name = localStorage.getItem(NAME_KEY) || ''; } catch(e){}
  if (!email){ UI.signin = 'confirm'; render(); return; }
  UI.signingIn = true; render();
  try { await finishEmailLink(email, name); }
  catch (err){ UI.signingIn = false; UI.signin = null; history.replaceState(null, '', location.pathname); fail(err); render(); }
}

// Google or Facebook sign-in in a popup. The waiting screen shows straight
// away; if the popup is closed or fails, the sign-in buttons come back.
async function signInPopup(provider){
  UI.signingIn = true; render();
  try {
    await signInWithPopup(auth, provider);
    // Normally the sign-in listener takes over from here; this is a safety net.
    if (!auth.currentUser){ UI.signingIn = false; render(); }
  } catch (err){ UI.signingIn = false; render(); throw err; }
}

// Every team, with each season's number of members, for the owner.
async function loadOwnerTeams(){
  HOME.all = { loading:true }; render();
  try {
    const teamSnaps = await getDocs(collection(db, 'teams'));
    const teams = await Promise.all(teamSnaps.docs.map(async t => {
      const seasonSnaps = await getDocs(collection(db, 'teams', t.id, 'seasons'));
      const seasons = await Promise.all(seasonSnaps.docs.map(async se => {
        const members = await getDocs(collection(se.ref, 'members'));
        return { seasonId:se.id, seasonName:se.data().name || '', competition:se.data().competition || '', members:members.docs.length };
      }));
      seasons.sort((a, b) => b.seasonName.localeCompare(a.seasonName));
      return { teamId:t.id, teamName:t.data().name || 'Unnamed team', seasons };
    }));
    teams.sort((a, b) => a.teamName.localeCompare(b.teamName));
    HOME.all = { teams };
  } catch (err){
    console.warn('Netty Pal: every team', err);
    HOME.all = { error:true };
  }
  render();
}

// The owner deletes a whole team: every season and everything in it
// (members, players, games and their events, invite links, codes), then the
// team itself. Only the owner is allowed to do this (see firestore.rules).
// People who were in it simply stop seeing it: their home screen tidies
// away seasons they're no longer a member of.
async function deleteTeam(teamId){
  const seasonSnaps = await getDocs(collection(db, 'teams', teamId, 'seasons'));
  for (const se of seasonSnaps.docs){
    const [members, players, games, invites] = await Promise.all(['members', 'players', 'games', 'invites'].map(c => getDocs(collection(se.ref, c))));
    const refs = [];
    for (const g of games.docs){
      const events = await getDocs(collection(g.ref, 'events'));
      events.docs.forEach(e => refs.push(e.ref));
    }
    refs.push(...games.docs.map(d => d.ref), ...players.docs.map(d => d.ref));
    invites.docs.forEach(d => { refs.push(d.ref); refs.push(doc(db, 'roleInvites', d.id)); });
    if (se.data().joinCode) refs.push(doc(db, 'joinCodes', se.data().joinCode));
    // Members last but one, then the season, so nothing is left orphaned if it stops part way.
    refs.push(...members.docs.map(d => d.ref), se.ref);
    await deleteDocs(refs);
  }
  await deleteDoc(doc(db, 'teams', teamId));
  HOME.items = HOME.items.filter(it => it.teamId !== teamId);
  toast('Team deleted.');
  await loadOwnerTeams();
}

/* ---- Install on a phone ----
   Netty Pal is a web app, but it can sit on a phone's home screen and open
   full-screen like any other app, without the browser's address bar.
   Android (Chrome, Edge, Samsung) can install it with one tap: the browser
   offers a "beforeinstallprompt" event, which we keep and use for the
   Install button. iPhone and iPad have no such button, so we show the
   Share > Add to Home Screen steps instead. */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; UI.showInstall = false; render(); toast('Netty Pal is on your home screen.'); });
const INSTALL_CARD_KEY = 'nettyPalInstallCardHidden';
// Already running from the home screen (no address bar)?
function isInstalled(){
  try { if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) return true; } catch(e){}
  return navigator.standalone === true;
}
function devicePlatform(){
  const ua = navigator.userAgent || '';
  // iPads say they're Macs, but Macs don't have touch screens.
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'other';
}
function installCardHidden(){ try { return localStorage.getItem(INSTALL_CARD_KEY) === '1'; } catch(e){ return false; } }
// A reminder on the home screen until it's installed or put away.
function installCardHtml(){
  if (isInstalled() || installCardHidden() || devicePlatform() === 'other') return '';
