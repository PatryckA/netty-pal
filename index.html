<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netty Pal</title>
<meta name="description" content="Court time, positions and live scoring for junior netball teams.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4E8C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Netty Pal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#F2F0EA; --surface:#FFFFFF; --surface-2:#F7F5F0; --line:#DAD5C8;
  --ink:#172033; --ink-soft:#586072; --accent:#1F4E8C; --accent-strong:#163B6B;
  --accent-contrast:#FFFFFF; --accent-bg:#E0E8F4; --warm:#C8641C; --warm-bg:#F7E6D6;
  --ok:#2E7550; --ok-bg:#DDEEE3; --critical:#B3261E; --critical-bg:#F6DEDC;
  --shadow:rgba(23,32,51,0.10);
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --surface:#171E2B; --surface-2:#1D2534; --line:#2B3547;
    --ink:#E8EAF0; --ink-soft:#A3AABA; --accent:#7FAEE8; --accent-strong:#A5C7F0;
    --accent-contrast:#0D1522; --accent-bg:#1C2B42; --warm:#F0A060; --warm-bg:#3A2819;
    --ok:#74C497; --ok-bg:#1A3325; --critical:#F08A82; --critical-bg:#3D1F1D;
    --shadow:rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --surface:#171E2B; --surface-2:#1D2534; --line:#2B3547;
  --ink:#E8EAF0; --ink-soft:#A3AABA; --accent:#7FAEE8; --accent-strong:#A5C7F0;
  --accent-contrast:#0D1522; --accent-bg:#1C2B42; --warm:#F0A060; --warm-bg:#3A2819;
  --ok:#74C497; --ok-bg:#1A3325; --critical:#F08A82; --critical-bg:#3D1F1D;
  --shadow:rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; letter-spacing:0.01em; text-wrap:balance;}
button{font-family:var(--font-body);}
input,select{font-family:var(--font-body); font-size:1rem;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.app-shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:0.75rem 1rem;
  display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
}
.brand{font-family:var(--font-display); font-size:1.5rem; font-weight:800; letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;}
@media (max-width:520px){ .user-chip .uname{display:none;} }
.brand span{color:var(--warm);}
.user-chip{display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:var(--ink-soft); min-width:0;}
.user-chip .uname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:9rem;}
main{flex:1; padding:1rem 1rem 4rem;}
.loading-state{color:var(--ink-soft); font-size:0.9rem; padding:3rem 1rem; text-align:center;}
.offline-banner{background:var(--critical); color:#fff; font-size:0.82rem; font-weight:600; padding:0.6rem 1rem; text-align:center;}

/* ---- Buttons and inputs ---- */
.btn{
  background:var(--accent); color:var(--accent-contrast); border:1px solid var(--accent); border-radius:8px;
  padding:0.55rem 0.95rem; font-weight:700; font-size:0.88rem; cursor:pointer;
}
.btn:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn.ghost{background:none; color:var(--ink); border-color:var(--line);}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
.btn.small{padding:0.35rem 0.65rem; font-size:0.78rem;}
.btn.big{padding:0.8rem 1.4rem; font-size:1rem;}
.btn.danger{background:none; color:var(--critical); border-color:var(--critical);}
.btn.danger.armed,.btn.armed{background:var(--critical); color:#fff; border-color:var(--critical);}
.btn:disabled{opacity:0.55; cursor:default;}
.text-input,.select-input{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:0.55rem 0.7rem; color:var(--ink);
}
.text-input:focus,.select-input:focus{border-color:var(--accent); outline:none;}
.field{display:flex; flex-direction:column; gap:0.3rem;}
.field label,.field .label{font-size:0.78rem; font-weight:700; color:var(--ink-soft);}
.field-row{display:flex; gap:0.6rem; flex-wrap:wrap;}
.field-row > .field{flex:1; min-width:130px;}
.hint{font-size:0.75rem; color:var(--ink-soft);}
.segmented{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; width:fit-content;}
.segmented label{position:relative; cursor:pointer;}
.segmented input{position:absolute; opacity:0; pointer-events:none;}
.segmented span{display:block; padding:0.5rem 0.9rem; font-size:0.85rem; font-weight:700; background:var(--surface); color:var(--ink);}
.segmented input:checked + span{background:var(--accent); color:var(--accent-contrast);}
.segmented input:focus-visible + span{outline:2px solid var(--accent); outline-offset:-3px;}
.form-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1rem;
  display:flex; flex-direction:column; gap:0.8rem; margin-bottom:1rem;
}
.form-card h3{font-size:1.2rem;}
.form-actions{display:flex; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap;}
.check-row{display:flex; align-items:center; gap:0.5rem; font-size:0.88rem;}

/* ---- Sign in ---- */
.hero{text-align:center; padding:3rem 1rem 2rem; display:flex; flex-direction:column; align-items:center; gap:1rem;}
.hero h1{font-size:3rem; text-transform:uppercase; letter-spacing:0.03em; line-height:1;}
.hero h1 span{color:var(--warm);}
.hero p{margin:0; color:var(--ink-soft); max-width:26rem;}
.hero .fine{font-size:0.78rem;}
.ball{width:84px; height:84px;}

/* ---- Home ---- */
.section-title{font-size:1.7rem; margin-bottom:0.8rem; text-transform:uppercase;}
.team-list{display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1.2rem;}
.team-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0.9rem 1rem;
  text-align:left; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between;
  align-items:center; gap:0.75rem; width:100%;
}
.team-card:hover{border-color:var(--accent);}
.team-card .tname{font-family:var(--font-display); font-size:1.35rem; font-weight:700; line-height:1.1;}
.team-card .tseason{font-size:0.8rem; color:var(--ink-soft);}
.badges{display:flex; gap:0.3rem; flex-wrap:wrap; justify-content:flex-end;}
.badge{
  font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  padding:0.18rem 0.45rem; border-radius:5px; background:var(--surface-2); color:var(--ink-soft);
  border:1px solid var(--line); white-space:nowrap;
}
.badge.admin{background:var(--warm-bg); color:var(--warm); border-color:transparent;}
.badge.coach{background:var(--accent-bg); color:var(--accent); border-color:transparent;}
.badge.scorer{background:var(--ok-bg); color:var(--ok); border-color:transparent;}
.home-actions{display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;}
.empty-state{color:var(--ink-soft); font-size:0.9rem; padding:1.5rem 0.5rem; text-align:center;}

/* ---- Season ---- */
.back-link{
  background:none; border:none; color:var(--ink-soft); font-size:0.8rem; font-weight:700;
  padding:0; cursor:pointer; margin-bottom:0.35rem;
}
.back-link:hover{color:var(--accent);}
.season-head{margin-bottom:0.9rem;}
.season-head h2{font-size:2rem; text-transform:uppercase; line-height:1.05;}
.season-meta{font-size:0.82rem; color:var(--ink-soft); margin-top:0.2rem;}
.tabs{display:flex; gap:0.35rem; margin-bottom:1rem; overflow-x:auto; padding-bottom:0.2rem;}
.tab{
  flex:none; background:var(--surface); border:1px solid var(--line); color:var(--ink);
  padding:0.45rem 0.85rem; border-radius:20px; font-size:0.84rem; font-weight:700; cursor:pointer;
}
.tab.active{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
.list-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:1rem;}
.list-row{display:flex; align-items:center; gap:0.6rem; padding:0.65rem 0.9rem; border-top:1px solid var(--line); flex-wrap:wrap;}
.list-row:first-child{border-top:none;}
.list-row .grow{flex:1; min-width:0;}
.list-row.inactive .pname{color:var(--ink-soft); text-decoration:line-through;}
.pname{font-weight:600;}
.psub{font-size:0.75rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis;}
.row-input{
  flex:1; min-width:0; background:transparent; border:1px solid transparent; border-radius:7px;
  padding:0.35rem 0.5rem; color:var(--ink); font-weight:600;
}
.row-input:hover{border-color:var(--line);}
.row-input:focus{border-color:var(--accent); background:var(--surface); outline:none;}
.avatar{
  width:34px; height:34px; border-radius:50%; background:var(--accent-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; flex:none;
  overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.avatar.small{width:26px; height:26px; font-size:0.7rem;}
.role-toggles{display:flex; gap:0.35rem; flex-wrap:wrap;}
.role-toggle{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:20px;
  padding:0.3rem 0.7rem; font-size:0.76rem; font-weight:800; cursor:pointer;
}
.role-toggle[aria-pressed="true"].coach{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.role-toggle[aria-pressed="true"].scorer{background:var(--ok); border-color:var(--ok); color:#fff;}
.member-actions{display:flex; gap:0.35rem; flex-wrap:wrap; width:100%; padding-left:calc(34px + 0.6rem);}
.code-card{
  background:var(--accent); color:var(--accent-contrast); border-radius:12px; padding:1rem;
  margin-bottom:1rem; display:flex; flex-direction:column; gap:0.6rem;
}
.code-card .label{font-size:0.75rem; font-weight:700; opacity:0.85; text-transform:uppercase; letter-spacing:0.08em;}
.code-value{font-family:var(--font-display); font-size:2.6rem; font-weight:800; letter-spacing:0.18em; line-height:1;}
.code-card .btn{background:var(--accent-contrast); color:var(--accent); border-color:var(--accent-contrast);}
.code-card .btn.armed{background:var(--critical); color:#fff; border-color:var(--critical);}
.code-actions{display:flex; gap:0.4rem; flex-wrap:wrap;}
.subhead{font-size:1.2rem; text-transform:uppercase; margin:0.2rem 0 0.6rem;}
.placeholder-card{
  background:var(--surface); border:1.5px dashed var(--line); border-radius:12px; padding:1.5rem 1rem;
  text-align:center; color:var(--ink-soft); font-size:0.9rem;
}
.add-inline{display:flex; gap:0.5rem; padding:0.75rem 0.9rem; border-top:1px dashed var(--line);}
.add-inline .text-input{flex:1;}
.toast{
  position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:50;
  background:var(--ink); color:var(--paper); padding:0.65rem 1rem; border-radius:10px;
  font-size:0.85rem; font-weight:600; box-shadow:0 6px 20px var(--shadow); max-width:calc(100% - 2rem);
}
.toast.error{background:var(--critical); color:#fff;}
.danger-zone{margin-top:1.5rem; padding-top:1rem; border-top:1px dashed var(--line);}

/* ---- Games ---- */
.game-list{display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1rem;}
.game-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0.75rem 0.9rem;
  text-align:left; color:var(--ink); cursor:pointer; width:100%; display:flex; gap:0.85rem; align-items:center;
}
.game-card:hover{border-color:var(--accent);}
.game-card.past{opacity:0.8;}
.game-date{flex:none; width:3rem; text-align:center; font-family:var(--font-display); line-height:1;}
.game-date .dw{font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); font-weight:700; letter-spacing:0.05em;}
.game-date .dd{font-size:1.7rem; font-weight:800;}
.game-date .dm{font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
.game-date.tbc .dd{font-size:1.1rem; color:var(--ink-soft);}
.gopp{font-weight:800; font-size:1rem;}
.gmeta{font-size:0.78rem; color:var(--ink-soft);}
.gstatus{font-size:0.75rem; font-weight:700; margin-top:0.15rem;}
.gstatus.todo{color:var(--warm);}
.gstatus.ok{color:var(--ok);}
.list-label{font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin:1.1rem 0 0.5rem;}
.game-head h2{font-size:1.9rem; text-transform:uppercase; line-height:1.05;}
.period-picker{display:flex; gap:0.35rem; margin-bottom:0.8rem; flex-wrap:wrap;}
.period-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:8px;
  padding:0.45rem 0.8rem; font-family:var(--font-display); font-size:1.05rem; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:0.35rem;
}
.period-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.period-btn .pdot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.period-btn .pdot.none{background:transparent; border:1.5px solid var(--line);}
.period-btn .pdot.follow{background:transparent; border:1.5px solid var(--ok);}
.follow-note{
  font-size:0.82rem; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--line);
  border-radius:8px; padding:0.45rem 0.7rem; margin:0 0 0.7rem;
}
.follow-note.own{border-style:solid;}
/* ---- Court ---- */
:root{ --court-bg:#CFE4F5; --court-line:#FFFFFF; --chip-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --court-bg:#172B42; --court-line:rgba(255,255,255,0.38); --chip-ink:#0D1522; } }
:root[data-theme="dark"]{ --court-bg:#172B42; --court-line:rgba(255,255,255,0.38); --chip-ink:#0D1522; }
.sheet .grow{flex:1; min-width:0;}
.court-wrap{max-width:320px; margin:0 auto 1rem;}
.court-end{
  text-align:center; font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--ink-soft); padding:0.3rem 0;
}
.court{position:relative; width:100%; aspect-ratio:100 / 135; background:var(--court-bg); border-radius:10px;}
.court-lines{position:absolute; inset:0; width:100%; height:100%;}
.court-lines *{fill:none; stroke:var(--court-line); stroke-width:1; vector-effect:non-scaling-stroke;}
.court-lines rect,.court-lines line,.court-lines path,.court-lines circle{stroke-width:2.5px;}
.court-token{
  position:absolute; transform:translate(-50%, -30%); display:flex; flex-direction:column; align-items:center;
  gap:0.2rem; background:none; border:none; padding:0.2rem; cursor:pointer; color:var(--ink); width:6.5rem;
}
div.court-token{cursor:default;}
.court-token .pos-chip{width:2.9rem; height:2.9rem; font-size:1.15rem; box-shadow:0 0 0 3px var(--court-line), 0 2px 6px var(--shadow);}
.court-token.picking .pos-chip{box-shadow:0 0 0 3px var(--ink), 0 2px 6px var(--shadow);}
button.court-token:hover .pos-chip{transform:scale(1.06);}
.token-name{
  max-width:100%; background:var(--surface); border-radius:6px; padding:0.1rem 0.45rem; font-size:0.8rem; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 1px 3px var(--shadow);
}
.token-name.empty{color:var(--ink-soft); font-weight:500; font-style:italic;}
.sheet-backdrop{position:fixed; inset:0; background:rgba(10,15,25,0.45); z-index:40;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:640px; margin:0 auto; max-height:75vh;
  display:flex; flex-direction:column; background:var(--paper); border-radius:16px 16px 0 0;
  box-shadow:0 -8px 30px var(--shadow); padding-bottom:env(safe-area-inset-bottom);
}
.sheet-head{display:flex; align-items:center; gap:0.75rem; padding:0.9rem 1rem; border-bottom:1px solid var(--line);}
.sheet-head h3{font-size:1.35rem; text-transform:uppercase;}
.sheet-body{overflow-y:auto; padding:0 1rem 1rem;}
.sheet-body .list-label{margin-top:0.9rem;}
.pick-row{
  display:flex; align-items:center; gap:0.6rem; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; padding:0.65rem 0.8rem; margin-bottom:0.4rem;
  color:var(--ink); cursor:pointer; font-size:0.95rem;
}
.pick-row:hover{border-color:var(--accent);}
.pick-row.current{border-color:var(--accent); background:var(--accent-bg);}
.pick-row .pname{display:block;}
.pick-row .psub{display:block;}
.pick-count{font-size:0.78rem; font-weight:800; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}
.pick-count.zero{color:var(--warm);}
.pos-chip{
  width:2.6rem; height:2.6rem; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:var(--chip-ink);
}
.pos-chip.att{background:var(--warm);}
.pos-chip.mid{background:var(--accent); color:var(--accent-contrast);}
.pos-chip.def{background:var(--ok);}
.pos-chip.unfilled{background:var(--surface-2); color:var(--ink-soft); border:1.5px dashed var(--line);}
.chip-wrap{display:flex; gap:0.35rem; flex-wrap:wrap;}
.chip{
  display:inline-flex; align-items:center; gap:0.3rem; font-size:0.8rem; font-weight:600;
  padding:0.25rem 0.6rem; border-radius:20px; background:var(--surface-2); border:1px solid var(--line);
}
.chip b{font-variant-numeric:tabular-nums;}
.chip.zero{border-color:var(--warm); color:var(--warm);}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0.8rem 0.9rem; margin-bottom:1rem;}
.panel h4{margin:0 0 0.5rem; font-size:0.78rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);}
.lineup-tools{display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1rem;}
.avail-row{
  display:flex; align-items:center; gap:0.7rem; width:100%; padding:0.65rem 0.9rem; border:none;
  border-top:1px solid var(--line); background:none; color:var(--ink); font-size:0.95rem; text-align:left; cursor:pointer;
}
.avail-row:first-child{border-top:none;}
.avail-row[disabled]{cursor:default;}
.avail-row.off .pname{color:var(--ink-soft); text-decoration:line-through;}
.tick{
  width:24px; height:24px; border-radius:6px; border:1.5px solid var(--line); flex:none;
  display:flex; align-items:center; justify-content:center; background:var(--surface); color:#fff; font-size:0.85rem;
}
.avail-row.on .tick{background:var(--ok); border-color:var(--ok);}
.fair-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:0.6rem;}
table.fair{border-collapse:collapse; width:100%; font-size:0.84rem; font-variant-numeric:tabular-nums;}
.fair th,.fair td{padding:0.5rem 0.3rem; text-align:center; border-top:1px solid var(--line);}
.fair thead th:last-child{padding-right:0.6rem; line-height:1.05;}
.fair thead th{border-top:none; font-family:var(--font-display); font-size:0.95rem; font-weight:700;}
.fair th:first-child,.fair td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); white-space:nowrap; padding-left:0.8rem; font-weight:600;}
.fair td.total{font-weight:800;}
.fair td.this{font-weight:800; color:var(--accent);}
.fair td.zero-this{color:var(--warm);}
</style>
</head>
<body>
<div id="app"><div class="loading-state">Loading Netty Pal…</div></div>
<div id="toast-root"></div>
<script type="module">

/* ---------------------------------------------------------------------
   Data layout (Firestore)
     teams/{teamId}                               name, adminUid
       seasons/{seasonId}                         name, competition, format, periodMinutes, joinCode
         members/{uid}                            name, email, photoURL, roles[], code
         players/{playerId}                       name, active
         games/{gameId}                           round, date, time, opponent, venue, court,
                                                  format, periodMinutes, status,
                                                  available[] (player ids; missing = all active),
                                                  plan { "1": { GS: playerId, ... }, "2": ... }
     joinCodes/{code}                             teamId, seasonId
     users/{uid}/memberships/{seasonId}           teamId, seasonId (so "my teams" can be listed)
--------------------------------------------------------------------- */
const DEFAULT_PERIOD_MINUTES = 7;
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L
const CODE_LENGTH = 6;
const POSITIONS = ['GS','GA','WA','C','WD','GD','GK'];
const POS_ZONE = { GS:'att', GA:'att', WA:'mid', C:'mid', WD:'mid', GD:'def', GK:'def' };
const POS_NAMES = { GS:'Goal Shooter', GA:'Goal Attack', WA:'Wing Attack', C:'Centre', WD:'Wing Defence', GD:'Goal Defence', GK:'Goal Keeper' };
// Where each bib sits on the court drawing, as % across and % down, with
// the attacking end at the top: GS in the goal circle, GA in the attacking
// third, WA, C and WD in the centre third (WA and WD near the transverse
// lines), GD in the defensive third, GK in
// the defending goal circle.
const COURT_SPOTS = { GS:[50,9], GA:[28,20], WA:[76,39], C:[50,50], WD:[24,54], GD:[72,76], GK:[50,89] };

let USER = null;
let authReady = false;
let offlineMode = !navigator.onLine;

// What the screen is showing. form is the name of an open inline form.
// view is 'home', 'season' or 'game'; gameTab and period belong to the game screen.
let UI = { view:'home', teamId:null, seasonId:null, tab:'games', form:null, busy:false,
  gameId:null, gameTab:'lineup', period:1, pickPos:null };

// Home screen: one entry per season the user belongs to.
let HOME = { loaded:false, items:[] };

// The season currently open, kept live by onSnapshot listeners.
let CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{} };

let armed = new Map(); // key -> timeout id, for "tap again to confirm" buttons

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function newId(){ return doc(collection(db, '_')).id; }
function randomCode(){
  const bytes = new Uint32Array(CODE_LENGTH);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
}
function normaliseCode(raw){ return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function initials(name){
  const parts = String(name || '?').trim().split(/\s+/);
  return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function formatLabel(season){
  if (!season) return '';
  const n = season.format === 'halves' ? 2 : 4;
  return `${n} × ${season.periodMinutes || DEFAULT_PERIOD_MINUTES} min ${season.format === 'halves' ? 'halves' : 'quarters'}`;
}
function avatarHtml(name, photoURL, cls){
  const inner = photoURL
    ? `<img src="${escapeHtml(photoURL)}" alt="" referrerpolicy="no-referrer">`
    : escapeHtml(initials(name));
  return `<span class="avatar ${cls || ''}" aria-hidden="true">${inner}</span>`;
}
function roleBadges(roles, isAdmin){
  const out = [];
  if (isAdmin) out.push('<span class="badge admin">Admin</span>');
  if (roles && roles.includes('coach')) out.push('<span class="badge coach">Coach</span>');
  if (roles && roles.includes('scorer')) out.push('<span class="badge scorer">Scorer</span>');
  if (!out.length) out.push('<span class="badge">Viewer</span>');
  return out.join('');
}
function toast(msg, isError){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast${isError ? ' error' : ''}" role="status">${escapeHtml(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { root.innerHTML = ''; }, isError ? 6000 : 3000);
}
function friendlyError(err){
  const code = (err && err.code) || '';
  if (code.includes('permission-denied')) return "You don't have permission to do that.";
  if (code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Sign-in was cancelled.';
  if (code.includes('popup-blocked')) return 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if (code.includes('unauthorized-domain')) return "This web address isn't allowed to sign in yet. Add it under Firebase > Authentication > Settings > Authorised domains.";
  if (code.includes('unavailable') || code.includes('network')) return 'No connection. Check your internet and try again.';
  return (err && err.message) || 'Something went wrong.';
}
function fail(err){ console.warn('Netty Pal:', err); toast(friendlyError(err), true); }

// "Tap again to confirm" for anything destructive or hard to undo.
function isArmed(key){ return armed.has(key); }
function arm(key){
  clearTimeout(armed.get(key));
  armed.set(key, setTimeout(() => { armed.delete(key); render(); }, 4000));
  render();
}
function disarm(key){ clearTimeout(armed.get(key)); armed.delete(key); }

// Role checks for the open season. The page uses these to decide what to
// show; the security rules enforce the same thing on Google's side.
function isAdmin(){ return !!(USER && CUR.team && CUR.team.adminUid === USER.uid); }
function myMember(){ return USER ? CUR.members.find(m => m.id === USER.uid) : null; }
function myRoles(){ const m = myMember(); return (m && m.roles) || []; }
function canEditRoster(){ return isAdmin() || myRoles().includes('coach'); }
// Fixtures, availability and lineup plans: admin or Coach.
function canEditGames(){ return isAdmin() || myRoles().includes('coach'); }

/* ---------------------------------------------------------------------
   Game helpers
--------------------------------------------------------------------- */
function findGame(id){ return CUR.games.find(g => g.id === id); }
function playerName(id){ const p = CUR.players.find(p => p.id === id); return p ? p.name : 'Unknown player'; }
function periodCount(g){ return g && g.format === 'halves' ? 2 : 4; }
function periodName(g, p){ return g.format === 'halves' ? (p === 1 ? '1st half' : '2nd half') : 'Q' + p; }
function periodNoun(g, plural){
  if (g.format === 'halves') return plural ? 'halves' : 'half';
  return plural ? 'quarters' : 'quarter';
}
// Lineups carry forward: a period with no lineup of its own uses the one
// before it. So setting Q1 fills Q2 to Q4, and a change in Q2 flows on to
// Q3 and Q4 unless those have been changed separately.
function ownPlan(g, p){ return g.plan && g.plan[p] ? g.plan[p] : null; }
function planFor(g, p){
  for (let k = p; k >= 1; k--){ const own = ownPlan(g, k); if (own) return own; }
  return {};
}
// The earlier period this one is following, or 0 if it has its own lineup.
function followsPeriod(g, p){
  if (p < 2 || ownPlan(g, p)) return 0;
  for (let k = p - 1; k >= 1; k--) if (ownPlan(g, k)) return k;
  return 0;
}
function isPeriodPlanned(g, p){ return POSITIONS.some(pos => planFor(g, p)[pos]); }
function plannedCount(g){
  let n = 0;
  for (let p = 1; p <= periodCount(g); p++) if (isPeriodPlanned(g, p)) n++;
  return n;
}
// Players ticked as playing this game. Until the coach sets it, that's
// every active player.
function availableIds(g){
  if (Array.isArray(g.available)) return g.available.filter(id => CUR.players.some(p => p.id === id));
  return CUR.players.filter(p => p.active !== false).map(p => p.id);
}
function byName(ids){ return ids.slice().sort((a,b) => playerName(a).localeCompare(playerName(b))); }
function pad2(n){ return String(n).padStart(2, '0'); }
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseIsoDate(iso){
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${pad2(m)}${h >= 12 ? 'pm' : 'am'}`;
}
function fmtGameWhen(g){
  const d = parseIsoDate(g.date);
  const date = d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }) : 'Date TBC';
  return g.time ? `${date}, ${fmtTime(g.time)}` : date;
}
// Dated games in date/time order, undated ones last.
function sortGames(games){
  return games.slice().sort((a,b) => {
    if (!a.date && !b.date) return String(a.round || '').localeCompare(String(b.round || ''), undefined, { numeric:true });
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
  });
}
function nextRound(){
  const nums = CUR.games.map(g => parseInt(g.round, 10)).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) + 1 : 1;
}
function gameTitle(g){ return `vs ${g.opponent || 'TBC'}`; }
function gameFormatLabel(g){ return formatLabel({ format:g.format, periodMinutes:g.periodMinutes }); }

/* ---------------------------------------------------------------------
   Rendering. Live updates re-render the whole screen, so any half-typed
   text in a form is saved first and put back afterwards.
--------------------------------------------------------------------- */
function captureInputs(){
  const saved = {};
  document.querySelectorAll('#app input[id], #app select[id]').forEach(el => {
    saved[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked:el.checked } : { value:el.value };
  });
  const active = document.activeElement;
  return { saved, focusId: active && active.id ? active.id : null,
    selStart: active && 'selectionStart' in active ? active.selectionStart : null };
}
function restoreInputs(state){
  Object.entries(state.saved).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if ('checked' in v) el.checked = v.checked; else el.value = v.value;
  });
  if (state.focusId){
    const el = document.getElementById(state.focusId);
    if (el){
      el.focus();
      try { if (state.selStart != null) el.setSelectionRange(state.selStart, state.selStart); } catch(e){}
    }
  }
}

function render(){
  const app = document.getElementById('app');
  const keep = captureInputs();
  let body;
  if (!authReady) body = '<div class="loading-state">Loading Netty Pal…</div>';
  else if (!USER) body = renderSignedOut();
  else {
    let main;
    if (UI.view === 'season') main = renderSeason();
    else if (UI.view === 'game') main = renderGame();
    else main = renderHome();
    body = `<div class="app-shell">
      ${offlineMode ? '<div class="offline-banner">You\'re offline. Changes will sync when you reconnect.</div>' : ''}
      ${renderTopbar()}
      <main>${main}</main>
    </div>`;
  }
  app.innerHTML = body;
  restoreInputs(keep);
}

}

/* ---- Home ---- */
function renderHome(){
  let list;
  const retry = HOME.loaded && HOME.failed
    ? `<div class="panel" role="alert">
        <p style="margin:0 0 0.6rem">${HOME.items.length ? 'Some of your teams' : 'Your teams'} couldn't be loaded just now. This is usually a connection hiccup.</p>
        <button class="btn small" data-action="reload-home">Try again</button>
      </div>` : '';
  if (!HOME.loaded) list = '<div class="loading-state">Loading your teams…</div>';
  else if (!HOME.items.length && HOME.failed) list = retry;
  else if (!HOME.items.length) list = '<div class="empty-state">You\'re not in any teams yet. Join one with a season code from your coach, or create your own team.</div>';
  else list = `<div class="team-list">${HOME.items.map(it => `
      <button class="team-card" data-action="open-season" data-team="${escapeHtml(it.teamId)}" data-season="${escapeHtml(it.seasonId)}">
        <div>
          <div class="tname">${escapeHtml(it.teamName)}</div>
          <div class="tseason">${escapeHtml(it.seasonName)}${it.competition ? ' · ' + escapeHtml(it.competition) : ''}</div>
        </div>
        <div class="badges">${roleBadges(it.roles, it.isAdmin)}</div>
      </button>`).join('')}</div>${retry}`;

  let form = '';
  if (UI.form === 'join') form = `
    <form class="form-card" data-form="join">
      <h3>Join a team</h3>
      <div class="field">
        <label for="join-code">Season code</label>
        <input class="text-input" id="join-code" name="code" autocomplete="off" autocapitalize="characters"
          maxlength="12" placeholder="e.g. K7PQ2M" required>
        <span class="hint">Ask your coach or team admin for this.</span>
      </div>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-action="close-form">Cancel</button>
        <button type="submit" class="btn" ${UI.busy ? 'disabled' : ''}>Join</button>
      </div>
    </form>`;
  else if (UI.form === 'create-team') form = `
    <form class="form-card" data-form="create-team">
      <h3>Create a team</h3>
      <div class="field">
        <label for="ct-team">Team name</label>
        <input class="text-input" id="ct-team" name="teamName" placeholder="e.g. Hawks 11U" required maxlength="60">
      </div>
      ${seasonFieldsHtml('ct', {})}
      <p class="hint">You'll be the team admin, Coach and Scorer to start with. You can hand any of those to other parents later.</p>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-action="close-form">Cancel</button>
        <button type="submit" class="btn" ${UI.busy ? 'disabled' : ''}>Create team</button>
      </div>
    </form>`;

  return `<h2 class="section-title">Your teams</h2>
    <p class="hint" style="margin:-0.4rem 0 0.9rem">Signed in as ${escapeHtml(USER.email || USER.displayName || '')}</p>
    ${form}
    ${list}
    ${UI.form ? '' : `<div class="home-actions">
      <button class="btn" data-action="show-form" data-form-name="join">Join with a code</button>
      <button class="btn ghost" data-action="show-form" data-form-name="create-team">Create a team</button>
    </div>`}`;
}

// Shared season fields for "create team", "new season" and season settings.
function seasonFieldsHtml(prefix, s){
  const fmt = s.format || 'quarters';
  return `
    <div class="field-row">
      <div class="field">
        <label for="${prefix}-season">Season name</label>
        <input class="text-input" id="${prefix}-season" name="seasonName" required maxlength="60"
          placeholder="e.g. Winter 2027" value="${escapeHtml(s.name || '')}">
      </div>
      <div class="field">
        <label for="${prefix}-comp">Competition <span class="hint">(optional)</span></label>
        <input class="text-input" id="${prefix}-comp" name="competition" maxlength="80"
          placeholder="e.g. Saturday juniors" value="${escapeHtml(s.competition || '')}">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <span class="label" id="${prefix}-fmt-label">Game format</span>
        <div class="segmented" role="radiogroup" aria-labelledby="${prefix}-fmt-label">
          <label><input type="radio" id="${prefix}-fmt-q" name="format" value="quarters" ${fmt === 'quarters' ? 'checked' : ''}><span>Quarters</span></label>
          <label><input type="radio" id="${prefix}-fmt-h" name="format" value="halves" ${fmt === 'halves' ? 'checked' : ''}><span>Halves</span></label>
        </div>
      </div>
      <div class="field">
        <label for="${prefix}-mins">Minutes per period</label>
        <input class="text-input" id="${prefix}-mins" name="periodMinutes" type="number" min="1" max="30" required
          value="${escapeHtml(s.periodMinutes || DEFAULT_PERIOD_MINUTES)}" style="max-width:7rem">
      </div>
    </div>
    <span class="hint">These are the defaults for every game this season. Each game can override them.</span>`;
}

/* ---- Season ---- */
function renderSeason(){
  const t = CUR.team, s = CUR.season;
  if (!t || !s || !CUR.loaded.members) return `<button class="back-link" data-action="go-home">‹ All teams</button>
    <div class="loading-state">Loading…</div>`;

  const tabs = [['games','Games'], ['players','Players'], ['people','People']];
  if (isAdmin()) tabs.push(['settings','Settings']);
  if (!tabs.some(([k]) => k === UI.tab)) UI.tab = 'games';

  let content = '';
  if (UI.tab === 'games') content = renderGamesTab();
  else if (UI.tab === 'players') content = renderPlayersTab();
  else if (UI.tab === 'people') content = renderPeopleTab();
  else if (UI.tab === 'settings') content = renderSettingsTab();

  return `<div class="season-head">
      <button class="back-link" data-action="go-home">‹ All teams</button>
      <h2>${escapeHtml(t.name)}</h2>
      <div class="season-meta">${escapeHtml(s.name)}${s.competition ? ' · ' + escapeHtml(s.competition) : ''} · ${escapeHtml(formatLabel(s))}</div>
      <div class="badges" style="justify-content:flex-start; margin-top:0.45rem">${roleBadges(myRoles(), isAdmin())}</div>
    </div>
    <nav class="tabs" aria-label="Season sections">
      ${tabs.map(([k, label]) => `<button class="tab ${UI.tab === k ? 'active' : ''}" data-action="tab" data-tab="${k}" ${UI.tab === k ? 'aria-current="page"' : ''}>${label}</button>`).join('')}
    </nav>
    ${content}`;
}

function gamesErrorHtml(){
  const denied = String(CUR.gamesError && CUR.gamesError.code).includes('permission-denied');
  return `<div class="panel" role="alert">
      <p style="margin:0">${denied
        ? (isAdmin()
          ? "Games can't be loaded because the database's security rules are out of date. Publish the latest firestore.rules in Firebase (Firestore Database > Rules), then refresh this page."
          : "Games can't be loaded right now. Please let your team admin know.")
        : "Games couldn't be loaded. Check your connection and refresh the page."}</p>
    </div>`;
}

function renderGamesTab(){
  const editable = canEditGames();
  if (CUR.gamesError) return gamesErrorHtml();
  if (!CUR.loaded.games) return '<div class="loading-state">Loading games…</div>';
  const games = sortGames(CUR.games);
  const today = todayIso();
  const upcoming = games.filter(g => !g.date || g.date >= today);
  const earlier = games.filter(g => g.date && g.date < today).reverse();

  const form = UI.form === 'add-game'
    ? gameFormHtml('ag', { round:nextRound(), format:CUR.season.format, periodMinutes:CUR.season.periodMinutes }, 'add-game', 'Add fixture')
    : '';

  const addBtn = editable && !UI.form
    ? `<div class="home-actions"><button class="btn" data-action="show-form" data-form-name="add-game">Add fixture</button></div>` : '';

  let body;
  if (!games.length){
    body = `<div class="empty-state">No games yet.${editable ? ' Add this season\'s fixtures to start planning lineups.' : ' Your coach will add them.'}</div>`;
  } else {
    body = `${upcoming.length ? `<div class="list-label">Upcoming</div><div class="game-list">${upcoming.map(g => gameCardHtml(g, false)).join('')}</div>` : ''}
      ${earlier.length ? `<div class="list-label">Earlier</div><div class="game-list">${earlier.map(g => gameCardHtml(g, true)).join('')}</div>` : ''}`;
  }
  return `${form}${addBtn}${body}`;
}

function gameCardHtml(g, past){
  const d = parseIsoDate(g.date);
  const dateBlock = d
    ? `<div class="game-date"><div class="dw">${d.toLocaleDateString('en-AU', { weekday:'short' })}</div>
        <div class="dd">${d.getDate()}</div><div class="dm">${d.toLocaleDateString('en-AU', { month:'short' })}</div></div>`
    : `<div class="game-date tbc"><div class="dd">TBC</div></div>`;
  const n = periodCount(g), planned = plannedCount(g);
  const status = planned === n
    ? `<div class="gstatus ok">Lineup planned</div>`
    : `<div class="gstatus ${past ? '' : 'todo'}">Lineup: ${planned} of ${n} ${periodNoun(g, true)} planned</div>`;
  const meta = [g.round ? 'Round ' + g.round : '', fmtTime(g.time), g.venue, g.court].filter(Boolean).join(' · ');
  return `<button class="game-card ${past ? 'past' : ''}" data-action="open-game" data-game="${escapeHtml(g.id)}">
      ${dateBlock}
      <div class="grow">
        <div class="gopp">${escapeHtml(gameTitle(g))}</div>
        ${meta ? `<div class="gmeta">${escapeHtml(meta)}</div>` : ''}
        ${status}
      </div>
    </button>`;
}

// Shared fixture fields for "add fixture" and the game's Details tab.
function gameFormHtml(prefix, g, formName, submitLabel){
  const fmt = g.format || 'quarters';
  return `<form class="form-card" data-form="${formName}">
      ${formName === 'add-game' ? '<h3>Add fixture</h3>' : ''}
      <div class="field-row">
        <div class="field" style="max-width:6rem">
          <label for="${prefix}-round">Round</label>
          <input class="text-input" id="${prefix}-round" name="round" maxlength="12" value="${escapeHtml(g.round || '')}">
        </div>
        <div class="field">
          <label for="${prefix}-opp">Opponent</label>
          <input class="text-input" id="${prefix}-opp" name="opponent" maxlength="60" required
            placeholder="e.g. Kestrels 11U" value="${escapeHtml(g.opponent || '')}">

/* ---- Game screen ---- */
function renderGame(){
  const back = `<button class="back-link" data-action="back-to-games">‹ ${CUR.team ? escapeHtml(CUR.team.name) : 'Games'}</button>`;
  if (CUR.gamesError) return back + gamesErrorHtml();
  if (!CUR.team || !CUR.season || !CUR.loaded.members || !CUR.loaded.games || !CUR.loaded.players)
    return back + '<div class="loading-state">Loading…</div>';
  const g = findGame(UI.gameId);
  if (!g) return back + '<div class="empty-state">This game has been deleted.</div>';

  const tabs = [['lineup','Lineup'], ['avail','Players'], ['fair','Fairness']];
  if (canEditGames()) tabs.push(['details','Details']);
  if (!tabs.some(([k]) => k === UI.gameTab)) UI.gameTab = 'lineup';

  let content = '';
  if (UI.gameTab === 'lineup') content = renderLineupTab(g);
  else if (UI.gameTab === 'avail') content = renderAvailTab(g);
  else if (UI.gameTab === 'fair') content = renderFairTab(g);
  else if (UI.gameTab === 'details') content = renderDetailsTab(g);

  const where = [g.venue, g.court].filter(Boolean).join(', ');
  return `<div class="season-head game-head">
      ${back}
      <h2>${escapeHtml(gameTitle(g))}</h2>
      <div class="season-meta">${g.round ? 'Round ' + escapeHtml(g.round) + ' · ' : ''}${escapeHtml(fmtGameWhen(g))}</div>
      <div class="season-meta">${where ? escapeHtml(where) + ' · ' : ''}${escapeHtml(gameFormatLabel(g))}</div>
    </div>
    <nav class="tabs" aria-label="Game sections">
      ${tabs.map(([k, label]) => `<button class="tab ${UI.gameTab === k ? 'active' : ''}" data-action="game-tab" data-tab="${k}" ${UI.gameTab === k ? 'aria-current="page"' : ''}>${label}</button>`).join('')}
    </nav>
    ${content}`;
}

function renderLineupTab(g){
  const n = periodCount(g);
  if (UI.period > n) UI.period = 1;
  const p = UI.period;
  const plan = planFor(g, p);
  const avail = byName(availableIds(g));
  const editable = canEditGames();

  const picker = `<div class="period-picker" role="tablist" aria-label="${escapeHtml(periodNoun(g, true))}">
    ${Array.from({ length:n }, (_, i) => i + 1).map(k => `
      <button class="period-btn ${k === p ? 'active' : ''}" data-action="period" data-period="${k}" role="tab" aria-selected="${k === p}"
        aria-label="${escapeHtml(periodName(g, k))}, ${!isPeriodPlanned(g, k) ? 'not planned'
          : followsPeriod(g, k) ? 'same as ' + escapeHtml(periodName(g, followsPeriod(g, k))) : 'planned'}">
        <span class="pdot ${!isPeriodPlanned(g, k) ? 'none' : followsPeriod(g, k) ? 'follow' : ''}" aria-hidden="true"></span>${escapeHtml(periodName(g, k))}
      </button>`).join('')}
  </div>`;

  // Where each player sits this period.
  const posOf = {};
  POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });

  // Periods on court this game per playing player, to keep it even.
  const counts = gamePeriodCounts(g, avail);

  const bench = avail.filter(id => !posOf[id]);
  const benchHtml = `<div class="panel"><h4>Bench, ${escapeHtml(periodName(g, p))}</h4>
    ${bench.length ? `<div class="chip-wrap">${bench.map(id => `<span class="chip">${escapeHtml(playerName(id))}</span>`).join('')}</div>`
      : '<span class="hint">Nobody on the bench.</span>'}</div>`;

  const countsHtml = `<div class="panel"><h4>${escapeHtml(periodNoun(g, true))} on court this game</h4>
    ${avail.length ? `<div class="chip-wrap">${avail.map(id =>
      `<span class="chip ${counts[id] ? '' : 'zero'}">${escapeHtml(playerName(id))} <b>${counts[id]}</b></span>`).join('')}</div>`
      : '<span class="hint">No players are marked as playing.</span>'}</div>`;

  // Tell the coach whether this period is following an earlier one, and
  // offer to undo this period's own changes (or clear Q1).
  const follows = followsPeriod(g, p);
  const prevName = p > 1 ? escapeHtml(periodName(g, p - 1)) : '';
  let followNote = '';
  if (p > 1 && isPeriodPlanned(g, p)){
    followNote = follows
      ? `<p class="follow-note">Same as ${escapeHtml(periodName(g, follows))}. Changes you make here also apply to later ${escapeHtml(periodNoun(g, true))} you haven't changed.</p>`
      : `<p class="follow-note own">${escapeHtml(periodName(g, p))} has its own changes.</p>`;
  }
  let tools = '';
  if (editable){
    if (p === 1 && ownPlan(g, 1) && isPeriodPlanned(g, 1)){
      tools = `<button class="btn ghost small ${isArmed('clear-period') ? 'armed' : ''}" data-action="clear-period">
        ${isArmed('clear-period') ? 'Tap again to clear' : 'Clear ' + escapeHtml(periodName(g, 1))}</button>`;
    } else if (p > 1 && ownPlan(g, p)){
      tools = `<button class="btn ghost small ${isArmed('clear-period') ? 'armed' : ''}" data-action="clear-period">
        ${isArmed('clear-period') ? 'Tap again to undo changes' : 'Reset to match ' + prevName}</button>`;
    }
    tools = tools ? `<div class="lineup-tools">${tools}</div>` : '';
  }

  return `${picker}
    ${followNote}
    ${courtHtml(plan, editable, g, p)}
    ${tools}
    ${benchHtml}
    ${countsHtml}
    ${editable ? `<p class="hint">Tap a position on the court to choose who plays there. Picking someone who is already on court swaps the two players. Each ${escapeHtml(periodNoun(g))} starts the same as the one before, so you only need to make the changes. You can still change everything on game day.</p>` : ''}
    ${editable && UI.pickPos ? pickerSheetHtml(g, p, plan, avail, posOf, counts) : ''}`;
}

function gamePeriodCounts(g, ids){
  const counts = {};
  ids.forEach(id => counts[id] = 0);
  for (let k = 1; k <= periodCount(g); k++) POSITIONS.forEach(pos => { const id = planFor(g, k)[pos]; if (id in counts) counts[id]++; });
  return counts;
}

// A simple netball court, attacking end at the top. Each position's bib
// sits in the area of the court that position plays in.
function courtHtml(plan, editable, g, p){
  const tokens = POSITIONS.map(pos => {
    const pid = plan[pos];
    const [x, y] = COURT_SPOTS[pos];
    const name = pid ? playerName(pid) : 'Empty';
    const inner = `<span class="pos-chip ${pid ? POS_ZONE[pos] : 'unfilled'}" aria-hidden="true">${pos}</span>
      <span class="token-name ${pid ? '' : 'empty'}">${escapeHtml(name)}</span>`;
    const style = `style="left:${x}%; top:${y}%"`;
    if (!editable) return `<div class="court-token" ${style} aria-label="${POS_NAMES[pos]}: ${escapeHtml(name)}">${inner}</div>`;
    return `<button class="court-token ${UI.pickPos === pos ? 'picking' : ''}" ${style} data-action="pick-pos" data-pos="${pos}"
        aria-label="${POS_NAMES[pos]}, ${escapeHtml(name)}. Change who plays ${pos} in ${escapeHtml(periodName(g, p))}">${inner}</button>`;
  }).join('');
  return `<div class="court-wrap">
      <div class="court-end">Attacking end</div>
      <div class="court" role="group" aria-label="Court positions, ${escapeHtml(periodName(g, p))}">
        <svg class="court-lines" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
          <rect x="1" y="1" width="98" height="133" rx="1.5" />
          <line x1="1" y1="45" x2="99" y2="45" />
          <line x1="1" y1="90" x2="99" y2="90" />
          <path d="M20 1 A30 30 0 0 0 80 1" />
          <path d="M20 134 A30 30 0 0 1 80 134" />
          <circle cx="50" cy="67.5" r="3" />
        </svg>
        ${tokens}
      </div>
      <div class="court-end">Defending end</div>
    </div>`;
}

// Bottom sheet listing who can play the chosen position. Bench players
// with the fewest periods so far this game come first.
function pickerSheetHtml(g, p, plan, avail, posOf, counts){
  const pos = UI.pickPos;
  const current = plan[pos];
  const n = periodCount(g);
  const row = (id, sub) => `<button class="pick-row ${id === current ? 'current' : ''}" data-action="pick-player" data-player="${escapeHtml(id)}">
      <span class="grow"><span class="pname">${escapeHtml(playerName(id))}</span><span class="psub">${sub}</span></span>
      <span class="pick-count ${counts[id] ? '' : 'zero'}">${counts[id] || 0} of ${n}</span>
    </button>`;
  const byCount = (a, b) => (counts[a] || 0) - (counts[b] || 0) || playerName(a).localeCompare(playerName(b));
  const bench = avail.filter(id => !posOf[id]).sort(byCount);
  const onCourt = avail.filter(id => posOf[id] && posOf[id] !== pos).sort(byCount);
  return `<div class="sheet-backdrop" data-action="close-picker"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="pos-chip ${POS_ZONE[pos]}" aria-hidden="true">${pos}</span>
        <div class="grow">
          <h3 id="sheet-title">${POS_NAMES[pos]}</h3>
          <div class="psub">${escapeHtml(periodName(g, p))} · ${current ? 'now ' + escapeHtml(playerName(current)) : 'empty'}</div>
        </div>
        <button class="btn ghost small" data-action="close-picker">Close</button>
      </div>
      <div class="sheet-body">
        ${bench.length ? `<div class="list-label">On the bench</div>${bench.map(id => row(id, 'Bench')).join('')}` : ''}
        ${onCourt.length ? `<div class="list-label">On court (will swap)</div>${onCourt.map(id => row(id, 'Now ' + posOf[id])).join('')}` : ''}
        ${!bench.length && !onCourt.length ? '<div class="empty-state">No other players are marked as playing.</div>' : ''}
        ${current ? `<button class="btn ghost" style="width:100%; margin-top:0.8rem" data-action="pick-player" data-player="">Leave ${pos} empty</button>` : ''}
        <p class="hint">Counts show ${escapeHtml(periodNoun(g, true))} planned this game.</p>
      </div>
    </div>`;
}

// Periods played in each position, across this game and every game
// before it this season. For now this counts planned lineups; once live
// scoring exists, games that were actually played will use real court time.
function renderFairTab(g){
  const games = sortGames(CUR.games);
  const upto = games.slice(0, games.findIndex(x => x.id === g.id) + 1);
  const rows = {};
  const ensure = id => rows[id] || (rows[id] = { id, pos:{}, total:0, thisGame:0 });
  CUR.players.filter(p => p.active !== false).forEach(p => ensure(p.id));
  upto.forEach(game => {
    for (let k = 1; k <= periodCount(game); k++){
      const plan = planFor(game, k);
      POSITIONS.forEach(pos => {
        const id = plan[pos];
        if (!id) return;
        const r = ensure(id);
        r.pos[pos] = (r.pos[pos] || 0) + 1;
        r.total++;
        if (game.id === g.id) r.thisGame++;
      });
    }
  });
  const list = Object.values(rows).sort((a,b) => playerName(a.id).localeCompare(playerName(b.id)));
  const max = Math.max(1, ...list.flatMap(r => POSITIONS.map(pos => r.pos[pos] || 0)));
  const playing = new Set(availableIds(g));
  const body = list.map(r => `<tr>
      <td>${escapeHtml(playerName(r.id))}</td>
      ${POSITIONS.map(pos => {
        const v = r.pos[pos] || 0;
        const shade = v ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * v / max)}%, transparent)"` : '';
        return `<td ${shade}>${v || '·'}</td>`;
      }).join('')}
      <td class="total">${r.total}</td>
      <td class="this ${playing.has(r.id) && !r.thisGame ? 'zero-this' : ''}">${playing.has(r.id) ? r.thisGame : 'out'}</td>
    </tr>`).join('');
  return `<h3 class="subhead">Positions so far</h3>
    <div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}
        <th scope="col">Total</th><th scope="col">This game</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 3}">No players yet.</td></tr>`}</tbody>
    </table></div>
    <p class="hint">Number of ${escapeHtml(periodNoun(g, true))} each player has been planned in each position, from the first game of the season up to and including this one (${upto.length} game${upto.length === 1 ? '' : 's'}). Darker means more often. Once live scoring is added, games that were actually played will use real court time instead of the plan.</p>`;
}

    const rmKey = 'rm-' + m.id, adKey = 'admin-' + m.id;

  return `${codeCard}

/* ---------------------------------------------------------------------

--------------------------------------------------------------------- */
async function loadHome(){
  HOME.loaded = false;
  HOME.failed = 0;
  render();
  try {
    const snaps = await getMembershipDocs();
    const items = await Promise.all(snaps.map(async (ms) => {
      try { return await loadHomeItem(ms); }
      catch (err){
        // Keep going with the other teams; this one gets a retry prompt.
        console.warn('Netty Pal: could not load team', err);
        HOME.failed++;
        return null;
      }
    }));
    HOME.items = items.filter(Boolean).sort((a,b) =>
      a.teamName.localeCompare(b.teamName) || b.seasonName.localeCompare(a.seasonName));
  } catch (err){
    console.warn('Netty Pal: could not load teams', err);
    HOME.failed++;
    HOME.items = [];
  }
  HOME.loaded = true;
  render();
}

async function loadHomeItem(ms){
  const { teamId, seasonId } = ms;
  // Our own member record can always be read, so this is a reliable
  // test of whether we still belong to the season.
  const memberSnap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
  if (!memberSnap.exists()){
    // Definitely removed (or left): tidy up our pointer to it.
    await forgetMembershipIfGone(teamId, seasonId);
    return null;
  }
  const [teamSnap, seasonSnap] = await Promise.all([
    getDoc(doc(db, 'teams', teamId)),
    getDoc(doc(db, 'teams', teamId, 'seasons', seasonId))
  ]);
  if (!teamSnap.exists() || !seasonSnap.exists()) return null;
  const team = teamSnap.data(), season = seasonSnap.data();
  return { teamId, seasonId, teamName:team.name, seasonName:season.name, competition:season.competition,
    roles:memberSnap.data().roles || [], isAdmin:team.adminUid === USER.uid };
}

// Only forgets a season once we've confirmed our member record is really
// gone. A temporary error (bad connection, rules being updated) must never
// cost someone their link to a team.
async function forgetMembershipIfGone(teamId, seasonId){
  try {
    const snap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
    if (snap.exists()) return false;
    await deleteDoc(doc(db, 'users', USER.uid, 'memberships', seasonId));
    return true;
  } catch (err){
    console.warn('Netty Pal: membership check failed', err);
    return false;
  }
}

async function getMembershipDocs(){
  const snap = await getDocs(collection(db, 'users', USER.uid, 'memberships'));
  return snap.docs.map(d => d.data());
}

function closeSeason(){
  CUR.unsubs.forEach(u => u());
  CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{} };
}

function openSeason(teamId, seasonId){
  closeSeason();
  UI = { ...UI, view:'season', teamId, seasonId, tab:'games', form:null, gameId:null };
  saveNav();
  render();
  const seasonRef = doc(db, 'teams', teamId, 'seasons', seasonId);
  let leaving = false;
  const lostAccess = async (err) => {
    console.warn('Netty Pal: season listener', err);
    if (leaving || UI.view === 'home' || UI.seasonId !== seasonId) return;
    if (!String(err && err.code).includes('permission-denied')){ fail(err); return; }
    leaving = true;
    const gone = await forgetMembershipIfGone(teamId, seasonId);
    toast(gone ? "You're no longer a member of that season."
      : "Couldn't load that team just now. Please try again in a moment.", true);
    goHome();
  };
  CUR.unsubs.push(onSnapshot(doc(db, 'teams', teamId), (snap) => {
    CUR.team = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(seasonRef, (snap) => {
    CUR.season = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'members'), (snap) => {
    CUR.members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.members = true;
    // If an admin removed us while we're looking at the season, leave.
    if (USER && !CUR.members.some(m => m.id === USER.uid)) lostAccess({ code:'permission-denied' });
    else render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'players'), (snap) => {
    CUR.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.players = true;
    render();
  }, lostAccess));
  // A problem reading games (for example security rules that haven't been
  // updated for a new feature yet) is shown on the Games tab rather than
  // throwing the user out of the whole team.
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'games'), (snap) => {
    CUR.games = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.games = true;
    CUR.gamesError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: games listener', err);
    CUR.gamesError = err;
    render();
  }));
}

function openGame(gameId){
  UI = { ...UI, view:'game', gameId, gameTab:'lineup', period:1, form:null, pickPos:null };
  saveNav();
  render();
  window.scrollTo(0, 0);
}

function backToGames(){
  UI = { ...UI, view:'season', tab:'games', gameId:null, form:null };
  saveNav();
  render();
}

function goHome(){
  closeSeason();
  UI = { ...UI, view:'home', teamId:null, seasonId:null, gameId:null, form:null };
  saveNav();
  loadHome();
}

// Remember which season was open so a refresh (or reopening the installed
// app) lands back in the same place.
function saveNav(){
  try { localStorage.setItem('nettyPalNav', JSON.stringify({ view:UI.view, teamId:UI.teamId, seasonId:UI.seasonId,
    tab:UI.tab, gameId:UI.gameId, gameTab:UI.gameTab })); } catch(e){}
}
function loadNav(){
  try { return JSON.parse(localStorage.getItem('nettyPalNav') || 'null'); } catch(e){ return null; }
}

/* ---------------------------------------------------------------------
   Actions that change data
--------------------------------------------------------------------- */
function memberProfile(){
  return { name: USER.displayName || USER.email || 'Unknown', email: USER.email || '', photoURL: USER.photoURL || '' };
}

// Picks a code nobody else is using. The security rules only allow a
// code to be created, never overwritten, so a clash can't hijack a team.
async function uniqueCode(){
  for (let i = 0; i < 6; i++){
    const code = randomCode();
    const snap = await getDoc(doc(db, 'joinCodes', code));
    if (!snap.exists()) return code;
  }
  throw new Error("Couldn't create a unique season code. Please try again.");
}

function readSeasonFields(fd){
  const mins = parseInt(fd.get('periodMinutes'), 10);
  return {
    name: String(fd.get('seasonName') || '').trim(),
    competition: String(fd.get('competition') || '').trim(),
    format: fd.get('format') === 'halves' ? 'halves' : 'quarters',
    periodMinutes: (mins >= 1 && mins <= 30) ? mins : DEFAULT_PERIOD_MINUTES
  };
}

// Writes a new season, its code, and makes the current user a member with
// both roles. Used by "create team" and "new season".
function addSeasonToBatch(batch, teamId, seasonId, code, fields){
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId), { ...fields, joinCode:code, createdAt:serverTimestamp() });
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid),
    { ...memberProfile(), roles:['coach','scorer'], joinedAt:serverTimestamp() });
  batch.set(doc(db, 'joinCodes', code), { teamId, seasonId });
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
}

async function createTeam(fd){
  const teamName = String(fd.get('teamName') || '').trim();
  const fields = readSeasonFields(fd);
  if (!teamName || !fields.name) return;
  const teamId = newId(), seasonId = newId();
  const code = await uniqueCode();
  const batch = writeBatch(db);
  batch.set(doc(db, 'teams', teamId), { name:teamName, adminUid:USER.uid, createdAt:serverTimestamp() });
  addSeasonToBatch(batch, teamId, seasonId, code, fields);
  await batch.commit();
  toast('Team created.');
  openSeason(teamId, seasonId);
  UI.tab = 'people';
  render();
}

async function joinWithCode(fd){
  const code = normaliseCode(fd.get('code'));
  if (!code) return;
  const codeSnap = await getDoc(doc(db, 'joinCodes', code));
  if (!codeSnap.exists()){ toast("That code wasn't found. Check it with your coach.", true); return; }
  const { teamId, seasonId } = codeSnap.data();
  const memberRef = doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid);
  const existing = await getDoc(memberRef);
  const batch = writeBatch(db);
  if (!existing.exists()){
    // The code is stored on the member doc so the security rules can check
    // it matches the season's current code.
    batch.set(memberRef, { ...memberProfile(), roles:[], code, joinedAt:serverTimestamp() });
  }
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
  await batch.commit();
  toast(existing.exists() ? "You're already in this team." : "You're in! You can follow games and stats.");
  openSeason(teamId, seasonId);
}

function seasonRef(){ return doc(db, 'teams', UI.teamId, 'seasons', UI.seasonId); }

async function addPlayer(fd){
  const name = String(fd.get('name') || '').trim();
  if (!name) return;
  await setDoc(doc(collection(seasonRef(), 'players')), { name, active:true, createdAt:serverTimestamp() });
  const input = document.getElementById('add-player-name');
  if (input){ input.value = ''; input.focus(); }
}

async function renamePlayer(playerId, name){
  name = name.trim();
  const p = CUR.players.find(p => p.id === playerId);
  if (!p || !name || name === p.name) return render();
  await updateDoc(doc(seasonRef(), 'players', playerId), { name });
}

async function togglePlayer(playerId){
  const p = CUR.players.find(p => p.id === playerId);
  if (!p) return;
  await updateDoc(doc(seasonRef(), 'players', playerId), { active: p.active === false });
}

async function toggleRole(memberId, role){
  const m = CUR.members.find(m => m.id === memberId);
  if (!m) return;
  const roles = new Set(m.roles || []);
  if (roles.has(role)) roles.delete(role); else roles.add(role);
  await updateDoc(doc(seasonRef(), 'members', memberId), { roles: Array.from(roles) });
}

async function removeMember(memberId){
  await deleteDoc(doc(seasonRef(), 'members', memberId));
  toast('Removed.');
}

async function makeAdmin(memberId){
  const m = CUR.members.find(m => m.id === memberId);
  await updateDoc(doc(db, 'teams', UI.teamId), { adminUid: memberId });
  toast(`${m ? m.name : 'They'} is now the team admin.`);
  UI.tab = 'people';
}

async function leaveSeason(){
  const seasonId = UI.seasonId;
  const batch = writeBatch(db);
  batch.delete(doc(seasonRef(), 'members', USER.uid));
  batch.delete(doc(db, 'users', USER.uid, 'memberships', seasonId));
  await batch.commit();
  toast('You left the season.');
  goHome();
}

async function regenerateCode(){
  const old = CUR.season.joinCode;
  const code = await uniqueCode();
  const batch = writeBatch(db);
  batch.update(seasonRef(), { joinCode: code });
  batch.set(doc(db, 'joinCodes', code), { teamId:UI.teamId, seasonId:UI.seasonId });
  if (old) batch.delete(doc(db, 'joinCodes', old));
  await batch.commit();
  toast('New code ready. The old one no longer works.');
}

async function shareCode(){
  const s = CUR.season, t = CUR.team;
  const url = location.origin + location.pathname;
  const text = `Join ${t.name} (${s.name}) on Netty Pal. Open ${url}, sign in with Google, tap "Join with a code" and enter: ${s.joinCode}`;
  if (navigator.share){
    try { await navigator.share({ title:'Netty Pal', text }); } catch(e){ /* cancelled */ }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('Invite copied. Paste it into a message.'); }
  catch(e){ toast('Copy failed. The code is ' + s.joinCode, true); }
}

async function saveTeamSettings(fd){
  const name = String(fd.get('teamName') || '').trim();
  if (!name) return;
  await updateDoc(doc(db, 'teams', UI.teamId), { name });
  toast('Team saved.');
}

async function saveSeasonSettings(fd){
  const fields = readSeasonFields(fd);
  if (!fields.name) return;
  await updateDoc(seasonRef(), fields);
  toast('Season saved.');
}

async function createNewSeason(fd){
  const fields = readSeasonFields(fd);
  if (!fields.name) return;
  const teamId = UI.teamId, seasonId = newId();
  const code = await uniqueCode();
  const batch = writeBatch(db);
  addSeasonToBatch(batch, teamId, seasonId, code, fields);
  if (fd.get('copyPlayers')){
    CUR.players.filter(p => p.active !== false).forEach(p => {
      batch.set(doc(collection(db, 'teams', teamId, 'seasons', seasonId, 'players')),
        { name:p.name, active:true, createdAt:serverTimestamp() });
    });
  }
  await batch.commit();
  toast('New season created.');
  openSeason(teamId, seasonId);
  UI.tab = 'people';
  render();
}

/* ---- Games ---- */
function gameRef(id){ return doc(seasonRef(), 'games', id); }

function readGameFields(fd){
  const mins = parseInt(fd.get('periodMinutes'), 10);
  return {
    round: String(fd.get('round') || '').trim(),
    opponent: String(fd.get('opponent') || '').trim(),
    date: String(fd.get('date') || ''),
    time: String(fd.get('time') || ''),
    venue: String(fd.get('venue') || '').trim(),
    court: String(fd.get('court') || '').trim(),
    format: fd.get('format') === 'halves' ? 'halves' : 'quarters',
    periodMinutes: (mins >= 1 && mins <= 30) ? mins : DEFAULT_PERIOD_MINUTES
  };
}

async function addGame(fd){
  const fields = readGameFields(fd);
  if (!fields.opponent) return;
  await setDoc(doc(collection(seasonRef(), 'games')), { ...fields, status:'scheduled', plan:{}, createdAt:serverTimestamp() });
  toast('Fixture added.');
}

async function saveGame(fd){
  const fields = readGameFields(fd);
  if (!fields.opponent) return;
  await updateDoc(gameRef(UI.gameId), fields);
  toast('Game saved.');
}

async function deleteGame(){
  const id = UI.gameId;
  backToGames();
  await deleteDoc(gameRef(id));
  toast('Game deleted.');
}

// Puts a player in a position for the selected period. If they were
// already somewhere else that period, whoever was in the target position
// moves into their old spot (a swap), so nobody is ever in two places.
// If the period was following an earlier one, it gets its own copy of that
// lineup first, with the change applied, and later periods follow it.
async function setPlanSlot(pos, pid){
  const g = findGame(UI.gameId);
  if (!g) return;
  const p = UI.period;
  const next = { ...planFor(g, p) };
  if (pid){
    const from = POSITIONS.find(other => other !== pos && next[other] === pid);
    if (from){ if (next[pos]) next[from] = next[pos]; else delete next[from]; }
    next[pos] = pid;
  } else {
    delete next[pos];
  }
  await updateDoc(gameRef(g.id), { [`plan.${p}`]: next });
}

// Q1: empty it. Later periods: drop their own changes so they follow the
// period before again.
async function clearPeriod(){
  const g = findGame(UI.gameId);
  if (!g) return;
  await updateDoc(gameRef(g.id), { [`plan.${UI.period}`]: UI.period === 1 ? {} : deleteField() });
}

async function toggleAvail(pid){
  const g = findGame(UI.gameId);
  if (!g) return;
  const avail = new Set(availableIds(g));
  const updates = {};
  if (avail.has(pid)){
    avail.delete(pid);
    // Take them out of every period of this game's plan too.
    Object.entries(g.plan || {}).forEach(([k, slots]) => {
      Object.entries(slots || {}).forEach(([pos, id]) => { if (id === pid) updates[`plan.${k}.${pos}`] = deleteField(); });
    });
  } else {
    avail.add(pid);
  }
  updates.available = Array.from(avail);
  await updateDoc(gameRef(g.id), updates);
}

async function availAll(){
  const g = findGame(UI.gameId);
  if (!g) return;
  await updateDoc(gameRef(g.id), { available: CUR.players.filter(p => p.active !== false).map(p => p.id) });
}

/* ---------------------------------------------------------------------
   Event wiring
--------------------------------------------------------------------- */
async function runBusy(fn){
  if (UI.busy) return;
  UI.busy = true; render();
  try { await fn(); } catch (err){ fail(err); }
  finally { UI.busy = false; render(); }
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  try {
    if (a === 'sign-in'){
      await signInWithPopup(auth, new GoogleAuthProvider());
    } else if (a === 'sign-out'){
      closeSeason();
      await signOut(auth);
    } else if (a === 'show-form'){
      UI.form = btn.dataset.formName; render();
      const first = document.querySelector('#app form input:not([type=hidden])');
      if (first) first.focus();
    } else if (a === 'close-form'){
      UI.form = null; render();
    } else if (a === 'open-season'){
      openSeason(btn.dataset.team, btn.dataset.season);
    } else if (a === 'go-home'){
      goHome();
    } else if (a === 'reload-home'){
      loadHome();
    } else if (a === 'tab'){
      UI.tab = btn.dataset.tab; UI.form = null; saveNav(); render();
    } else if (a === 'toggle-player'){
      await togglePlayer(btn.dataset.player);
    } else if (a === 'toggle-role'){
      await toggleRole(btn.dataset.member, btn.dataset.role);
    } else if (a === 'remove-member'){
      const key = 'rm-' + btn.dataset.member;
      if (!isArmed(key)) return arm(key);
      disarm(key); await removeMember(btn.dataset.member);
    } else if (a === 'make-admin'){
      const key = 'admin-' + btn.dataset.member;
      if (!isArmed(key)) return arm(key);
      disarm(key); await makeAdmin(btn.dataset.member);
    } else if (a === 'leave-season'){
      if (!isArmed('leave')) return arm('leave');
      disarm('leave'); await leaveSeason();
    } else if (a === 'regen-code'){
      if (!isArmed('regen-code')) return arm('regen-code');
      disarm('regen-code'); await runBusy(regenerateCode);
    } else if (a === 'share-code'){
      await shareCode();
    } else if (a === 'open-game'){
      openGame(btn.dataset.game);
    } else if (a === 'back-to-games'){
      backToGames();
    } else if (a === 'game-tab'){
      UI.gameTab = btn.dataset.tab; UI.pickPos = null; saveNav(); render();
    } else if (a === 'period'){
      UI.period = parseInt(btn.dataset.period, 10) || 1; UI.pickPos = null; disarm('clear-period'); render();
    } else if (a === 'pick-pos'){
      UI.pickPos = btn.dataset.pos; render();
      const first = document.querySelector('.sheet .pick-row, .sheet button');
      if (first) first.focus();
    } else if (a === 'close-picker'){
      closePicker();
    } else if (a === 'pick-player'){
      const pos = UI.pickPos;
      UI.pickPos = null; render();
      await setPlanSlot(pos, btn.dataset.player);
      const token = document.querySelector(`.court-token[data-pos="${pos}"]`);
      if (token) token.focus();
    } else if (a === 'clear-period'){
      if (!isArmed('clear-period')) return arm('clear-period');
      disarm('clear-period'); await clearPeriod();
    } else if (a === 'toggle-avail'){
      await toggleAvail(btn.dataset.player);
    } else if (a === 'avail-all'){
      await availAll();
    } else if (a === 'delete-game'){
      if (!isArmed('del-game')) return arm('del-game');
      disarm('del-game'); await deleteGame();
    }
  } catch (err){ fail(err); render(); }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const name = form.dataset.form;
  const done = () => { UI.form = null; };
  if (name === 'join') runBusy(async () => { await joinWithCode(fd); done(); });
  else if (name === 'create-team') runBusy(async () => { await createTeam(fd); done(); });
  else if (name === 'add-player') addPlayer(fd).catch(fail);
  else if (name === 'team-settings') saveTeamSettings(fd).catch(fail);
  else if (name === 'season-settings') saveSeasonSettings(fd).catch(fail);
  else if (name === 'new-season') runBusy(async () => { await createNewSeason(fd); done(); });
  else if (name === 'add-game') runBusy(async () => { await addGame(fd); done(); });
  else if (name === 'edit-game') runBusy(() => saveGame(fd));
});

// Player names save when the box loses focus (or Enter is pressed).
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('input[data-field="player-name"]')) renamePlayer(el.dataset.player, el.value).catch(fail);
});
function closePicker(){
  const pos = UI.pickPos;
  UI.pickPos = null; render();
  const token = pos && document.querySelector(`.court-token[data-pos="${pos}"]`);
  if (token) token.focus();
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UI.pickPos) closePicker();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-field="player-name"]')) e.target.blur();
});

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
onAuthStateChanged(auth, (user) => {
  USER = user;
  authReady = true;
  if (!user){ HOME = { loaded:false, items:[] }; UI = { ...UI, view:'home', form:null }; render(); return; }
  const nav = loadNav();
  if (nav && (nav.view === 'season' || nav.view === 'game') && nav.teamId && nav.seasonId){
    openSeason(nav.teamId, nav.seasonId);
    if (nav.tab) UI.tab = nav.tab;
    if (nav.view === 'game' && nav.gameId){
      UI = { ...UI, view:'game', gameId:nav.gameId, gameTab:nav.gameTab || 'lineup' };
    }
    saveNav();
    render();
  } else {
    goHome();
  }
});

window.addEventListener('online', () => { offlineMode = false; render(); });
window.addEventListener('offline', () => { offlineMode = true; render(); });
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
