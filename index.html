<body>
<div id="app"><div class="splash" role="status" aria-live="polite"><div class="splash-bounce"><svg class="splash-ball" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#E0457B" stroke-width="3.5"/><path d="M50 50a40 40 0 0 0 40 20 M27.5 57.5a60 60 0 0 0 42.5 32.5 M50 50a40 40 0 0 0 -37.3 24.6 M54.8 26.8a60 60 0 0 0 -49.4 20.6 M50 50a40 40 0 0 0 -2.7 -44.6 M67.7 65.7a60 60 0 0 0 6.9 -53.1" fill="none" stroke="#E0457B" stroke-width="4" stroke-linecap="round"/></svg></div><div class="splash-shadow" aria-hidden="true"></div><p>Loading Netty Pal…</p></div></div>
<div id="toast-root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, updateProfile,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail,
  reauthenticateWithPopup, deleteUser
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc as fsUpdateDoc, deleteDoc,
  collection, onSnapshot, writeBatch as fsWriteBatch, serverTimestamp, deleteField, query, where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

// On the old address the page is already moving to nettypal.au (see the
// script in <head>): don't start the app here.
if (window.NETTY_PAL_MOVED) throw new Error('Netty Pal has moved to nettypal.au');

/* ---------------------------------------------------------------------
   Firebase. This config is not a secret: it only tells the page which
   Firebase project to talk to. Who can read or change what is enforced
   by the Firestore security rules (see firestore.rules), not by this page.
--------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBToJHWizkOtnLXMt4HawIbTBk0cz9cxes",
  authDomain: "netty-pal.firebaseapp.com",
  projectId: "netty-pal",
  storageBucket: "netty-pal.firebasestorage.app",
  messagingSenderId: "614096574186",
  appId: "1:614096574186:web:df6472c29986949ae66993"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

/* ---------------------------------------------------------------------
   Practice game. A pretend game kept only in this phone's memory, so
   parents can try scoring before a real game. Saves for it never reach
   the database: updateDoc and writeBatch below send anything aimed at the
   practice game to practiceWrite instead. It's gone when they leave it.
--------------------------------------------------------------------- */
const PRACTICE_ID = 'practice-game';
const DELETE_FIELD = deleteField();
let PRACTICE = null;   // { game, events } while a practice game is open
function isPracticeRef(ref){ return !!(ref && ref.path && ref.path.split('/').includes(PRACTICE_ID)); }
function isPractice(g){ return !!(g && g.id === PRACTICE_ID); }
function inPractice(){ return UI.view === 'game' && UI.gameId === PRACTICE_ID && !!PRACTICE; }

function updateDoc(ref, data){
  return isPracticeRef(ref) ? practiceWrite([['update', ref, data]]) : fsUpdateDoc(ref, data);
}
function writeBatch(database){
  const ops = [];
  const b = {
    set(ref, data){ ops.push(['set', ref, data]); return b; },
    update(ref, data){ ops.push(['update', ref, data]); return b; },
    delete(ref){ ops.push(['delete', ref]); return b; },
    commit(){
      if (ops.some(([, ref]) => isPracticeRef(ref))) return practiceWrite(ops);
      const real = fsWriteBatch(database);
      ops.forEach(([kind, ref, data]) => kind === 'delete' ? real.delete(ref) : real[kind](ref, data));
      return real.commit();
    }
  };
  return b;
}
// Applies saves to the practice game in memory, the same way the database
// would ("live.phase" style keys, deleteField), then redraws.
function practiceWrite(ops){
  if (!PRACTICE) return Promise.resolve();
  const setPath = (obj, key, val) => {
    const parts = key.split('.');
    let o = obj;
    parts.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });
    const last = parts[parts.length - 1];
    if (val && typeof val.isEqual === 'function' && val.isEqual(DELETE_FIELD)) delete o[last];
    else o[last] = val;
  };
  ops.forEach(([kind, ref, data]) => {
    const parts = ref.path.split('/');
    if (parts[parts.length - 2] === 'events'){
      const id = parts[parts.length - 1];
      if (kind === 'set') PRACTICE.events = [...PRACTICE.events.filter(e => e.id !== id), { ...data, id }];
      else if (kind === 'update') PRACTICE.events = PRACTICE.events.map(e => {
        if (e.id !== id) return e;
        const next = { ...e };
        Object.keys(data).forEach(k => setPath(next, k, data[k]));
        return next;
      });
    } else if (kind === 'update'){
      const g = JSON.parse(JSON.stringify(PRACTICE.game));
      Object.keys(data).forEach(k => setPath(g, k, data[k]));
      PRACTICE.game = g;
    }
  });
  if (CUR.eventsFor === PRACTICE_ID) CUR.events = PRACTICE.events;
  render();
  return Promise.resolve();
}

/* ---------------------------------------------------------------------
   Data layout (Firestore)
     teams/{teamId}                               name, adminUid (who created it; no longer
                                                  gives extra rights), editSeason
       seasons/{seasonId}                         name, competition, format, periodMinutes, joinCode,
                                                  fromSeason (the season it was started from),
                                                  stats { extra[], teams } ("Track more stats")
         members/{uid}                            name, email, photoURL, roles[], code
         players/{playerId}                       name, active
         games/{gameId}                           round, date, time, opponent, venue, court,
                                                  format, periodMinutes, status,
                                                  available[] (player ids; missing = all active),
                                                  plan { "1": { GS: playerId, ... }, "2": ... },
                                                  stats (optional: overrides the season's)
         awards/settings                          enabled (awards on for the season; off by default),
                                                  types [{ id, name }] (up to 5; Coach/Managers only)
         awards/{gameId}                          winners { awardId: [playerIds] }, enabled (optional:
                                                  overrides the season for this game) (Coach/Managers only)
     joinCodes/{code}                             teamId, seasonId
     users/{uid}/memberships/{seasonId}           teamId, seasonId (so "my teams" can be listed)
--------------------------------------------------------------------- */
const DEFAULT_PERIOD_MINUTES = 7;
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L
const CODE_LENGTH = 6;
const POSITIONS = ['GS','GA','WA','C','WD','GD','GK'];
const POS_ZONE = { GS:'att', GA:'att', WA:'mid', C:'mid', WD:'mid', GD:'def', GK:'def' };
const POS_NAMES = { GS:'Goal Shooter', GA:'Goal Attack', WA:'Wing Attack', C:'Centre', WD:'Wing Defence', GD:'Goal Defence', GK:'Goal Keeper' };
// Where each bib sits on the court drawing, as % across and % down, with
// the attacking end at the top: GS in the goal circle, GA in the attacking
// third, WA, C and WD in the centre third (WA and WD near the transverse
// lines), GD in the defensive third, GK in
// the defending goal circle.
const COURT_SPOTS = { GS:[50,9], GA:[28,20], WA:[76,39], C:[50,50], WD:[24,54], GD:[72,76], GK:[50,89] };

let USER = null;
let authReady = false;
let offlineMode = !navigator.onLine;

// What the screen is showing. form is the name of an open inline form.
// view is 'home', 'season' or 'game'; gameTab and period belong to the game screen.
let UI = { view:'home', teamId:null, seasonId:null, tab:'games', form:null, busy:false,
  gameId:null, gameTab:'lineup', period:1, pickPos:null, pickMode:'plan', statPos:null, statSide:'us',
  liveMode:'event', pendingEvent:null };
// Scoring mode: Goal/Miss first unless this phone chose Player first.
try { if (localStorage.getItem('nettyPalLiveMode') === 'player') UI.liveMode = 'player'; } catch(e){}

// Home screen: one entry per season the user belongs to.
let HOME = { loaded:false, items:[] };

// The season currently open, kept live by onSnapshot listeners.
// events/eventsFor hold the open game's event list (see watchEvents).
let CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{},
  events:[], eventsFor:null, eventsUnsub:null };

let armed = new Map(); // key -> timeout id, for "Confirm [action]" buttons

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function newId(){ return doc(collection(db, '_')).id; }
function randomCode(){
  const bytes = new Uint32Array(CODE_LENGTH);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
}
function normaliseCode(raw){ return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function initials(name){
  const parts = String(name || '?').trim().split(/\s+/);
  return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function formatLabel(season){
  if (!season) return '';
  const n = season.format === 'halves' ? 2 : 4;
  return `${n} × ${season.periodMinutes || DEFAULT_PERIOD_MINUTES} min ${season.format === 'halves' ? 'halves' : 'quarters'}`;
}
function avatarHtml(name, photoURL, cls){
  const inner = photoURL
    ? `<img src="${escapeHtml(photoURL)}" alt="" referrerpolicy="no-referrer">`
    : escapeHtml(initials(name));
  return `<span class="avatar ${cls || ''}" aria-hidden="true">${inner}</span>`;
}
function roleBadges(roles){
  const out = [];
  if (roles && roles.includes('coach')) out.push('<span class="badge coach">Coach/Manager</span>');
  if (roles && roles.includes('scorer')) out.push('<span class="badge scorer">Scorer</span>');
  if (!out.length) out.push('<span class="badge">Viewer</span>');
  return out.join('');
}
function toast(msg, isError){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast${isError ? ' error' : ''}" role="status">${escapeHtml(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { root.innerHTML = ''; }, isError ? 6000 : 3000);
}
function friendlyError(err){
  const code = (err && err.code) || '';
  if (code.includes('permission-denied')) return "You don't have permission to do that.";
  if (code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Sign-in was cancelled.';
  if (code.includes('popup-blocked')) return 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if (code.includes('unauthorized-domain')) return "This web address isn't allowed to sign in yet. Add it under Firebase > Authentication > Settings > Authorised domains.";
  if (code.includes('unavailable') || code.includes('network')) return 'No connection. Check your internet and try again.';
  if (code.includes('account-exists-with-different-credential'))
    return "You've already signed in with this email another way (probably Google, or email and password). Please sign in that way instead.";
  if (code.includes('operation-not-allowed')) return "That way of signing in isn't switched on yet. Please use another option for now.";
  if (code.includes('invalid-email')) return "That email address doesn't look right.";
  if (code.includes('invalid-action-code') || code.includes('expired-action-code'))
    return 'That sign-in link has expired or was already used. Ask for a new one.';
  return (err && err.message) || 'Something went wrong.';
}
function fail(err){ console.warn('Netty Pal:', err); toast(friendlyError(err), true); }

// "Confirm [action]" second tap for anything destructive or hard to undo.
function isArmed(key){ return armed.has(key); }
function arm(key){
  clearTimeout(armed.get(key));
  armed.set(key, setTimeout(() => { armed.delete(key); render(); }, 4000));
  render();
}
function disarm(key){ clearTimeout(armed.get(key)); armed.delete(key); }

// Role checks for the open season. The page uses these to decide what to
// show; the security rules enforce the same thing on Google's side.
// Coach/Managers run the team: everything a separate "admin" used to do.
// The app owner can also manage every team, without being listed as a
// member (the same email is checked in firestore.rules).
const OWNER_EMAIL = 'patryck.allen@gmail.com';
function isOwner(){ return !!(USER && USER.emailVerified && String(USER.email || '').toLowerCase() === OWNER_EMAIL); }
function myMember(){ return USER ? CUR.members.find(m => m.id === USER.uid) : null; }
function myRoles(){ const m = myMember(); return (m && m.roles) || []; }
function isManager(){ return isOwner() || myRoles().includes('coach'); }
function canEditRoster(){ return isManager(); }
// Fixtures, availability and lineup plans: Coach/Managers.
function canEditGames(){ return isManager(); }
// Coach/Managers and Scorers see the team's working tabs.
function isStaff(){ return isManager() || myRoles().includes('scorer'); }
function coachCount(){ return CUR.members.filter(m => (m.roles || []).includes('coach')).length; }

/* ---------------------------------------------------------------------
   Game helpers
--------------------------------------------------------------------- */
function findGame(id){ return id === PRACTICE_ID ? (PRACTICE && PRACTICE.game) : CUR.games.find(g => g.id === id); }
function playerName(id){ const p = CUR.players.find(p => p.id === id); return p ? p.name : 'Unknown player'; }
function periodCount(g){ return g && g.format === 'halves' ? 2 : 4; }
function periodName(g, p){ return g.format === 'halves' ? (p === 1 ? '1st half' : '2nd half') : 'Q' + p; }
function periodNoun(g, plural){
  if (g.format === 'halves') return plural ? 'halves' : 'half';
  return plural ? 'quarters' : 'quarter';
}
// Lineups carry forward: a period with no lineup of its own uses the one
// before it. So setting Q1 fills Q2 to Q4, and a change in Q2 flows on to
// Q3 and Q4 unless those have been changed separately.
function ownPlan(g, p){ return g.plan && g.plan[p] ? g.plan[p] : null; }
function planFor(g, p){
  for (let k = p; k >= 1; k--){ const own = ownPlan(g, k); if (own) return own; }
  return {};
}
// The earlier period this one is following, or 0 if it has its own lineup.
function followsPeriod(g, p){
  if (p < 2 || ownPlan(g, p)) return 0;
  for (let k = p - 1; k >= 1; k--) if (ownPlan(g, k)) return k;
  return 0;
}
function isPeriodPlanned(g, p){ return POSITIONS.some(pos => planFor(g, p)[pos]); }
// Once a game has started, a period that has begun has been played (or is
// being played), so the Lineup tab shows what really happened instead of
// the plan.
function periodStarted(g, p){ return !!(g.live && g.live.period && p <= g.live.period); }
// Who was on court at the end of period p (or is on court now, for the
// current period): the last lineup recorded for it. Null if this game's
// events haven't loaded.
function endLineup(g, p){
  if (CUR.eventsFor !== g.id) return null;
  const les = (CUR.events || []).filter(e => !e.undone && e.type === 'lineup' && e.period === p)
    .sort((a, b) => (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  return les.length ? (les[les.length - 1].lineup || {}) : null;
}
// The lineup the Lineup tab shows. Before the game it's the plan. Once the
// game is under way, periods that have started show the real lineup, and
// later periods carry on from it unless they have their own changes (the
// same rule the scorer's screen uses when the next period starts).
function lineupFor(g, p){
  if (!g.live || !g.live.period) return planFor(g, p);
  if (periodStarted(g, p)) return endLineup(g, p) || planFor(g, p);
  const own = ownPlan(g, p);
  if (!own) return lineupFor(g, p - 1);
  const avail = new Set(availableIds(g)), lineup = {};
  POSITIONS.forEach(pos => { if (own[pos] && avail.has(own[pos])) lineup[pos] = own[pos]; });
  return lineup;
}
// Ready to play: someone has ticked who's playing, and every quarter has all
// seven positions filled with players who are playing (a quarter without its
// own plan carries on from the one before, as on the Lineup tab).
function lineupReady(g){
  if (!Array.isArray(g.available)) return false;
  const avail = new Set(availableIds(g));
  for (let p = 1; p <= periodCount(g); p++){
    const plan = planFor(g, p);
    if (!POSITIONS.every(pos => plan[pos] && avail.has(plan[pos]))) return false;
  }
  return true;
}
// Players ticked as playing this game. Until the coach sets it, that's
// every active player.
function availableIds(g){
  if (Array.isArray(g.available)) return g.available.filter(id => CUR.players.some(p => p.id === id));
  return CUR.players.filter(p => p.active !== false).map(p => p.id);
}
function byName(ids){ return ids.slice().sort((a,b) => playerName(a).localeCompare(playerName(b))); }
function pad2(n){ return String(n).padStart(2, '0'); }
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseIsoDate(iso){
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${pad2(m)}${h >= 12 ? 'pm' : 'am'}`;
}
function fmtGameWhen(g){
  const d = parseIsoDate(g.date);
  const date = d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }) : 'Date TBC';
  return g.time ? `${date}, ${fmtTime(g.time)}` : date;
}
// Dated games in date/time order, undated ones last.
function sortGames(games){
  return games.slice().sort((a,b) => {
    if (!a.date && !b.date) return String(a.round || '').localeCompare(String(b.round || ''), undefined, { numeric:true });
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
  });
}
function nextRound(){
  const nums = CUR.games.map(g => parseInt(g.round, 10)).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) + 1 : 1;
}
function gameTitle(g){ return g.bye ? 'Bye' : `vs ${g.opponent || 'TBC'}`; }
function gameFormatLabel(g){ return formatLabel({ format:g.format, periodMinutes:g.periodMinutes }); }

/* ---------------------------------------------------------------------
   Live game helpers
   A game's live state is on the game doc (status, scorerUid, live: period,
   phase, startedAt, elapsedMs, firstCentre). Everything else (score,
   lineups, court time, stats, centre pass) is worked out from its events:
     games/{gameId}/events/{eventId}   type, period, t (ms of play into the
                                       period), at, by, plus per type:
       lineup      lineup { GS: playerId, ... }, start (true at period start)
       goal, miss, and the extra stats (EXTRA_STATS)   pos, playerId
       feed        pos, playerId, goal (the id of the goal it led to)
       oppGoal, oppMiss
       oppStat     stat (an extra stat key) for the other team as a whole
       centre      team ('us' or 'them'): who takes the next centre pass
       periodEnd
     undone: true marks an event as undone or removed.
--------------------------------------------------------------------- */
// Goals and misses (by GS and GA, for both teams) are always recorded.
// "Track more stats" (team Settings, or a game's settings) adds any of
// the extra stats below, for our players, the other team, or both.
const STATS = [{ key:'goal', label:'Goal' }, { key:'miss', label:'Miss' }];
// short is the column heading in stats tables.
const STAT_GROUPS = [
  { key:'shooting', label:'Shooting', stats:[{ key:'goal', label:'Goal', short:'Goals' }, { key:'miss', label:'Miss', short:'Misses' },
    { key:'feed', label:'Feed', short:'Feeds' }] },
  { key:'gains', label:'Gains', stats:[{ key:'rebound', label:'Rebound', short:'Reb' }, { key:'intercept', label:'Intercept', short:'Int' },
    { key:'deflect', label:'Deflection', short:'Defl' }] },
  { key:'losses', label:'Losses', stats:[{ key:'badPass', label:'Bad pass', short:'BP' }, { key:'footwork', label:'Footwork', short:'FW' },
    { key:'held', label:'Held ball', short:'HB' }, { key:'outOfCourt', label:'Out of court', short:'OOC' }, { key:'error', label:'Error', short:'Err' }] },
  { key:'penalties', label:'Penalties', stats:[{ key:'contact', label:'Contact', short:'Con' }, { key:'obstruction', label:'Obstruction', short:'Obs' },
    { key:'offside', label:'Offside', short:'Off' }] }
];
const STAT_INFO = Object.fromEntries(STAT_GROUPS.flatMap(gr => gr.stats.map(st => [st.key, { ...st, group:gr.key }])));
const EXTRA_STATS = Object.keys(STAT_INFO).filter(k => k !== 'goal' && k !== 'miss');
// Every stat a player can be credited with (older games may hold intercept,
// held, obstruction or contact from before scoring was simplified; those
// only count where the game tracks them).
const STAT_LABEL = Object.fromEntries(Object.entries(STAT_INFO).map(([k, v]) => [k, v.label]));
const SHOOTERS = ['GS','GA'];

// Which extra stats a game tracks: its own choice if it has one, otherwise
// the season's. { extra:[keys], teams:'us' | 'them' | 'both' }
function statConfig(g){
  const c = (g && g.stats) || (CUR.season && CUR.season.stats) || {};
  return { extra:(c.extra || []).filter(k => EXTRA_STATS.includes(k)), teams:c.teams === 'them' || c.teams === 'both' ? c.teams : 'us',
    miss:c.miss !== false };
}
// Misses can be turned off (Goal can't: it's the score).
function tracksMiss(g){ return statConfig(g).miss; }
// The shot buttons offered: Goal, plus Miss when it's tracked.
function shotStats(g){ return tracksMiss(g) ? STATS : STATS.filter(x => x.key === 'goal'); }
// Extra stats recorded for our players, and for the other team (feeds are
// only for our players: the other team has no names to credit).
function usExtras(g){ const c = statConfig(g); return c.teams === 'them' ? [] : c.extra; }
function themExtras(g){ const c = statConfig(g); return c.teams === 'us' ? [] : c.extra.filter(k => k !== 'feed'); }
function tracksExtras(g){ return usExtras(g).length + themExtras(g).length > 0; }
// The extra stats that can be tapped during play (feeds are asked for after a goal).
function tapExtras(list){ return list.filter(k => k !== 'feed'); }

// Anyone who can run a game: Coach/Manager or Scorer.
function canScore(){ return inPractice() || isStaff(); }
function amScorer(g){ return !!(USER && g.scorerUid === USER.uid && canScore()); }
function periodMs(g){ return (g.periodMinutes || DEFAULT_PERIOD_MINUTES) * 60000; }
// Time played so far in the current period, never more than its length.
function elapsedMs(g){
  const L = g.live || {};
  const run = L.phase === 'running' && L.startedAt ? Date.now() - L.startedAt : 0;
  return Math.max(0, Math.min(periodMs(g), (L.elapsedMs || 0) + run));
}
function fmtClock(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; }
function fmtMins(ms){ const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; }
function otherTeam(t){ return t === 'us' ? 'them' : 'us'; }
function teamLabel(g, t){ return t === 'us' ? (CUR.team ? CUR.team.name : 'Us') : (g.opponent || 'Opposition'); }
// Centre passes alternate between periods: the team that didn't take the
// first centre of the previous period takes it in the next.
function periodStartCentre(g, p){
  const first = (g.live && g.live.firstCentre) || 'us';
  return p % 2 === 1 ? first : otherTeam(first);
}
function isInPlay(g){ const ph = g.live && g.live.phase; return g.status === 'live' && (ph === 'running' || ph === 'paused'); }
// The clock has reached 0:00 but the scorer hasn't ended the period yet, so a
// shot that was in the air on the whistle can still be recorded.
function isTimeUp(g){ return isInPlay(g) && elapsedMs(g) >= periodMs(g); }
function isGameOver(g){
  return g.status === 'final' || (g.status === 'live' && !!g.live && g.live.phase === 'ended' && g.live.period >= periodCount(g));
}
// The break after period p: Quarter time, Half time, Three quarter time or Full time.
function breakName(g, p){
  if (p >= periodCount(g)) return 'Full time';
  if (g.format === 'halves') return 'Half time';
  return ['Quarter time', 'Half time', 'Three quarter time'][p - 1] || 'Break';
}
// How far through the game we are, e.g. "Not started", "Q2 in play",
// "Half time" or "Full time".
function gameStage(g){
  const L = g.live;
  if (!L || !L.period || g.status === 'scheduled') return 'Not started';
  if (isGameOver(g)) return 'Full time';
  if (!isInPlay(g)) return breakName(g, L.period);
  return `${periodName(g, L.period)} in play`;
}

// Works out score, centre pass, lineups, court time and player stats from
// the events. Court time counts only time played (the clock running),
// because t is measured in time played, not wall-clock time.
function computeGame(g, events){
  const n = periodCount(g), L = g.live || {};
  const evs = (events || []).filter(e => !e.undone)
    .sort((a,b) => (a.period - b.period) || (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  const res = { us:0, them:0, oppMiss:0, byPeriod:{}, players:{}, lineup:null, centre:null,
    opp:{ GS:{ goal:0, miss:0 }, GA:{ goal:0, miss:0 }, Team:{ goal:0, miss:0 } } };
  const P = id => res.players[id] || (res.players[id] = { ms:0, pos:{}, goal:0, miss:0 });
  // Extra stats only count if this game tracks them (older games may hold
  // stats from before they were optional). A feed counts while its goal stands.
  const usOn = new Set(usExtras(g)), themOn = new Set(themExtras(g));
  const missOn = res.missOn = tracksMiss(g);
  const goals = new Set(evs.filter(e => e.type === 'goal').map(e => e.id));
  res.oppStats = {};
  for (let p = 1; p <= n; p++){
    const pe = evs.filter(e => e.period === p);
    const lineups = pe.filter(e => e.type === 'lineup');
    const endEv = pe.find(e => e.type === 'periodEnd');
    const endT = endEv ? endEv.t : (L.period === p ? elapsedMs(g) : 0);
    lineups.forEach((le, i) => {
      const to = Math.min(i + 1 < lineups.length ? lineups[i + 1].t : endT, endT);
      const dt = Math.max(0, to - le.t);
      Object.entries(le.lineup || {}).forEach(([pos, id]) => {
        if (!id) return;
        const r = P(id);
        r.ms += dt;
        r.pos[pos] = (r.pos[pos] || 0) + dt;
      });
    });
    let centre = periodStartCentre(g, p), us = 0, them = 0;
    pe.forEach(e => {
      if (e.type === 'goal'){ us++; centre = otherTeam(centre); }
      else if (e.type === 'oppGoal'){ them++; centre = otherTeam(centre); }
      else if (e.type === 'oppMiss' && missOn) res.oppMiss++;
      else if (e.type === 'centre') centre = e.team;
      if (e.type === 'oppGoal' || (e.type === 'oppMiss' && missOn))
        res.opp[e.pos === 'GS' || e.pos === 'GA' ? e.pos : 'Team'][e.type === 'oppGoal' ? 'goal' : 'miss']++;
      if (e.playerId && (e.type === 'goal' || (e.type === 'miss' && missOn) || (usOn.has(e.type) && (e.type !== 'feed' || goals.has(e.goal)))))
        P(e.playerId)[e.type] = (P(e.playerId)[e.type] || 0) + 1;
      if (e.type === 'oppStat' && themOn.has(e.stat)) res.oppStats[e.stat] = (res.oppStats[e.stat] || 0) + 1;
    });
    res.us += us; res.them += them;
    if (lineups.length) res.byPeriod[p] = { us, them };
    if (p === L.period){ res.centre = centre; res.lineup = lineups.length ? lineups[lineups.length - 1].lineup || {} : null; }
  }
  // Court time a Coach/Manager set by hand after the game (minutes per
  // position, kept as ms in courtAdjust) replaces what was recorded.
  Object.entries(g.courtAdjust || {}).forEach(([id, pos]) => {
    const r = P(id);
    r.pos = {}; r.ms = 0; r.adjusted = true;
    Object.entries(pos || {}).forEach(([k, ms]) => { if (POSITIONS.includes(k) && ms > 0){ r.pos[k] = ms; r.ms += ms; } });
  });
  return res;
}

// Kept on the game doc so the game list and fairness table don't need to
// load every game's events.
function gameSummary(g, events){
  const st = computeGame(g, events);
  const courtTime = {};
  Object.entries(st.players).forEach(([id, r]) => { if (r.ms) courtTime[id] = r.pos; });
  // Each player's preferred positions as they were for this game, kept from
  // the first save, so changing preferences later doesn't rewrite the past
  // (used to share out playing out of position over the season).
  const prefs = { ...((g.summary && g.summary.prefs) || {}) };
  Object.keys(courtTime).forEach(id => { if (!prefs[id]) prefs[id] = playerPrefs(CUR.players.find(x => x.id === id)); });
  return { us:st.us, them:st.them, courtTime, prefs };
}

/* ---------------------------------------------------------------------
   Rendering. Live updates re-render the whole screen, so any half-typed
   text in a form is saved first and put back afterwards.
--------------------------------------------------------------------- */
function captureInputs(){
  const saved = {};
  document.querySelectorAll('#app input[id]:not([type=file]), #app select[id], #app textarea[id]').forEach(el => {
    saved[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked:el.checked } : { value:el.value };
  });
  const active = document.activeElement;
  return { saved, focusId: active && active.id ? active.id : null,
    selStart: active && 'selectionStart' in active ? active.selectionStart : null };
}
function restoreInputs(state){
  Object.entries(state.saved).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if ('checked' in v) el.checked = v.checked; else el.value = v.value;
  });
  if (state.focusId){
    const el = document.getElementById(state.focusId);
    if (el){
      el.focus();
      try { if (state.selStart != null) el.setSelectionRange(state.selStart, state.selStart); } catch(e){}
    }
  }
}

function render(){
  const app = document.getElementById('app');
  const keep = captureInputs();
  let body;
  LIVE.used = new Set();
  // While the app starts, or a sign-in is finishing, show the bouncing ball
  // rather than the sign-in buttons (which would look like "sign in again").
  if (!authReady) body = splashHtml('Loading Netty Pal…');
  else if (!USER && UI.signingIn) body = splashHtml('Signing you in…');
  else if (!USER) body = renderSignedOut();
  else {
    let main;
    if (UI.view === 'season') main = renderSeason();
    else if (UI.view === 'game') main = renderGame();
    else main = renderHome();
    // The top bar sits outside the 640px column so its colour runs edge to
    // edge on wide screens; its contents line up with the column.
    // While a period is being played, the scorer's screen drops the top bar
    // so the score and buttons fit (Help is on the scoreboard).
    const lg = UI.view === 'game' && UI.gameTab === 'live' ? findGame(UI.gameId) : null;
    const scoringNow = !!(lg && isInPlay(lg) && amScorer(lg));
    body = `${offlineMode ? '<div class="offline-banner">You\'re offline. Changes will sync when you reconnect.</div>' : ''}
      ${scoringNow ? '' : renderTopbar()}
      <div class="app-shell">
        <main>${main}</main>
      </div>`;
  }
  if (UI.showInstall) body += installSheetHtml();
  else if (UI.showHelp) body += helpSheetHtml();
  else if (UI.playerSheet && USER && CUR.season) body += playerSheetHtml(UI.playerSheet);
  pruneLive();
  // A redraw keeps an open panel scrolled where it was (e.g. "Try another").
  const sheetWas = document.querySelector('.sheet[aria-labelledby]');
  const sheetKey = sheetWas && sheetWas.getAttribute('aria-labelledby');
  const sheetBody = sheetWas && sheetWas.querySelector('.sheet-body');
  const sheetScroll = sheetBody ? sheetBody.scrollTop : 0, sheetOuter = sheetWas ? sheetWas.scrollTop : 0;
  app.innerHTML = body;
  if (sheetKey){
    const now = document.querySelector(`.sheet[aria-labelledby="${sheetKey}"]`);
    if (now){ now.scrollTop = sheetOuter; const b = now.querySelector('.sheet-body'); if (b) b.scrollTop = sheetScroll; }
  }
  restoreInputs(keep);
  // A half-filled fixture form keeps its bye tick (and hidden fields) through a redraw.
  document.querySelectorAll('input[data-field="bye-toggle"]').forEach(syncByeForm);
  showActiveTabs();
}

// "This round is a bye" ticked: hide the fields a bye doesn't need, and the
// opponent is no longer required.
function syncByeForm(el){
  const form = el.closest('form');
  if (!form) return;
  form.classList.toggle('is-bye', el.checked);
  const opp = form.querySelector('input[name="opponent"]');
  if (opp) opp.required = !el.checked;
}

// The tab rows scroll sideways on a phone. Slide each row so the selected
// tab is fully visible (sideways only, so the page itself never jumps).
function showActiveTabs(){
  document.querySelectorAll('.tabs').forEach(row => {
    const tab = row.querySelector('.tab.active');
    if (tab){
      const left = tab.offsetLeft - row.offsetLeft, right = left + tab.offsetWidth;
      if (left < row.scrollLeft) row.scrollLeft = left - 8;
      else if (right > row.scrollLeft + row.clientWidth) row.scrollLeft = right - row.clientWidth + 8;
    }
    tabFade(row);
  });
}
// A tab row wider than the screen fades out at the edge that has more tabs,
// so it's clear there's more to scroll to (iPhones hide the scroll bar).
function tabFade(row){
  const more = row.scrollWidth - row.clientWidth;
  row.style.setProperty('--fl', more > 0 && row.scrollLeft > 2 ? '28px' : '0px');
  row.style.setProperty('--fr', more > 0 && row.scrollLeft < more - 2 ? '40px' : '0px');
}
document.addEventListener('scroll', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('tabs')) tabFade(e.target);
}, true);

function renderTopbar(){
  return `<header class="topbar"><div class="topbar-inner">
    <button class="brand" data-action="go-home" aria-label="Netty Pal: back to all teams">${ballSvg('brand-ball')}<span>Netty Pal</span></button>
    <div class="user-chip">
      <button class="btn small help-pop" data-action="help-open">Help</button>
      <button class="avatar-btn" data-action="user-menu" aria-label="Your account" aria-haspopup="true" aria-expanded="${UI.userMenu ? 'true' : 'false'}">${avatarHtml(USER.displayName, USER.photoURL)}</button>
      ${UI.userMenu ? `<div class="user-menu" role="menu" aria-label="Your account">
        <div>
          ${USER.displayName ? `<div class="um-name">${escapeHtml(USER.displayName)}</div>` : ''}
          ${USER.email ? `<div class="um-email">${escapeHtml(USER.email)}</div>` : ''}
        </div>
        ${isInstalled() ? '' : '<button class="btn ghost small" role="menuitem" data-action="install-open">Install on your phone</button>'}
        <button class="btn ghost small" role="menuitem" data-action="sign-out">Sign out</button>
      </div>` : ''}
    </div>
  </div></header>`;
}

// White netball with pink panel seams (three curved pairs, the classic
// netball panel pattern), matching the app icon and the shared result card.
// Drawn in a 100 x 100 box: ball centred at 50,50 with radius 45.
const BALL_SEAMS = 'M50 50a40 40 0 0 0 40 20 M27.5 57.5a60 60 0 0 0 42.5 32.5 M50 50a40 40 0 0 0 -37.3 24.6 M54.8 26.8a60 60 0 0 0 -49.4 20.6 M50 50a40 40 0 0 0 -2.7 -44.6 M67.7 65.7a60 60 0 0 0 6.9 -53.1';
// The same ball on a canvas, centred at cx,cy with radius r.
function drawBall(x, cx, cy, r){
  const k = r / 45;
  x.save(); x.translate(cx - 50 * k, cy - 50 * k); x.scale(k, k);
  x.fillStyle = '#FFFFFF'; x.strokeStyle = '#E0457B'; x.lineCap = 'round';
  x.beginPath(); x.arc(50, 50, 45, 0, Math.PI * 2); x.fill();
  x.lineWidth = 3.5; x.stroke();
  x.lineWidth = 4; x.stroke(new Path2D(BALL_SEAMS));
  x.restore();
}
// The logo ball drawn small (next centre pass marker), with thicker lines so
// the seams still show at icon size.
function cpBallSvg(){
  return `<svg class="cp-ball" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#E0457B" stroke-width="7"/>
    <path d="${BALL_SEAMS}" fill="none" stroke="#E0457B" stroke-width="7" stroke-linecap="round"/>
  </svg>`;
}
function ballSvg(cls){
  return `<svg class="${cls || 'ball'}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#E0457B" stroke-width="3.5"/>
    <path d="${BALL_SEAMS}" fill="none" stroke="#E0457B" stroke-width="4" stroke-linecap="round"/>
  </svg>`;
}

// Sign-in options: Google, Facebook, or a link emailed to you (no
// password). UI.signin is null, 'email' (asking for email and name),
// 'sent' (check your inbox) or 'confirm' (link opened on another device,
// so the email has to be typed again).
function renderSignedOut(){
  const intro = pendingInvite()
    ? `<p class="invite-note"><b>You've been invited to join a team.</b> Sign in to accept.</p>`
    : `<div class="welcome">
        <p class="welcome-lead"><b>Welcome to Netty Pal</b>, an app for your netball team where:</p>
        <ul>
          <li>Someone keeps score on their phone.</li>
          <li>Everyone can see a live scoreboard, plus simple game and season stats.</li>
          <li>You can share the scoreboard with friends and family.</li>
        </ul>
        <p class="fine">Netty Pal doesn't replace any official app for fixtures and court numbers, such as NetballHQ.</p>
      </div>`;
  let panel;
  // Email and password: sign in, create an account, or reset a password.
  // The emailed link is still there as a backup.
  const err = UI.signinError ? `<p class="signin-error" role="alert">${escapeHtml(UI.signinError)}</p>` : '';
  const emailField = `<div class="field"><label for="si-email">Email</label>
      <input class="text-input" id="si-email" name="email" type="email" autocomplete="email" inputmode="email" required value="${escapeHtml(UI.signinEmail || '')}">
      ${gmailNudgeHtml()}</div>`;
  const pwField = (newPw) => `<div class="field"><label for="si-pw">${newPw ? 'Choose a password' : 'Password'}</label>
      <div class="pw-wrap"><input class="text-input" id="si-pw" name="password" type="${UI.showPw ? 'text' : 'password'}" autocomplete="${newPw ? 'new-password' : 'current-password'}" required ${newPw ? 'minlength="6"' : ''}>

// Links tapped in Facebook, Messenger, Instagram and some other apps open
// in that app's own mini browser, where Google blocks signing in. Spot
// that and explain how to get to the phone's real browser.
function inAppBrowser(){
  const ua = navigator.userAgent || '';
  if (/FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua)) return 'Facebook';
  if (/Instagram/i.test(ua)) return 'Instagram';
  if (/MicroMessenger/i.test(ua)) return 'WeChat';
  if (/\bLine\//.test(ua)) return 'LINE';
  if (/Android/.test(ua) && /; wv\)/.test(ua)) return 'another app';
  return '';
}
function inAppBrowserHtml(){
  const app = inAppBrowser();
  if (!app) return '';
  const android = /Android/.test(navigator.userAgent || '');
  const chrome = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
  return `<div class="inapp-note" role="alert">
      <b>Open this in ${android ? 'Chrome' : 'Safari'} first</b>
      <p>This page opened inside ${escapeHtml(app)}, where Google sign-in doesn't work. Tap <b>⋯</b> (top right) and choose <b>Open in browser</b>${android ? '' : ' or <b>Open in Safari</b>'}.</p>
      <div class="inapp-actions">
        ${android ? `<a class="btn small" href="${escapeHtml(chrome)}">Open in Chrome</a>` : ''}
        <button class="btn ghost small" data-action="copy-link">Copy link</button>
      </div>
      <p class="hint" style="margin:0">Or use <b>Continue with email</b> below, which works here.</p>
    </div>`;
}

/* ---- Email link sign-in ----
   Firebase emails a one-time link. Opening it brings the person back here,
   where the link is checked and they're signed in. The email (and name)
   are remembered on this device in between; if the link is opened on a
   different device, they're asked to type the email again. */
const EMAIL_KEY = 'nettyPalSigninEmail', NAME_KEY = 'nettyPalSigninName';
async function sendEmailLink(fd){
  const email = String(fd.get('email') || '').trim(), name = String(fd.get('name') || '').trim();
  if (!email) return;
  // Come back to the app, keeping any team invite so it isn't lost if the
  // email is opened in a different browser.
  const invite = pendingInvite();
  const url = `${location.origin}${location.pathname}${invite ? '?join=' + encodeURIComponent(invite) : ''}`;
  await sendSignInLinkToEmail(auth, email, { url, handleCodeInApp:true });
  try { localStorage.setItem(EMAIL_KEY, email); if (name) localStorage.setItem(NAME_KEY, name); } catch(e){}
  UI.signin = 'sent'; UI.signinEmail = email;
}
async function finishEmailLink(email, name){
  const cred = await signInWithEmailLink(auth, email, location.href);
  try { localStorage.removeItem(EMAIL_KEY); localStorage.removeItem(NAME_KEY); } catch(e){}
  // Tidy the sign-in code out of the address bar.
  history.replaceState(null, '', location.pathname);
  if (name && cred.user && !cred.user.displayName){
    await updateProfile(cred.user, { displayName:name });
    USER = auth.currentUser;
  }
  UI.signin = null;
}
/* ---- Email and password ----
   The usual way to sign in with email: nobody has to leave the app (which
   matters on iPhones, where an emailed link opens in Safari, not in the
   installed app). A forgotten password, or someone who used to sign in with
   an emailed link, gets a "set a new password" email. */
async function passwordSignIn(fd){
  const email = String(fd.get('email') || '').trim();
  UI.signinEmail = email;
  await signInWithEmailAndPassword(auth, email, String(fd.get('password') || ''));
  UI.signin = null; UI.signinError = null; UI.showPw = false;
}
async function passwordCreate(fd){
  const email = String(fd.get('email') || '').trim(), name = String(fd.get('name') || '').trim();
  UI.signinEmail = email;
  const cred = await createUserWithEmailAndPassword(auth, email, String(fd.get('password') || ''));
  if (name){ await updateProfile(cred.user, { displayName:name }); USER = auth.currentUser; }
  UI.signin = null; UI.signinError = null; UI.showPw = false;
}
async function passwordReset(fd){
  const email = String(fd.get('email') || '').trim();
  UI.signinEmail = email;
  // Comes back to Netty Pal after the new password is set.
  await sendPasswordResetEmail(auth, email, { url:`${location.origin}${location.pathname}` });
  UI.signin = 'reset-sent'; UI.signinError = null;
}
// Sign-in forms show their problem in the form, not in a passing toast.
async function runSignin(fn){
  if (UI.busy) return;
  UI.busy = true; UI.signinError = null; render();
  try { await fn(); }
  catch (err){ console.warn('Netty Pal: sign-in', err); UI.signinError = signinErrorText(err); }
  finally { UI.busy = false; render(); }
}
function signinErrorText(err){
  const code = (err && err.code) || '';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-login'))
    return "That email and password don't match. Check them and try again. New here? Tap Create an account. Used to sign in with an emailed link? Tap Forgot password to set one.";
  if (code.includes('email-already-in-use'))
    return "There's already a Netty Pal account for that email. Sign in instead, or tap Forgot password if you don't have a password yet.";
  if (code.includes('weak-password')) return 'Please choose a password with at least 6 characters.';
  if (code.includes('missing-password')) return 'Please type your password.';
  if (code.includes('too-many-requests')) return 'Too many tries. Please wait a few minutes, or tap Forgot password.';
  return friendlyError(err);
}
// Gmail addresses already have a Google account: one tap is quicker.
const GMAIL = /@(gmail|googlemail)\./i;
function gmailNudgeHtml(){
  return `<p class="gmail-nudge" ${GMAIL.test(UI.signinEmail || '') ? '' : 'hidden'}>Using Gmail? <button type="button" class="link-btn" data-action="sign-in">Continue with Google</button> is quicker: no password needed.</p>`;
}
document.addEventListener('input', (e) => {
  if (e.target.id !== 'si-email') return;
  UI.signinEmail = e.target.value;
  const nudge = e.target.parentElement.querySelector('.gmail-nudge');
  if (nudge) nudge.hidden = !GMAIL.test(e.target.value);
});

// Runs once when the page opens: is this the link from the email?
async function checkEmailLink(){
  if (!isSignInWithEmailLink(auth, location.href)) return;
  let email = '', name = '';
  try { email = localStorage.getItem(EMAIL_KEY) || ''; name = localStorage.getItem(NAME_KEY) || ''; } catch(e){}
  if (!email){ UI.signin = 'confirm'; render(); return; }
  UI.signingIn = true; render();
  try { await finishEmailLink(email, name); }
  catch (err){ UI.signingIn = false; UI.signin = null; history.replaceState(null, '', location.pathname); fail(err); render(); }
}

// Google or Facebook sign-in in a popup. The waiting screen shows straight
// away; if the popup is closed or fails, the sign-in buttons come back.
async function signInPopup(provider){
  UI.signingIn = true; render();
  try {
    await signInWithPopup(auth, provider);
    // Normally the sign-in listener takes over from here; this is a safety net.
    if (!auth.currentUser){ UI.signingIn = false; render(); }
  } catch (err){ UI.signingIn = false; render(); throw err; }
}

// Every team, with each season's number of members, for the owner.
async function loadOwnerTeams(){
  HOME.all = { loading:true }; render();
  try {
    const teamSnaps = await getDocs(collection(db, 'teams'));
    const teams = await Promise.all(teamSnaps.docs.map(async t => {
      const seasonSnaps = await getDocs(collection(db, 'teams', t.id, 'seasons'));
      const seasons = await Promise.all(seasonSnaps.docs.map(async se => {
        const members = await getDocs(collection(se.ref, 'members'));
        return { seasonId:se.id, seasonName:se.data().name || '', competition:se.data().competition || '', members:members.docs.length };
      }));
      seasons.sort((a, b) => b.seasonName.localeCompare(a.seasonName));
      return { teamId:t.id, teamName:t.data().name || 'Unnamed team', seasons };
    }));
    teams.sort((a, b) => a.teamName.localeCompare(b.teamName));
    HOME.all = { teams };
  } catch (err){
    console.warn('Netty Pal: every team', err);
    HOME.all = { error:true };
  }
  render();
}

// The owner deletes a whole team: every season and everything in it
// (members, players, games and their events, invite links, codes), then the
// team itself. Only the owner is allowed to do this (see firestore.rules).
// People who were in it simply stop seeing it: their home screen tidies
// away seasons they're no longer a member of.
async function deleteTeam(teamId){
  const seasonSnaps = await getDocs(collection(db, 'teams', teamId, 'seasons'));
  for (const se of seasonSnaps.docs){
    const [members, players, games, invites, awards] = await Promise.all(['members', 'players', 'games', 'invites', 'awards'].map(c => getDocs(collection(se.ref, c))));
    const refs = awards.docs.map(d => d.ref);
    for (const g of games.docs){
      const events = await getDocs(collection(g.ref, 'events'));
      events.docs.forEach(e => refs.push(e.ref));
    }
    refs.push(...games.docs.map(d => d.ref), ...players.docs.map(d => d.ref));
    invites.docs.forEach(d => { refs.push(d.ref); refs.push(doc(db, 'roleInvites', d.id)); });
    if (se.data().joinCode) refs.push(doc(db, 'joinCodes', se.data().joinCode));
    // Members last but one, then the season, so nothing is left orphaned if it stops part way.
    refs.push(...members.docs.map(d => d.ref), se.ref);
    await deleteDocs(refs);
  }
  await deleteDoc(doc(db, 'teams', teamId));
  HOME.items = HOME.items.filter(it => it.teamId !== teamId);
  toast('Team deleted.');
  if (HOME.all) await loadOwnerTeams(); else render();
}

/* ---- Install on a phone ----
   Netty Pal is a web app, but it can sit on a phone's home screen and open

   offers a "beforeinstallprompt" event, which we keep and use for the
   Install button. iPhone and iPad have no such button, so we show the
   Share > Add to Home Screen steps instead. */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; UI.showInstall = false; render(); toast('Netty Pal is on your home screen.'); });
const INSTALL_CARD_KEY = 'nettyPalInstallCardHidden';
// Already running from the home screen (no address bar)?
function isInstalled(){
  try { if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) return true; } catch(e){}
  return navigator.standalone === true;
}
function devicePlatform(){
  const ua = navigator.userAgent || '';
  // iPads say they're Macs, but Macs don't have touch screens.
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';

/* ---- Deleting your account ----
   Anyone can delete their Netty Pal account from the home screen. It:
   - leaves every team season they're in (their name, email and photo are
     removed from Support Crew),
   - deletes the players, games and invite links of any season where
     nobody else is a member (the data would otherwise sit there unused),
   - deletes their list of teams, and then their sign-in account.
   A team always keeps a Coach/Manager: if they're the only one and other
   people are in the team, they must make someone else Coach/Manager first.
   Firebase only deletes a sign-in account if the person signed in
   recently, so Google and Facebook users confirm with a quick sign-in
   popup before anything is deleted. */
// Looks at each season this person is in and works out what will happen.
async function planAccountDeletion(){
  const uid = USER.uid;
  const ms = await getMembershipDocs();
  const seasons = await Promise.all(ms.map(async ({ teamId, seasonId }) => {
    const sRef = doc(db, 'teams', teamId, 'seasons', seasonId);
    const meSnap = await getDoc(doc(sRef, 'members', uid));
    if (!meSnap.exists()) return { teamId, seasonId, action:'gone' };
    const [teamSnap, seasonSnap, membersSnap] = await Promise.all([getDoc(doc(db, 'teams', teamId)), getDoc(sRef), getDocs(collection(sRef, 'members'))]);
    const others = membersSnap.docs.filter(d => d.id !== uid).map(d => d.data());
    const coach = (meSnap.data().roles || []).includes('coach');
    const action = !others.length && coach ? 'delete'
      : coach && !others.some(m => (m.roles || []).includes('coach')) ? 'blocked' : 'leave';
    return { teamId, seasonId, action, teamName:teamSnap.exists() ? teamSnap.data().name : 'A team',
      seasonName:seasonSnap.exists() ? seasonSnap.data().name : '', joinCode:seasonSnap.exists() ? seasonSnap.data().joinCode || '' : '' };
  }));
  seasons.sort((a, b) => (a.teamName || '').localeCompare(b.teamName || ''));
  return seasons;
}
async function openDeleteAccount(){
  UI.deleteAcct = { loading:true }; render();
  try { UI.deleteAcct = { seasons:await planAccountDeletion() }; }
  catch (err){ console.warn('Netty Pal: delete plan', err); UI.deleteAcct = { error:true }; }
  render(); focusSheet();
}
function deleteAccountHtml(){
  const d = UI.deleteAcct;
  let body;
  if (d.loading) body = '<div class="loading-state">Checking your teams…</div>';
  else if (d.error) body = `<p role="alert">Couldn't check your teams just now. This is usually a connection hiccup.</p>
      <button class="btn small" data-action="delete-account-open">Try again</button>`;
  else if (d.working) body = `<div class="loading-state" role="status">${escapeHtml(d.working)}</div>`;
  else if (d.relogin) body = `<p role="alert"><b>Please sign in again first.</b> For your security, an account can only be deleted soon after signing in. Sign out, sign back in, then come back here and tap <b>Delete my account</b> straight away.</p>
      <button class="btn" data-action="sign-out">Sign out</button>`;
  else {
    const label = s => `<b>${escapeHtml(s.teamName)}</b>${s.seasonName ? ' (' + escapeHtml(s.seasonName) + ')' : ''}`;
    const list = d.seasons.filter(s => s.action !== 'gone');
    const blocked = list.filter(s => s.action === 'blocked');
    const rows = list.map(s => `<li>${label(s)}: ${
      s.action === 'leave' ? "you'll leave the team. The team keeps its players, games and scores."
      : s.action === 'delete' ? "nobody else is in this team, so its players, games and scores will be deleted too."
      : `you're the only Coach/Manager and other people are in this team. Make someone else Coach/Manager in Support Crew first. <button class="btn ghost small" data-action="delete-account-team" data-team="${escapeHtml(s.teamId)}" data-season="${escapeHtml(s.seasonId)}">Open ${escapeHtml(s.teamName)}</button>`}</li>`).join('');
    body = `<p style="margin:0.8rem 0 0">This permanently deletes your Netty Pal account. It can't be undone.</p>
      <ul class="delete-list">
        <li>Your name, email and photo are removed from every team you're in.</li>
        <li>Your sign-in account is deleted and you'll be signed out.</li>
        ${list.length ? '' : "<li>You're not in any teams, so nothing else is affected.</li>"}
      </ul>
      ${list.length ? `<div class="list-label">Your teams</div><ul class="delete-list">${rows}</ul>` : ''}
      <p class="hint">Your name may still show on past games you scored. To have that removed too, email <a href="mailto:${OWNER_EMAIL}?subject=Netty%20Pal%20data%20deletion">${OWNER_EMAIL}</a>.</p>
      ${blocked.length ? `<p class="hint" role="alert"><b>You can't delete your account yet.</b> ${blocked.length === 1 ? 'One team needs' : blocked.length + ' teams need'} another Coach/Manager first (see above).</p>`
        : `<button class="btn danger big ${isArmed('delete-account') ? 'armed' : ''}" style="width:100%" data-action="delete-account" ${UI.busy ? 'disabled' : ''}>${isArmed('delete-account') ? 'Confirm delete my account' : 'Delete my account'}</button>`}`;
  }
  return `<div class="sheet-backdrop" data-action="delete-account-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="delete-title">
      <div class="sheet-head">
        <div class="grow"><h3 id="delete-title">Delete my account</h3></div>
        ${d.working ? '' : '<button class="btn ghost small" data-action="delete-account-close">Close</button>'}
      </div>
      <div class="sheet-body">${body}</div>
    </div>`;
}
// Google and Facebook users confirm who they are with a quick popup, unless
// they signed in within the last few minutes. Email-link users can't do that
// from here, so they're asked to sign in again. Runs before anything is
// deleted, so nothing is left half done.
async function confirmRecentSignIn(){
  const user = auth.currentUser;
  const last = Date.parse((user.metadata && user.metadata.lastSignInTime) || '') || 0;
  if (Date.now() - last < 4 * 60000) return true;
  const ids = (user.providerData || []).map(p => p.providerId);
  if (ids.includes('google.com')){ await reauthenticateWithPopup(user, new GoogleAuthProvider()); return true; }
  if (ids.includes('facebook.com')){ await reauthenticateWithPopup(user, new FacebookAuthProvider()); return true; }
  return false;
}
// Deletes a list of documents, in batches (Firestore allows 500 per save).
async function deleteDocs(refs){
  for (let i = 0; i < refs.length; i += 400){
    const batch = writeBatch(db);
    refs.slice(i, i + 400).forEach(r => batch.delete(r));
    await batch.commit();
  }
}
// A season nobody else is in: delete its players, games, invite links and
// code while we're still its Coach/Manager. (The season and team names stay;
// the security rules don't allow deleting those.)
async function deleteSeasonData(s){
  const sRef = doc(db, 'teams', s.teamId, 'seasons', s.seasonId);
  const [players, games, invites, awards] = await Promise.all([
    getDocs(collection(sRef, 'players')), getDocs(collection(sRef, 'games')), getDocs(collection(sRef, 'invites')), getDocs(collection(sRef, 'awards'))]);
  const refs = [...players.docs.map(d => d.ref), ...games.docs.map(d => d.ref), ...awards.docs.map(d => d.ref)];
  invites.docs.forEach(d => { refs.push(d.ref); refs.push(doc(db, 'roleInvites', d.id)); });
  if (s.joinCode) refs.push(doc(db, 'joinCodes', s.joinCode));
  await deleteDocs(refs);
}
async function deleteAccount(){
  const d = UI.deleteAcct;
  if (!d || !d.seasons || d.seasons.some(s => s.action === 'blocked')) return;
  try {
    if (!(await confirmRecentSignIn())){ UI.deleteAcct = { ...d, relogin:true }; render(); return; }
  } catch (err){
    if (String(err && err.code).includes('user-mismatch')){ toast('Please confirm with the same account you signed in with.', true); return; }
    throw err;
  }
  const uid = USER.uid;
  closeSeason();
  UI.deleteAcct = { ...d, working:'Deleting your account…' }; render();
  try {
    for (const s of d.seasons){
      if (s.action === 'delete') await deleteSeasonData(s);
      const batch = writeBatch(db);
      if (s.action !== 'gone') batch.delete(doc(db, 'teams', s.teamId, 'seasons', s.seasonId, 'members', uid));
      batch.delete(doc(db, 'users', uid, 'memberships', s.seasonId));
      await batch.commit();
    }
    await deleteUser(auth.currentUser);
  } catch (err){
    UI.deleteAcct = { ...d, working:null };
    if (String(err && err.code).includes('requires-recent-login')){ UI.deleteAcct.relogin = true; render(); return; }
    throw err;
  }
  // Forget this phone's Netty Pal settings too.
  try { Object.keys(localStorage).filter(k => k.startsWith('nettyPal')).forEach(k => localStorage.removeItem(k)); } catch(e){}
  UI.deleteAcct = null;
  toast('Your account has been deleted.');
}

function readStatsFields(fd){
  const extra = EXTRA_STATS.filter(k => fd.get('stat_' + k));

/* ---- Live score cards ----
   The home screen and the Games tab show any game being played right now,
   with the score, period and clock, one tap from the Live tab. The score is
   counted from the game's events (as on the Live tab), so these listen to
   live games only, and only while a card is on screen: each render notes the
   listeners it used and pruneLive() stops the rest. */
const LIVE = { seasons:new Map(), events:new Map(), clocks:new Map(), used:new Set() };
// Live games in one season (for the home screen, where no season is open).
function liveGamesIn(teamId, seasonId){
  const key = teamId + '/' + seasonId;
  LIVE.used.add('s:' + key);
  let w = LIVE.seasons.get(key);
  if (!w){
    w = { games:[], unsub:null };
    LIVE.seasons.set(key, w);
    w.unsub = onSnapshot(query(collection(db, 'teams', teamId, 'seasons', seasonId, 'games'), where('status', '==', 'live')),
      (snap) => { w.games = snap.docs.map(d => ({ id:d.id, ...d.data() })); render(); },
      (err) => console.warn('Netty Pal: live games', err));
  }
  return w.games;
}
// The events of one live game (the open game's are already loaded).
function liveEventsFor(teamId, seasonId, gameId){
  if (UI.seasonId === seasonId && CUR.eventsFor === gameId && CUR.loaded.events) return CUR.events;
  const key = teamId + '/' + seasonId + '/' + gameId;
  LIVE.used.add('e:' + key);
  let w = LIVE.events.get(key);
  if (!w){
    w = { events:null, unsub:null };
    LIVE.events.set(key, w);
    w.unsub = onSnapshot(collection(db, 'teams', teamId, 'seasons', seasonId, 'games', gameId, 'events'),
      (snap) => { w.events = snap.docs.map(d => ({ id:d.id, ...d.data() })); render(); },
      (err) => console.warn('Netty Pal: live events', err));
  }
  return w.events;
}
function pruneLive(){
  [['s:', LIVE.seasons], ['e:', LIVE.events]].forEach(([pre, map]) => {
    map.forEach((w, key) => { if (!LIVE.used.has(pre + key)){ if (w.unsub) w.unsub(); map.delete(key); } });
  });
}
function liveCardHtml(teamId, seasonId, teamName, g){
  const evs = liveEventsFor(teamId, seasonId, g.id);
  const on = (evs || []).filter(e => !e.undone);
  const us = on.filter(e => e.type === 'goal').length, them = on.filter(e => e.type === 'oppGoal').length;
  const L = g.live || {};
  let when;
  if (isGameOver(g)) when = 'Full time';
  else if (!isInPlay(g)) when = breakName(g, L.period);
  else {
    const key = seasonId + '/' + g.id;
    LIVE.clocks.set(key, g);
    when = `${escapeHtml(periodName(g, L.period))} · <span data-lclock="${escapeHtml(key)}">${fmtClock(periodMs(g) - elapsedMs(g))}</span>${L.phase === 'paused' ? ' · Paused' : ''}`;
  }
  const score = evs ? `<b>${us} : ${them}</b>` : '<b>&nbsp;</b>';
  return `<button class="live-card" data-action="open-live" data-team="${escapeHtml(teamId)}" data-season="${escapeHtml(seasonId)}" data-game="${escapeHtml(g.id)}">

/* ---- Fill lineup for me ----
   Coach/Managers can have Netty Pal plan every quarter of a game that
   hasn't started, then check it in a preview before using it.
   1. How many quarters each available player gets: everyone gets the even
      share (rounded down), and the spare quarters go one at a time to
      whoever has the lowest season average (minutes per game they were
      available for, from finished games), so anyone behind catches up.
   2. Which quarters: nobody sits out two in a row where that's possible,
      and each quarter needs players who can shoot (only players who chose
      GS or GA as a preferred position play there).
   3. Which positions, quarter by quarter: the best match for preferences
      ("Top preferences"), or rotating through each player's preferences
      ("Variety"). Short of players, WD is left empty first, then WA, then GA.
   Many candidate plans are tried and the best ones are offered. */
const EMPTY_FIRST = ['WD', 'WA', 'GA', 'GD', 'GK', 'GS'];
const SHOOTERS_POS = ['GS', 'GA'];
function seededRandom(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// Season court time so far, from the summaries saved with finished games:
// total ms on court and the number of games each player was available for.
// Also time out of preferred positions ("off"), judged by the preferences
// saved with each game (games from before that was saved use today's).
function seasonCourtTotals(skipId){
  const tot = {}, games = {}, off = {};
  CUR.games.filter(x => x.id !== skipId && !x.archived && !x.bye && isGameOver(x) && x.summary && x.summary.courtTime).forEach(x => {
    const ct = x.summary.courtTime, saved = x.summary.prefs || {};
    new Set([...availableIds(x), ...Object.keys(ct)]).forEach(id => { games[id] = (games[id] || 0) + 1; });
    Object.entries(ct).forEach(([id, pos]) => {
      tot[id] = (tot[id] || 0) + Object.values(pos || {}).reduce((a, b) => a + (b || 0), 0);
      const prefs = Array.isArray(saved[id]) ? saved[id] : playerPrefs(CUR.players.find(p => p.id === id));
      if (prefs.length) Object.entries(pos || {}).forEach(([k, ms]) => { if (!prefs.includes(k)) off[id] = (off[id] || 0) + (ms || 0); });
    });
  });
  return { tot, games, off };
}
// Cost of putting a player (who has preferences) somewhere they don't
// prefer: more for whoever has done it most this season (per game
// available), so it's shared out evenly.
function offPrefCost(id, totals, pm){
  const games = totals.games[id] || 0;
  return games ? 25 * ((totals.off[id] || 0) / games) / pm : 0;
}
let autoCache = null;
function autoPlan(g, opts){
  const key = JSON.stringify([g.id, opts, g.plan || {}, availableIds(g), CUR.players.map(x => [x.id, x.positions || []])]);
  if (autoCache && autoCache.key === key) return autoCache.r;
  const r = makeAutoPlan(g, opts);
  autoCache = { key, r };
  return r;
}
function makeAutoPlan(g, opts){
  const P = periodCount(g), pm = periodMs(g);
  const ids = byName(availableIds(g));
  const N = ids.length, K = Math.min(7, N);
  const rng = seededRandom(opts.seed || 1);
  const notes = [];
  if (!N) return { error:'Nobody is marked as playing. Tick who\'s playing on the Players tab first.' };
  const canShoot = id => playerPrefs(CUR.players.find(x => x.id === id)).some(pos => SHOOTERS_POS.includes(pos));
  const open = POSITIONS.filter(pos => !EMPTY_FIRST.slice(0, 7 - K).includes(pos));

  // What's already set and being kept.
  const fixed = {}, fixedOn = {};
  for (let p = 1; p <= P; p++){
    fixed[p] = {};
    const own = opts.keep ? ownPlan(g, p) : null;
    if (own) POSITIONS.forEach(pos => {
      const id = own[pos];
      if (id && ids.includes(id) && !Object.values(fixed[p]).includes(id)){ fixed[p][pos] = id; (fixedOn[id] = fixedOn[id] || new Set()).add(p); }
    });
  }

  // 1. Quarters each.
  const totals = seasonCourtTotals(g.id);
  const { tot, games } = totals;
  const avgAfter = (id, q) => ((tot[id] || 0) + q * pm) / ((games[id] || 0) + 1);
  // The most quarters each player can play: a quarter whose lineup is
  // already full (kept) only has room for the players kept in it.
  const maxQ = {};
  ids.forEach(id => {
    maxQ[id] = 0;
    for (let p = 1; p <= P; p++) if ((fixedOn[id] && fixedOn[id].has(p)) || Object.keys(fixed[p]).length < K) maxQ[id]++;
  });
  const base = Math.min(P, Math.floor(K * P / N));
  const q = {};
  ids.forEach(id => { q[id] = Math.min(maxQ[id], Math.max(base, fixedOn[id] ? fixedOn[id].size : 0)); });
  let spare = K * P - ids.reduce((a, id) => a + q[id], 0);
  while (spare > 0){
    const cands = ids.filter(id => q[id] < maxQ[id]);
    if (!cands.length) break;
    cands.sort((a, b) => avgAfter(a, q[a]) - avgAfter(b, q[b]) || q[a] - q[b] || rng() - 0.5);
    q[cands[0]]++; spare--;
  }
  while (spare < 0){
    const cands = ids.filter(id => q[id] > (fixedOn[id] ? fixedOn[id].size : 0));
    if (!cands.length) break;
    cands.sort((a, b) => avgAfter(b, q[b]) - avgAfter(a, q[a]));
    q[cands[0]]--; spare++;
  }
  // Shooting positions need shooters every quarter. If there aren't many,
  // they play extra quarters, taken from whoever is furthest ahead.
  const shootSlots = open.filter(pos => SHOOTERS_POS.includes(pos)).length;
  const shooters = ids.filter(canShoot);
  const extraShooters = new Set();
  const fairQ = { ...q };
  const minOf = id => Math.max(1, fixedOn[id] ? fixedOn[id].size : 0);
  while (shooters.reduce((a, id) => a + q[id], 0) < Math.min(shooters.length, shootSlots) * P){
    const up = shooters.filter(id => q[id] < maxQ[id]).sort((a, b) => avgAfter(a, q[a]) - avgAfter(b, q[b]))[0];
    const down = ids.filter(id => !canShoot(id) && q[id] > minOf(id)).sort((a, b) => avgAfter(b, q[b]) - avgAfter(a, q[a]))[0];
    if (!up || !down) break;
    q[up]++; q[down]--; extraShooters.add(up);
  }
  const shootNeed = Math.min(shooters.length, shootSlots);

  // 2. Which quarters: random tries at filling every quarter exactly.
  const subsets = (n) => {
    const out = [];
    for (let m = 0; m < (1 << P); m++){
      const set = []; for (let p = 1; p <= P; p++) if (m & (1 << (p - 1))) set.push(p);
      if (set.length === n) out.push(set);
    }
    return out;
  };
  const benchRun = set => { for (let p = 1; p < P; p++) if (!set.includes(p) && !set.includes(p + 1)) return true; return false; };
  const patternsFor = id => {
    const must = fixedOn[id] || new Set();
    return subsets(q[id]).filter(set => [...must].every(p => set.includes(p)));
  };
  const tryFill = (strictBench) => {
    const order = ids.slice().sort(() => rng() - 0.5).sort((a, b) => patternsFor(a).length - patternsFor(b).length);
    const cap = {}; for (let p = 1; p <= P; p++) cap[p] = K;
    const pick = {};
    let nodes = 0;
    const dfs = (i) => {
      if (++nodes > 4000) return false;
      if (i === order.length) return true;
      const id = order[i];
      let pats = patternsFor(id).sort(() => rng() - 0.5);
      const good = pats.filter(set => !benchRun(set));
      if (strictBench && good.length) pats = good; else pats = [...good, ...pats.filter(set => benchRun(set))];
      for (const set of pats){
        if (!set.every(p => cap[p] > 0)) continue;
        set.forEach(p => cap[p]--); pick[id] = set;
        const left = order.length - i - 1;
        let ok = true; for (let p = 1; p <= P; p++) if (cap[p] > left) ok = false;
        if (ok && dfs(i + 1)) return true;
        set.forEach(p => cap[p]++); delete pick[id];
      }
      return false;
    };
    if (!dfs(0)) return null;
    // Every quarter needs shooters for the shooting positions it fills
    // (positions kept from the lineup already set don't count).
    for (let p = 1; p <= P; p++){
      const free = open.filter(pos => SHOOTERS_POS.includes(pos) && !fixed[p][pos]).length;
      const kept = new Set(Object.values(fixed[p]));
      if (ids.filter(id => pick[id].includes(p) && canShoot(id) && !kept.has(id)).length < Math.min(shootNeed, free)) return null;
    }
    return pick;
  };

  // 3. Positions for one quarter: the best arrangement, worked out exactly
  // (at most 7 players and 7 positions). A shooting position can only go to
  // a shooter; leaving a position empty, or a player without one, costs a lot.
  const prefScore = (id, pos, playedHere) => {
    // Shooting positions go to players who chose GS or GA. If there aren't
    // enough of them on court, someone else fills in (a big cost, so it only
    // happens when there's no shooter to use) rather than leaving it empty.
    if (SHOOTERS_POS.includes(pos) && !canShoot(id)) return -400 - offPrefCost(id, totals, pm);
    const prefs = playerPrefs(CUR.players.find(x => x.id === id));
    const r = prefs.indexOf(pos);
    if (r < 0) return prefs.length ? -offPrefCost(id, totals, pm) : 20;
    // Variety: a smaller pull than the cost of a 2nd position change, so
    // players rotate once (e.g. GA, GA, WA, WA) rather than every quarter.
    if (opts.mode === 'variety') return [100, 90, 80][r] - 30 * (playedHere || 0);
    return [100, 70, 40][r];
  };
  // Position changes: each time a player plays a different position from the
  // last quarter they were on court. The first one in a game is free; more
  // cost points, so plans keep players to fewer than 2 changes where possible.
  const CHANGE_COST = 60;
  const changeCost = (id, pos, hist) => { const h = hist[id]; return h && h.last && h.last !== pos && h.changes >= 1 ? CHANGE_COST : 0; };
  const placeQuarter = (on, lock, played, hist) => {
    const posList = open.filter(pos => !lock[pos]);
    const players = on.filter(id => !Object.values(lock).includes(id));
    const memo = new Map();
    const best = (i, mask) => {
      if (i === posList.length) return { score:-300 * (players.length - bitCount(mask)), pick:[] };
      const key = i + ':' + mask;
      if (memo.has(key)) return memo.get(key);
      const pos = posList[i];
      let out = best(i + 1, mask); out = { score:out.score - 500, pick:[null, ...out.pick] };
      players.forEach((id, j) => {
        if (mask & (1 << j)) return;
        let sc = prefScore(id, pos, played[id] && played[id][pos]);
        if (sc === null) return;
        sc -= changeCost(id, pos, hist);
        const rest = best(i + 1, mask | (1 << j));
        const total = rest.score + sc + rng() * 0.01;
        if (total > out.score) out = { score:total, pick:[id, ...rest.pick] };
      });
      memo.set(key, out);
      return out;
    };
    const r = best(0, 0);
    const plan = { ...lock };
    posList.forEach((pos, i) => { if (r.pick[i]) plan[pos] = r.pick[i]; });
    return { plan, score:r.score };
  };
  const bitCount = m => { let c = 0; while (m){ c += m & 1; m >>= 1; } return c; };

  const candidates = [];
  const seen = new Set();
  for (let t = 0; t < 60; t++){
    const pick = tryFill(t < 45);
    if (!pick) continue;
    const plan = {}, played = {}, hist = {};
    let score = 0;
    for (let p = 1; p <= P; p++){
      const on = ids.filter(id => pick[id].includes(p));
      const r = placeQuarter(on, fixed[p], played, hist);
      plan[p] = r.plan; score += r.score;
      Object.entries(r.plan).forEach(([pos, id]) => {
        (played[id] = played[id] || {})[pos] = ((played[id] || {})[pos] || 0) + 1;
        const h = hist[id] = hist[id] || { last:null, changes:0 };
        // Fixed (kept) positions count too, but aren't scored by placeQuarter.
        if (h.last && h.last !== pos){ if (h.changes >= 1 && fixed[p][pos] === id) score -= CHANGE_COST; h.changes++; }
        h.last = pos;
      });
    }
    ids.forEach(id => { if (benchRun(pick[id]) && pick[id].length) score -= 1000; });
    const sig = JSON.stringify(plan);
    if (seen.has(sig)) continue;
    seen.add(sig);
    candidates.push({ plan, score });
  }
  if (!candidates.length) return { error:"Couldn't make a lineup that fits. Try keeping fewer of the existing positions." };
  candidates.sort((a, b) => b.score - a.score);
  const chosen = candidates[(opts.alt || 0) % Math.min(5, candidates.length)];

  // Notes on anything it couldn't do.
  // Court time made uneven by a lack of shooters: flagged in the preview
  // so the coach can fix it by hand.
  const shift = ids.map(id => ({ id, d:q[id] - fairQ[id] })).filter(x => x.d);
  const uneven = shift.length ? { up:shift.filter(x => x.d > 0), down:shift.filter(x => x.d < 0), shooters:shooters.length, fairQ } : null;
  // Not enough shooters: who fills in at GS or GA, flagged for the coach.
  const fillIns = [];
  for (let p = 1; p <= P; p++) SHOOTERS_POS.forEach(pos => { const id = chosen.plan[p][pos]; if (id && !canShoot(id)) fillIns.push({ p, pos, id }); });
  const shortShooters = fillIns.length ? { shooters:shooters.length, fillIns } : null;
  for (let p = 1; p <= P; p++){
    const empty = open.filter(pos => !chosen.plan[p][pos]);
    if (empty.length) notes.push(`${periodName(g, p)}: ${empty.join(', ')} left empty.`);
  }
  if (K < 7) notes.push(`Only ${N} playing, so ${EMPTY_FIRST.slice(0, 7 - K).join(', ')} ${7 - K === 1 ? 'is' : 'are'} left empty.`);
  ids.forEach(id => {
    const onQ = []; for (let p = 1; p <= P; p++) if (Object.values(chosen.plan[p]).includes(id)) onQ.push(p);
    if (onQ.length && onQ.length < P && benchRun(onQ)) notes.push(`${playerName(id)} sits out two ${periodNoun(g, true)} in a row (it couldn't be avoided).`);
  });
  return { plan:chosen.plan, ids, P, pm, tot, games, notes, uneven, shortShooters, count:candidates.length };
}

// The whole game at a glance: each player's position in every quarter
// (– on the bench). Coloured bibs are preferred positions (or the player
// hasn't chosen any); grey ones aren't. Used in the Fill lineup preview and
// on the Lineup tab.
//   opts.lineupOf(p)  the lineup for quarter p
//   opts.ids          players to list (in order)
//   opts.avg          { tot, games, pm, thisMs? } to show season average minutes after this
//                     game: earlier finished games plus this one (thisMs(id), or quarters x length)
//   opts.tap(p)       true if quarter p's cells can be tapped for a suggested change
//   opts.drag         cells can be dragged to swap, but not tapped (the Fill lineup preview)
//   opts.shift(id)    + / − quarters to tag (Fill lineup's uneven warning)
//   opts.current      the quarter shown on the court (highlighted; headings switch quarter)
// Players filling in at GS or GA who didn't choose a shooting position.
function fillInWarnHtml(g, fillIns, shooters){
  if (!fillIns.length) return '';
  const byPlayer = {};
  fillIns.forEach(f => { (byPlayer[f.id] = byPlayer[f.id] || []).push(`${f.pos} in ${periodName(g, f.p)}`); });
  const list = Object.entries(byPlayer).map(([id, w]) => `<b>${escapeHtml(playerName(id))}</b> (${w.join(', ')})`).join('; ');

}
// Fill-ins in the saved lineup, for quarters still to come.
function lineupFillIns(g){
  const out = [];
  const canShoot = id => playerPrefs(CUR.players.find(x => x.id === id)).some(pos => SHOOTERS_POS.includes(pos));
  for (let p = 1; p <= periodCount(g); p++){
    if (periodStarted(g, p)) continue;
    const l = lineupFor(g, p);
    SHOOTERS_POS.forEach(pos => { if (l[pos] && !canShoot(l[pos])) out.push({ p, pos, id:l[pos] }); });
  }
  return out;
}
