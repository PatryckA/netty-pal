/* ---------------------------------------------------------------------
   Fixture import. Reads a pasted draw, a PDF or a spreadsheet (CSV) into
   rows to check before saving. Competition draws usually list every game
   in the division, so only games involving our team are kept.
--------------------------------------------------------------------- */
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
const WEEKDAY_RE = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)\b\.?,?/gi;
const VS_RE = /\s+(?:vs?\.?|versus|v\/s)\s+/i;
// Cell breaks: a pipe, tab, two or more spaces, a spaced hyphen or en dash, or a comma.
const CELL_SPLIT = /\s*(?:\||\t| {2,}| - | – |, )\s*/;
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.296/build/pdf.min.mjs';
const PDFJS_WORKER_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.296/build/pdf.worker.min.mjs';

function nameKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

// A day and month with no year: the year in the season's name (e.g.
// "Winter 2027") if it has one, otherwise this year, or next year if that
// date has already passed by more than a month.
function seasonYear(){
  const m = `${(CUR.season && CUR.season.name) || ''} ${(CUR.season && CUR.season.competition) || ''}`.match(/\b(20\d\d)\b/);
  return m ? +m[1] : 0;
}
function isoDate(y, m, d){
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  if (!y) y = seasonYear();
  if (!y){
    const now = new Date();
    y = now.getFullYear();
    if (new Date(y, m - 1, d) < new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30)) y++;
  } else if (y < 100) y += 2000;
  return `${y}-${pad2(m)}-${pad2(d)}`;
}

// Finds a date in the text; returns { iso, match } or null.
function findDate(text){
  let m;
  if ((m = text.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/))) return { iso:isoDate(+m[1], +m[2], +m[3]), match:m[0] };
  // (Not preceded by ":" or ".", so a time like "9:30 May Park" isn't read as 30 May.)
  if ((m = text.match(new RegExp(`(?<![:.\\d])\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+${MONTH_RE}(?:,?\\s+(\\d{4}))?`, 'i'))))
    return { iso:isoDate(m[3] ? +m[3] : 0, MONTHS.indexOf(m[2].toLowerCase()) + 1, +m[1]), match:m[0] };
  if ((m = text.match(new RegExp(`\\b${MONTH_RE}\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b`, 'i'))))
    return { iso:isoDate(m[3] ? +m[3] : 0, MONTHS.indexOf(m[1].toLowerCase()) + 1, +m[2]), match:m[0] };
  // Australian day/month order.
  if ((m = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) return { iso:isoDate(m[3] ? +m[3] : 0, +m[2], +m[1]), match:m[0] };
  if ((m = text.match(/\b(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})\b/))) return { iso:isoDate(+m[3], +m[2], +m[1]), match:m[0] };
  return null;
}

// Finds a time; returns { hhmm, match } or null. Without am/pm, times
// before 8 are taken as afternoon (junior netball rarely starts before 8am).
function findTime(text){
  let m = text.match(/\b(\d{1,2})[:.](\d{2})\s*(a\.?m\.?|p\.?m\.?)?(?![\d/])/i);
  let h, min, ap;
  if (m){ h = +m[1]; min = +m[2]; ap = m[3]; }
  else if ((m = text.match(/\b(\d{1,2})\s*(a\.?m\.?|p\.?m\.?)(?![a-z])/i))){ h = +m[1]; min = 0; ap = m[2]; }
  else return null;
  if (h > 23 || min > 59) return null;
  const pm = ap && /p/i.test(ap), am = ap && /a/i.test(ap);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!ap && h >= 1 && h < 8) h += 12;
  return { hhmm:`${pad2(h)}:${pad2(min)}`, match:m[0] };
}

// Reads one line of a draw. Matched pieces are cut out and replaced with a
// cell break, so what's left splits cleanly into team names and venue.
function parseFixtureLine(raw){
  let text = ' ' + raw.replace(/ /g, ' ') + ' ';
  const cut = (s) => { text = text.replace(s, ' | '); };
  const out = { date:'', time:'', round:'', court:'', venue:'', home:'', away:'', bye:/\bbye\b/i.test(raw) };
  const d = findDate(text); if (d && d.iso){ out.date = d.iso; cut(d.match); }
  text = text.replace(WEEKDAY_RE, ' | ');
  let m = text.match(/\b(?:round|rnd|rd|week|wk)\s*\.?\s*(\d{1,2})\b/i) || text.match(/\bR(\d{1,2})\b/);
  if (m){ out.round = m[1]; cut(m[0]); }
  const t = findTime(text); if (t){ out.time = t.hhmm; cut(t.match); }
  m = text.match(/\b(?:court|ct)\s*\.?\s*#?\s*([a-z]?\d{1,2}[a-z]?)\b/i);
  if (m){ out.court = 'Court ' + m[1].toUpperCase(); cut(m[0]); }
  m = text.match(/\bvenue\s*:\s*([^|]+)/i);
  if (m){ out.venue = m[1].trim(); cut(m[0]); }
  const vs = text.match(VS_RE);
  if (vs){
    const left = text.slice(0, vs.index).split(CELL_SPLIT).map(s => s.trim()).filter(Boolean);
    const right = text.slice(vs.index + vs[0].length).split(CELL_SPLIT).map(s => s.trim()).filter(Boolean);
    out.home = left.pop() || '';
    out.away = right.shift() || '';
    const rest = [...left, ...right].filter(s => /[a-z]{3,}/i.test(s));
    if (!out.venue && rest.length) out.venue = rest.join(', ');
  }
  return out;
}

// Splits a CSV or tab-separated line, respecting "quoted, cells".
function splitDelimited(line, delim){
  const cells = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (c === '"'){ if (q && line[i + 1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if (c === delim && !q){ cells.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  cells.push(cur.trim());
  return cells;
}

// A table with a header row (Date, Time, Home, Away, ...), from a
// spreadsheet (commas or tabs) or a PDF table (cells joined with " | ").
// The header can come after title lines. Returns null if there isn't one.
function tableDelim(line){
  if (line.includes('\t')) return '\t';
  if (line.includes(' | ')) return '|';
  return line.includes(',') ? ',' : null;
}
function tableColumns(line){
  const delim = tableDelim(line);
  if (!delim) return null;
  const head = splitDelimited(line, delim).map(h => h.toLowerCase().trim());
  if (head.length < 3) return null;
  const col = (re) => head.findIndex(h => re.test(h));
  const c = { date:col(/^(date|day)/), time:col(/time|start/), round:col(/^(round|rnd|rd|week|wk)\b/), court:col(/^(court|ct)\b/),
    venue:col(/venue|location|ground|field/), home:col(/home/), away:col(/away|visitor/),
    opp:col(/opponent|opposition|against/), match:col(/match|game|fixture|teams/) };
  const known = Object.values(c).filter(i => i >= 0).length;
  if (known < 3 || (c.home < 0 && c.opp < 0 && c.match < 0)) return null;
  return { delim, c, headKey:nameKey(line) };
}
function parseFixtureTable(lines){
  const at = lines.findIndex(l => tableColumns(l));
  if (at < 0) return null;
  const { delim, c, headKey } = tableColumns(lines[at]);
  return lines.slice(at + 1).filter(l => nameKey(l) !== headKey).map(line => {
    const cells = splitDelimited(line, delim);
    const get = (i) => (i >= 0 ? cells[i] || '' : '');
    // A "v" printed between the team names can end up stuck to one of them.
    const team = (i) => get(i).replace(/^(?:vs?\.?|versus)\s+|\s+(?:vs?\.?|versus)$/i, '').trim();
    const d = findDate(get(c.date)), t = findTime(get(c.time));
    const court = get(c.court);
    const row = { date:d ? d.iso : '', time:t ? t.hhmm : '', round:(get(c.round).match(/\d+/) || [''])[0],
      court:court ? (/court/i.test(court) ? court : 'Court ' + court) : '',
      venue:get(c.venue), home:team(c.home), away:team(c.away), bye:/\bbye\b/i.test(line), opponent:team(c.opp) };
    if (!row.home && c.match >= 0){
      const parts = get(c.match).split(VS_RE);
      if (parts.length === 2){ row.home = parts[0].trim(); row.away = parts[1].trim(); }
    }
    return row;
  });
}

// Turns the whole draw into our games. Returns { rows, teams, total, byes }.
function parseFixtures(text, ourName){
  const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const games = [];
  let byes = 0;
  const ourKey = nameKey(ourName);
  const isUs = (name) => {
    const k = nameKey(name);
    return !!k && !!ourKey && (k === ourKey || (k.length >= 3 && (k.includes(ourKey) || ourKey.includes(k))));
  };
  const table = lines.length > 1 ? parseFixtureTable(lines) : null;
  if (table){
    // Tables sometimes show the round, date or venue only once per group.
    const last = { date:'', round:'', venue:'' };
    table.forEach(r => {
      ['date', 'round', 'venue'].forEach(k => { if (r[k]) last[k] = r[k]; else r[k] = last[k]; });
      if (r.bye){ if (isUs(r.home) || isUs(r.away) || isUs(r.opponent)) byes++; return; }
      if (r.opponent) games.push({ ...r, home:ourName, away:r.opponent });
      else if (r.home && r.away) games.push(r);
    });
  } else {
    // Headings like "Round 3, Saturday 10 May" apply to the games under them.
    const ctx = { date:'', round:'', venue:'' };
    lines.forEach(line => {
      const p = parseFixtureLine(line);
      if (!p.home || !p.away){
        if (p.bye && isUs(line)) byes++;
        if (p.date) ctx.date = p.date;
        if (p.round) ctx.round = p.round;
        if (p.venue) ctx.venue = p.venue;
        return;
      }
      games.push({ ...p, date:p.date || ctx.date, round:p.round || ctx.round, venue:p.venue || ctx.venue });
    });
  }
  const teams = new Set();
  games.forEach(g => { teams.add(g.home); teams.add(g.away); });
  const rows = games.filter(g => isUs(g.home) || isUs(g.away)).map(g => {
    const opponent = isUs(g.home) ? g.away : g.home;
    const dup = CUR.games.some(x => x.date && x.date === g.date && nameKey(x.opponent) === nameKey(opponent));
    return { round:g.round, date:g.date, time:g.time, court:g.court, venue:g.venue, opponent, dup };
  });
  return { rows, teams:Array.from(teams).filter(Boolean).sort(), total:games.length, byes };
}

// Reads a PDF's text in the browser with PDF.js (loaded only when needed).
// Text is grouped into lines by height on the page. If a row of column
// headings is found (Date, Time, Home, Away...), each later line is split
// into those columns by where the text sits, so blank cells stay blank.
// Otherwise gaps between words become cell breaks.
const HEADING_RE = /^(date|day|time|start|round|rnd|rd|court|ct|venue|location|home|away|visitor|opponent|match|game|teams?)$/i;
async function pdfToText(file){
  const pdfjs = await import(PDFJS_URL);
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
  const pdf = await pdfjs.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  let columns = null; // x positions of the column headings, carried across pages
  for (let i = 1; i <= pdf.numPages; i++){
    const content = await (await pdf.getPage(i)).getTextContent();
    const rows = [];
    content.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row){ row = { y, items:[] }; rows.push(row); }
      row.items.push({ x, w:it.width || 0, s:it.str.trim() });
    });
    rows.sort((a,b) => b.y - a.y).forEach(r => {
      r.items.sort((a,b) => a.x - b.x);
      const headings = r.items.filter(it => HEADING_RE.test(it.s)).length;
      if (headings >= 3 && headings >= r.items.length - 1){
        columns = r.items.map(it => it.x);
        out.push(r.items.map(it => it.s).join(' | '));
        return;
      }
      if (columns){
        const cells = columns.map(() => []);
        r.items.forEach(it => {
          let c = 0;
          columns.forEach((x, k) => { if (it.x >= x - 4) c = k; });
          cells[c].push(it.s);
        });
        out.push(cells.map(parts => parts.join(' ')).join(' | '));
        return;
      }
      let line = '', end = null;
      r.items.forEach(it => {
        if (end !== null){ const gap = it.x - end; line += gap > 6 ? ' | ' : ' '; }
        line += it.s;
        end = it.x + it.w;
      });
      out.push(line.trim());
    });
  }
  return out.join('\n');
}

async function readImportFile(file){
  if (!file) return;
  const teamEl = document.getElementById('imp-team');
  if (teamEl) UI.importTeam = teamEl.value.trim();
  UI.importBusy = 'Reading ' + file.name + '…';
  render();
  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    UI.importText = isPdf ? await pdfToText(file) : await file.text();
    UI.importBusy = null;
    runImport(true);
  } catch (err){
    console.warn('Netty Pal: import file', err);
    UI.importBusy = null;
    toast("Couldn't read that file. Try copying the text from it and pasting it instead.", true);
    render();
  }
}

// fromFile: the text has just been read from an upload, rather than typed.
function runImport(fromFile){
  const teamEl = document.getElementById('imp-team');
  if (teamEl) UI.importTeam = teamEl.value.trim();

    const textEl = document.getElementById('imp-text');
    if (textEl) UI.importText = textEl.value;

  if (!String(UI.importText || '').trim()){ toast('Paste the fixture or choose a file first.', true); return; }
  UI.importResult = parseFixtures(UI.importText, UI.importTeam || CUR.team.name);
  render();
  window.scrollTo(0, 0);
}

async function saveImport(fd){
  const rows = UI.importResult ? UI.importResult.rows : [];
  const batch = writeBatch(db);
  let n = 0;
  fd.getAll('inc').map(Number).forEach(i => {
    if (!rows[i]) return;
    const opponent = String(fd.get(`opponent-${i}`) || '').trim();
    if (!opponent) return;
    batch.set(doc(collection(seasonRef(), 'games')), {
      round:String(fd.get(`round-${i}`) || '').trim(), opponent,
      date:String(fd.get(`date-${i}`) || ''), time:String(fd.get(`time-${i}`) || ''),
      venue:String(fd.get(`venue-${i}`) || '').trim(), court:String(fd.get(`court-${i}`) || '').trim(),
      format:CUR.season.format || 'quarters', periodMinutes:CUR.season.periodMinutes || DEFAULT_PERIOD_MINUTES,

    });

  closeImport();
  toast(`${n} fixture${n === 1 ? '' : 's'} added.`);
}

/* ---- Live game ---- */
function eventsRef(gameId){ return collection(gameRef(gameId), 'events'); }

// Keeps the open game's events up to date. Called from renderGame, so it
// only starts a new listener when a different game is opened.
function watchEvents(gameId){
  if (CUR.eventsFor === gameId) return;
  stopEvents();
  CUR.eventsFor = gameId;
  CUR.loaded.events = false;
  CUR.eventsError = null;
  if (gameId === PRACTICE_ID){
    CUR.events = PRACTICE ? PRACTICE.events : [];
    CUR.loaded.events = true;
    return;
  }
  CUR.eventsUnsub = onSnapshot(eventsRef(gameId), (snap) => {
    if (CUR.eventsFor !== gameId) return;
    CUR.events = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.events = true;
    CUR.eventsError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: events listener', err);
    CUR.eventsError = err;
    render();
  });
}
function stopEvents(){
  if (CUR.eventsUnsub) CUR.eventsUnsub();
  CUR.eventsUnsub = null; CUR.eventsFor = null; CUR.events = [];
  if (CUR.loaded) CUR.loaded.events = false;
}

function newEvent(fields){ return { ...fields, by:USER.uid, at:Date.now() }; }

// Writes events (and optionally game changes) together in one go.
async function writeGame(g, events, gameUpdates){
  const batch = writeBatch(db);
  events.forEach(ev => batch.set(doc(eventsRef(g.id)), ev));
  if (gameUpdates) batch.update(gameRef(g.id), gameUpdates);
  // Anything new means there's nothing to redo. Cleared before saving, since
  // the screen redraws as soon as the change lands.
  if (events.length) redoStack = [];
  await batch.commit();
}

// The lineup a period starts with, minus anyone not playing. A period with
// its own plan uses it. Otherwise it carries on from whoever was on court
// at the end of the previous period (so substitutions carry forward too),
// or from the plan before the game has started.
function startLineup(g, p){
  const avail = new Set(availableIds(g));
  let base = planFor(g, p);
  if (p > 1 && !ownPlan(g, p) && g.live && g.live.period === p - 1){
    const st = computeGame(g, CUR.events);
    if (st.lineup) base = st.lineup;
  }
  const lineup = {};
  POSITIONS.forEach(pos => { if (base[pos] && avail.has(base[pos])) lineup[pos] = base[pos]; });
  return lineup;
}

async function startGame(g, firstCentre){
  await writeGame(g, [newEvent({ type:'lineup', period:1, t:0, lineup:startLineup(g, 1), start:true })], {
    status:'live', scorerUid:USER.uid, scorerName:memberProfile().name,
    live:{ period:1, phase:'running', startedAt:Date.now(), elapsedMs:0, firstCentre }
  });
}

async function startNextPeriod(g){
  const p = g.live.period + 1;
  await writeGame(g, [newEvent({ type:'lineup', period:p, t:0, lineup:startLineup(g, p), start:true })], {
    'live.period':p, 'live.phase':'running', 'live.startedAt':Date.now(), 'live.elapsedMs':0
  });
}

async function pauseClock(g){
  await updateDoc(gameRef(g.id), { 'live.phase':'paused', 'live.elapsedMs':elapsedMs(g), 'live.startedAt':null });
}
async function resumeClock(g){
  await updateDoc(gameRef(g.id), { 'live.phase':'running', 'live.startedAt':Date.now() });
}

async function endPeriod(g){
  const t = elapsedMs(g);
  const ev = newEvent({ type:'periodEnd', period:g.live.period, t });
  const after = { ...g, live:{ ...g.live, phase:'ended', elapsedMs:t, startedAt:null } };
  await writeGame(g, [ev], { 'live.phase':'ended', 'live.elapsedMs':t, 'live.startedAt':null,
    summary:gameSummary(after, [...CUR.events, ev]) });
}

// A short buzz to confirm something was logged. (Android phones vibrate;
// iPhones don't let web apps vibrate, so nothing happens there.)
function buzz(){ try { if (navigator.vibrate) navigator.vibrate(40); } catch(e){} }

async function recordStat(g, pos, type){
  const st = computeGame(g, CUR.events);
  const pid = st.lineup && st.lineup[pos];
  if (!pid) return;
  await writeGame(g, [newEvent({ type, pos, playerId:pid, period:g.live.period, t:elapsedMs(g) })]);
  buzz();
}

// The other team's goals are recorded without a position. (Older games
// may have a pos of GS or GA, or opposition misses; those still display.)
async function recordOpp(g, type, pos){
  const fields = { type, period:g.live.period, t:elapsedMs(g) };
  if (pos === 'GS' || pos === 'GA') fields.pos = pos;
  await writeGame(g, [newEvent(fields)]);
  buzz();
}

// Records "goal" or "miss" for either side, from either scoring mode.
async function recordShot(g, side, pos, stat){
  if (side === 'them') await recordOpp(g, stat === 'goal' ? 'oppGoal' : 'oppMiss', pos);
  else await recordStat(g, pos, stat);
}

/* ---------------------------------------------------------------------
   Voice scoring (beta). Push-to-talk: the scorer taps the mic and says a
   short phrase like "GS goal", "their miss" or "undo". Uses the phone
   browser's built-in speech recognition (Chrome on Android, Safari on
   iPhone), which sends the audio to Google or Apple to turn into text.
   Nothing is recorded or stored by Netty Pal.
--------------------------------------------------------------------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRec = null;
function voiceSupported(){ return !!SpeechRec; }

// Turns what was heard into { side, pos, stat }, { undo:true } or { error }.
// pos is 'GS' or 'GA', or '' for an opposition shot with no position.
function parseVoice(g, heard, lineup){
  let t = ' ' + String(heard || '').toLowerCase().replace(/[.,!?'"-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  if (/\b(undo|scratch that|cancel that|delete that|take that back)\b/.test(t)) return { undo:true };

  // Which side: words for the other team, or their name.
  const oppWords = nameKey(g.opponent).split(' ').filter(w => w.length >= 3 && !['the', 'team', 'netball', 'club'].includes(w));
  let side = 'us';
  if (/\b(their|theirs|them|they|opposition|opponents?|other team|away|visitors?)\b/.test(t)
    || oppWords.some(w => new RegExp(`\\b${w}\\b`).test(t))) side = 'them';

  // Position, checked before the event, since "goal shooter" contains "goal".
  let pos = null;
  const posRules = [
    ['GS', /\b(goal shooter|shooter|g ?s|gee ess|gs)\b/],
    ['GA', /\b(goal attack|g ?a|gee ay|ga)\b/]
  ];
  for (const [p, re] of posRules){
    const m = t.match(re);
    if (m){ pos = p; t = t.replace(m[0], ' '); break; }
  }
  // Or one of our shooters by name ("Rianne goal").
  if (!pos && side === 'us'){
    for (const p of SHOOTERS){
      const first = nameKey(lineup[p] ? playerName(lineup[p]) : '').split(' ')[0];
      if (first && first.length >= 2 && new RegExp(`\\b${first}\\b`).test(t)){ pos = p; t = t.replace(new RegExp(`\\b${first}\\b`), ' '); break; }
    }
  }
  if (!pos && /\b(wing attack|wing defen[cs]e|centre|center|goal defen[cs]e|goal ?keeper|keeper|w a|w d|g d|g k|wa|wd|gd|gk)\b/.test(t))
    return { error:'Only GS and GA can shoot.' };

  let stat = null;
  if (/\b(miss|missed|misses|missing|no goal|off target)\b/.test(t)) stat = 'miss';
  else if (/\b(goal|goals|scored|scores|score|in)\b/.test(t)) stat = 'goal';
  if (!stat) return { error:'Say "goal" or "miss".' };
  // The other team's shots are recorded without a position.
  if (side === 'them') return { side, pos:'', stat };
  if (!pos) return { error:'Say who: "GS goal" or "GA miss".' };
  return { side, pos, stat };
}

function voiceErrorText(code){
  if (code === 'not-allowed' || code === 'service-not-allowed')
    return "Voice isn't allowed yet. Allow the microphone when asked. On iPhone, also turn on Settings > General > Keyboard > Enable Dictation. If it still won't work from the home screen icon, open Netty Pal in Safari.";
  if (code === 'network') return 'Voice needs an internet connection.';
  if (code === 'audio-capture') return "Couldn't use the microphone.";
  if (code === 'no-speech') return "Didn't hear anything. Tap the mic and try again.";
  if (code === 'language-not-supported') return "Voice isn't available in this language on this phone.";
  return "Voice didn't work that time. Try again, or tap instead.";
}

// Tap the mic to listen; tap again to stop. Listening ends by itself after
// one phrase.
function toggleVoice(){
  if (voiceRec){ try { voiceRec.stop(); } catch(e){} return; }
  const g = findGame(UI.gameId);
  if (!g || !isInPlay(g) || !amScorer(g) || !SpeechRec) return;
  const rec = new SpeechRec();
  rec.lang = 'en-AU';
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 5;
  let done = false;
  rec.onresult = (e) => {
    done = true;
    const alts = Array.from((e.results && e.results[0]) || []).map(a => a.transcript).filter(Boolean);
    handleVoice(alts).catch(fail);
  };
  rec.onerror = (e) => {
    done = true;
    if (e.error !== 'aborted') toast(voiceErrorText(e.error), true);
  };
  rec.onend = () => {
    voiceRec = null; UI.voiceListening = false; render();
    if (!done) toast(voiceErrorText('no-speech'), true);
  };
  voiceRec = rec;
  UI.voiceListening = true;
  render();
  try { rec.start(); }
  catch (err){ voiceRec = null; UI.voiceListening = false; render(); toast(voiceErrorText(err && err.name), true); }
}

// Tries each of the recogniser's guesses until one makes sense.
async function handleVoice(alts){
  const g = findGame(UI.gameId);
  if (!g || !isInPlay(g)) return;
  const lineup = computeGame(g, CUR.events).lineup || {};
  let heard = alts[0] || '';
  let parsed = null, error = null;
  for (const a of alts){
    const p = parseVoice(g, a, lineup);
    if (!p.error){ parsed = p; heard = a; break; }
    if (!error) error = p.error;
  }
  if (!parsed){ toast(`Heard "${heard}". ${error || "Didn't understand."}`, true); return; }
  if (parsed.undo){ await undoLast(); return; }
  if (parsed.side === 'us' && !lineup[parsed.pos]){ toast(`Heard "${heard}", but nobody is playing ${parsed.pos}.`, true); return; }
  await recordShot(g, parsed.side, parsed.pos, parsed.stat);
  const what = parsed.stat === 'goal' ? 'Goal' : 'Miss';
  const who = parsed.side === 'them'
    ? `${teamLabel(g, 'them')}${parsed.pos ? ' ' + parsed.pos : ''}`
    : `${playerName(lineup[parsed.pos])} (${parsed.pos})`;
  toast(`Heard "${heard}": ${what}, ${who}`);
}

function micSvg(){
  return `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
    <path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

async function swapCentre(g){
  const st = computeGame(g, CUR.events);
  await writeGame(g, [newEvent({ type:'centre', team:otherTeam(st.centre || 'us'), period:g.live.period, t:elapsedMs(g) })]);
}

// A substitution during play: same swap rules as the planner.
async function setLiveSlot(g, pos, pid){
  const st = computeGame(g, CUR.events);
  const next = { ...(st.lineup || {}) };
  if (pid){
    const from = POSITIONS.find(other => other !== pos && next[other] === pid);
    if (from){ if (next[pos]) next[from] = next[pos]; else delete next[from]; }
    next[pos] = pid;
  } else {
    delete next[pos];
  }
  await writeGame(g, [newEvent({ type:'lineup', lineup:next, period:g.live.period, t:elapsedMs(g) })]);
}

// Undo marks the scorer's last action as undone; Redo brings back the most
// recently undone one. Recording anything new clears the Redo list.
let redoStack = [];
// The Redo list is updated before saving, so the buttons are right when the
// screen redraws; if saving fails the change to the list is put back.
async function undoLast(){
  const e = lastUndoable();
  if (!e) return;
  redoStack.push(e.id);
  try { await updateDoc(doc(eventsRef(UI.gameId), e.id), { undone:true }); }
  catch (err){ redoStack.pop(); throw err; }
  toast('Undone: ' + eventText(findGame(UI.gameId), e));
}
async function redoLast(){
  const id = redoStack.pop();
  const e = id && CUR.events.find(x => x.id === id);
  if (!e) return;
  try { await updateDoc(doc(eventsRef(UI.gameId), id), { undone:false }); }
  catch (err){ redoStack.push(id); throw err; }
  toast('Redone: ' + eventText(findGame(UI.gameId), e));
}

async function takeOverScoring(g){
  await updateDoc(gameRef(g.id), { scorerUid:USER.uid, scorerName:memberProfile().name });
  toast("You're now scoring this game.");
}

async function finaliseGame(g){
  await updateDoc(gameRef(g.id), { status:'final', summary:gameSummary(g, CUR.events) });
  toast('Game finalised.');
}

async function unlockGame(g){
  await updateDoc(gameRef(g.id), { status:'live' });
  toast('Unlocked. Finalise again when you\'re done.');
}

// Corrections at full time. Each one also refreshes the saved summary.
async function correctEvent(g, eventId, changes){
  const events = CUR.events.map(e => e.id === eventId ? { ...e, ...changes } : e);
  const batch = writeBatch(db);
  batch.update(doc(eventsRef(g.id), eventId), changes);
  batch.update(gameRef(g.id), { summary:gameSummary(g, events) });
  await batch.commit();
}

async function addCorrection(g, fd){
  const period = parseInt(fd.get('period'), 10) || 1;
  const who = String(fd.get('who') || '');
  let type = String(fd.get('stat') || '');
  if (who === 'opp'){
    type = type === 'goal' ? 'oppGoal' : 'oppMiss';
  }
  // Added at the end of the period, since the exact moment isn't known.
  const endEv = CUR.events.find(e => !e.undone && e.type === 'periodEnd' && e.period === period);
  const fields = { type, period, t:endEv ? endEv.t : periodMs(g) };
  if (who !== 'opp') fields.playerId = who;
  const ev = newEvent(fields);
  await writeGame(g, [ev], { summary:gameSummary(g, [...CUR.events, ev]) });
  toast('Added.');
}

/* ---------------------------------------------------------------------
   Event wiring
--------------------------------------------------------------------- */
async function runBusy(fn){
  if (UI.busy) return;
  UI.busy = true; render();
  try { await fn(); } catch (err){ fail(err); }
  finally { UI.busy = false; render(); }
}

document.addEventListener('click', async (e) => {
  // Ignore the click that follows a drag or a long press.
  if (Date.now() < swallowClickUntil){ swallowClickUntil = 0; e.preventDefault(); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  try {
    if (a === 'sign-in'){
      await signInWithPopup(auth, new GoogleAuthProvider());
    } else if (a === 'sign-in-facebook'){
      await signInWithPopup(auth, new FacebookAuthProvider());
    } else if (a === 'sign-in-email'){
      UI.signin = 'email'; render();
      const f = document.getElementById('si-email'); if (f) f.focus();
    } else if (a === 'copy-link'){
      try { await navigator.clipboard.writeText(location.href); toast('Link copied. Paste it into Chrome or Safari.'); }
      catch (err){ toast("Couldn't copy. Use the ⋯ menu to open in your browser instead.", true); }
    } else if (a === 'signin-back'){
      UI.signin = null; render();
    } else if (a === 'sign-out'){
      closeSeason();
      await signOut(auth);
    } else if (a === 'show-form'){
      UI.form = btn.dataset.formName; render();
      const first = document.querySelector('#app form input:not([type=hidden])');
      if (first) first.focus();
    } else if (a === 'close-form'){
      UI.form = null; render();
    } else if (a === 'open-season'){
      openSeason(btn.dataset.team, btn.dataset.season);
    } else if (a === 'go-home'){
      goHome();
    } else if (a === 'reload-home'){
      loadHome();
    } else if (a === 'share-summary'){
      const g = findGame(UI.gameId); if (g) await shareSummary(g);
    } else if (a === 'reload-stats'){
      CUR.seasonEvents = null; loadSeasonEvents(true); render();
    } else if (a === 'import-open'){
      closeImport(); UI.form = 'import'; render();
    } else if (a === 'import-cancel'){
      closeImport(); render();
    } else if (a === 'import-read'){
      runImport(false);
    } else if (a === 'import-back'){
      UI.importResult = null; render();
    } else if (a === 'import-pick-team'){
      UI.importTeam = btn.dataset.team;
      UI.importResult = parseFixtures(UI.importText, UI.importTeam);
      render();
    } else if (a === 'accept-invite'){
      const inv = HOME.invite;
      if (!inv) return;
      if (inv.already){ clearInvite(); openSeason(inv.teamId, inv.seasonId); return; }
      await runBusy(async () => { await joinByCode(inv.code); clearInvite(); });
    } else if (a === 'dismiss-invite'){

      lookupInvite();
    } else if (a === 'tab'){
      UI.tab = btn.dataset.tab; UI.form = null; saveNav(); render();
    } else if (a === 'toggle-player'){
      await togglePlayer(btn.dataset.player);
    } else if (a === 'toggle-role'){
      await toggleRole(btn.dataset.member, btn.dataset.role);
    } else if (a === 'remove-member'){
      const key = 'rm-' + btn.dataset.member;
      if (!isArmed(key)) return arm(key);
      disarm(key); await removeMember(btn.dataset.member);
    } else if (a === 'make-admin'){
      const key = 'admin-' + btn.dataset.member;
      if (!isArmed(key)) return arm(key);
      disarm(key); await makeAdmin(btn.dataset.member);
    } else if (a === 'leave-season'){
      if (!isArmed('leave')) return arm('leave');
      disarm('leave'); await leaveSeason();
    } else if (a === 'regen-code'){
      if (!isArmed('regen-code')) return arm('regen-code');
      disarm('regen-code'); await runBusy(regenerateCode);
    } else if (a === 'share-code'){
      await shareCode();
    } else if (a === 'open-game'){
      openGame(btn.dataset.game);
    } else if (a === 'back-to-games'){
      backToGames();
    } else if (a === 'game-tab'){
      UI.gameTab = btn.dataset.tab; UI.pickPos = null; UI.statPos = null; saveNav(); render();
    } else if (a === 'period'){
      UI.period = parseInt(btn.dataset.period, 10) || 1; UI.pickPos = null; UI.statPos = null; disarm('clear-period'); render();
    } else if (a === 'pick-pos'){
      UI.pickPos = btn.dataset.pos; UI.pickMode = 'plan'; UI.statPos = null; render();
      focusSheet();
    } else if (a === 'close-picker'){
      closePicker();
    } else if (a === 'pick-player'){
      const pos = UI.pickPos, mode = UI.pickMode;
      UI.pickPos = null; render();
      await assignSlot(pos, btn.dataset.player, mode);
      const token = document.querySelector(`.court-token[data-pos="${pos}"]`);
      if (token) token.focus();
    } else if (a === 'tile'){
      // Player first: a shooter opens Goal / Miss, anyone else a substitution.
      const g = findGame(UI.gameId);
      if (!g || !isInPlay(g)) return;
      const side = btn.dataset.side, pos = btn.dataset.pos || 'Team';
      if (amScorer(g) && (side === 'them' || SHOOTERS.includes(pos))){ UI.statPos = pos; UI.statSide = side; UI.pickPos = null; }
      else if (side === 'us'){ UI.pickPos = pos; UI.pickMode = 'live'; UI.statPos = null; }
      render(); focusSheet();
    } else if (a === 'stat-change-player'){
      UI.pickPos = UI.statPos; UI.pickMode = 'live'; UI.statPos = null; render(); focusSheet();
    } else if (a === 'record-stat'){
      const g = findGame(UI.gameId), pos = UI.statPos, side = UI.statSide || 'us';
      UI.statPos = null; render();
      if (g && pos && isInPlay(g)){
        await recordShot(g, side, pos === 'Team' ? '' : pos, btn.dataset.stat);
        const tile = document.querySelector(`.ptile[data-side="${side}"][data-pos="${pos === 'Team' ? '' : pos}"]`);
        if (tile) tile.focus();
      }
    } else if (a === 'live-mode'){
      setLiveMode(btn.dataset.mode);
    } else if (a === 'ef-event'){
      UI.pendingEvent = UI.pendingEvent === btn.dataset.stat ? null : btn.dataset.stat; render();
    } else if (a === 'ef-who'){
      // Goal/Miss first: the chosen Goal or Miss goes to whoever is tapped.
      const g = findGame(UI.gameId), stat = UI.pendingEvent;
      if (!g || !stat || !isInPlay(g)) return;
      UI.pendingEvent = null; render();
      await recordShot(g, btn.dataset.side, btn.dataset.pos, stat);
    } else if (a === 'voice'){
      toggleVoice();
    } else if (a === 'toggle-archived'){
      UI.showArchived = !UI.showArchived; render();
    } else if (a === 'toggle-live-stats'){
      UI.statsOpen[btn.dataset.game] = btn.dataset.open !== '1'; render();
    } else if (a === 'archive-ask'){
      UI.archiveAsk = btn.dataset.game; render();
    } else if (a === 'archive-cancel'){
      UI.archiveAsk = null; render();
    } else if (a === 'archive-confirm'){
      const g = findGame(btn.dataset.game);
      UI.archiveAsk = null; render();
      if (g) await setArchived(g, !g.archived);
    } else if (a === 'redo'){
      await redoLast();
    } else if (a === 'log-select'){
      UI.logSel = UI.logSel === btn.dataset.event ? null : btn.dataset.event; render();
    } else if (a === 'log-cancel'){
      UI.logSel = null; render();
    } else if (a === 'show-guide'){
      UI.showGuide = true; render();
      const close = document.querySelector('.sheet [data-action="close-guide"]');
      if (close) close.focus();
    } else if (a === 'close-guide'){
      closeGuide();
      const help = document.querySelector('[data-action="show-guide"]');
      if (help) help.focus();
    } else if (a === 'log-undo'){
      UI.logSel = null; render();
      await undoEvent(btn.dataset.event);
    } else if (a === 'swap-centre'){
      if (!isArmed('swap-centre')) return arm('swap-centre');
      disarm('swap-centre');
      const g = findGame(UI.gameId);
      if (g && isInPlay(g)) await swapCentre(g);
    } else if (a === 'sub-open'){
      UI.subSheet = true; UI.statPos = null; UI.pickPos = null; UI.pendingEvent = null; render(); focusSheet();
    } else if (a === 'sub-close'){
      UI.subSheet = false; render();
      const sub = document.querySelector('[data-action="sub-open"]');
      if (sub) sub.focus();
    } else if (a === 'sub-pos'){
      UI.subSheet = false; UI.pickPos = btn.dataset.pos; UI.pickMode = 'live'; UI.statPos = null; render(); focusSheet();
    } else if (a === 'start-practice'){
      startPractice();
    } else if (a === 'end-practice'){
      endPractice();
    } else if (a === 'show-tabs'){
      UI.showTabs = true; render();
    } else if (a === 'undo'){
      await undoLast();
    } else if (a === 'start-game'){
      const g = findGame(UI.gameId);
      const first = document.querySelector('input[name="firstCentre"]:checked');
      if (g) await runBusy(() => startGame(g, first ? first.value : 'us'));
    } else if (a === 'start-period'){
      const g = findGame(UI.gameId);
      UI.showTabs = false;
      if (g) await runBusy(() => startNextPeriod(g));
    } else if (a === 'pause-clock'){
      const g = findGame(UI.gameId); if (g) await pauseClock(g);
    } else if (a === 'resume-clock'){
      const g = findGame(UI.gameId); if (g) await resumeClock(g);
    } else if (a === 'end-period'){
      if (!isArmed('end-period')) return arm('end-period');
      disarm('end-period');
      const g = findGame(UI.gameId); if (g) await endPeriod(g);
    } else if (a === 'take-over'){
      if (!isArmed('take-over')) return arm('take-over');
      disarm('take-over');
      const g = findGame(UI.gameId); if (g) await takeOverScoring(g);
    } else if (a === 'finalise-game'){
      const g = findGame(UI.gameId); if (g) await runBusy(() => finaliseGame(g));
    } else if (a === 'unlock-game'){
      if (!isArmed('unlock-game')) return arm('unlock-game');
      disarm('unlock-game');
      const g = findGame(UI.gameId); if (g) await unlockGame(g);
    } else if (a === 'remove-event'){
      const key = 'rm-ev-' + btn.dataset.event;
      if (!isArmed(key)) return arm(key);
      disarm(key);
      const g = findGame(UI.gameId); if (g) await correctEvent(g, btn.dataset.event, { undone:true });
    } else if (a === 'clear-period'){
      if (!isArmed('clear-period')) return arm('clear-period');
      disarm('clear-period'); await clearPeriod();
    } else if (a === 'toggle-avail'){
      await toggleAvail(btn.dataset.player);
    } else if (a === 'avail-all'){
      await availAll();
    } else if (a === 'delete-game'){
      if (!isArmed('del-game')) return arm('del-game');
      disarm('del-game'); await deleteGame();
    }
  } catch (err){ fail(err); render(); }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const name = form.dataset.form;
  const done = () => { UI.form = null; };
  if (name === 'join') runBusy(async () => { await joinWithCode(fd); done(); });
  else if (name === 'create-team') runBusy(async () => { await createTeam(fd); done(); });
  else if (name === 'add-player') addPlayer(fd).catch(fail);
  else if (name === 'team-settings') saveTeamSettings(fd).catch(fail);
  else if (name === 'season-settings') saveSeasonSettings(fd).catch(fail);
  else if (name === 'new-season') runBusy(async () => { await createNewSeason(fd); done(); });
  else if (name === 'add-game') runBusy(async () => { await addGame(fd); done(); });
  else if (name === 'edit-game') runBusy(() => saveGame(fd));
  else if (name === 'import-save') runBusy(() => saveImport(fd));
  else if (name === 'email-signin') runBusy(() => sendEmailLink(fd));
  else if (name === 'email-confirm') runBusy(() => finishEmailLink(String(fd.get('email') || '').trim(), String(fd.get('name') || '').trim()));
  else if (name === 'add-correction'){ const g = findGame(UI.gameId); if (g) runBusy(() => addCorrection(g, fd)); }
});

// Player names save when the box loses focus (or Enter is pressed).
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('input[data-field="player-name"]')) renamePlayer(el.dataset.player, el.value).catch(fail);
  if (el.matches('input[data-field="import-file"]') && el.files && el.files[0]) readImportFile(el.files[0]);
  if (el.matches('input[data-field="fair-view"]')){ UI.fairView = el.value; render(); }
  if (el.matches('select[data-field="event-player"]')){
    const g = findGame(UI.gameId);
    if (g) correctEvent(g, el.dataset.event, { playerId:el.value }).catch(err => { fail(err); render(); });
  }
});
// Puts a player in a position (or empties it when pid is ''), in the right
// place: a substitution during play, the next period's lineup between
// periods, or the lineup plan otherwise. Once the game is under way, a
// later period's changes start from the lineup the Lineup tab shows (which
// carries on from who's on court), and periods that have started are only
// changed by substitutions.
async function assignSlot(pos, pid, mode){
  const g = findGame(UI.gameId);
  if (mode === 'live' && g && isInPlay(g)) return setLiveSlot(g, pos, pid);
  if (g && periodStarted(g, UI.period)) return;
  if (g && g.live && g.live.period) return setPlanSlot(pos, pid, lineupFor(g, UI.period));
  return setPlanSlot(pos, pid);
}

/* ---------------------------------------------------------------------
   Drag and drop on the lineup court. Works with a finger or a mouse:
   press on a player (on court or on the bench) and move; drop on a
   position to put them there (swapping with whoever is there), or on the
   bench to take them off. A plain tap still opens the picker.
--------------------------------------------------------------------- */
let drag = null;
// The tap that ends a drag or long press should not also count as a tap on
// whatever is under the finger. Only a click arriving straight after the
// finger lifts is ignored, so a missing click can never block a real tap.
let swallowClickUntil = 0, holdFired = false;
function swallowNextClick(){ swallowClickUntil = Date.now() + 400; }
function dropTarget(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const tok = el.closest('.court[data-dnd] .court-token[data-pos]');
  if (tok) return { el:tok, pos:tok.dataset.pos };
  const bench = el.closest('.bench-drop[data-dnd]');
  return bench ? { el:bench, bench:true } : null;
}
function endDrag(){
  if (drag && drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
  document.body.classList.remove('dragging');
  drag = null;
}
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const src = e.target.closest('.court[data-dnd] .court-token[data-pos], .bench-drop[data-dnd] .bench-chip[data-player]');
  if (!src) return;
  const pid = src.dataset.player || '';
  if (!pid) return; // nothing to drag from an empty position
  drag = { id:e.pointerId, x:e.clientX, y:e.clientY, from:src.dataset.pos || null, pid, ghost:null, active:false };
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.active){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.active = true;
    drag.ghost = document.createElement('div');
    drag.ghost.className = 'drag-ghost';
    drag.ghost.textContent = playerName(drag.pid);
    document.body.appendChild(drag.ghost);
    document.body.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
  const t = dropTarget(e.clientX, e.clientY);
  if (t) t.el.classList.add('drop-hover');
}, { passive:false });
document.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  if (!d.active){ drag = null; return; }
  const t = dropTarget(e.clientX, e.clientY);
  endDrag();
  // The tap that ends a drag shouldn't also open the picker.
  swallowNextClick();
  if (!t) return;
  if (t.pos && t.pos !== d.from) assignSlot(t.pos, d.pid, 'plan').catch(fail);
  else if (t.bench && d.from) assignSlot(d.from, '', 'plan').catch(fail);
});
document.addEventListener('pointercancel', () => { if (drag) endDrag(); });

// Long press (about half a second) on a game in the list asks to archive
// or restore it. Moving the finger (e.g. scrolling) cancels it.
let press = null;
document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.game-card[data-longpress]');
  if (!card) return;
  const id = card.dataset.game, x = e.clientX, y = e.clientY;
  press = { x, y, card, timer:setTimeout(() => {
    press = null;
    holdFired = true;
    if (navigator.vibrate) try { navigator.vibrate(30); } catch(err){}
    UI.archiveAsk = id; render();
  }, 550) };
  card.classList.add('pressing');
});
function cancelPress(){ if (press){ clearTimeout(press.timer); press.card.classList.remove('pressing'); press = null; } }
document.addEventListener('pointermove', (e) => { if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress(); });
// Lifting the finger after a long press: ignore the tap that comes with it.
document.addEventListener('pointerup', () => { cancelPress(); if (holdFired){ holdFired = false; swallowNextClick(); } });
document.addEventListener('pointercancel', () => { cancelPress(); holdFired = false; });
document.addEventListener('contextmenu', (e) => { if (e.target.closest('.game-card[data-longpress]')) e.preventDefault(); });

function focusSheet(){
  const first = document.querySelector('.sheet .stat-btn, .sheet .pick-row, .sheet button');
  if (first) first.focus();
}
function closePicker(){
  const pos = UI.pickPos || UI.statPos;
  UI.pickPos = null; UI.statPos = null; render();
  const token = pos && document.querySelector(`.court-token[data-pos="${pos}"], .ptile[data-pos="${pos === 'Team' ? '' : pos}"]`);
  if (token) token.focus();
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UI.showGuide){ closeGuide(); return; }
  if (e.key === 'Escape' && UI.subSheet){ UI.subSheet = false; render(); return; }
  if (e.key === 'Escape' && (UI.pickPos || UI.statPos)) closePicker();
});

// Scoring mode (Player first / Goal/Miss first), remembered on this phone.
function setLiveMode(mode){
  if (mode !== 'player' && mode !== 'event') return;
  UI.liveMode = mode; UI.pendingEvent = null;
  try { localStorage.setItem('nettyPalLiveMode', mode); } catch(e){}
  render();
}
// Swiping left or right across the positions switches mode.
let swipeStart = null;
document.addEventListener('touchstart', (e) => {
  const zone = e.target.closest('[data-swipe]');
  swipeStart = zone && e.touches.length === 1 ? { x:e.touches[0].clientX, y:e.touches[0].clientY } : null;
}, { passive:true });
document.addEventListener('touchend', (e) => {
  if (!swipeStart || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x, dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  setLiveMode(dx < 0 ? 'player' : 'event');
}, { passive:true });

/* ---------------------------------------------------------------------
   Game clock. Ticks the clock on screen, and on the scorer's phone ends
   the period at 0:00 (with a vibration) and keeps the screen awake.
--------------------------------------------------------------------- */
let autoEndedKey = null, tickCount = 0;
let wakeLock = null, wakeLockPending = false;
setInterval(() => {
  const g = UI.view === 'game' ? findGame(UI.gameId) : null;
  syncWakeLock(g);
  // Stop listening if the scorer leaves the Live tab or play stops.
  if (voiceRec && !(g && UI.gameTab === 'live' && isInPlay(g))){ try { voiceRec.abort(); } catch(e){} }
  if (!g || UI.gameTab !== 'live' || g.status !== 'live' || !g.live) return;
  const el = document.querySelector('[data-clock]');
  if (el) el.textContent = fmtClock(periodMs(g) - elapsedMs(g));
  // Court time on the position tiles, refreshed about once a second.
  const tiles = document.querySelectorAll('[data-ptime]');
  if (tiles.length && g.live.phase === 'running' && (tickCount++ % 4 === 0)){
    const st = computeGame(g, CUR.events);
    tiles.forEach(t => { const id = t.dataset.ptime; if (id) t.textContent = fmtMins((st.players[id] || {}).ms || 0); });
  }
  const key = g.id + ':' + g.live.period;
  if (g.live.phase === 'running' && amScorer(g) && elapsedMs(g) >= periodMs(g) && autoEndedKey !== key){
    autoEndedKey = key;
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    endPeriod(g).then(() => toast(`End of ${periodName(g, g.live.period)}.`))
      .catch(err => { autoEndedKey = null; fail(err); });
  }
}, 250);

function syncWakeLock(g){
  const want = !!(g && UI.gameTab === 'live' && g.status === 'live' && amScorer(g) && document.visibilityState === 'visible');
  if (want && !wakeLock && !wakeLockPending && 'wakeLock' in navigator){
    wakeLockPending = true;
    navigator.wakeLock.request('screen')
      .then(lock => { wakeLock = lock; lock.addEventListener('release', () => { wakeLock = null; }); })
      .catch(() => {})
      .finally(() => { wakeLockPending = false; });
  } else if (!want && wakeLock){
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-field="player-name"]')) e.target.blur();
});

/* ---------------------------------------------------------------------
   Invite links (?join=CODE). The code is remembered on this device until
   the person joins or taps "Not now", so it survives signing in.
--------------------------------------------------------------------- */
const INVITE_KEY = 'nettyPalInvite';
let inviteMemory = '';
function pendingInvite(){
  try { return localStorage.getItem(INVITE_KEY) || inviteMemory; } catch(e){ return inviteMemory; }
}
function clearInvite(){
  inviteMemory = '';
  try { localStorage.removeItem(INVITE_KEY); } catch(e){}
  HOME.invite = null;
}
(function captureInvite(){
  const params = new URLSearchParams(location.search);
  const code = normaliseCode(params.get('join'));
  if (!code) return;
  inviteMemory = code;
  try { localStorage.setItem(INVITE_KEY, code); } catch(e){}
  // Tidy the address bar so a refresh or bookmark doesn't re-trigger it.
  params.delete('join');
  const rest = params.toString();
  history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
})();

// Looks up the invite so the home screen can say which team it's for.
async function lookupInvite(){
  const code = pendingInvite();
  if (!code || !USER) return;
  HOME.invite = { code, loading:true };
  render();
  try {
    const codeSnap = await getDoc(doc(db, 'joinCodes', code));
    if (!codeSnap.exists()){ HOME.invite = { code, bad:true }; render(); return; }
    const { teamId, seasonId } = codeSnap.data();
    const [teamSnap, memberSnap] = await Promise.all([
      getDoc(doc(db, 'teams', teamId)),
      getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid))
    ]);
    HOME.invite = { code, teamId, seasonId, teamName:teamSnap.exists() ? teamSnap.data().name : 'a team',
      already:memberSnap.exists() };
  } catch (err){
    console.warn('Netty Pal: invite lookup', err);
    HOME.invite = { code, error:true };
  }
  render();
}

function inviteHtml(){
  const inv = HOME.invite;
  if (!inv) return '';
  if (inv.loading) return '<div class="panel invite-panel">Checking your invite…</div>';
  if (inv.bad) return `<div class="panel invite-panel" role="alert">
      <p>That invite link isn't valid any more (the team may have made a new code). Ask your coach for a new link.</p>
      <button class="btn ghost small" data-action="dismiss-invite">OK</button></div>`;
  if (inv.error) return `<div class="panel invite-panel" role="alert">
      <p>Couldn't check your invite just now.</p>
      <div class="form-actions" style="justify-content:flex-start">
        <button class="btn small" data-action="retry-invite">Try again</button>
        <button class="btn ghost small" data-action="dismiss-invite">Not now</button></div></div>`;
  if (inv.already) return `<div class="panel invite-panel">
      <p>You're already in <b>${escapeHtml(inv.teamName)}</b>.</p>
      <button class="btn small" data-action="accept-invite">Open team</button></div>`;
  return `<div class="panel invite-panel">
      <p>You've been invited to join <b>${escapeHtml(inv.teamName)}</b>.</p>
      <div class="form-actions" style="justify-content:flex-start">
        <button class="btn" data-action="accept-invite" ${UI.busy ? 'disabled' : ''}>Join team</button>
        <button class="btn ghost" data-action="dismiss-invite">Not now</button></div></div>`;
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
onAuthStateChanged(auth, (user) => {
  USER = user;
  authReady = true;
  if (!user){ HOME = { loaded:false, items:[] }; UI = { ...UI, view:'home', form:null }; render(); return; }
  const nav = loadNav();
  // An invite link always lands on the home screen, where it can be accepted.
  if (pendingInvite()){
    goHome();
    lookupInvite();
  } else if (nav && (nav.view === 'season' || nav.view === 'game') && nav.teamId && nav.seasonId){
    openSeason(nav.teamId, nav.seasonId);
    if (nav.tab) UI.tab = nav.tab;
    if (nav.view === 'game' && nav.gameId){
      UI = { ...UI, view:'game', gameId:nav.gameId, gameTab:nav.gameTab || 'lineup' };
    }
    saveNav();
    render();
  } else {
    goHome();
  }
});

// Opened from a sign-in email? Finish signing in.
checkEmailLink();

window.addEventListener('online', () => { offlineMode = false; render(); });
window.addEventListener('offline', () => { offlineMode = true; render(); });
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
