/* ---------------------------------------------------------------------
   Summaries (step 3): one game, and the season to date.
--------------------------------------------------------------------- */
function pctText(goals, shots){ return shots ? Math.round(100 * goals / shots) + '%' : '·'; }
function resultWord(us, them){ return us > them ? 'Won' : us < them ? 'Lost' : 'Drew'; }
function minsText(ms){ return ms ? String(Math.round(ms / 60000)) : '·'; }
// Court time in whole minutes (0 shows as 0).
function wholeMins(ms){ return String(Math.round((ms || 0) / 60000)); }

// Court time table: minutes per position for each player, plus a total.
// fmt turns milliseconds into what's shown in each cell.
function courtTimeTable(rows, fmt, playingIds){
  const max = Math.max(1, ...rows.flatMap(r => POSITIONS.map(pos => r.pos[pos] || 0)));
  const body = rows.map(r => `<tr class="${playingIds && playingIds.has(r.id) && !r.ms ? 'no-time' : ''} ${followRow(r.id)}">
      <td>${pnameHtml(r.id)}${r.adjusted ? ' <span class="adj-tag" title="Adjusted by a Coach/Manager">adjusted</span>' : ''}</td>
      ${POSITIONS.map(pos => {
        const v = r.pos[pos] || 0;
        const shade = v ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * v / max)}%, transparent)"` : '';
        return `<td ${shade}>${v ? fmt(v) : '·'}</td>`;
      }).join('')}
      <td class="total">${r.ms ? fmt(r.ms) : '0'}</td>
    </tr>`).join('');
  return `<div class="fair-wrap"><table class="fair">
      <caption>Times in minutes</caption>
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}<th scope="col">Total mins</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 2}">Nobody has been on court yet.</td></tr>`}</tbody>
    </table></div>`;
}

// Where an unfinished game is up to, e.g. "Q2 · 4:12 left". The time
// counts down live (the clock ticker updates every [data-clock]).
function progressLineHtml(g){
  const L = g.live;
  if (!L || !L.period) return '';
  const q = escapeHtml(periodName(g, L.period));
  // At a break the heading already says "Half time" etc.
  if (!isInPlay(g)) return '';
  if (isTimeUp(g)) return `<div class="progress-line">${q} · Time</div>`;
  return `<div class="progress-line">${q} · <span data-clock>${fmtClock(periodMs(g) - elapsedMs(g))}</span> left${L.phase === 'paused' ? ' · clock paused' : ''}</div>`;
}

// Time on court on the Game stats tab, one table at a time. A Game / Season
// switch (Season only before the game, Game only in practice), and for
// Coach/Managers and Scorers a Simple / Detailed switch: Detailed splits the
// time by position. st is this game's figures, or null before it starts.
/* ---- Adjust court time ----
   After a game, a Coach/Manager can set a player's minutes in each
   position by hand (for a sub recorded late, or not at all). Saved on the
   game as courtAdjust { playerId: { GS: ms, ... } }; computeGame uses it in
   place of the recorded time, so game stats, season stats, the player page
   and Fill lineup all follow. Reset to recorded removes it. */
function gameLengthMs(g){ return periodCount(g) * periodMs(g); }
function courtAdjustSheetHtml(g, st){
  const pid = UI.courtAdj.pid;
  const ids = byName(Array.from(new Set([...availableIds(g), ...Object.keys(st.players).filter(id => st.players[id].ms)])));
  const total = gameLengthMs(g);
  let body;
  if (!pid){
    // Positions with more minutes than the game had (two players can't both
    // be GS for the whole game), so the coach can spot a slip.
    const byPos = {};
    Object.values(st.players).forEach(r => Object.entries(r.pos || {}).forEach(([k, ms]) => { byPos[k] = (byPos[k] || 0) + ms; }));
    const over = POSITIONS.filter(k => byPos[k] > total + 30000);
    body = `<p style="margin:0.8rem 0 0.6rem">Pick a player to set their minutes in each position for this game. Use it when a sub was recorded late or missed.</p>
      ${over.length ? `<p class="adj-warn" role="alert">More minutes than the game had at ${over.map(k => `${k} (${wholeMins(byPos[k])} of ${wholeMins(total)})`).join(', ')}. Check who else played there.</p>` : ''}
      <div class="list-card">${ids.map(id => { const r = st.players[id] || { ms:0 };
        return `<button class="result-row" data-action="adj-pick" data-player="${escapeHtml(id)}">
          <span class="grow"><span class="pname">${escapeHtml(playerName(id))}${r.adjusted ? ' <span class="adj-tag">adjusted</span>' : ''}</span>
            <span class="psub">${POSITIONS.filter(k => r.pos && r.pos[k]).map(k => `${k} ${wholeMins(r.pos[k])}`).join(' · ') || 'No court time'}</span></span>
          <span class="result-badge">${wholeMins(r.ms)} min</span></button>`; }).join('')}</div>`;
  } else {
    const r = st.players[pid] || { pos:{}, ms:0 };
    const adjusted = !!(g.courtAdjust && g.courtAdjust[pid]);
    body = `<form class="adj-form" data-form="court-adjust" data-player="${escapeHtml(pid)}">
        <p style="margin:0.8rem 0 0.6rem">Minutes in each position this game (the whole game is ${wholeMins(total)} minutes).</p>
        <div class="adj-grid">${POSITIONS.map(k => `<label class="adj-cell"><span class="pos-chip ${POS_ZONE[k]}">${k}</span>
            <input class="text-input" type="number" inputmode="numeric" min="0" max="${wholeMins(total)}" step="1" name="${k}" value="${r.pos && r.pos[k] ? wholeMins(r.pos[k]) : ''}" placeholder="0" aria-label="${POS_NAMES[k]} minutes"></label>`).join('')}</div>
        <p class="adj-total">Total: <b data-adj-total>${wholeMins(r.ms)}</b> of ${wholeMins(total)} minutes</p>
        <div class="form-actions">
          <button type="button" class="btn ghost" data-action="adj-back">Back</button>
          <button type="submit" class="btn" ${UI.busy ? 'disabled' : ''}>Save</button>
        </div>
        ${adjusted ? `<button type="button" class="btn ghost small ${isArmed('adj-reset') ? 'armed' : ''}" data-action="adj-reset" data-player="${escapeHtml(pid)}">${isArmed('adj-reset') ? 'Confirm reset to recorded time' : 'Reset to recorded time'}</button>` : ''}
      </form>`;
  }
  return `<div class="sheet-backdrop" data-action="adj-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="adj-title">
      <div class="sheet-head"><div class="grow"><h3 id="adj-title">${pid ? escapeHtml(playerName(pid)) : 'Adjust court time'}</h3>
        <div class="psub">${escapeHtml(gameTitle(g))}</div></div>
        <button class="btn ghost small" data-action="adj-close">Close</button></div>
      <div class="sheet-body">${body}</div>
    </div>`;
}
async function saveCourtAdjust(g, pid, fd){
  const total = gameLengthMs(g);
  const pos = {};
  let sum = 0;
  POSITIONS.forEach(k => {
    const mins = Math.max(0, Math.round(Number(fd.get(k)) || 0));
    if (mins){ pos[k] = mins * 60000; sum += mins * 60000; }
  });
  if (sum > total + 30000){ toast(`That's ${wholeMins(sum)} minutes, more than the ${wholeMins(total)}-minute game.`, true); return; }
  const courtAdjust = { ...(g.courtAdjust || {}), [pid]:pos };
  await updateDoc(gameRef(g.id), { [`courtAdjust.${pid}`]:pos, summary:gameSummary({ ...g, courtAdjust }, CUR.events) });
  UI.courtAdj = { pid:null };
  toast(`${playerName(pid)}'s court time updated.`);
}
async function resetCourtAdjust(g, pid){
  const courtAdjust = { ...(g.courtAdjust || {}) };
  delete courtAdjust[pid];
  await updateDoc(gameRef(g.id), { [`courtAdjust.${pid}`]:DELETE_FIELD, summary:gameSummary({ ...g, courtAdjust }, CUR.events) });
  UI.courtAdj = { pid:null };
  toast(`${playerName(pid)} is back to the recorded time.`);
}
// Live total while typing minutes.
document.addEventListener('input', (e) => {
  const form = e.target.closest && e.target.closest('form.adj-form');
  if (!form) return;
  const sum = POSITIONS.reduce((a, k) => a + Math.max(0, Math.round(Number((form.elements[k] || {}).value) || 0)), 0);
  const out = form.querySelector('[data-adj-total]'); if (out) out.textContent = sum;
});

function timeOnCourtHtml(g, st){
  const staff = isStaff();
  const canSeason = !isPractice(g);
  const season = !st || (canSeason && UI.courtView === 'season');
  const detailed = staff && UI.fairView === 'detailed';
  const radio = (name, field, value, label, on) =>
    `<label><input type="radio" name="${name}" data-field="${field}" value="${value}" ${on ? 'checked' : ''}><span>${label}</span></label>`;
  const switches = [
    st && canSeason ? `<div class="segmented" role="radiogroup" aria-label="Game or season">
        ${radio('courtView', 'court-view', 'game', 'Game', !season)}${radio('courtView', 'court-view', 'season', 'Season', season)}</div>` : '',
    staff ? `<div class="segmented" role="radiogroup" aria-label="Simple or detailed">
        ${radio('fairView', 'fair-view', 'simple', 'Simple', !detailed)}${radio('fairView', 'fair-view', 'detailed', 'Detailed', detailed)}</div>` : ''
  ].filter(Boolean).join('');
  // Every table is in minutes and says so in its caption.
  const head = `<h3 class="subhead">Time on court</h3>
    ${switches ? `<div class="toc-switches">${switches}</div>` : ''}`;
  if (season) return head + seasonTimeHtml(g, detailed);

  const playing = new Set(availableIds(g));
  const ids = Array.from(new Set([...Object.keys(st.players).filter(id => st.players[id].ms), ...playing]));
  const msOf = id => (st.players[id] || {}).ms || 0;
  const benched = ids.filter(id => !msOf(id) && playing.has(id)).length;
  const benchNote = staff && benched
    ? ` ${benched} player${benched === 1 ? ' was' : 's were'} marked as playing but didn't get on court (highlighted).` : '';
  if (detailed){
    // Least court time first, so anyone who's missed out stands out.
    const rows = ids.map(id => ({ id, ms:msOf(id), pos:(st.players[id] || {}).pos || {}, adjusted:!!(st.players[id] || {}).adjusted })).sort((a, b) => a.ms - b.ms);
    return `${head}${courtTimeTable(rows, wholeMins, playing)}
      <p class="hint">Minutes in each position this game.${benchNote}</p>`;
  }
  // Simple: staff see least time first (who's owed a turn); viewers see names in order.
  const order = staff ? ids.slice().sort((a, b) => msOf(a) - msOf(b) || playerName(a).localeCompare(playerName(b))) : byName(ids);
  const adjMark = id => st && st.players[id] && st.players[id].adjusted ? ' <span class="adj-tag" title="Adjusted by a Coach/Manager">adjusted</span>' : '';
  const rows = order.map(id => `<tr class="${followRow(id)}"><td>${pnameHtml(id)}${adjMark(id)}</td>
      <td class="this ${staff && playing.has(id) && !msOf(id) ? 'zero-this' : ''}">${wholeMins(msOf(id))}</td></tr>`).join('');
  return `${head}<div class="fair-wrap"><table class="fair simple">
      <caption>Times in minutes</caption>
      <thead><tr><th scope="col">Player</th><th scope="col">Mins this game</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="2">No players yet.</td></tr>'}</tbody>
    </table></div>
    ${benchNote ? `<p class="hint">${benchNote.trim()}</p>` : ''}`;
}

// "Simple stats" or "All stats" on Game stats and Season Stats, when extra
// stats are tracked. Each phone remembers its own choice (All to start with).
function statsViewAll(){ try { return localStorage.getItem('nettyPalStatsView') !== 'simple'; } catch(e){ return true; } }
function statsViewHtml(){
  const all = statsViewAll();
  return `<div class="toc-switches"><div class="segmented" role="radiogroup" aria-label="Which stats to show">
      <label><input type="radio" name="statsView" data-field="stats-view" value="simple" ${all ? '' : 'checked'}><span>Simple stats</span></label>
      <label><input type="radio" name="statsView" data-field="stats-view" value="all" ${all ? 'checked' : ''}><span>All stats</span></label>
    </div></div>`;
}
// The extra stats as a table: one row per player (plus our team total, and
// the other team when tracked), one column per stat, grouped (Gains...).
// rows: [{ id, counts }]; usKeys/themKeys: the stats tracked for each side.
function extraStatsTableHtml(rows, usKeys, themKeys, oppCounts, usName, themName){
  const keys = EXTRA_STATS.filter(k => usKeys.includes(k) || themKeys.includes(k));
  if (!keys.length) return '';
  const groups = STAT_GROUPS.map(gr => ({ label:gr.label, n:gr.stats.filter(x => keys.includes(x.key)).length })).filter(gr => gr.n);
  const cell = (on, v) => `<td>${on ? (v || 0) : '·'}</td>`;
  const total = {};
  rows.forEach(r => keys.forEach(k => { total[k] = (total[k] || 0) + (r.counts[k] || 0); }));
  const body = rows.map(r => `<tr><td>${escapeHtml(playerName(r.id))}</td>${keys.map(k => cell(usKeys.includes(k), r.counts[k])).join('')}</tr>`).join('');
  return `<div class="fair-wrap"><table class="fair stats-table extra-stats">
      <thead><tr><th></th>${groups.map(gr => `<th scope="colgroup" colspan="${gr.n}" class="grp">${escapeHtml(gr.label)}</th>`).join('')}</tr>
        <tr><th scope="col">Player</th>${keys.map(k => `<th scope="col" title="${escapeHtml(STAT_LABEL[k])}">${escapeHtml(STAT_INFO[k].short)}</th>`).join('')}</tr></thead>
      <tbody>${usKeys.length ? body : ''}
        ${usKeys.length ? `<tr class="team-total"><td>${escapeHtml(usName)}</td>${keys.map(k => cell(usKeys.includes(k), total[k])).join('')}</tr>` : ''}
        ${themKeys.length ? `<tr class="team-total opp"><td>${escapeHtml(themName)}</td>${keys.map(k => cell(themKeys.includes(k), oppCounts[k])).join('')}</tr>` : ''}
      </tbody>
    </table></div>
    <p class="hint">${keys.map(k => `${escapeHtml(STAT_INFO[k].short)} = ${escapeHtml(STAT_LABEL[k])}`).join(', ')}. A dot means that stat isn't tracked for them.</p>`;
}

function renderSummaryTab(g){
  if (!CUR.loaded.events) return '<div class="loading-state">Loading…</div>';
  // Before the game there's no score yet, just season court time for planning.
  if (g.status !== 'live' && g.status !== 'final'){
    return `<p class="hint">The score, shooting and this game's court time appear here once the game starts.</p>
      ${timeOnCourtHtml(g, null)}`;
  }
  const st = computeGame(g, CUR.events);
  const n = periodCount(g), over = isGameOver(g);
  const res = resultWord(st.us, st.them);

  const head = `<div class="result-card ${over ? res.toLowerCase() : ''}">
      <div class="result-word">${over ? res : escapeHtml(gameStage(g))}</div>
      <div class="result-score">
        <span>${escapeHtml(teamLabel(g, 'us'))}</span><b>${st.us}</b><i aria-hidden="true">:</i><b>${st.them}</b><span>${escapeHtml(teamLabel(g, 'them'))}</span>
      </div>
      ${g.status === 'live' && over ? '<div class="hint">Full time. Not finalised yet.</div>' : ''}
      ${!over ? progressLineHtml(g) : ''}
    </div>`;

  const periods = Array.from({ length:n }, (_, i) => i + 1);
  const cell = (p, side) => st.byPeriod[p] ? st.byPeriod[p][side] : '·';
  const byPeriod = `<h3 class="subhead">Score by ${escapeHtml(periodNoun(g))}</h3>
    <div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Team</th>${periods.map(p => `<th scope="col">${escapeHtml(periodName(g, p))}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>
        <tr><td>${escapeHtml(teamLabel(g, 'us'))}</td>${periods.map(p => `<td>${cell(p, 'us')}</td>`).join('')}<td class="total">${st.us}</td></tr>
        <tr><td>${escapeHtml(teamLabel(g, 'them'))}</td>${periods.map(p => `<td>${cell(p, 'them')}</td>`).join('')}<td class="total">${st.them}</td></tr>
      </tbody>
    </table></div>`;

  // Shooting: who shot, from which positions, and how accurately.
  const shooterPos = {};
  CUR.events.filter(e => !e.undone && (e.type === 'goal' || e.type === 'miss') && e.playerId && e.pos)
    .forEach(e => { (shooterPos[e.playerId] = shooterPos[e.playerId] || new Set()).add(e.pos); });
  const shooters = Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .sort((a, b) => b[1].goal - a[1].goal || playerName(a[0]).localeCompare(playerName(b[0])));
  const ourShots = st.us + shooters.reduce((s, [, r]) => s + r.miss, 0);
  // The other team by position only when there's more than one (otherwise
  // it would just repeat their total).
  const oppRows = ['GS', 'GA', 'Team'].filter(k => st.opp[k].goal + st.opp[k].miss);
  const oppSplit = oppRows.length > 1 && oppRows.some(k => k !== 'Team');
  const shooting = `<h3 class="subhead">Shooting</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Shooter</th><th scope="col">Pos</th><th scope="col">Goals</th>${st.missOn ? '<th scope="col">Accuracy</th>' : ''}</tr></thead>
      <tbody>
        ${shooters.map(([id, r]) => `<tr class="${followRow(id)}"><td>${pnameHtml(id)}</td><td>${escapeHtml(Array.from(shooterPos[id] || []).join(', '))}</td>
          <td>${st.missOn ? r.goal + '/' + (r.goal + r.miss) : r.goal}</td>${st.missOn ? `<td>${pctText(r.goal, r.goal + r.miss)}</td>` : ''}</tr>`).join('')}
        <tr class="team-total"><td>${escapeHtml(teamLabel(g, 'us'))}</td><td>Total</td><td>${st.missOn ? st.us + '/' + ourShots : st.us}</td>${st.missOn ? `<td>${pctText(st.us, ourShots)}</td>` : ''}</tr>
        ${oppSplit ? oppRows.map(k => `<tr class="opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td>${k}</td>
          <td>${st.oppMiss ? st.opp[k].goal + '/' + (st.opp[k].goal + st.opp[k].miss) : st.opp[k].goal}</td>${st.missOn ? `<td>${st.oppMiss ? pctText(st.opp[k].goal, st.opp[k].goal + st.opp[k].miss) : '·'}</td>` : ''}</tr>`).join('') : ''}
        <tr class="team-total opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td>${oppSplit ? 'Total' : ''}</td><td>${st.oppMiss ? st.them + '/' + (st.them + st.oppMiss) : st.them}</td>${st.missOn ? `<td>${st.oppMiss ? pctText(st.them, st.them + st.oppMiss) : '·'}</td>` : ''}</tr>
      </tbody>
    </table></div>
    `;

  const canAdjust = over && isManager() && !isPractice(g);
  const court = timeOnCourtHtml(g, st)
    + (canAdjust ? `<div class="lineup-tools"><button class="btn ghost small" data-action="adj-open">Adjust court time</button></div>` : '')
    + (canAdjust && UI.courtAdj ? courtAdjustSheetHtml(g, st) : '');

  // Extra stats, when this game tracks any (and "All stats" is chosen).
  let extra = '';
  if (tracksExtras(g) && statsViewAll()){
    const rows = Object.entries(st.players).filter(([id, r]) => r.ms || EXTRA_STATS.some(k => r[k]))
      .map(([id, r]) => ({ id, counts:r })).sort((a, b) => playerName(a.id).localeCompare(playerName(b.id)));
    extra = `<h3 class="subhead">More stats</h3>
      ${extraStatsTableHtml(rows, usExtras(g), themExtras(g), st.oppStats, teamLabel(g, 'us'), teamLabel(g, 'them'))}`;
  }
  const view = tracksExtras(g) ? statsViewHtml() : '';

  prepareShare(g, st);
  const share = `<div class="lineup-tools" style="justify-content:center">
      <button class="btn" data-action="share-summary">${over ? 'Share result' : 'Share score'}</button>
    </div>`;
  return head + share + view + gameAwardsHtml(g) + byPeriod + shooting + extra + court;
}

/* ---- Sharing a game result ----
   A picture card plus a short text version, for team group chats. Court
   time is deliberately left out of what's shared. The picture is made in
   advance (while the Game stats tab is open), because iPhones only allow
   sharing straight after a tap. */
function summaryShareText(g, st){
  const n = periodCount(g), over = isGameOver(g);
  const lines = [`${teamLabel(g, 'us')} ${st.us} : ${st.them} ${teamLabel(g, 'them')}`];
  lines.push([over ? `${resultWord(st.us, st.them)} (full time)` : gameStage(g), g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : '']
    .filter(Boolean).join(' · '));
  const periods = [];
  for (let p = 1; p <= n; p++) if (st.byPeriod[p]) periods.push(`${periodName(g, p)} ${st.byPeriod[p].us}:${st.byPeriod[p].them}`);
  if (periods.length) lines.push(periods.join(' · '));
  const shooters = shareShooters(st);
  if (shooters.length){
    const shots = shooters.reduce((s, x) => s + x.shots, 0);
    lines.push(st.missOn ? `Shooting: ${shooters.map(x => `${x.name} ${x.goals}/${x.shots}`).join(', ')} (${st.us}/${shots}, ${pctText(st.us, shots)})`
      : `Goals: ${shooters.map(x => `${x.name} ${x.goals}`).join(', ')}`);
  }
  return lines.join('\n');
}

// e.g. "Sat 1 May" (no year or time), for the shared result.
function shareDate(g){
  const d = parseIsoDate(g.date);
  return d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }).replace(/,/g, '') : '';
}

function shareShooters(st){
  return Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .map(([id, r]) => ({ name:playerName(id), goals:r.goal, shots:r.goal + r.miss }))
    .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
}

// Draws the result card as a 1080 x 1080 picture and returns it as a PNG.
async function summaryImage(g, st){
  try {
    await Promise.all([
      document.fonts.load('900 100px Archivo'),
      document.fonts.load('700 40px "DM Sans"'),
      document.fonts.load('800 40px "DM Sans"')
    ]);
  } catch(e){ /* falls back to system fonts */ }
  const W = 1080, c = document.createElement('canvas');
  c.width = W; c.height = W;
  const x = c.getContext('2d');
  x.fontStretch = 'extra-condensed'; // narrow Archivo headings, like the app (DM Sans has no narrow width)
  const display = (size, weight) => `${weight || 900} ${size}px Archivo, "Arial Narrow", sans-serif`;
  const body = (size, weight) => `${weight || 700} ${size}px "DM Sans", "Segoe UI", sans-serif`;
  const fit = (text, max) => { let t = String(text); while (t.length > 1 && x.measureText(t).width > max) t = t.slice(0, -2) + '…'; return t; };
  const over = isGameOver(g), res = resultWord(st.us, st.them);

  // Background and header band.
  x.fillStyle = '#F5F5F6'; x.fillRect(0, 0, W, W);
  // Ink band with white text, like the app's top bar.
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, 150);
  // The black and white stripe under the bar.
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 150, W, 12);
  x.fillStyle = '#0B0B0D'; for (let sx = 12; sx < W; sx += 24) x.fillRect(sx, 150, 12, 12);
  // Ball: the same white netball with pink seams as the logo.
  drawBall(x, 95, 75, 42);
  x.fillStyle = '#FFFFFF'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.font = display(58); x.fillText('NETTY PAL', 160, 78);
  x.fillStyle = '#B4B4BC'; x.textAlign = 'right'; x.font = body(34);
  x.fillText(fit([g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : ''].filter(Boolean).join(' · '), 560), W - 60, 78);

  // Result word.
  x.textAlign = 'center';
  x.fillStyle = !over ? '#C8641C' : res === 'Won' ? '#2E7550' : res === 'Lost' ? '#B3261E' : '#0B0B0D';
  // How far through the game: the result at full time, otherwise e.g.
  // "Half time" or "Q3 in play", with a smaller line under it to match.
  const headline = (over ? res : gameStage(g)).toUpperCase();
  let hs = 90;
  x.font = display(hs);
  while (hs > 50 && x.measureText(headline).width > W - 120){ hs -= 4; x.font = display(hs); }
  x.fillText(headline, W / 2, 240);
  x.fillStyle = '#5F5F66'; x.font = body(30, 800);
  x.fillText(over ? 'FULL TIME' : 'SCORE SO FAR', W / 2, 305);

  // Teams and score. Team names are never cut short: long ones get a
  // smaller font, and wrap onto a second line if still too wide.
  const teamName = (name, cx) => {
    const max = 440, text = String(name).toUpperCase();
    let size = 40;
    x.font = body(size, 800);
    while (size > 30 && x.measureText(text).width > max){ size -= 2; x.font = body(size, 800); }
    if (x.measureText(text).width <= max){ x.fillText(text, cx, 370); return; }
    const words = text.split(' '), lines = [''];
    words.forEach(w => {
      const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
      if (x.measureText(tryLine).width <= max || !lines[lines.length - 1]) lines[lines.length - 1] = tryLine;
      else lines.push(w);
    });
    const shown = lines.slice(0, 2);
    if (lines.length > 2) shown[1] = lines.slice(1).join(' ');
    shown.forEach((line, i) => x.fillText(line, cx, 370 + (i - (shown.length - 1) / 2) * (size + 4)));
  };
  x.fillStyle = '#5F5F66';
  teamName(teamLabel(g, 'us'), 290);
  teamName(teamLabel(g, 'them'), 790);
  x.fillStyle = '#0B0B0D'; x.font = display(240);
  x.fillText(String(st.us), 290, 520); x.fillText(String(st.them), 790, 520);
  x.fillStyle = '#A6A6AE'; x.font = display(150); x.fillText(':', W / 2, 505);

  // Score by period.
  const n = periodCount(g), boxW = 200, gap = 20, left = (W - (n * boxW + (n - 1) * gap)) / 2;
  for (let p = 1; p <= n; p++){
    const bx = left + (p - 1) * (boxW + gap);
    x.fillStyle = '#FFFFFF'; x.strokeStyle = '#E1E1E5'; x.lineWidth = 3;
    x.beginPath(); x.roundRect(bx, 660, boxW, 150, 6); x.fill(); x.stroke();
    x.fillStyle = '#C2005E'; x.font = display(44); x.fillText(periodName(g, p).toUpperCase(), bx + boxW / 2, 705);
    x.fillStyle = '#0B0B0D'; x.font = display(64);
    x.fillText(st.byPeriod[p] ? `${st.byPeriod[p].us} : ${st.byPeriod[p].them}` : '-', bx + boxW / 2, 770);
  }

  // Shooters.
  const shooters = shareShooters(st);
  if (shooters.length){
    x.fillStyle = '#5F5F66'; x.font = body(32, 800); x.fillText('SHOOTING', W / 2, 880);
    x.fillStyle = '#0B0B0D'; x.font = body(40);
    const shots = shooters.reduce((s, y) => s + y.shots, 0);
    x.fillText(fit(shooters.map(s => st.missOn ? `${s.name} ${s.goals}/${s.shots}` : `${s.name} ${s.goals}`).join('   ·   '), W - 120), W / 2, 940);
    if (st.missOn){
      x.fillStyle = '#5F5F66'; x.font = body(32);
      x.fillText(`Team ${st.us}/${shots} (${pctText(st.us, shots)})`, W / 2, 1000);
    }
  }
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('No image')), 'image/png'));
}

function prepareShare(g, st){
  const text = summaryShareText(g, st);
  const key = g.id + '|' + text;
  if (CUR.share && CUR.share.key === key) return;
  const share = { key, text, file:null };
  share.ready = summaryImage(g, st).then(blob => {
    const name = `netty-pal-${nameKey(teamLabel(g, 'us')).replace(/ /g, '-')}-v-${nameKey(teamLabel(g, 'them')).replace(/ /g, '-')}.png`;
    share.file = new File([blob], name, { type:'image/png' });
  }).catch(err => console.warn('Netty Pal: share image', err));
  CUR.share = share;
}

async function shareSummary(g){
  const st = computeGame(g, CUR.events);
  prepareShare(g, st);
  // If the picture is still being made (Share tapped straight away), wait a
  // moment for it; any longer and phones may not allow the share any more.
  if (!CUR.share.file && CUR.share.ready)
    await Promise.race([CUR.share.ready, new Promise(r => setTimeout(r, 1000))]);
  const { text, file } = CUR.share;
  // Phones: the share menu with just the picture (no text, so group chats
  // only get the score card).
  if (file && navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file] }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  // Can't share pictures here (most computers): save the picture instead.
  if (file){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Score card saved as a picture. Add it to a message.');
    return;
  }
  // Only if the picture couldn't be made at all: share the score as text.
  if (navigator.share){
    try { await navigator.share({ text }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('Score copied. Paste it into a message.'); }
  catch(e){ toast(text); }
}

/* ---- Share the planned lineup ----
   Coach/Managers can send the whole game's lineup as a picture (like the
   result card): each player's position in every quarter, with the note
   parents see (not the coach's version). */
function lineupShareText(g){
  const n = periodCount(g);
  const lines = [`${teamLabel(g, 'us')} ${gameTitle(g)}${g.round ? ', Round ' + g.round : ''}${g.date ? ', ' + shareDate(g) : ''}: planned lineup`];
  for (let p = 1; p <= n; p++){
    const l = lineupFor(g, p);
    lines.push(`${periodName(g, p)}: ${POSITIONS.filter(pos => l[pos]).map(pos => `${pos} ${playerName(l[pos])}`).join(', ') || 'not set'}`);
  }
  lines.push(PLAN_NOTE);
  return lines.join('\n');
}
async function lineupImage(g){
  try {
    await Promise.all([document.fonts.load('900 100px Archivo'), document.fonts.load('700 40px "DM Sans"'), document.fonts.load('800 40px "DM Sans"')]);
  } catch(e){ /* falls back to system fonts */ }
  const n = periodCount(g), ids = byName(availableIds(g));
  const lineups = Array.from({ length:n }, (_, i) => lineupFor(g, i + 1));
  const W = 1080, top = 470, rowH = 78, H = top + 90 + ids.length * rowH + 200;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fontStretch = 'extra-condensed';
  const display = (size, weight) => `${weight || 900} ${size}px Archivo, "Arial Narrow", sans-serif`;
  const body = (size, weight) => `${weight || 700} ${size}px "DM Sans", "Segoe UI", sans-serif`;
  const fit = (text, max) => { let t = String(text); while (t.length > 1 && x.measureText(t).width > max) t = t.slice(0, -2) + '…'; return t; };
  const ZONE = { att:'#C8641C', mid:'#0B0B0D', def:'#2E7550' };

  // Background, header bar and stripe, as on the result card.
  x.fillStyle = '#F5F5F6'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, 150);
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 150, W, 12);
  x.fillStyle = '#0B0B0D'; for (let sx = 12; sx < W; sx += 24) x.fillRect(sx, 150, 12, 12);
  drawBall(x, 95, 75, 42);
  x.fillStyle = '#FFFFFF'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.font = display(58); x.fillText('NETTY PAL', 160, 78);
  x.fillStyle = '#B4B4BC'; x.textAlign = 'right'; x.font = body(34);
  x.fillText(fit([g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : ''].filter(Boolean).join(' · '), 560), W - 60, 78);

  // Title, teams, and when and where.
  x.textAlign = 'center';
  x.fillStyle = '#C2005E'; x.font = display(84); x.fillText('PLANNED LINEUP', W / 2, 240);
  x.fillStyle = '#0B0B0D'; x.font = body(42, 800);
  x.fillText(fit(`${teamLabel(g, 'us')} ${gameTitle(g)}`.toUpperCase(), W - 120), W / 2, 315);
  x.fillStyle = '#5F5F66'; x.font = body(32);
  x.fillText(fit([g.time ? fmtTime(g.time) : '', g.venue, g.court ? courtLabel(g.court) : ''].filter(Boolean).join(' · '), W - 120), W / 2, 370);

  // Table: player names, then a column of bibs per quarter.
  const nameX = 70, colW = Math.min(170, (W - 470) / n), col0 = W - 60 - n * colW;
  x.fillStyle = '#5F5F66'; x.font = body(28, 800);
  x.textAlign = 'left'; x.fillText('PLAYER', nameX, top + 20);
  x.textAlign = 'center';
  for (let p = 1; p <= n; p++){ x.fillStyle = '#C2005E'; x.font = display(40); x.fillText(periodName(g, p).toUpperCase(), col0 + (p - 0.5) * colW, top + 20); }
  ids.forEach((id, i) => {
    const y = top + 90 + i * rowH;
    if (i % 2 === 0){ x.fillStyle = '#FFFFFF'; x.fillRect(40, y - rowH / 2, W - 80, rowH); }
    x.fillStyle = '#0B0B0D'; x.textAlign = 'left'; x.font = body(36);
    x.fillText(fit(playerName(id), col0 - nameX - 20), nameX, y);
    x.textAlign = 'center';
    lineups.forEach((l, k) => {
      const cx = col0 + (k + 0.5) * colW;
      const pos = POSITIONS.find(q => l[q] === id);
      if (!pos){ x.fillStyle = '#A6A6AE'; x.font = body(36); x.fillText('–', cx, y); return; }
      x.fillStyle = ZONE[POS_ZONE[pos]]; x.beginPath(); x.arc(cx, y, 28, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#FFFFFF'; x.font = display(28); x.fillText(pos, cx, y + 1);
    });
  });

  // The note parents see, wrapped over two or three lines.
  x.fillStyle = '#5F5F66'; x.font = `italic ${body(30, 600)}`;
  const words = PLAN_NOTE.split(' '), out = [''];
  words.forEach(w => { const t = out[out.length - 1] ? out[out.length - 1] + ' ' + w : w; if (x.measureText(t).width > W - 160 && out[out.length - 1]) out.push(w); else out[out.length - 1] = t; });
  const ny = top + 90 + ids.length * rowH + 40;
  out.forEach((line, i) => x.fillText(line, W / 2, ny + i * 42));
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('No image')), 'image/png'));
}
// Made ahead of the tap (phones only allow sharing straight after one).
function prepareLineupShare(g){
  const text = lineupShareText(g);
  const key = 'lineup|' + g.id + '|' + text;
  if (CUR.lineupShare && CUR.lineupShare.key === key) return;
  const share = { key, text, file:null };
  share.ready = lineupImage(g).then(blob => {
    share.file = new File([blob], `netty-pal-lineup-${nameKey(teamLabel(g, 'us')).replace(/ /g, '-')}-v-${nameKey(teamLabel(g, 'them')).replace(/ /g, '-')}.png`, { type:'image/png' });
  }).catch(err => console.warn('Netty Pal: lineup image', err));
  CUR.lineupShare = share;
}
async function shareLineup(g){
  prepareLineupShare(g);
  const share = CUR.lineupShare;
  if (!share.file && share.ready) await Promise.race([share.ready, new Promise(r => setTimeout(r, 1000))]);
  const { text, file } = share;
  if (file && navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file] }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  if (file){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Lineup saved as a picture. Add it to a message.');
    return;
  }
  if (navigator.share){
    try { await navigator.share({ text }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('Lineup copied. Paste it into a message.'); }
  catch(e){ toast(text); }
}

// Loads the events of every game played so far this season (only while
// the Stats tab is open), so the season totals are worked out exactly the
// same way as each game's own summary.
function playedGames(){ return sortGames(CUR.games).filter(g => !g.archived && (g.status === 'live' || g.status === 'final')); }
function loadSeasonEvents(force){
  const games = playedGames();
  const key = games.map(g => `${g.id}:${g.status}:${g.summary ? g.summary.us + '-' + g.summary.them : ''}:${g.live ? g.live.period + g.live.phase : ''}`).join('|');
  if (!force && (CUR.seasonEventsKey === key || CUR.seasonEventsLoading)) return;
  CUR.seasonEventsKey = key;
  CUR.seasonEventsLoading = true;
  CUR.seasonEventsError = null;
  const seasonId = UI.seasonId;
  Promise.all(games.map(g => getDocs(eventsRef(g.id)).then(snap => [g.id, snap.docs.map(d => ({ id:d.id, ...d.data() }))])))
    .then(pairs => { if (UI.seasonId !== seasonId) return; CUR.seasonEvents = Object.fromEntries(pairs); })
    .catch(err => { console.warn('Netty Pal: season events', err); CUR.seasonEventsError = err; })
    .finally(() => { CUR.seasonEventsLoading = false; render(); });
}

/* ---- Follow a player ----
   A parent picks their child once (saved on this phone, for each season).
   They're starred and highlighted in lineups and stats. Any player's name in
   a stats table opens their own page: games, minutes, positions and goals. */
const FOLLOW_KEY = 'nettyPalFollow';
let FOLLOW = null;
function followMap(){
  if (!FOLLOW){ try { FOLLOW = JSON.parse(localStorage.getItem(FOLLOW_KEY) || '{}') || {}; } catch(e){ FOLLOW = {}; } }
  return FOLLOW;
}
function followedId(){ const id = UI.seasonId && followMap()[UI.seasonId]; return id && CUR.players.some(p => p.id === id) ? id : null; }
function setFollow(id){
  const m = followMap();
  if (id) m[UI.seasonId] = id; else delete m[UI.seasonId];
  try { localStorage.setItem(FOLLOW_KEY, JSON.stringify(m)); } catch(e){}
}
function isFollowed(id){ return !!id && id === followedId(); }
function followRow(id){ return isFollowed(id) ? 'followed-row' : ''; }

  return `<button class="pname-btn" data-action="player-open" data-player="${escapeHtml(id)}">${isFollowed(id) ? STAR + ' ' : ''}${escapeHtml(playerName(id))}</button>`;

        ${tile(r.goal, r.goal === 1 ? 'Goal' : 'Goals')}
        ${T.missGames && r.goalM + r.miss ? `<div class="rec wide"><b>${pctText(r.goalM, r.goalM + r.miss)}</b><span>Shooting accuracy</span></div>` : ''}
      </div>
      <h4 class="subhead">Positions played</h4>

          <span class="pos-chip ${POS_ZONE[pos]}">${pos}</span>

          <span class="bar-v">${minsText(r.pos[pos])} min</span></div>`).join('')}</div>` : '<p class="hint">No court time yet this season.</p>'}
      <h4 class="subhead">Game by game</h4>
      ${games.length ? `<div class="list-card">${games.map(({ g, st, r: res }) => {

            <span class="grow"><span class="pname">${escapeHtml(gameTitle(g))}</span>

            <span class="result-badge ${res.toLowerCase()}">${res[0]}</span>

  }
  return `<div class="sheet-backdrop" data-action="player-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="player-title">

        <button class="btn ghost small" data-action="player-close">Close</button></div>
      <div class="sheet-body">

          <button class="btn ${following ? 'ghost' : ''} small" data-action="follow-toggle" data-player="${escapeHtml(id)}" aria-pressed="${following}">${following ? '★ Following ' + first : '☆ Follow ' + first}</button>
          <span class="hint">${following ? 'Starred in lineups and stats on this phone. Tap to stop.' : 'Star them in lineups and stats on this phone.'}</span>
        </div>
        ${playerPrefs(pl).length ? `<p class="pref-line"><b>Preferred positions</b> ${prefChipsHtml(pl)}</p>` : ''}
        ${body}
      </div>
    </div>`;
}

// Season totals from the games that reached full time: the record, and
// per player court time, positions, goals and the games they were in.
function seasonTotals(finished){
  const rec = { w:0, l:0, d:0, gf:0, ga:0, ourShots:0, oppShots:0 };
  const players = {};
  // games: games they got on court. avail: games they were available for
  // (marked as playing, or got on court anyway), which the average divides by.
  // goalM counts goals only in games that tracked misses, so accuracy is fair.
  const P = id => players[id] || (players[id] = { id, ms:0, pos:{}, goal:0, goalM:0, miss:0, games:0, avail:0, counts:{} });
  let missGames = 0, teamGoalM = 0;
  // Extra stats: which ones were tracked in any finished game, for each side.
  const usKeys = new Set(), themKeys = new Set(), oppCounts = {};
  const results = finished.map(g => {
    const st = computeGame(g, CUR.seasonEvents[g.id]);
    usExtras(g).forEach(k => usKeys.add(k));
    themExtras(g).forEach(k => themKeys.add(k));
    Object.entries(st.oppStats).forEach(([k, v]) => { oppCounts[k] = (oppCounts[k] || 0) + v; });
    const r = resultWord(st.us, st.them);
    rec[r === 'Won' ? 'w' : r === 'Lost' ? 'l' : 'd']++;
    rec.gf += st.us; rec.ga += st.them; rec.oppShots += st.them + st.oppMiss;
    if (st.missOn){ missGames++; teamGoalM += st.us; }
    Object.entries(st.players).forEach(([id, s]) => {
      const p = P(id);
      p.ms += s.ms; p.goal += s.goal; p.miss += s.miss;
      if (st.missOn) p.goalM += s.goal;
      EXTRA_STATS.forEach(k => { if (s[k]) p.counts[k] = (p.counts[k] || 0) + s[k]; });
      if (st.missOn) rec.ourShots += s.goal + s.miss;
      if (s.ms) p.games++;
      Object.entries(s.pos).forEach(([pos, v]) => { p.pos[pos] = (p.pos[pos] || 0) + v; });
    });
    new Set([...availableIds(g), ...Object.keys(st.players).filter(id => st.players[id].ms)])
      .forEach(id => { P(id).avail++; });
    return { g, st, r };
  });
  return { rec, players, missGames, teamGoalM, usKeys, themKeys, oppCounts, results };
}

function renderSeasonStatsTab(){
  if (!CUR.loaded.games || !CUR.loaded.players) return '<div class="loading-state">Loading…</div>';
  loadSeasonEvents(false);
  if (CUR.seasonEventsError) return `<div class="panel" role="alert"><p style="margin:0 0 0.6rem">Couldn't load the season's games.</p>
    <button class="btn small" data-action="reload-stats">Try again</button></div>`;
  if (!CUR.seasonEvents) return '<div class="loading-state">Adding up the season…</div>';

  const finished = playedGames().filter(g => isGameOver(g) && CUR.seasonEvents[g.id]);
  const inProgress = playedGames().filter(g => !isGameOver(g)).length;
  if (!finished.length) return `<div class="empty-state">No games have reached full time yet.${inProgress ? ' A game is in progress: its stats will appear here at full time.' : ' Stats appear here once games are scored.'}</div>`;

  const T = seasonTotals(finished);
  const { rec, players, missGames, teamGoalM, usKeys, themKeys, oppCounts, results } = T;

  const recordCard = `<div class="record-grid">
      <div class="rec"><b>${finished.length}</b><span>Played</span></div>
      <div class="rec won"><b>${rec.w}</b><span>Won</span></div>
      <div class="rec lost"><b>${rec.l}</b><span>Lost</span></div>
      <div class="rec"><b>${rec.d}</b><span>Drawn</span></div>
      <div class="rec wide"><b>${rec.gf} : ${rec.ga}</b><span>Goals for : against</span></div>
      ${missGames ? `<div class="rec wide"><b>${pctText(teamGoalM, rec.ourShots)}</b><span>Our shooting</span></div>` : ''}
    </div>
    ${inProgress ? `<p class="hint">${inProgress} game${inProgress === 1 ? ' is' : 's are'} in progress and not included yet.</p>` : ''}`;

  const resultsList = `<h3 class="subhead">Results</h3>
    <div class="list-card">${results.slice().reverse().map(({ g, st, r }) => `
      <button class="result-row" data-action="open-game" data-game="${escapeHtml(g.id)}">
        <span class="grow"><span class="pname">${escapeHtml(gameTitle(g))}</span>
          <span class="psub">${g.round ? 'Round ' + escapeHtml(g.round) + ' · ' : ''}${escapeHtml(fmtGameWhen(g))}${g.status === 'final' ? '' : ' · not finalised'}</span></span>
        <span class="result-badge ${r.toLowerCase()}">${r} ${st.us} : ${st.them}</span>
      </button>`).join('')}</div>`;

  // Anyone who was available is listed, even if they never got on court,
  // so a player left on the bench shows up with an average of 0.
  const list = Object.values(players).filter(p => p.ms || p.goal + p.miss || p.avail)
    .sort((a, b) => playerName(a.id).localeCompare(playerName(b.id)));
  // Player, Mins and Goals to start with; "All columns" adds the rest.
  // Tap a heading to sort, or a name for that player's page.
  const all = !!UI.statsAllCols;
  const sort = UI.statsSort || { key:'name', dir:1 };
  const val = {
    name: p => playerName(p.id).toLowerCase(), mins: p => p.ms, goals: p => p.goal, games: p => p.games,
    avg: p => p.avail ? p.ms / p.avail : -1, acc: p => p.goalM + p.miss ? p.goalM / (p.goalM + p.miss) : -1
  };
  const sorted = list.slice().sort((a, b) => {
    const x = val[sort.key](a), y = val[sort.key](b);
    return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || playerName(a.id).localeCompare(playerName(b.id));
  });
  const th = (key, label) => `<th scope="col" aria-sort="${sort.key === key ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button class="sort-btn" data-action="stats-sort" data-key="${key}">${label}${sort.key === key ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  const cols = [['mins', 'Mins', p => minsText(p.ms)], ...(all ? [['games', 'Games', p => p.games], ['avg', 'Avg mins', p => p.avail ? wholeMins(p.ms / p.avail) : '·']] : []),
    ['goals', 'Goals', p => p.goal || '·'], ...(all && missGames ? [['acc', 'Accuracy', p => pctText(p.goalM, p.goalM + p.miss)]] : [])];
  const playerTable = `<h3 class="subhead">Players</h3>
    <div class="fair-wrap"><table class="fair stats-table players-table">
      <thead><tr>${th('name', 'Player')}${cols.map(([k, l]) => th(k, l)).join('')}</tr></thead>
      <tbody>${sorted.map(p => `<tr class="${followRow(p.id)}"><td>${pnameHtml(p.id)}</td>${cols.map(([, , f]) => `<td>${f(p)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="table-foot"><button class="btn ghost small" data-action="stats-cols" aria-pressed="${all}">${all ? 'Fewer columns' : 'All columns'}</button>
      <span class="hint">Tap a name for that player's games and positions.</span></div>
    ${all ? `<p class="hint">Games counts games where they got on court. Avg mins divides their court time by the games they were available for, so games they missed don't pull it down, but games on the bench do.${missGames && missGames < finished.length ? ' Accuracy only counts games where misses were tracked.' : ''}</p>` : ''}`;

  // The full position grid is for the people planning lineups. Everyone
  // can see one player's positions on their page.
  const court = isStaff() ? `<h3 class="subhead">Court time by position</h3>
    ${courtTimeTable(list, minsText)}
    <p class="hint">Total minutes in each position this season. Darker means more.</p>` : '';

  // Extra stats tracked in any game this season. Each counts only the games
  // that tracked it.
  const anyExtra = usKeys.size + themKeys.size > 0;
  const partly = finished.some(g => [...usKeys].some(k => !usExtras(g).includes(k)) || [...themKeys].some(k => !themExtras(g).includes(k)));
  const extra = anyExtra && statsViewAll() ? `<h3 class="subhead">More stats</h3>
    ${extraStatsTableHtml(list, [...usKeys], [...themKeys], oppCounts, CUR.team ? CUR.team.name : 'Our team', 'Other teams')}
    ${partly ? '<p class="hint">Some stats weren\'t tracked in every game. Each one counts only the games that tracked it.</p>' : ''}` : '';

  const fid = followedId(), fp = fid && players[fid];
  const followCard = fid ? `<button class="follow-card" data-action="player-open" data-player="${escapeHtml(fid)}">
      <span>${STAR} <b>${escapeHtml(playerName(fid))}</b></span>
      <span class="hint">${fp ? `${fp.games} game${fp.games === 1 ? '' : 's'} · ${minsText(fp.ms)} min · ${fp.goal} goal${fp.goal === 1 ? '' : 's'}` : 'No games yet'}</span>
      <span class="lc-go">See all ›</span></button>`
    : '<p class="hint follow-tip">Tip: tap your player\'s name below to follow them.</p>';
  return `${anyExtra ? statsViewHtml() : ''}${followCard}${recordCard}${seasonAwardsHtml()}${resultsList}${playerTable}${extra}${court}
    <div class="lineup-tools"><button class="btn ghost small" data-action="reload-stats">Refresh</button></div>`;
}

// Players: tap one for their stats page; Coach/Managers press and hold for

    (b.active !== false) - (a.active !== false) || (a.name || '').localeCompare(b.name || ''));

// Up to 3 preferred positions, most preferred first.
function playerPrefs(p){ return (Array.isArray(p && p.positions) ? p.positions : []).filter(x => POSITIONS.includes(x)).slice(0, 3); }
function prefChipsHtml(p){
  const prefs = playerPrefs(p);
  return prefs.length ? `<span class="pref-chips" aria-label="Preferred positions: ${prefs.join(', ')}">${prefs.map(pos =>
    `<span class="pref-chip ${POS_ZONE[pos]}" aria-hidden="true">${pos}</span>`).join('')}</span>` : '';
}
async function togglePref(playerId, pos){
  const p = CUR.players.find(x => x.id === playerId);
  if (!p || !POSITIONS.includes(pos)) return;
  const cur = playerPrefs(p);
  const next = cur.includes(pos) ? cur.filter(x => x !== pos) : cur.length >= 3 ? cur : [...cur, pos];
  await updateDoc(doc(seasonRef(), 'players', playerId), { positions:next });
}

// Has this player been in a game that started? Then deleting them would
// break past lineups and stats, so they can only be removed from the team.
function playerHasHistory(id){
  return CUR.games.some(g => (g.status || 'scheduled') !== 'scheduled' && (
    !Array.isArray(g.available) || g.available.includes(id)
    || Object.values(g.plan || {}).some(pl => Object.values(pl || {}).includes(id))
    || !!(g.summary && g.summary.courtTime && g.summary.courtTime[id])));
}
// Deletes a player who hasn't played, and takes them out of upcoming games.
async function deletePlayer(id){
  const batch = writeBatch(db);
  CUR.games.filter(g => (g.status || 'scheduled') === 'scheduled').forEach(g => {
    const upd = {};
    if (Array.isArray(g.available) && g.available.includes(id)) upd.available = g.available.filter(x => x !== id);
    Object.entries(g.plan || {}).forEach(([per, pl]) => Object.entries(pl || {}).forEach(([pos, pid]) => {
      if (pid === id) upd[`plan.${per}.${pos}`] = DELETE_FIELD;
    }));
    if (Object.keys(upd).length) batch.update(gameRef(g.id), upd);
  });
  batch.delete(doc(seasonRef(), 'players', id));
  await batch.commit();
}

/* ---------------------------------------------------------------------
   Loading data
--------------------------------------------------------------------- */
async function loadHome(){
  HOME.loaded = false;
  HOME.failed = 0;
  render();
  try {
    const snaps = await getMembershipDocs();
    const items = await Promise.all(snaps.map(async (ms) => {
      try { return await loadHomeItem(ms); }
      catch (err){
        // Keep going with the other teams; this one gets a retry prompt.
        console.warn('Netty Pal: could not load team', err);
        HOME.failed++;
        return null;
      }
    }));
    HOME.items = items.filter(Boolean).sort((a,b) =>
      a.teamName.localeCompare(b.teamName) || b.seasonName.localeCompare(a.seasonName));
  } catch (err){
    console.warn('Netty Pal: could not load teams', err);
    HOME.failed++;
    HOME.items = [];
  }
  HOME.loaded = true;
  render();
}

async function loadHomeItem(ms){
  const { teamId, seasonId } = ms;
  // Our own member record can always be read, so this is a reliable
  // test of whether we still belong to the season.
  const memberSnap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
  if (!memberSnap.exists()){
    // Definitely removed (or left): tidy up our pointer to it.
    await forgetMembershipIfGone(teamId, seasonId);
    return null;
  }
  const [teamSnap, seasonSnap] = await Promise.all([
    getDoc(doc(db, 'teams', teamId)),
    getDoc(doc(db, 'teams', teamId, 'seasons', seasonId))
  ]);
  if (!teamSnap.exists() || !seasonSnap.exists()) return null;
  const team = teamSnap.data(), season = seasonSnap.data();
  return { teamId, seasonId, teamName:team.name, seasonName:season.name, competition:season.competition,
    joinCode:season.joinCode || '', roles:memberSnap.data().roles || [], archived:!!ms.archived };
}

// Archiving a team only hides it from this person's home screen: they stay
// a member and can bring it back. It's kept on their own list of teams
// (users/{uid}/memberships), which only they can change.
async function setTeamArchived(teamId, seasonId, archived){
  await setDoc(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId, archived }, { merge:true });
  HOME.items = HOME.items.map(it => it.seasonId === seasonId ? { ...it, archived } : it);
  const it = HOME.items.find(x => x.seasonId === seasonId);
  const name = it ? it.teamName : (CUR.team && UI.seasonId === seasonId ? CUR.team.name : 'Team');
  toast(archived ? `${name} archived. Find it under "Archived teams" on your home screen.` : `${name} is back on your home screen.`);
}
function archivedBannerHtml(){
  if (!CUR.myMembership || !CUR.myMembership.archived) return '';
  return `<div class="panel" role="note"><p style="margin:0 0 0.5rem">You've archived this team, so it's hidden on your home screen.</p>
    <button class="btn small" data-action="unarchive-team" data-team="${escapeHtml(UI.teamId)}" data-season="${escapeHtml(UI.seasonId)}">Unarchive</button></div>`;

// Only forgets a season once we've confirmed our member record is really
// gone. A temporary error (bad connection, rules being updated) must never
// cost someone their link to a team.
async function forgetMembershipIfGone(teamId, seasonId){
  try {
    const snap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
    if (snap.exists()) return false;
    await deleteDoc(doc(db, 'users', USER.uid, 'memberships', seasonId));
    return true;
  } catch (err){
    console.warn('Netty Pal: membership check failed', err);
    return false;
  }
}

async function getMembershipDocs(){
  const snap = await getDocs(collection(db, 'users', USER.uid, 'memberships'));
  return snap.docs.map(d => d.data());
}

function closeSeason(){
  stopEvents();
  CUR.unsubs.forEach(u => u());
  CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{},
    events:[], eventsFor:null, eventsUnsub:null };
}

function openSeason(teamId, seasonId){
  closeSeason();
  PRACTICE = null;
  UI = { ...UI, view:'season', teamId, seasonId, tab:'games', form:null, gameId:null, showMgGuide:false, handover:null };
  saveNav();
  render();
  const seasonRef = doc(db, 'teams', teamId, 'seasons', seasonId);
  let leaving = false;
  const lostAccess = async (err) => {
    console.warn('Netty Pal: season listener', err);
    if (leaving || UI.view === 'home' || UI.seasonId !== seasonId) return;
    if (!String(err && err.code).includes('permission-denied')){ fail(err); return; }
    leaving = true;
    const gone = await forgetMembershipIfGone(teamId, seasonId);
    toast(gone ? "You're no longer a member of that season."
      : "Couldn't load that team just now. Please try again in a moment.", true);
    goHome();
  };
  CUR.unsubs.push(onSnapshot(doc(db, 'teams', teamId), (snap) => {
    CUR.team = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(doc(db, 'users', USER.uid, 'memberships', seasonId), (snap) => {
    CUR.myMembership = snap.exists() ? snap.data() : null; render();
  }, (err) => console.warn('Netty Pal: membership', err)));
  CUR.unsubs.push(onSnapshot(seasonRef, (snap) => {
    CUR.season = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'members'), (snap) => {
    CUR.members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.members = true;
    // If a Coach/Manager removed us while we're looking at the season, leave.
    // (The app owner can look at any team without being a member.)
    if (USER && !isOwner() && !CUR.members.some(m => m.id === USER.uid)) lostAccess({ code:'permission-denied' });
    else render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'players'), (snap) => {
    CUR.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.players = true;
    render();
  }, lostAccess));
  // A problem reading games (for example security rules that haven't been
  // updated for a new feature yet) is shown on the Games tab rather than
  // throwing the user out of the whole team.
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'games'), (snap) => {
    CUR.games = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.games = true;
    CUR.gamesError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: games listener', err);
    CUR.gamesError = err;
    render();
  }));
}

/* ---------------------------------------------------------------------
   Actions that change data
--------------------------------------------------------------------- */
function memberProfile(){
  return { name: USER.displayName || USER.email || 'Unknown', email: USER.email || '', photoURL: USER.photoURL || '' };
}

// Picks a code nobody else is using. The security rules only allow a
// code to be created, never overwritten, so a clash can't hijack a team.
async function uniqueCode(){
  for (let i = 0; i < 6; i++){
    const code = randomCode();
    const snap = await getDoc(doc(db, 'joinCodes', code));
    if (!snap.exists()) return code;
  }
  throw new Error("Couldn't create a unique season code. Please try again.");
}

function readSeasonFields(fd){
  const mins = parseInt(fd.get('periodMinutes'), 10);
  return {
    name: String(fd.get('seasonName') || '').trim(),
    competition: String(fd.get('competition') || '').trim(),
    format: fd.get('format') === 'halves' ? 'halves' : 'quarters',
    periodMinutes: (mins >= 1 && mins <= 30) ? mins : DEFAULT_PERIOD_MINUTES
  };
}

// Writes a new season, its code, and makes the current user a member with
// both roles. Used by "create team" and "new season". fromSeason is the
// season a new season was started from: the security rules check that the
// person was Coach/Manager there.
function addSeasonToBatch(batch, teamId, seasonId, code, fields, fromSeason){
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId),
    { ...fields, joinCode:code, createdAt:serverTimestamp(), ...(fromSeason ? { fromSeason } : {}) });
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid),
    { ...memberProfile(), roles:['coach','scorer'], joinedAt:serverTimestamp() });
  batch.set(doc(db, 'joinCodes', code), { teamId, seasonId });
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
}

async function createTeam(fd){
  const teamName = String(fd.get('teamName') || '').trim();
  const fields = readSeasonFields(fd);
  if (!teamName || !fields.name) return;
  const teamId = newId(), seasonId = newId();
  const code = await uniqueCode();
  const batch = writeBatch(db);
  batch.set(doc(db, 'teams', teamId), { name:teamName, adminUid:USER.uid, createdAt:serverTimestamp() });
  addSeasonToBatch(batch, teamId, seasonId, code, fields);
  await batch.commit();
  toast('Team created.');
  openSeason(teamId, seasonId);
  // A brand new Coach/Manager starts with the guide to what to do next.
  UI.showMgGuide = true;
  render();
}

async function joinWithCode(fd){ return joinByCode(normaliseCode(fd.get('code'))); }

async function joinByCode(code){
  if (!code) return;
  const codeSnap = await getDoc(doc(db, 'joinCodes', code));
  if (!codeSnap.exists()){ toast("That code wasn't found. Check it with your coach/manager.", true); return; }
  const { teamId, seasonId } = codeSnap.data();
  const memberRef = doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid);
  const existing = await getDoc(memberRef);
  const batch = writeBatch(db);
  if (!existing.exists()){
    // The code is stored on the member doc so the security rules can check
    // it matches the season's current code.
    batch.set(memberRef, { ...memberProfile(), roles:[], code, joinedAt:serverTimestamp() });
  }
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
  await batch.commit();
  toast(existing.exists() ? "You're already in this team." : "You're in! You can follow games and stats.");
  openSeason(teamId, seasonId);
}

function seasonRef(){ return doc(db, 'teams', UI.teamId, 'seasons', UI.seasonId); }

async function addPlayer(fd){

async function togglePlayer(playerId){

async function toggleRole(memberId, role){

  const roles = new Set(m.roles || []);

async function leaveSeason(){

async function regenerateCode(){
  const old = CUR.season.joinCode;
  const code = await uniqueCode();
  const batch = writeBatch(db);
  batch.update(seasonRef(), { joinCode: code });
  batch.set(doc(db, 'joinCodes', code), { teamId:UI.teamId, seasonId:UI.seasonId });

  await batch.commit();

// The invite is a link with the code in it (?join=CODE), so parents just
// tap it and sign in. The code is included as text too, as a fallback.
// Used from the Support Crew tab and from "Invite someone to a team" on the
// home screen, so anyone in the team can send it.
async function shareInvite(teamName, seasonName, code){
  if (!code){ toast("This team's code couldn't be found. Ask your coach/manager to send the invite.", true); return; }
  const url = `${location.origin}${location.pathname}?join=${encodeURIComponent(code)}`;
  const text = `Join ${teamName} (${seasonName}) on Netty Pal: ${url}\n\nTap the link and sign in. That's it: you don't need the code. (If the link doesn't work, open Netty Pal, tap Join with Team Code and enter ${code}.)\n\nOnce you've joined, tap "Install on your phone" in Netty Pal to put it on your home screen.`;
  if (navigator.share){
    try { await navigator.share({ title:'Netty Pal', text }); } catch(e){ /* cancelled */ }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('Invite copied. Paste it into a message.'); }
  catch(e){ toast('Copy failed. The code is ' + code, true); }
}
function shareCode(){ return shareInvite(CUR.team.name, CUR.season.name, CUR.season.joinCode); }

/* ---- Role invite links ----
   A Coach/Manager can send someone a one-time link that makes them a
   Coach/Manager or Scorer as soon as they join. It uses the same ?join=
   link as the team code, but with a much longer code (so it can't be
   guessed), which is how the two are told apart. Each link is saved twice:
   roleInvites/{code} (looked up by the person joining) and the season's
   invites/{code} (so Coach/Managers can see and cancel unused links).
   Using the link deletes both, so it only ever works once. */
const ROLE_CODE_LENGTH = 14;
const ROLE_LABEL = { coach:'Coach/Manager', scorer:'Scorer' };
function isRoleCode(code){ return String(code || '').length >= 12; }
function randomRoleCode(){
  const bytes = new Uint32Array(ROLE_CODE_LENGTH);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
}
// Which team an invite is for: the open season, unless given (the home
// screen's "Invite someone to a team" passes the team picked there).
function inviteTeam(t){
  return t || { teamId:UI.teamId, seasonId:UI.seasonId, teamName:CUR.team.name, seasonName:CUR.season.name };
}
function roleInviteText(role, code, t){
  t = inviteTeam(t);
  const url = `${location.origin}${location.pathname}?join=${encodeURIComponent(code)}`;
  return `You're invited to be a ${ROLE_LABEL[role]} for ${t.teamName} (${t.seasonName}) on Netty Pal: ${url}\n\nTap the link and sign in. This link works once, for one person, so please don't pass it on.`;
}
// Saving starts first, but the share menu opens straight away without
// waiting for it (phones only allow sharing right after a tap).
async function createRoleInvite(role, t){
  if (!ROLE_LABEL[role]) return;
  t = inviteTeam(t);
  const code = randomRoleCode();
  const batch = writeBatch(db);
  batch.set(doc(db, 'roleInvites', code), { teamId:t.teamId, seasonId:t.seasonId, role, createdAt:serverTimestamp() });
  batch.set(doc(db, 'teams', t.teamId, 'seasons', t.seasonId, 'invites', code), { role, createdAt:serverTimestamp(), createdByName:memberProfile().name });
  const saving = batch.commit();
  await sendRoleInvite(role, code, t);
  try { await saving; }
  catch (err){ fail(err); toast("That invite link couldn't be saved, so it won't work. Please try again.", true); }
}
async function sendRoleInvite(role, code, t){
  const text = roleInviteText(role, code, t);
  if (navigator.share){
    try { await navigator.share({ title:'Netty Pal', text }); } catch(e){ /* cancelled: the link stays in the list */ }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast(`${ROLE_LABEL[role]} invite copied. Send it to one person.`); }
  catch(e){ toast("Couldn't copy the invite.", true); }
}
async function cancelRoleInvite(code){
  const batch = writeBatch(db);
  batch.delete(doc(db, 'roleInvites', code));
  batch.delete(doc(seasonRef(), 'invites', code));
  await batch.commit();
  toast('Invite link cancelled. It no longer works.');
}
// Keeps the unused invite links up to date while a Coach/Manager has the
// Support Crew tab open (only they're allowed to read them).
function watchInvites(){
  if (CUR.invitesFor === UI.seasonId) return;
  if (CUR.invitesUnsub) CUR.invitesUnsub();
  CUR.invitesFor = UI.seasonId;
  CUR.invites = null;
  CUR.invitesUnsub = onSnapshot(collection(seasonRef(), 'invites'), (snap) => {
    CUR.invites = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => { console.warn('Netty Pal: invites', err); CUR.invites = []; render(); });
  CUR.unsubs.push(() => { if (CUR.invitesUnsub) CUR.invitesUnsub(); });
}
/* ---- Player awards ----
   Coach/Managers give awards after each game (joint winners are fine) and
   see the season's tally. Nobody else can see them: they're kept in the
   season's awards collection, which only Coach/Managers can read
   (firestore.rules). Up to 5 award names, "Coaches Award" to start with.
   Off by default: switched on for the season (Team Settings) or for one
   game (Game settings, which otherwise follows the season). */
const MAX_AWARDS = 5;
const DEFAULT_AWARDS = [{ id:'coaches', name:'Coaches Award' }];
function awardTypes(){ return (CUR.awardSettings && CUR.awardSettings.types && CUR.awardSettings.types.length) ? CUR.awardSettings.types : DEFAULT_AWARDS; }
// Are awards on for the season, or for this game (its own choice, else the season's)?
function seasonAwardsOn(){ return !!(CUR.awardSettings && CUR.awardSettings.enabled); }
function awardsOn(g){
  const own = CUR.awardFlags && g ? CUR.awardFlags[g.id] : undefined;
  return typeof own === 'boolean' ? own : seasonAwardsOn();
}
function watchAwards(){
  if (CUR.awardsFor === UI.seasonId || !isManager()) return;
  if (CUR.awardsUnsub) CUR.awardsUnsub();
  CUR.awardsFor = UI.seasonId;
  CUR.awards = null; CUR.awardSettings = null;
  CUR.awardsUnsub = onSnapshot(collection(seasonRef(), 'awards'), (snap) => {
    CUR.awards = {}; CUR.awardFlags = {}; CUR.awardSettings = null;
    snap.docs.forEach(d => {
      if (d.id === 'settings'){ CUR.awardSettings = d.data(); return; }
      CUR.awards[d.id] = d.data().winners || {};
      if (typeof d.data().enabled === 'boolean') CUR.awardFlags[d.id] = d.data().enabled;
    });
    render();
  }, (err) => { console.warn('Netty Pal: awards', err); CUR.awards = {}; render(); });
  CUR.unsubs.push(() => { if (CUR.awardsUnsub) CUR.awardsUnsub(); });
}
// How many of each award every player has had this season, leaving out one
// game (so the game being decided shows who hasn't had one yet).
function awardTally(exceptGameId){
  const tally = {};
  // Only games that aren't archived and have awards switched on.
  const live = new Set(CUR.games.filter(g => !g.archived && awardsOn(g)).map(g => g.id));
  Object.entries(CUR.awards || {}).forEach(([gameId, winners]) => {
    if (gameId === exceptGameId || !live.has(gameId)) return;
    Object.entries(winners).forEach(([awardId, ids]) => (ids || []).forEach(id => {
      const t = tally[id] || (tally[id] = { total:0 });
      t[awardId] = (t[awardId] || 0) + 1; t.total++;
    }));
  });
  return tally;
}
async function toggleAward(gameId, awardId, playerId){
  const winners = { ...((CUR.awards || {})[gameId] || {}) };
  const ids = new Set(winners[awardId] || []);
  if (ids.has(playerId)) ids.delete(playerId); else ids.add(playerId);
  winners[awardId] = Array.from(ids);
  await setDoc(doc(seasonRef(), 'awards', gameId), { winners }, { merge:true });
}
async function saveAwardSettings(fd){
  const old = awardTypes();
  const enabled = !!fd.get('awardsOn');
  const types = [];
  for (let i = 0; i < MAX_AWARDS; i++){
    const name = String(fd.get('award_' + i) || '').trim().slice(0, 40);
    if (!name) continue;
    types.push({ id:String(fd.get('awardId_' + i) || '') || newId(), name });
  }
  if (!types.length){ toast('Keep at least one award (you can rename it).', true); return; }
  await setDoc(doc(seasonRef(), 'awards', 'settings'), { enabled, types });
  const removed = old.filter(o => !types.some(t => t.id === o.id)).length;
  toast(!enabled ? 'Player awards are off for this season.'
    : removed ? 'Awards saved. Removed awards no longer show (past winners are kept, just hidden).' : 'Awards saved.');
}
// Team Settings: the award names (Coach/Managers only; the tab is theirs).
function awardSettingsHtml(){
  watchAwards();
  if (!CUR.awards) return '';
  const types = awardTypes();
  const rows = UI.awardRows || types.length;
  const field = i => {
    const t = types[i] || {};
    return `<div class="award-field">
        <input type="hidden" name="awardId_${i}" value="${escapeHtml(t.id || '')}">
        <input class="text-input" id="aw-name-${i}" name="award_${i}" maxlength="40" placeholder="e.g. Encouragement Award" aria-label="Award ${i + 1} name" value="${escapeHtml(t.name || '')}">
      </div>`;
  };
  const on = seasonAwardsOn();
  return `<form class="form-card" data-form="award-settings">
      <details class="more-stats" ${on || UI.awardRows ? 'open' : ''}>
        <summary>Player awards${on ? ' <span class="hint">(on)</span>' : ''}</summary>
        <label class="check-row"><input type="checkbox" id="aw-on" name="awardsOn" ${on ? 'checked' : ''}> <b>Give player awards this season</b></label>
        <p class="hint">Give awards after each game from its Game stats tab. Only Coach/Managers can see them. Each game can also switch awards on or off in its Game settings.</p>
        <div class="award-names">
          <span class="label">Awards <span class="hint">(up to ${MAX_AWARDS}; clear a name to remove it)</span></span>
          ${Array.from({ length:rows }, (_, i) => field(i)).join('')}
          ${rows < MAX_AWARDS ? '<button type="button" class="btn ghost small" data-action="award-add-row">Add an award</button>' : ''}
        </div>
        <div class="form-actions"><button type="submit" class="btn">Save awards</button></div>
      </details>
    </form>`;
}
// Game stats (Coach/Managers only): pick winners for each award. Anyone who
// hasn't had that award yet this season is listed first and marked.
function gameAwardsHtml(g){
  if (!isManager() || isPractice(g) || g.bye) return '';
  watchAwards();
  if (!CUR.awards || !awardsOn(g)) return '';
  const winners = CUR.awards[g.id] || {};
  const tally = awardTally(g.id);
  const st = g.id === CUR.eventsFor ? computeGame(g, CUR.events) : { players:{} };
  const played = Array.from(new Set([...availableIds(g), ...Object.keys(st.players).filter(id => st.players[id].ms)]))
    .filter(id => CUR.players.some(p => p.id === id));
  const types = awardTypes();
  return `<h3 class="subhead">Awards <span class="hint" style="font-family:var(--font-body); text-transform:none">(only Coach/Managers see these)</span></h3>
    ${types.map(t => {
      const chosen = new Set(winners[t.id] || []);
      const order = played.slice().sort((a, b) => ((tally[a] || {})[t.id] || 0) - ((tally[b] || {})[t.id] || 0) || playerName(a).localeCompare(playerName(b)));
      return `<div class="panel award-panel">
          <h4>${escapeHtml(t.name)}${chosen.size ? ': ' + escapeHtml(Array.from(chosen).map(playerName).join(', ')) : ''}</h4>
          <div class="chip-wrap">${order.map(id => {
            const had = (tally[id] || {})[t.id] || 0;
            return `<button class="award-chip ${chosen.has(id) ? 'on' : ''}" data-action="award-toggle" data-game="${escapeHtml(g.id)}" data-award="${escapeHtml(t.id)}" data-player="${escapeHtml(id)}" aria-pressed="${chosen.has(id)}">
              ${escapeHtml(playerName(id))}${had ? ` <span class="award-count">${had}</span>` : ' <span class="award-new">not yet</span>'}</button>`;
          }).join('') || '<span class="hint">No players marked as playing.</span>'}</div>
        </div>`;
    }).join('')}
    <p class="hint">Tap a name to give the award, again to take it back. Joint winners are fine. The number is how many times they've had it this season; "not yet" means never.</p>`;
}
// Game settings: awards on or off for this game. Ticked to match the
// season to start with; saving the same as the season removes the game's
// own choice, so it follows the season again.
function gameAwardsFieldHtml(g){
  if (!isManager()) return '';
  watchAwards();
  if (!CUR.awards) return '';
  return `<div class="more-stats"><label class="check-row"><input type="checkbox" id="eg-awards" name="awardsOn" ${awardsOn(g) ? 'checked' : ''}>
      <b>Player awards for this game</b></label>
    <p class="hint" style="margin:0.3rem 0 0">Only Coach/Managers see awards. The season's setting (${seasonAwardsOn() ? 'on' : 'off'}) is ticked to start with.</p>
    <input type="hidden" name="awardsField" value="1"></div>`;
}
async function saveGameAwardsChoice(gameId, fd){
  if (!fd.get('awardsField')) return;
  const on = !!fd.get('awardsOn');
  const same = on === seasonAwardsOn();
  const had = CUR.awardFlags && typeof CUR.awardFlags[gameId] === 'boolean';

}

// Season Stats (Coach/Managers only): awards per player, and who's yet to get one.
function seasonAwardsHtml(){
  if (!isManager()) return '';
  watchAwards();
  // Shown when awards are on for the season, or any game has its own awards.
  if (!CUR.awards || !(seasonAwardsOn() || CUR.games.some(g => !g.archived && awardsOn(g)))) return '';
  const tally = awardTally(null);
  const types = awardTypes();
  const players = CUR.players.filter(p => p.active !== false || tally[p.id]).map(p => p.id).sort((a, b) => playerName(a).localeCompare(playerName(b)));
  const none = players.filter(id => !(tally[id] || {}).total);
  return `<h3 class="subhead">Season awards <span class="hint" style="font-family:var(--font-body); text-transform:none">(only Coach/Managers see these)</span></h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Player</th>${types.map(t => `<th scope="col">${escapeHtml(t.name)}</th>`).join('')}${types.length > 1 ? '<th scope="col">Total</th>' : ''}</tr></thead>
      <tbody>${players.map(id => `<tr class="${(tally[id] || {}).total ? '' : 'no-time'}"><td>${escapeHtml(playerName(id))}</td>
        ${types.map(t => `<td>${(tally[id] || {})[t.id] || '·'}</td>`).join('')}${types.length > 1 ? `<td class="total">${(tally[id] || {}).total || 0}</td>` : ''}</tr>`).join('')}</tbody>
    </table></div>

// Accepting a role invite: join (or, if already in the season, add the
// role) and use up the link, all in one save.
async function acceptRoleInvite(inv){
  const { code, role, teamId, seasonId } = inv;
  const memberRef = doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid);
  const existing = await getDoc(memberRef);
  const batch = writeBatch(db);
  if (existing.exists()){
    const roles = Array.from(new Set([...(existing.data().roles || []), role]));
    batch.update(memberRef, { roles, invite:code });
  } else {
    batch.set(memberRef, { ...memberProfile(), roles:[role], invite:code, joinedAt:serverTimestamp() });
  }
  batch.delete(doc(db, 'roleInvites', code));
  batch.delete(doc(db, 'teams', teamId, 'seasons', seasonId, 'invites', code));
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
  await batch.commit();
  toast(`You're now a ${ROLE_LABEL[role]} for ${inv.teamName}.`);
  openSeason(teamId, seasonId);
}
