/* ---------------------------------------------------------------------
   Summaries (step 3): one game, and the season to date.
--------------------------------------------------------------------- */
function pctText(goals, shots){ return shots ? Math.round(100 * goals / shots) + '%' : '·'; }
function resultWord(us, them){ return us > them ? 'Won' : us < them ? 'Lost' : 'Drew'; }
function minsText(ms){ return ms ? String(Math.round(ms / 60000)) : '·'; }
// Court time in whole minutes (0 shows as 0).
function wholeMins(ms){ return String(Math.round((ms || 0) / 60000)); }

// Court time table: minutes per position for each player, plus a total.
// fmt turns milliseconds into what's shown in each cell.
function courtTimeTable(rows, fmt, playingIds){
  const max = Math.max(1, ...rows.flatMap(r => POSITIONS.map(pos => r.pos[pos] || 0)));
  const body = rows.map(r => `<tr class="${playingIds && playingIds.has(r.id) && !r.ms ? 'no-time' : ''}">
      <td>${escapeHtml(playerName(r.id))}</td>
      ${POSITIONS.map(pos => {
        const v = r.pos[pos] || 0;
        const shade = v ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * v / max)}%, transparent)"` : '';
        return `<td ${shade}>${v ? fmt(v) : '·'}</td>`;
      }).join('')}
      <td class="total">${r.ms ? fmt(r.ms) : '0'}</td>
    </tr>`).join('');
  return `<div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 2}">Nobody has been on court yet.</td></tr>`}</tbody>
    </table></div>`;
}

// Where an unfinished game is up to, e.g. "Q2 · 4:12 left". The time
// counts down live (the clock ticker updates every [data-clock]).
function progressLineHtml(g){
  const L = g.live;
  if (!L || !L.period) return '';
  const q = escapeHtml(periodName(g, L.period));
  // At a break the heading already says "Half time" etc.
  if (!isInPlay(g)) return '';
  if (isTimeUp(g)) return `<div class="progress-line">${q} · Time</div>`;
  return `<div class="progress-line">${q} · <span data-clock>${fmtClock(periodMs(g) - elapsedMs(g))}</span> left${L.phase === 'paused' ? ' · clock paused' : ''}</div>`;
}

function renderSummaryTab(g){
  if (!CUR.loaded.events) return '<div class="loading-state">Loading…</div>';
  const st = computeGame(g, CUR.events);
  const n = periodCount(g), over = isGameOver(g);
  const res = resultWord(st.us, st.them);

  const head = `<div class="result-card ${over ? res.toLowerCase() : ''}">
      <div class="result-word">${over ? res : escapeHtml(gameStage(g))}</div>
      <div class="result-score">
        <span>${escapeHtml(teamLabel(g, 'us'))}</span><b>${st.us}</b><i aria-hidden="true">:</i><b>${st.them}</b><span>${escapeHtml(teamLabel(g, 'them'))}</span>
      </div>
      ${g.status === 'live' && over ? '<div class="hint">Full time. Not finalised yet.</div>' : ''}
      ${!over ? progressLineHtml(g) : ''}
    </div>`;

  const periods = Array.from({ length:n }, (_, i) => i + 1);
  const cell = (p, side) => st.byPeriod[p] ? st.byPeriod[p][side] : '·';
  const byPeriod = `<h3 class="subhead">Score by ${escapeHtml(periodNoun(g))}</h3>
    <div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Team</th>${periods.map(p => `<th scope="col">${escapeHtml(periodName(g, p))}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>
        <tr><td>${escapeHtml(teamLabel(g, 'us'))}</td>${periods.map(p => `<td>${cell(p, 'us')}</td>`).join('')}<td class="total">${st.us}</td></tr>
        <tr><td>${escapeHtml(teamLabel(g, 'them'))}</td>${periods.map(p => `<td>${cell(p, 'them')}</td>`).join('')}<td class="total">${st.them}</td></tr>
      </tbody>
    </table></div>`;

  // Shooting: who shot, from which positions, and how accurately.
  const shooterPos = {};
  CUR.events.filter(e => !e.undone && (e.type === 'goal' || e.type === 'miss') && e.playerId && e.pos)
    .forEach(e => { (shooterPos[e.playerId] = shooterPos[e.playerId] || new Set()).add(e.pos); });
  const shooters = Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .sort((a, b) => b[1].goal - a[1].goal || playerName(a[0]).localeCompare(playerName(b[0])));
  const ourShots = st.us + shooters.reduce((s, [, r]) => s + r.miss, 0);
  const oppRows = ['GS', 'GA', 'Team'].filter(k => st.opp[k].goal + st.opp[k].miss);
  const shooting = `<h3 class="subhead">Shooting</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Shooter</th><th scope="col">Pos</th><th scope="col">Goals</th><th scope="col">Accuracy</th></tr></thead>
      <tbody>
        ${shooters.map(([id, r]) => `<tr><td>${escapeHtml(playerName(id))}</td><td>${escapeHtml(Array.from(shooterPos[id] || []).join(', '))}</td>
          <td>${r.goal}/${r.goal + r.miss}</td><td>${pctText(r.goal, r.goal + r.miss)}</td></tr>`).join('')}
        <tr class="team-total"><td>${escapeHtml(teamLabel(g, 'us'))}</td><td></td><td>${st.us}/${ourShots}</td><td>${pctText(st.us, ourShots)}</td></tr>
        ${oppRows.some(k => k !== 'Team') ? oppRows.map(k => `<tr class="opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td>${k}</td>
          <td>${st.oppMiss ? st.opp[k].goal + '/' + (st.opp[k].goal + st.opp[k].miss) : st.opp[k].goal}</td><td>${st.oppMiss ? pctText(st.opp[k].goal, st.opp[k].goal + st.opp[k].miss) : '·'}</td></tr>`).join('') : ''}
        <tr class="team-total opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td></td><td>${st.oppMiss ? st.them + '/' + (st.them + st.oppMiss) : st.them}</td><td>${st.oppMiss ? pctText(st.them, st.them + st.oppMiss) : '·'}</td></tr>
      </tbody>
    </table></div>
    `;

  const playing = new Set(availableIds(g));
  const ids = byName(Array.from(new Set([...Object.keys(st.players).filter(id => st.players[id].ms), ...playing])));
  // Least court time first, so anyone who's missed out stands out.
  const rows = ids.map(id => ({ id, ms:(st.players[id] || {}).ms || 0, pos:(st.players[id] || {}).pos || {} }))
    .sort((a, b) => a.ms - b.ms);
  const benched = rows.filter(r => !r.ms && playing.has(r.id)).length;
  const court = `<h3 class="subhead">Court time</h3>
    ${courtTimeTable(rows, wholeMins, playing)}
    <p class="hint">Minutes in each position.${benched ? ` ${benched} player${benched === 1 ? ' was' : 's were'} marked as playing but didn't get on court (highlighted).` : ''}</p>`;

  prepareShare(g, st);
  const share = `<div class="lineup-tools" style="justify-content:center">
      <button class="btn" data-action="share-summary">${over ? 'Share result' : 'Share score'}</button>
    </div>`;
  return head + share + byPeriod + shooting + court;
}

/* ---- Sharing a game result ----
   A picture card plus a short text version, for team group chats. Court
   time is deliberately left out of what's shared. The picture is made in
   advance (while the Game stats tab is open), because iPhones only allow
   sharing straight after a tap. */
function summaryShareText(g, st){
  const n = periodCount(g), over = isGameOver(g);
  const lines = [`${teamLabel(g, 'us')} ${st.us} : ${st.them} ${teamLabel(g, 'them')}`];
  lines.push([over ? `${resultWord(st.us, st.them)} (full time)` : gameStage(g), g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : '']
    .filter(Boolean).join(' · '));
  const periods = [];
  for (let p = 1; p <= n; p++) if (st.byPeriod[p]) periods.push(`${periodName(g, p)} ${st.byPeriod[p].us}:${st.byPeriod[p].them}`);
  if (periods.length) lines.push(periods.join(' · '));
  const shooters = shareShooters(st);
  if (shooters.length){
    const shots = shooters.reduce((s, x) => s + x.shots, 0);
    lines.push(`Shooting: ${shooters.map(x => `${x.name} ${x.goals}/${x.shots}`).join(', ')} (${st.us}/${shots}, ${pctText(st.us, shots)})`);
  }
  return lines.join('\n');
}

// e.g. "Sat 1 May" (no year or time), for the shared result.
function shareDate(g){
  const d = parseIsoDate(g.date);
  return d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }).replace(/,/g, '') : '';
}

function shareShooters(st){
  return Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .map(([id, r]) => ({ name:playerName(id), goals:r.goal, shots:r.goal + r.miss }))
    .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
}

// Draws the result card as a 1080 x 1080 picture and returns it as a PNG.
async function summaryImage(g, st){
  try {
    await Promise.all([
      document.fonts.load('900 100px Archivo'),
      document.fonts.load('700 40px "DM Sans"'),
      document.fonts.load('800 40px "DM Sans"')
    ]);
  } catch(e){ /* falls back to system fonts */ }
  const W = 1080, c = document.createElement('canvas');
  c.width = W; c.height = W;
  const x = c.getContext('2d');
  x.fontStretch = 'extra-condensed'; // narrow Archivo headings, like the app (DM Sans has no narrow width)
  const display = (size, weight) => `${weight || 900} ${size}px Archivo, "Arial Narrow", sans-serif`;
  const body = (size, weight) => `${weight || 700} ${size}px "DM Sans", "Segoe UI", sans-serif`;
  const fit = (text, max) => { let t = String(text); while (t.length > 1 && x.measureText(t).width > max) t = t.slice(0, -2) + '…'; return t; };
  const over = isGameOver(g), res = resultWord(st.us, st.them);

  // Background and header band.
  x.fillStyle = '#F5F5F6'; x.fillRect(0, 0, W, W);
  // Ink band with white text, like the app's top bar.
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, 150);
  // The black and white stripe under the bar.
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 150, W, 12);
  x.fillStyle = '#0B0B0D'; for (let sx = 12; sx < W; sx += 24) x.fillRect(sx, 150, 12, 12);
  // Ball: the same white netball with pink seams as the logo.
  drawBall(x, 95, 75, 42);
  x.fillStyle = '#FFFFFF'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.font = display(58); x.fillText('NETTY PAL', 160, 78);
  x.fillStyle = '#B4B4BC'; x.textAlign = 'right'; x.font = body(34);
  x.fillText(fit([g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : ''].filter(Boolean).join(' · '), 560), W - 60, 78);

  // Result word.
  x.textAlign = 'center';
  x.fillStyle = !over ? '#C8641C' : res === 'Won' ? '#2E7550' : res === 'Lost' ? '#B3261E' : '#0B0B0D';
  // How far through the game: the result at full time, otherwise e.g.
  // "Half time" or "Q3 in play", with a smaller line under it to match.
  const headline = (over ? res : gameStage(g)).toUpperCase();
  let hs = 90;
  x.font = display(hs);
  while (hs > 50 && x.measureText(headline).width > W - 120){ hs -= 4; x.font = display(hs); }
  x.fillText(headline, W / 2, 240);
  x.fillStyle = '#5F5F66'; x.font = body(30, 800);
  x.fillText(over ? 'FULL TIME' : 'SCORE SO FAR', W / 2, 305);

  // Teams and score. Team names are never cut short: long ones get a
  // smaller font, and wrap onto a second line if still too wide.
  const teamName = (name, cx) => {
    const max = 440, text = String(name).toUpperCase();
    let size = 40;
    x.font = body(size, 800);
    while (size > 30 && x.measureText(text).width > max){ size -= 2; x.font = body(size, 800); }
    if (x.measureText(text).width <= max){ x.fillText(text, cx, 370); return; }
    const words = text.split(' '), lines = [''];
    words.forEach(w => {
      const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
      if (x.measureText(tryLine).width <= max || !lines[lines.length - 1]) lines[lines.length - 1] = tryLine;
      else lines.push(w);
    });
    const shown = lines.slice(0, 2);
    if (lines.length > 2) shown[1] = lines.slice(1).join(' ');
    shown.forEach((line, i) => x.fillText(line, cx, 370 + (i - (shown.length - 1) / 2) * (size + 4)));
  };
  x.fillStyle = '#5F5F66';
  teamName(teamLabel(g, 'us'), 290);
  teamName(teamLabel(g, 'them'), 790);
  x.fillStyle = '#0B0B0D'; x.font = display(240);
  x.fillText(String(st.us), 290, 520); x.fillText(String(st.them), 790, 520);
  x.fillStyle = '#A6A6AE'; x.font = display(150); x.fillText(':', W / 2, 505);

  // Score by period.
  const n = periodCount(g), boxW = 200, gap = 20, left = (W - (n * boxW + (n - 1) * gap)) / 2;
  for (let p = 1; p <= n; p++){
    const bx = left + (p - 1) * (boxW + gap);
    x.fillStyle = '#FFFFFF'; x.strokeStyle = '#E1E1E5'; x.lineWidth = 3;
    x.beginPath(); x.roundRect(bx, 660, boxW, 150, 6); x.fill(); x.stroke();
    x.fillStyle = '#C2005E'; x.font = display(44); x.fillText(periodName(g, p).toUpperCase(), bx + boxW / 2, 705);
    x.fillStyle = '#0B0B0D'; x.font = display(64);
    x.fillText(st.byPeriod[p] ? `${st.byPeriod[p].us} : ${st.byPeriod[p].them}` : '-', bx + boxW / 2, 770);
  }

  // Shooters.
  const shooters = shareShooters(st);
  if (shooters.length){
    x.fillStyle = '#5F5F66'; x.font = body(32, 800); x.fillText('SHOOTING', W / 2, 880);
    x.fillStyle = '#0B0B0D'; x.font = body(40);
    const shots = shooters.reduce((s, y) => s + y.shots, 0);
    x.fillText(fit(shooters.map(s => `${s.name} ${s.goals}/${s.shots}`).join('   ·   '), W - 120), W / 2, 940);
    x.fillStyle = '#5F5F66'; x.font = body(32);
    x.fillText(`Team ${st.us}/${shots} (${pctText(st.us, shots)})`, W / 2, 1000);
  }
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('No image')), 'image/png'));
}

function prepareShare(g, st){
  const text = summaryShareText(g, st);
  const key = g.id + '|' + text;
  if (CUR.share && CUR.share.key === key) return;
  const share = { key, text, file:null };
  share.ready = summaryImage(g, st).then(blob => {
    const name = `netty-pal-${nameKey(teamLabel(g, 'us')).replace(/ /g, '-')}-v-${nameKey(teamLabel(g, 'them')).replace(/ /g, '-')}.png`;
    share.file = new File([blob], name, { type:'image/png' });
  }).catch(err => console.warn('Netty Pal: share image', err));
  CUR.share = share;
}

async function shareSummary(g){
  const st = computeGame(g, CUR.events);
  prepareShare(g, st);
  // If the picture is still being made (Share tapped straight away), wait a
  // moment for it; any longer and phones may not allow the share any more.
  if (!CUR.share.file && CUR.share.ready)
    await Promise.race([CUR.share.ready, new Promise(r => setTimeout(r, 1000))]);
  const { text, file } = CUR.share;
  const title = `${teamLabel(g, 'us')} v ${teamLabel(g, 'them')}`;
  // Phones: the share menu, with the picture if the phone allows it.
  if (file && navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], text, title }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  if (navigator.share){
    try { await navigator.share({ title, text }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  // Computers: copy the text and save the picture.
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch(e){}
  if (file){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast(copied ? `Result copied${file ? ' and picture saved' : ''}. Paste it into a message.` : (file ? 'Picture saved.' : text));
}

// Loads the events of every game played so far this season (only while
// the Stats tab is open), so the season totals are worked out exactly the
// same way as each game's own summary.
function playedGames(){ return sortGames(CUR.games).filter(g => !g.archived && (g.status === 'live' || g.status === 'final')); }
function loadSeasonEvents(force){
  const games = playedGames();
  const key = games.map(g => `${g.id}:${g.status}:${g.summary ? g.summary.us + '-' + g.summary.them : ''}:${g.live ? g.live.period + g.live.phase : ''}`).join('|');
  if (!force && (CUR.seasonEventsKey === key || CUR.seasonEventsLoading)) return;
  CUR.seasonEventsKey = key;
  CUR.seasonEventsLoading = true;
  CUR.seasonEventsError = null;
  const seasonId = UI.seasonId;
  Promise.all(games.map(g => getDocs(eventsRef(g.id)).then(snap => [g.id, snap.docs.map(d => ({ id:d.id, ...d.data() }))])))
    .then(pairs => { if (UI.seasonId !== seasonId) return; CUR.seasonEvents = Object.fromEntries(pairs); })
    .catch(err => { console.warn('Netty Pal: season events', err); CUR.seasonEventsError = err; })
    .finally(() => { CUR.seasonEventsLoading = false; render(); });
}

function renderSeasonStatsTab(){
  if (!CUR.loaded.games || !CUR.loaded.players) return '<div class="loading-state">Loading…</div>';
  loadSeasonEvents(false);
  if (CUR.seasonEventsError) return `<div class="panel" role="alert"><p style="margin:0 0 0.6rem">Couldn't load the season's games.</p>
    <button class="btn small" data-action="reload-stats">Try again</button></div>`;
  if (!CUR.seasonEvents) return '<div class="loading-state">Adding up the season…</div>';

  const finished = playedGames().filter(g => isGameOver(g) && CUR.seasonEvents[g.id]);
  const inProgress = playedGames().filter(g => !isGameOver(g)).length;
  if (!finished.length) return `<div class="empty-state">No games have reached full time yet.${inProgress ? ' A game is in progress: its stats will appear here at full time.' : ' Stats appear here once games are scored.'}</div>`;

  const rec = { w:0, l:0, d:0, gf:0, ga:0, ourShots:0, oppShots:0 };
  const players = {};
  // games: games they got on court. avail: games they were available for
  // (marked as playing, or got on court anyway), which the average divides by.
  const P = id => players[id] || (players[id] = { id, ms:0, pos:{}, goal:0, miss:0, games:0, avail:0 });
  const results = finished.map(g => {
    const st = computeGame(g, CUR.seasonEvents[g.id]);
    const r = resultWord(st.us, st.them);
    rec[r === 'Won' ? 'w' : r === 'Lost' ? 'l' : 'd']++;
    rec.gf += st.us; rec.ga += st.them; rec.oppShots += st.them + st.oppMiss;
    Object.entries(st.players).forEach(([id, s]) => {
      const p = P(id);
      p.ms += s.ms; p.goal += s.goal; p.miss += s.miss;
      rec.ourShots += s.goal + s.miss;
      if (s.ms) p.games++;
      Object.entries(s.pos).forEach(([pos, v]) => { p.pos[pos] = (p.pos[pos] || 0) + v; });
    });
    new Set([...availableIds(g), ...Object.keys(st.players).filter(id => st.players[id].ms)])
      .forEach(id => { P(id).avail++; });
    return { g, st, r };
  });

  const recordCard = `<div class="record-grid">
      <div class="rec"><b>${finished.length}</b><span>Played</span></div>
      <div class="rec won"><b>${rec.w}</b><span>Won</span></div>
      <div class="rec lost"><b>${rec.l}</b><span>Lost</span></div>
      <div class="rec"><b>${rec.d}</b><span>Drawn</span></div>
      <div class="rec wide"><b>${rec.gf} : ${rec.ga}</b><span>Goals for : against</span></div>
      <div class="rec wide"><b>${pctText(rec.gf, rec.ourShots)}</b><span>Our shooting</span></div>
    </div>
    ${inProgress ? `<p class="hint">${inProgress} game${inProgress === 1 ? ' is' : 's are'} in progress and not included yet.</p>` : ''}`;

  const resultsList = `<h3 class="subhead">Results</h3>
    <div class="list-card">${results.slice().reverse().map(({ g, st, r }) => `
      <button class="result-row" data-action="open-game" data-game="${escapeHtml(g.id)}">
        <span class="grow"><span class="pname">${escapeHtml(gameTitle(g))}</span>
          <span class="psub">${g.round ? 'Round ' + escapeHtml(g.round) + ' · ' : ''}${escapeHtml(fmtGameWhen(g))}${g.status === 'final' ? '' : ' · not finalised'}</span></span>
        <span class="result-badge ${r.toLowerCase()}">${r} ${st.us} : ${st.them}</span>
      </button>`).join('')}</div>`;

  // Anyone who was available is listed, even if they never got on court,
  // so a player left on the bench shows up with an average of 0.
  const list = Object.values(players).filter(p => p.ms || p.goal + p.miss || p.avail)
    .sort((a, b) => playerName(a.id).localeCompare(playerName(b.id)));
  const playerTable = `<h3 class="subhead">Players</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Player</th><th scope="col">Games</th><th scope="col">Mins</th><th scope="col">Avg mins played per game available</th><th scope="col">Goals</th><th scope="col">Accuracy</th></tr></thead>
      <tbody>${list.map(p => `<tr><td>${escapeHtml(playerName(p.id))}</td><td>${p.games}</td><td>${minsText(p.ms)}</td><td>${p.avail ? wholeMins(p.ms / p.avail) : '·'}</td>
        <td>${p.goal + p.miss ? p.goal + '/' + (p.goal + p.miss) : '·'}</td><td>${pctText(p.goal, p.goal + p.miss)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="hint">Games counts games where they got on court. Mins is total court time. The average divides their court time by the games they were available for, so games they missed don't pull it down, but games spent on the bench do.</p>`;

  const court = `<h3 class="subhead">Court time by position</h3>
    ${courtTimeTable(list, minsText)}
    <p class="hint">Total minutes in each position this season. Darker means more.</p>`;

  return `${recordCard}${resultsList}${playerTable}${court}
    <div class="lineup-tools"><button class="btn ghost small" data-action="reload-stats">Refresh</button></div>`;
}

/* ---------------------------------------------------------------------
   Loading data
--------------------------------------------------------------------- */
async function loadHome(){
  HOME.loaded = false;
  HOME.failed = 0;
  render();
  try {
    const snaps = await getMembershipDocs();
    const items = await Promise.all(snaps.map(async (ms) => {
      try { return await loadHomeItem(ms); }
      catch (err){
        // Keep going with the other teams; this one gets a retry prompt.
        console.warn('Netty Pal: could not load team', err);
        HOME.failed++;
        return null;
      }
    }));
    HOME.items = items.filter(Boolean).sort((a,b) =>
      a.teamName.localeCompare(b.teamName) || b.seasonName.localeCompare(a.seasonName));
  } catch (err){
    console.warn('Netty Pal: could not load teams', err);
    HOME.failed++;
    HOME.items = [];
  }
  HOME.loaded = true;
  render();
}

async function loadHomeItem(ms){
  const { teamId, seasonId } = ms;
  // Our own member record can always be read, so this is a reliable
  // test of whether we still belong to the season.
  const memberSnap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
  if (!memberSnap.exists()){
    // Definitely removed (or left): tidy up our pointer to it.
    await forgetMembershipIfGone(teamId, seasonId);
    return null;
  }
  const [teamSnap, seasonSnap] = await Promise.all([
    getDoc(doc(db, 'teams', teamId)),
    getDoc(doc(db, 'teams', teamId, 'seasons', seasonId))
  ]);
  if (!teamSnap.exists() || !seasonSnap.exists()) return null;
  const team = teamSnap.data(), season = seasonSnap.data();
  return { teamId, seasonId, teamName:team.name, seasonName:season.name, competition:season.competition,
    joinCode:season.joinCode || '', roles:memberSnap.data().roles || [] };
}

// Only forgets a season once we've confirmed our member record is really
// gone. A temporary error (bad connection, rules being updated) must never
// cost someone their link to a team.
async function forgetMembershipIfGone(teamId, seasonId){
  try {
    const snap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
    if (snap.exists()) return false;
    await deleteDoc(doc(db, 'users', USER.uid, 'memberships', seasonId));
    return true;
  } catch (err){
    console.warn('Netty Pal: membership check failed', err);
    return false;
  }
}

async function getMembershipDocs(){
  const snap = await getDocs(collection(db, 'users', USER.uid, 'memberships'));
  return snap.docs.map(d => d.data());
}

  saveNav();
  render();
  const seasonRef = doc(db, 'teams', teamId, 'seasons', seasonId);
  let leaving = false;
  const lostAccess = async (err) => {
    console.warn('Netty Pal: season listener', err);
    if (leaving || UI.view === 'home' || UI.seasonId !== seasonId) return;
    if (!String(err && err.code).includes('permission-denied')){ fail(err); return; }
    leaving = true;
    const gone = await forgetMembershipIfGone(teamId, seasonId);
    toast(gone ? "You're no longer a member of that season."
      : "Couldn't load that team just now. Please try again in a moment.", true);
    goHome();
  };
  CUR.unsubs.push(onSnapshot(doc(db, 'teams', teamId), (snap) => {
    CUR.team = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(seasonRef, (snap) => {
    CUR.season = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'members'), (snap) => {
    CUR.members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.members = true;
    // If a Coach/Manager removed us while we're looking at the season, leave.
    // (The app owner can look at any team without being a member.)
    if (USER && !isOwner() && !CUR.members.some(m => m.id === USER.uid)) lostAccess({ code:'permission-denied' });
    else render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'players'), (snap) => {
    CUR.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.players = true;
    render();
  }, lostAccess));
  // A problem reading games (for example security rules that haven't been
  // updated for a new feature yet) is shown on the Games tab rather than
  // throwing the user out of the whole team.
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'games'), (snap) => {
    CUR.games = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.games = true;
    CUR.gamesError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: games listener', err);
    CUR.gamesError = err;
    render();
  }));
}

function memberProfile(){

// Picks a code nobody else is using. The security rules only allow a
// code to be created, never overwritten, so a clash can't hijack a team.
async function uniqueCode(){
  for (let i = 0; i < 6; i++){
    const code = randomCode();
    const snap = await getDoc(doc(db, 'joinCodes', code));
    if (!snap.exists()) return code;
  }
  throw new Error("Couldn't create a unique season code. Please try again.");
}

function readSeasonFields(fd){
  const mins = parseInt(fd.get('periodMinutes'), 10);
  return {
    name: String(fd.get('seasonName') || '').trim(),
    competition: String(fd.get('competition') || '').trim(),
    format: fd.get('format') === 'halves' ? 'halves' : 'quarters',
    periodMinutes: (mins >= 1 && mins <= 30) ? mins : DEFAULT_PERIOD_MINUTES
  };
}

// Writes a new season, its code, and makes the current user a member with
// both roles. Used by "create team" and "new season". fromSeason is the
// season a new season was started from: the security rules check that the
// person was Coach/Manager there.
function addSeasonToBatch(batch, teamId, seasonId, code, fields, fromSeason){
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId),
    { ...fields, joinCode:code, createdAt:serverTimestamp(), ...(fromSeason ? { fromSeason } : {}) });
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid),
    { ...memberProfile(), roles:['coach','scorer'], joinedAt:serverTimestamp() });
  batch.set(doc(db, 'joinCodes', code), { teamId, seasonId });
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
}

async function createTeam(fd){
  const teamName = String(fd.get('teamName') || '').trim();
  const fields = readSeasonFields(fd);
  if (!teamName || !fields.name) return;
  const teamId = newId(), seasonId = newId();
  const code = await uniqueCode();
  const batch = writeBatch(db);
  batch.set(doc(db, 'teams', teamId), { name:teamName, adminUid:USER.uid, createdAt:serverTimestamp() });
  addSeasonToBatch(batch, teamId, seasonId, code, fields);
  await batch.commit();
  toast('Team created.');
  openSeason(teamId, seasonId);
  // A brand new Coach/Manager starts with the guide to what to do next.
  UI.showMgGuide = true;
  render();
}

async function joinWithCode(fd){ return joinByCode(normaliseCode(fd.get('code'))); }

async function joinByCode(code){
  if (!code) return;
  const codeSnap = await getDoc(doc(db, 'joinCodes', code));
  if (!codeSnap.exists()){ toast("That code wasn't found. Check it with your coach/manager.", true); return; }
  const { teamId, seasonId } = codeSnap.data();
  const memberRef = doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid);
  const existing = await getDoc(memberRef);
  const batch = writeBatch(db);
  if (!existing.exists()){
    // The code is stored on the member doc so the security rules can check
    // it matches the season's current code.
    batch.set(memberRef, { ...memberProfile(), roles:[], code, joinedAt:serverTimestamp() });
  }
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
  await batch.commit();
  toast(existing.exists() ? "You're already in this team." : "You're in! You can follow games and stats.");
  openSeason(teamId, seasonId);
}

// The invite is a link with the code in it (?join=CODE), so parents just
// tap it and sign in. The code is included as text too, as a fallback.
// Used from the Support Crew tab and from "Invite someone to a team" on the
// home screen, so anyone in the team can send it.
async function shareInvite(teamName, seasonName, code){
  if (!code){ toast("This team's code couldn't be found. Ask your coach/manager to send the invite.", true); return; }
  const url = `${location.origin}${location.pathname}?join=${encodeURIComponent(code)}`;
  const text = `Join ${teamName} (${seasonName}) on Netty Pal: ${url}\n\nTap the link and sign in. That's it: you don't need the code. (If the link doesn't work, open Netty Pal, tap Join with Team Code and enter ${code}.)\n\nOnce you've joined, tap "Install on your phone" in Netty Pal to put it on your home screen.`;
  if (navigator.share){
    try { await navigator.share({ title:'Netty Pal', text }); } catch(e){ /* cancelled */ }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('Invite copied. Paste it into a message.'); }
  catch(e){ toast('Copy failed. The code is ' + code, true); }
}
function shareCode(){ return shareInvite(CUR.team.name, CUR.season.name, CUR.season.joinCode); }

/* ---- Role invite links ----
   A Coach/Manager can send someone a one-time link that makes them a
   Coach/Manager or Scorer as soon as they join. It uses the same ?join=
   link as the team code, but with a much longer code (so it can't be
   guessed), which is how the two are told apart. Each link is saved twice:
   roleInvites/{code} (looked up by the person joining) and the season's
   invites/{code} (so Coach/Managers can see and cancel unused links).
   Using the link deletes both, so it only ever works once. */
const ROLE_CODE_LENGTH = 14;
const ROLE_LABEL = { coach:'Coach/Manager', scorer:'Scorer' };
function isRoleCode(code){ return String(code || '').length >= 12; }
function randomRoleCode(){
  const bytes = new Uint32Array(ROLE_CODE_LENGTH);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
}
// Which team an invite is for: the open season, unless given (the home
// screen's "Invite someone to a team" passes the team picked there).
function inviteTeam(t){
  return t || { teamId:UI.teamId, seasonId:UI.seasonId, teamName:CUR.team.name, seasonName:CUR.season.name };
}
function roleInviteText(role, code, t){
  t = inviteTeam(t);
  const url = `${location.origin}${location.pathname}?join=${encodeURIComponent(code)}`;
  return `You're invited to be a ${ROLE_LABEL[role]} for ${t.teamName} (${t.seasonName}) on Netty Pal: ${url}\n\nTap the link and sign in. This link works once, for one person, so please don't pass it on.`;
}
// Saving starts first, but the share menu opens straight away without
// waiting for it (phones only allow sharing right after a tap).
async function createRoleInvite(role, t){
  if (!ROLE_LABEL[role]) return;
  t = inviteTeam(t);
  const code = randomRoleCode();
  const batch = writeBatch(db);
  batch.set(doc(db, 'roleInvites', code), { teamId:t.teamId, seasonId:t.seasonId, role, createdAt:serverTimestamp() });
  batch.set(doc(db, 'teams', t.teamId, 'seasons', t.seasonId, 'invites', code), { role, createdAt:serverTimestamp(), createdByName:memberProfile().name });
  const saving = batch.commit();
  await sendRoleInvite(role, code, t);
  try { await saving; }
  catch (err){ fail(err); toast("That invite link couldn't be saved, so it won't work. Please try again.", true); }
}
async function sendRoleInvite(role, code, t){
  const text = roleInviteText(role, code, t);
  if (navigator.share){
    try { await navigator.share({ title:'Netty Pal', text }); } catch(e){ /* cancelled: the link stays in the list */ }
    return;
  }
  try { await navigator.clipboard.writeText(text); toast(`${ROLE_LABEL[role]} invite copied. Send it to one person.`); }
  catch(e){ toast("Couldn't copy the invite.", true); }
}
async function cancelRoleInvite(code){
  const batch = writeBatch(db);
  batch.delete(doc(db, 'roleInvites', code));
  batch.delete(doc(seasonRef(), 'invites', code));
  await batch.commit();
  toast('Invite link cancelled. It no longer works.');
}
// Keeps the unused invite links up to date while a Coach/Manager has the
// Support Crew tab open (only they're allowed to read them).
function watchInvites(){
  if (CUR.invitesFor === UI.seasonId) return;
  if (CUR.invitesUnsub) CUR.invitesUnsub();
  CUR.invitesFor = UI.seasonId;
  CUR.invites = null;
  CUR.invitesUnsub = onSnapshot(collection(seasonRef(), 'invites'), (snap) => {
    CUR.invites = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => { console.warn('Netty Pal: invites', err); CUR.invites = []; render(); });
  CUR.unsubs.push(() => { if (CUR.invitesUnsub) CUR.invitesUnsub(); });
}
// Accepting a role invite: join (or, if already in the season, add the
// role) and use up the link, all in one save.
async function acceptRoleInvite(inv){
  const { code, role, teamId, seasonId } = inv;
  const memberRef = doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid);
  const existing = await getDoc(memberRef);
  const batch = writeBatch(db);
  if (existing.exists()){
    const roles = Array.from(new Set([...(existing.data().roles || []), role]));
    batch.update(memberRef, { roles, invite:code });
  } else {
    batch.set(memberRef, { ...memberProfile(), roles:[role], invite:code, joinedAt:serverTimestamp() });
  }
  batch.delete(doc(db, 'roleInvites', code));
  batch.delete(doc(db, 'teams', teamId, 'seasons', seasonId, 'invites', code));
  batch.set(doc(db, 'users', USER.uid, 'memberships', seasonId), { teamId, seasonId });
  await batch.commit();
  toast(`You're now a ${ROLE_LABEL[role]} for ${inv.teamName}.`);
  openSeason(teamId, seasonId);
}

function gameRef(id){ return doc(seasonRef(), 'games', id); }

function readGameFields(fd){

async function addGame(fd){
  const fields = readGameFields(fd);

async function saveGame(fd){
  const g = findGame(UI.gameId);
  const fields = readGameFields(fd);

// Puts a player in a position for the selected period. If they were
// already somewhere else that period, whoever was in the target position
// moves into their old spot (a swap), so nobody is ever in two places.
// If the period was following an earlier one, it gets its own copy of that
// lineup first, with the change applied, and later periods follow it.
// base is the lineup to start from if it isn't the plan (between periods of
// a live game, the next period starts from the actual lineup).
async function setPlanSlot(pos, pid, base){
  const g = findGame(UI.gameId);
  if (!g) return;
  const p = UI.period;
  const next = { ...(base || planFor(g, p)) };
  if (pid){
    const from = POSITIONS.find(other => other !== pos && next[other] === pid);
    if (from){ if (next[pos]) next[from] = next[pos]; else delete next[from]; }
    next[pos] = pid;
  } else {
    delete next[pos];
  }
  await updateDoc(gameRef(g.id), { [`plan.${p}`]: next });
}

// Q1: empty it. Later periods: drop their own changes so they follow the
// period before again.
async function clearPeriod(){
  const g = findGame(UI.gameId);
  if (!g) return;
  await updateDoc(gameRef(g.id), { [`plan.${UI.period}`]: UI.period === 1 ? {} : deleteField() });
}

async function toggleAvail(pid){
  const g = findGame(UI.gameId);
  if (!g) return;
  const avail = new Set(availableIds(g));
  const updates = {};
  if (avail.has(pid)){
    avail.delete(pid);
    // Take them out of every period of this game's plan too.
    Object.entries(g.plan || {}).forEach(([k, slots]) => {
      Object.entries(slots || {}).forEach(([pos, id]) => { if (id === pid) updates[`plan.${k}.${pos}`] = deleteField(); });
    });
  } else {
    avail.add(pid);
  }
  updates.available = Array.from(avail);
  await updateDoc(gameRef(g.id), updates);
}

async function availAll(){
  const g = findGame(UI.gameId);
  if (!g) return;
  await updateDoc(gameRef(g.id), { available: CUR.players.filter(p => p.active !== false).map(p => p.id) });
}

/* ---------------------------------------------------------------------
   Fixture import. Reads a pasted draw, a PDF or a spreadsheet (CSV) into
   rows to check before saving. Competition draws usually list every game
   in the division, so only games involving our team are kept.
--------------------------------------------------------------------- */
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
const WEEKDAY_RE = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)\b\.?,?/gi;
const VS_RE = /\s+(?:vs?\.?|versus|v\/s)\s+/i;
// Cell breaks: a pipe, tab, two or more spaces, a spaced hyphen or en dash, or a comma.
const CELL_SPLIT = /\s*(?:\||\t| {2,}| - | – |, )\s*/;
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.296/build/pdf.min.mjs';
const PDFJS_WORKER_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.296/build/pdf.worker.min.mjs';

function nameKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

// A day and month with no year: the year in the season's name (e.g.
// "Winter 2027") if it has one, otherwise this year, or next year if that
// date has already passed by more than a month.
function seasonYear(){
  const m = `${(CUR.season && CUR.season.name) || ''} ${(CUR.season && CUR.season.competition) || ''}`.match(/\b(20\d\d)\b/);
  return m ? +m[1] : 0;
}
function isoDate(y, m, d){
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  if (!y) y = seasonYear();
  if (!y){
    const now = new Date();
    y = now.getFullYear();
    if (new Date(y, m - 1, d) < new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30)) y++;
  } else if (y < 100) y += 2000;
  return `${y}-${pad2(m)}-${pad2(d)}`;
}

// Finds a date in the text; returns { iso, match } or null.
function findDate(text){
  let m;
  if ((m = text.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/))) return { iso:isoDate(+m[1], +m[2], +m[3]), match:m[0] };
  // (Not preceded by ":" or ".", so a time like "9:30 May Park" isn't read as 30 May.)
  if ((m = text.match(new RegExp(`(?<![:.\\d])\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+${MONTH_RE}(?:,?\\s+(\\d{4}))?`, 'i'))))
    return { iso:isoDate(m[3] ? +m[3] : 0, MONTHS.indexOf(m[2].toLowerCase()) + 1, +m[1]), match:m[0] };
  if ((m = text.match(new RegExp(`\\b${MONTH_RE}\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b`, 'i'))))
    return { iso:isoDate(m[3] ? +m[3] : 0, MONTHS.indexOf(m[1].toLowerCase()) + 1, +m[2]), match:m[0] };
  // Australian day/month order.
  if ((m = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) return { iso:isoDate(m[3] ? +m[3] : 0, +m[2], +m[1]), match:m[0] };
  if ((m = text.match(/\b(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})\b/))) return { iso:isoDate(+m[3], +m[2], +m[1]), match:m[0] };
  return null;
}

// Finds a time; returns { hhmm, match } or null. Without am/pm, times
// before 8 are taken as afternoon (junior netball rarely starts before 8am).
function findTime(text){
  let m = text.match(/\b(\d{1,2})[:.](\d{2})\s*(a\.?m\.?|p\.?m\.?)?(?![\d/])/i);
  let h, min, ap;
  if (m){ h = +m[1]; min = +m[2]; ap = m[3]; }
  else if ((m = text.match(/\b(\d{1,2})\s*(a\.?m\.?|p\.?m\.?)(?![a-z])/i))){ h = +m[1]; min = 0; ap = m[2]; }
  else return null;
  if (h > 23 || min > 59) return null;
  const pm = ap && /p/i.test(ap), am = ap && /a/i.test(ap);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!ap && h >= 1 && h < 8) h += 12;
  return { hhmm:`${pad2(h)}:${pad2(min)}`, match:m[0] };
}

// Reads one line of a draw. Matched pieces are cut out and replaced with a
// cell break, so what's left splits cleanly into team names and venue.
function parseFixtureLine(raw){
  let text = ' ' + raw.replace(/ /g, ' ') + ' ';
  const cut = (s) => { text = text.replace(s, ' | '); };
  const out = { date:'', time:'', round:'', court:'', venue:'', home:'', away:'', bye:/\bbye\b/i.test(raw) };
  const d = findDate(text); if (d && d.iso){ out.date = d.iso; cut(d.match); }
  text = text.replace(WEEKDAY_RE, ' | ');
  let m = text.match(/\b(?:round|rnd|rd|week|wk)\s*\.?\s*(\d{1,2})\b/i) || text.match(/\bR(\d{1,2})\b/);
  if (m){ out.round = m[1]; cut(m[0]); }
  const t = findTime(text); if (t){ out.time = t.hhmm; cut(t.match); }
  m = text.match(/\b(?:court|ct)\s*\.?\s*#?\s*([a-z]?\d{1,2}[a-z]?)\b/i);
  if (m){ out.court = 'Court ' + m[1].toUpperCase(); cut(m[0]); }
  m = text.match(/\bvenue\s*:\s*([^|]+)/i);
  if (m){ out.venue = m[1].trim(); cut(m[0]); }
  const vs = text.match(VS_RE);
  if (vs){
    const left = text.slice(0, vs.index).split(CELL_SPLIT).map(s => s.trim()).filter(Boolean);
    const right = text.slice(vs.index + vs[0].length).split(CELL_SPLIT).map(s => s.trim()).filter(Boolean);
    out.home = left.pop() || '';
    out.away = right.shift() || '';
    const rest = [...left, ...right].filter(s => /[a-z]{3,}/i.test(s));
    if (!out.venue && rest.length) out.venue = rest.join(', ');
  }
  return out;
}

// Splits a CSV or tab-separated line, respecting "quoted, cells".
function splitDelimited(line, delim){
  const cells = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (c === '"'){ if (q && line[i + 1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if (c === delim && !q){ cells.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  cells.push(cur.trim());
  return cells;
}

// A table with a header row (Date, Time, Home, Away, ...), from a
// spreadsheet (commas or tabs) or a PDF table (cells joined with " | ").
// The header can come after title lines. Returns null if there isn't one.
function tableDelim(line){
  if (line.includes('\t')) return '\t';
  if (line.includes(' | ')) return '|';
  return line.includes(',') ? ',' : null;
}
function tableColumns(line){
  const delim = tableDelim(line);
  if (!delim) return null;
  const head = splitDelimited(line, delim).map(h => h.toLowerCase().trim());
  if (head.length < 3) return null;
  const col = (re) => head.findIndex(h => re.test(h));
  const c = { date:col(/^(date|day)/), time:col(/time|start/), round:col(/^(round|rnd|rd|week|wk)\b/), court:col(/^(court|ct)\b/),
    venue:col(/venue|location|ground|field/), home:col(/home/), away:col(/away|visitor/),
    opp:col(/opponent|opposition|against/), match:col(/match|game|fixture|teams/) };
  const known = Object.values(c).filter(i => i >= 0).length;
  if (known < 3 || (c.home < 0 && c.opp < 0 && c.match < 0)) return null;
  return { delim, c, headKey:nameKey(line) };
}
function parseFixtureTable(lines){
  const at = lines.findIndex(l => tableColumns(l));
  if (at < 0) return null;
  const { delim, c, headKey } = tableColumns(lines[at]);
  return lines.slice(at + 1).filter(l => nameKey(l) !== headKey).map(line => {
    const cells = splitDelimited(line, delim);
    const get = (i) => (i >= 0 ? cells[i] || '' : '');
    // A "v" printed between the team names can end up stuck to one of them.
    const team = (i) => get(i).replace(/^(?:vs?\.?|versus)\s+|\s+(?:vs?\.?|versus)$/i, '').trim();
    const d = findDate(get(c.date)), t = findTime(get(c.time));
    const court = get(c.court);
    const row = { date:d ? d.iso : '', time:t ? t.hhmm : '', round:(get(c.round).match(/\d+/) || [''])[0],
      court:court ? (/court/i.test(court) ? court : 'Court ' + court) : '',
      venue:get(c.venue), home:team(c.home), away:team(c.away), bye:/\bbye\b/i.test(line), opponent:team(c.opp) };
    if (!row.home && c.match >= 0){
      const parts = get(c.match).split(VS_RE);
      if (parts.length === 2){ row.home = parts[0].trim(); row.away = parts[1].trim(); }
    }
    return row;
  });
}

// Turns the whole draw into our games. Returns { rows, teams, total, byes }.
function parseFixtures(text, ourName){
  const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const games = [];
  // Our byes are kept too (as rounds with no game), so the season reads in order.
  const byeRows = [];
  let byes = 0;
  const ourKey = nameKey(ourName);
  const isUs = (name) => {
    const k = nameKey(name);
    return !!k && !!ourKey && (k === ourKey || (k.length >= 3 && (k.includes(ourKey) || ourKey.includes(k))));
  };
  const table = lines.length > 1 ? parseFixtureTable(lines) : null;
  if (table){
    // Tables sometimes show the round, date or venue only once per group.
    const last = { date:'', round:'', venue:'' };
    table.forEach(r => {
      ['date', 'round', 'venue'].forEach(k => { if (r[k]) last[k] = r[k]; else r[k] = last[k]; });
      if (r.bye){ if (isUs(r.home) || isUs(r.away) || isUs(r.opponent)){ byes++; byeRows.push({ round:r.round, date:r.date }); } return; }
      if (r.opponent) games.push({ ...r, home:ourName, away:r.opponent });
      else if (r.home && r.away) games.push(r);
    });
  } else {
    // Headings like "Round 3, Saturday 10 May" apply to the games under them.
    const ctx = { date:'', round:'', venue:'' };
    lines.forEach(line => {
      const p = parseFixtureLine(line);
      if (!p.home || !p.away){
        if (p.date) ctx.date = p.date;
        if (p.round) ctx.round = p.round;
        if (p.bye && isUs(line)){ byes++; byeRows.push({ round:ctx.round, date:ctx.date }); }
        if (p.venue) ctx.venue = p.venue;
        return;
      }
      // "Hawks v BYE": a bye written like a game.
      if (p.bye){ if (isUs(p.home) || isUs(p.away)){ byes++; byeRows.push({ round:p.round || ctx.round, date:p.date || ctx.date }); } return; }
      games.push({ ...p, date:p.date || ctx.date, round:p.round || ctx.round, venue:p.venue || ctx.venue });
    });
  }
  const teams = new Set();
  games.forEach(g => { teams.add(g.home); teams.add(g.away); });
  const rows = games.filter(g => isUs(g.home) || isUs(g.away)).map(g => {
    const opponent = isUs(g.home) ? g.away : g.home;
    const dup = CUR.games.some(x => x.date && x.date === g.date && nameKey(x.opponent) === nameKey(opponent));
    return { round:g.round, date:g.date, time:g.time, court:g.court, venue:g.venue, opponent, dup };
  });
  byeRows.forEach(b => rows.push({ round:b.round, date:b.date, time:'', court:'', venue:'', opponent:'', bye:true,
    dup:CUR.games.some(x => x.bye && ((b.date && x.date === b.date) || (b.round && x.round === b.round))) }));
  rows.sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || String(a.round).localeCompare(String(b.round), undefined, { numeric:true }));
  return { rows, teams:Array.from(teams).filter(Boolean).sort(), total:games.length, byes };
}

// Reads a PDF's text in the browser with PDF.js (loaded only when needed).
// Text is grouped into lines by height on the page. If a row of column
// headings is found (Date, Time, Home, Away...), each later line is split
// into those columns by where the text sits, so blank cells stay blank.
// Otherwise gaps between words become cell breaks.
const HEADING_RE = /^(date|day|time|start|round|rnd|rd|court|ct|venue|location|home|away|visitor|opponent|match|game|teams?)$/i;
async function pdfToText(file){
  const pdfjs = await import(PDFJS_URL);
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
  const pdf = await pdfjs.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  let columns = null; // x positions of the column headings, carried across pages
  for (let i = 1; i <= pdf.numPages; i++){
    const content = await (await pdf.getPage(i)).getTextContent();
    const rows = [];
    content.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row){ row = { y, items:[] }; rows.push(row); }
      row.items.push({ x, w:it.width || 0, s:it.str.trim() });
    });
    rows.sort((a,b) => b.y - a.y).forEach(r => {
      r.items.sort((a,b) => a.x - b.x);
      const headings = r.items.filter(it => HEADING_RE.test(it.s)).length;
      if (headings >= 3 && headings >= r.items.length - 1){
        columns = r.items.map(it => it.x);
        out.push(r.items.map(it => it.s).join(' | '));
        return;
      }
      if (columns){
        const cells = columns.map(() => []);
        r.items.forEach(it => {
          let c = 0;
          columns.forEach((x, k) => { if (it.x >= x - 4) c = k; });
          cells[c].push(it.s);
        });
        out.push(cells.map(parts => parts.join(' ')).join(' | '));
        return;
      }
      let line = '', end = null;
      r.items.forEach(it => {
        if (end !== null){ const gap = it.x - end; line += gap > 6 ? ' | ' : ' '; }
        line += it.s;
        end = it.x + it.w;
      });
      out.push(line.trim());
    });
  }
  return out.join('\n');
}

async function readImportFile(file){
  if (!file) return;
  const teamEl = document.getElementById('imp-team');
  if (teamEl) UI.importTeam = teamEl.value.trim();
  UI.importBusy = 'Reading ' + file.name + '…';
  render();
  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    UI.importText = isPdf ? await pdfToText(file) : await file.text();
    UI.importBusy = null;
    runImport(true);
  } catch (err){
    console.warn('Netty Pal: import file', err);
    UI.importBusy = null;
    toast("Couldn't read that file. Try copying the text from it and pasting it instead.", true);
    render();
  }
}

// fromFile: the text has just been read from an upload, rather than typed.
function runImport(fromFile){
  const teamEl = document.getElementById('imp-team');
  if (teamEl) UI.importTeam = teamEl.value.trim();
  if (!fromFile){
    const textEl = document.getElementById('imp-text');
    if (textEl) UI.importText = textEl.value;
  }
  if (!String(UI.importText || '').trim()){ toast('Paste the fixture or choose a file first.', true); return; }
  UI.importResult = parseFixtures(UI.importText, UI.importTeam || CUR.team.name);
  render();
  window.scrollTo(0, 0);
}

async function saveImport(fd){
  const rows = UI.importResult ? UI.importResult.rows : [];
  const batch = writeBatch(db);
  let n = 0;
  fd.getAll('inc').map(Number).forEach(i => {
    if (!rows[i]) return;
    const bye = !!rows[i].bye;
    const opponent = String(fd.get(`opponent-${i}`) || '').trim();
    if (!opponent && !bye) return;
    batch.set(doc(collection(seasonRef(), 'games')), {
      round:String(fd.get(`round-${i}`) || '').trim(), opponent, bye,
      date:String(fd.get(`date-${i}`) || ''), time:String(fd.get(`time-${i}`) || ''),
      venue:String(fd.get(`venue-${i}`) || '').trim(), court:String(fd.get(`court-${i}`) || '').trim(),
      format:CUR.season.format || 'quarters', periodMinutes:CUR.season.periodMinutes || DEFAULT_PERIOD_MINUTES,
      status:'scheduled', plan:{}, createdAt:serverTimestamp()
    });
    n++;
  });
  if (!n){ toast('Tick at least one game to add.', true); return; }
  await batch.commit();
  closeImport();
  toast(`${n} fixture${n === 1 ? '' : 's'} added.`);
}

function closeImport(){
  UI.form = null; UI.importText = ''; UI.importResult = null; UI.importTeam = ''; UI.importBusy = null;
}

/* ---- Live game ---- */
function eventsRef(gameId){ return collection(gameRef(gameId), 'events'); }

// Keeps the open game's events up to date. Called from renderGame, so it
// only starts a new listener when a different game is opened.
function watchEvents(gameId){
  if (CUR.eventsFor === gameId) return;
  stopEvents();
  CUR.eventsFor = gameId;
  CUR.loaded.events = false;
  CUR.eventsError = null;
  if (gameId === PRACTICE_ID){
    CUR.events = PRACTICE ? PRACTICE.events : [];
    CUR.loaded.events = true;
    return;
  }
  CUR.eventsUnsub = onSnapshot(eventsRef(gameId), (snap) => {
    if (CUR.eventsFor !== gameId) return;
    CUR.events = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.events = true;
    CUR.eventsError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: events listener', err);
    CUR.eventsError = err;
    render();
  });
}
function stopEvents(){
  if (CUR.eventsUnsub) CUR.eventsUnsub();
  CUR.eventsUnsub = null; CUR.eventsFor = null; CUR.events = [];
  if (CUR.loaded) CUR.loaded.events = false;
}

function newEvent(fields){ return { ...fields, by:USER.uid, at:Date.now() }; }

// Writes events (and optionally game changes) together in one go.
async function writeGame(g, events, gameUpdates){
  const batch = writeBatch(db);
  events.forEach(ev => batch.set(doc(eventsRef(g.id)), ev));
  if (gameUpdates) batch.update(gameRef(g.id), gameUpdates);
  // Anything new means there's nothing to redo. Cleared before saving, since
  // the screen redraws as soon as the change lands.
  if (events.length) redoStack = [];
  await batch.commit();
}

// The lineup a period starts with, minus anyone not playing. A period with
// its own plan uses it. Otherwise it carries on from whoever was on court
// at the end of the previous period (so substitutions carry forward too),
// or from the plan before the game has started.
function startLineup(g, p){
  const avail = new Set(availableIds(g));
  let base = planFor(g, p);
  if (p > 1 && !ownPlan(g, p) && g.live && g.live.period === p - 1){
    const st = computeGame(g, CUR.events);
    if (st.lineup) base = st.lineup;
  }
  const lineup = {};
  POSITIONS.forEach(pos => { if (base[pos] && avail.has(base[pos])) lineup[pos] = base[pos]; });
  return lineup;
}

async function startGame(g, firstCentre){

/* ---------------------------------------------------------------------
   Voice scoring (beta). Push-to-talk: the scorer taps the mic and says a
   short phrase like "GS goal", "their miss" or "undo". Uses the phone
   browser's built-in speech recognition (Chrome on Android, Safari on
   iPhone), which sends the audio to Google or Apple to turn into text.
   Nothing is recorded or stored by Netty Pal.
--------------------------------------------------------------------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRec = null;
function voiceSupported(){ return !!SpeechRec; }

// Turns what was heard into { side, pos, stat }, { undo:true } or { error }.
// pos is 'GS' or 'GA', or '' for an opposition shot with no position.
function parseVoice(g, heard, lineup){
  let t = ' ' + String(heard || '').toLowerCase().replace(/[.,!?'"-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  if (/\b(undo|scratch that|cancel that|delete that|take that back)\b/.test(t)) return { undo:true };

  // Which side: words for the other team, or their name.
  const oppWords = nameKey(g.opponent).split(' ').filter(w => w.length >= 3 && !['the', 'team', 'netball', 'club'].includes(w));
  let side = 'us';
  if (/\b(their|theirs|them|they|opposition|opponents?|other team|away|visitors?)\b/.test(t)
    || oppWords.some(w => new RegExp(`\\b${w}\\b`).test(t))) side = 'them';

  // Position, checked before the event, since "goal shooter" contains "goal".
  let pos = null;
  const posRules = [
    ['GS', /\b(goal shooter|shooter|g ?s|gee ess|gs)\b/],
    ['GA', /\b(goal attack|g ?a|gee ay|ga)\b/]
  ];
  for (const [p, re] of posRules){
    const m = t.match(re);
    if (m){ pos = p; t = t.replace(m[0], ' '); break; }
  }
  // Or one of our shooters by name ("Rianne goal").
  if (!pos && side === 'us'){
    for (const p of SHOOTERS){
      const first = nameKey(lineup[p] ? playerName(lineup[p]) : '').split(' ')[0];
      if (first && first.length >= 2 && new RegExp(`\\b${first}\\b`).test(t)){ pos = p; t = t.replace(new RegExp(`\\b${first}\\b`), ' '); break; }
    }
  }
  if (!pos && /\b(wing attack|wing defen[cs]e|centre|center|goal defen[cs]e|goal ?keeper|keeper|w a|w d|g d|g k|wa|wd|gd|gk)\b/.test(t))
    return { error:'Only GS and GA can shoot.' };

  let stat = null;
  if (/\b(miss|missed|misses|missing|no goal|off target)\b/.test(t)) stat = 'miss';
  else if (/\b(goal|goals|scored|scores|score|in)\b/.test(t)) stat = 'goal';
  if (!stat) return { error:'Say "goal" or "miss".' };
  // The other team's shots are recorded without a position.
  if (side === 'them') return { side, pos:'', stat };
  if (!pos) return { error:'Say who: "GS goal" or "GA miss".' };
  return { side, pos, stat };
}

function voiceErrorText(code){
  if (code === 'not-allowed' || code === 'service-not-allowed')
    return "Voice isn't allowed yet. Allow the microphone when asked. On iPhone, also turn on Settings > General > Keyboard > Enable Dictation. If it still won't work from the home screen icon, open Netty Pal in Safari.";
  if (code === 'network') return 'Voice needs an internet connection.';
  if (code === 'audio-capture') return "Couldn't use the microphone.";
  if (code === 'no-speech') return "Didn't hear anything. Tap the mic and try again.";
  if (code === 'language-not-supported') return "Voice isn't available in this language on this phone.";
  return "Voice didn't work that time. Try again, or tap instead.";
}

// Tap the mic to listen; tap again to stop. Listening ends by itself after
// one phrase.
function toggleVoice(){
  if (voiceRec){ try { voiceRec.stop(); } catch(e){} return; }
  const g = findGame(UI.gameId);
  if (!g || !isInPlay(g) || !amScorer(g) || !SpeechRec) return;
  const rec = new SpeechRec();
  rec.lang = 'en-AU';
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 5;
  let done = false;
  rec.onresult = (e) => {
    done = true;
    const alts = Array.from((e.results && e.results[0]) || []).map(a => a.transcript).filter(Boolean);
    handleVoice(alts).catch(fail);
  };
  rec.onerror = (e) => {
    done = true;
    if (e.error !== 'aborted') toast(voiceErrorText(e.error), true);
  };
  rec.onend = () => {
    voiceRec = null; UI.voiceListening = false; render();
    if (!done) toast(voiceErrorText('no-speech'), true);
  };
  voiceRec = rec;
  UI.voiceListening = true;
  render();
  try { rec.start(); }
  catch (err){ voiceRec = null; UI.voiceListening = false; render(); toast(voiceErrorText(err && err.name), true); }
}

// Tries each of the recogniser's guesses until one makes sense.
async function handleVoice(alts){
  const g = findGame(UI.gameId);
  if (!g || !isInPlay(g)) return;
  const lineup = computeGame(g, CUR.events).lineup || {};
  let heard = alts[0] || '';
  let parsed = null, error = null;
  for (const a of alts){
    const p = parseVoice(g, a, lineup);
    if (!p.error){ parsed = p; heard = a; break; }
    if (!error) error = p.error;
  }
  if (!parsed){ toast(`Heard "${heard}". ${error || "Didn't understand."}`, true); return; }
  if (parsed.undo){ await undoLast(); return; }
  if (parsed.side === 'us' && !lineup[parsed.pos]){ toast(`Heard "${heard}", but nobody is playing ${parsed.pos}.`, true); return; }
  await recordShot(g, parsed.side, parsed.pos, parsed.stat);
  const what = parsed.stat === 'goal' ? 'Goal' : 'Miss';
  const who = parsed.side === 'them'
    ? `${teamLabel(g, 'them')}${parsed.pos ? ' ' + parsed.pos : ''}`
    : `${playerName(lineup[parsed.pos])} (${parsed.pos})`;
  toast(`Heard "${heard}": ${what}, ${who}`);
}

async function swapCentre(g){

  await writeGame(g, [newEvent({ type:'centre', team:otherTeam(st.centre || 'us'), period:g.live.period, t:elapsedMs(g) })]);
}

// A substitution during play: same swap rules as the planner.
async function setLiveSlot(g, pos, pid){
  const st = computeGame(g, CUR.events);
  const next = { ...(st.lineup || {}) };
  if (pid){
    const from = POSITIONS.find(other => other !== pos && next[other] === pid);
    if (from){ if (next[pos]) next[from] = next[pos]; else delete next[from]; }
    next[pos] = pid;
  } else {
    delete next[pos];
  }
  await writeGame(g, [newEvent({ type:'lineup', lineup:next, period:g.live.period, t:elapsedMs(g) })]);
}

// Undo marks the scorer's last action as undone; Redo brings back the most
// recently undone one. Recording anything new clears the Redo list.
let redoStack = [];
// The Redo list is updated before saving, so the buttons are right when the
// screen redraws; if saving fails the change to the list is put back.
async function undoLast(){
  const e = lastUndoable();
  if (!e) return;
  redoStack.push(e.id);
  try { await updateDoc(doc(eventsRef(UI.gameId), e.id), { undone:true }); }
  catch (err){ redoStack.pop(); throw err; }
  toast('Undone: ' + eventText(findGame(UI.gameId), e));
}
async function redoLast(){
  const id = redoStack.pop();
  const e = id && CUR.events.find(x => x.id === id);
  if (!e) return;
  try { await updateDoc(doc(eventsRef(UI.gameId), id), { undone:false }); }
  catch (err){ redoStack.push(id); throw err; }
  toast('Redone: ' + eventText(findGame(UI.gameId), e));
}

// Corrections at full time. Each one also refreshes the saved summary.
async function correctEvent(g, eventId, changes){
  const events = CUR.events.map(e => e.id === eventId ? { ...e, ...changes } : e);
  const batch = writeBatch(db);
  batch.update(doc(eventsRef(g.id), eventId), changes);
  batch.update(gameRef(g.id), { summary:gameSummary(g, events) });
  await batch.commit();
}

async function addCorrection(g, fd){
  const period = parseInt(fd.get('period'), 10) || 1;
  const who = String(fd.get('who') || '');
  let type = String(fd.get('stat') || '');
  if (who === 'opp'){
    type = type === 'goal' ? 'oppGoal' : 'oppMiss';
  }
  // Added at the end of the period, since the exact moment isn't known.
  const endEv = CUR.events.find(e => !e.undone && e.type === 'periodEnd' && e.period === period);
  const fields = { type, period, t:endEv ? endEv.t : periodMs(g) };
  if (who !== 'opp') fields.playerId = who;
  const ev = newEvent(fields);
  await writeGame(g, [ev], { summary:gameSummary(g, [...CUR.events, ev]) });
  toast('Added.');
}

}
