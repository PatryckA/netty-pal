/* ---- Suggest a change ----
   Tapping a player's spot in the Whole game table looks at every simple
   change for that spot (swap with someone on court that quarter, bring a
   bench player on, or bring them on from the bench) and scores the whole
   game the way Fill lineup does: preferred positions, even season minutes,
   nobody sitting out two quarters in a row, shooters only at GS and GA.
   The best few are offered, with the reasons. */
function lineupScore(g, lineups, ctx){
  const P = lineups.length;
  let pref = 0, empty = 0, bench = 0, badShoot = 0;
  lineups.forEach(l => {
    ctx.open.forEach(pos => {
      const id = l[pos];
      if (!id){ empty++; return; }
      if (SHOOTERS_POS.includes(pos) && !ctx.canShoot(id)){ badShoot++; return; }
      const prefs = playerPrefs(CUR.players.find(x => x.id === id));
      const r = prefs.indexOf(pos);
      pref += r < 0 ? (prefs.length ? -offPrefCost(id, ctx, ctx.pm) : 20) : [100, 70, 40][r];
    });
  });
  const q = {}, avg = {}, changes = {};
  let extraChanges = 0;
  ctx.ids.forEach(id => {
    // Position changes beyond the first (see Fill lineup).
    let last = null; changes[id] = 0;
    lineups.forEach(l => { const pos = POSITIONS.find(x => l[x] === id); if (pos){ if (last && last !== pos) changes[id]++; last = pos; } });
    extraChanges += Math.max(0, changes[id] - 1);
    const on = lineups.map(l => Object.values(l).includes(id));
    q[id] = on.filter(Boolean).length;
    if (q[id] >= 2) for (let i = 0; i < P - 1; i++) if (!on[i] && !on[i + 1]){ bench++; break; }
    avg[id] = ((ctx.tot[id] || 0) + q[id] * ctx.pm) / ((ctx.games[id] || 0) + 1) / ctx.pm;
  });
  const vals = Object.values(avg), mean = vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length);
  const spread = vals.reduce((a, v) => a + (v - mean) * (v - mean), 0);
  const fair = -120 * spread;
  return { total:pref + fair - 500 * empty - 200 * bench - 1000 * badShoot - 60 * extraChanges, pref, fair, empty, bench, badShoot, q, avg, changes, extraChanges };
}
function suggestionsFor(g, pid, k){
  const P = periodCount(g), ids = byName(availableIds(g)), K = Math.min(7, ids.length);
  const { tot, games, off } = seasonCourtTotals(g.id);
  const canShoot = id => playerPrefs(CUR.players.find(x => x.id === id)).some(pos => SHOOTERS_POS.includes(pos));
  const ctx = { ids, pm:periodMs(g), tot, games, off, canShoot, open:POSITIONS.filter(pos => !EMPTY_FIRST.slice(0, 7 - K).includes(pos)) };
  const base = Array.from({ length:P }, (_, i) => ({ ...lineupFor(g, i + 1) }));
  const now = lineupScore(g, base, ctx);
  const L = base[k - 1];
  const posA = POSITIONS.find(pos => L[pos] === pid);
  const benchK = ids.filter(id => !Object.values(L).includes(id));
  const out = [];
  const tryIt = (changes) => {
    const next = base.map(l => ({ ...l }));
    const nl = next[k - 1];
    changes.forEach(([pos, id]) => { if (id) nl[pos] = id; else delete nl[pos]; });
    // Never move a non-shooter into GS or GA (one already there can be moved out).
    if (changes.some(([pos, id]) => id && SHOOTERS_POS.includes(pos) && !canShoot(id))) return;
    const sc = lineupScore(g, next, ctx);
    out.push({ lineups:next, score:sc, delta:sc.total - now.total, changes });
  };
  if (posA){
    ctx.open.filter(pos => pos !== posA).forEach(pos => { if (L[pos]) tryIt([[pos, pid], [posA, L[pos]]]); else tryIt([[pos, pid], [posA, null]]); });
    benchK.forEach(c => tryIt([[posA, c]]));
  } else {
    ctx.open.forEach(pos => tryIt([[pos, pid]]));
  }
  out.sort((a, b) => b.delta - a.delta);
  return { now, base, list:out.slice(0, 3), ctx };
}
// Plain-English description of a change and why it helps.
function describeSuggestion(g, k, s, now, base){
  const before = base[k - 1], after = s.lineups[k - 1];
  const where = (l, id) => POSITIONS.find(pos => l[pos] === id);
  const moved = Array.from(new Set([...Object.values(before), ...Object.values(after)])).filter(id => where(before, id) !== where(after, id));
  const what = moved.map(id => {
    const a = where(before, id), b = where(after, id);
    const nm = `<b>${escapeHtml(playerName(id))}</b>`;
    if (!a) return `${nm} comes on at ${b}`;
    if (!b) return `${nm} goes to the bench`;
    return `${nm} moves ${a} → ${b}`;
  });
  const why = [];
  // Who fills in out of position: share it with whoever has done it less.
  const ctxNow = seasonCourtTotals(g.id), pmNow = periodMs(g);
  const outOf = (l, id) => { const pos = where(l, id), pr = playerPrefs(CUR.players.find(x => x.id === id)); return !!(pos && pr.length && !pr.includes(pos)); };
  const inNow = moved.filter(id => outOf(after, id) && !outOf(before, id));
  const outNow = moved.filter(id => outOf(before, id) && !outOf(after, id));
  if (inNow.length && outNow.length){
    const less = inNow.filter(a => outNow.some(b => offPrefCost(a, ctxNow, pmNow) < offPrefCost(b, ctxNow, pmNow)));
    if (less.length) why.push(`Shares out playing out of position (${less.map(id => escapeHtml(playerName(id))).join(', ')} has done it less this season)`);
  }
  moved.forEach(id => {
    const b = where(after, id);
    const prefs = playerPrefs(CUR.players.find(x => x.id === id));
    if (b && prefs.length){
      const r = prefs.indexOf(b), ra = prefs.indexOf(where(before, id));
      if (r >= 0 && (ra < 0 || r < ra)) why.push(`${escapeHtml(playerName(id))} gets a ${['1st', '2nd', '3rd'][r]}-choice position`);
      else if (r < 0 && where(before, id) && ra >= 0) why.push(`${escapeHtml(playerName(id))} leaves a preferred position`);
    }
  });
  const pm = s.score.q;
  const fairIds = s.score && Object.keys(pm).filter(id => pm[id] !== now.q[id]);
  if (fairIds.length){
    const mins = id => wholeMins(s.score.avg[id] * periodMs(g));
    const better = s.score.fair > now.fair + 1;
    why.push(`${better ? 'Evens out' : 'Makes'} season minutes ${better ? '' : 'less even '}(${fairIds.map(id => `${escapeHtml(playerName(id))} ${wholeMins(now.avg[id] * periodMs(g))} → ${mins(id)} avg`).join(', ')})`);
  }
  // Position changes per player across the game.
  const chg = Object.keys(s.score.changes).filter(id => s.score.changes[id] !== now.changes[id]);
  const fewer = chg.filter(id => s.score.changes[id] < now.changes[id] && now.changes[id] >= 2);
  const more = chg.filter(id => s.score.changes[id] > now.changes[id] && s.score.changes[id] >= 2);
  const times = n => n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times';
  if (fewer.length) why.push(`Fewer position changes (${fewer.map(id => `${escapeHtml(playerName(id))} ${times(s.score.changes[id])}`).join(', ')})`);
  if (more.length) why.push(`More position changes (${more.map(id => `${escapeHtml(playerName(id))} changes ${times(s.score.changes[id])}`).join(', ')})`);
  if (s.score.bench < now.bench) why.push('Nobody sits out two quarters in a row');
  if (s.score.bench > now.bench) why.push('Someone would sit out two quarters in a row');
  if (s.score.badShoot < now.badShoot) why.push('Puts a player who chose GS or GA in a shooting position');
  if (s.score.empty < now.empty) why.push('Fills an empty position');
  if (s.score.empty > now.empty) why.push('Leaves a position empty');
  return { what, why };
}
function suggestSheetHtml(g){
  const { pid, k } = UI.suggest;
  if (!CUR.players.some(x => x.id === pid) || periodStarted(g, k)) return '';
  const { now, base, list } = suggestionsFor(g, pid, k);
  const posNow = POSITIONS.find(pos => base[k - 1][pos] === pid);
  const better = list.filter(s => s.delta > 0.5);
  const shown = better.length ? better : list.slice(0, 2);
  const cards = shown.map((s, i) => {
    const d = describeSuggestion(g, k, s, now, base);
    return `<div class="sugg ${s.delta > 0.5 ? 'good' : ''}">
        <p class="sugg-what">${d.what.join('; ')}</p>
        ${d.why.length ? `<ul class="sugg-why">${d.why.map(w => `<li>${w}</li>`).join('')}</ul>` : ''}
        <button class="btn ${i === 0 && s.delta > 0.5 ? '' : 'ghost'} small" data-action="suggest-apply" data-index="${list.indexOf(s)}">Make this change</button>
      </div>`;
  }).join('');
  return `<div class="sheet-backdrop" data-action="suggest-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sugg-title">
      <div class="sheet-head"><div class="grow"><h3 id="sugg-title">${escapeHtml(playerName(pid))}, ${escapeHtml(periodName(g, k))}</h3>
        <div class="psub">Now: ${posNow ? escapeHtml(POS_NAMES[posNow]) : 'on the bench'}</div></div>
        <button class="btn ghost small" data-action="suggest-close">Close</button></div>
      <div class="sheet-body">
        <p style="margin:0.8rem 0 0.6rem">${better.length ? `${better.length === 1 ? 'A change' : 'Changes'} that ${better.length === 1 ? 'makes' : 'make'} the whole game better (preferred positions, even season minutes, no one sitting out two in a row, few position changes):`
          : 'This spot already works well: nothing here makes the game better overall. The closest options:'}</p>
        ${cards || '<p class="hint">No other options for this spot.</p>'}
        ${manualPickHtml(g, pid, k)}
      </div>
    </div>`;
}
// Every spot a player could be put in for quarter k, empty spots first.
function manualOptions(g, pid, k){
  const L = lineupFor(g, k), posA = POSITIONS.find(pos => L[pos] === pid);
  const prefs = playerPrefs(CUR.players.find(x => x.id === pid));
  const opts = POSITIONS.filter(pos => pos !== posA).map(pos => ({ pos, other:L[pos] || null, pref:prefs.indexOf(pos) }));
  opts.sort((a, b) => (a.other ? 1 : 0) - (b.other ? 1 : 0));
  if (posA) opts.push({ pos:'bench', other:null, pref:-1 });
  return { L, posA, opts };
}
function manualPickHtml(g, pid, k){
  const { posA, opts } = manualOptions(g, pid, k);
  const first = playerName(pid).split(' ')[0];
  const btns = opts.map(o => {
    let sub;
    if (o.pos === 'bench') sub = 'Bench';
    else if (!o.other) sub = 'Empty';
    else sub = posA ? `Swap with ${escapeHtml(playerName(o.other).split(' ')[0])}` : `${escapeHtml(playerName(o.other).split(' ')[0])} to bench`;
    const pref = o.pref >= 0 ? ` <span class="pref">${['1st', '2nd', '3rd'][o.pref]} choice</span>` : '';
    const label = o.pos === 'bench' ? `Put ${first} on the bench` : `Put ${first} at ${POS_NAMES[o.pos]}. ${sub.replace(/<[^>]*>/g, '')}`;
    return `<button class="pick ${o.pos !== 'bench' && !o.other ? 'empty' : ''}" data-action="suggest-pick" data-pos="${o.pos}" aria-label="${escapeHtml(label)}"><b>${o.pos === 'bench' ? '&#8645;' : o.pos}</b><span>${sub}</span>${pref}</button>`;
  }).join('');
  return `<p style="margin:0.8rem 0 0.5rem"><b>Or choose a spot for ${escapeHtml(first)}:</b></p><div class="pick-grid">${btns}</div>`;
}
// The whole-game lineups after putting pid at pos ('bench' to sit out) in quarter k.
function manualLineups(g, pid, k, pos){
  const { L, posA } = manualOptions(g, pid, k);
  const next = Array.from({ length:periodCount(g) }, (_, i) => ({ ...lineupFor(g, i + 1) }));
  const nl = next[k - 1];
  if (pos === 'bench'){ if (posA) delete nl[posA]; return next; }
  const other = L[pos];
  nl[pos] = pid;
  if (posA){ if (other) nl[posA] = other; else delete nl[posA]; }
  return next;
}
// Saves one quarter's new lineup. A later quarter that was following this
// one keeps the lineup it had, so only the chosen quarter changes.
async function applySuggestion(g, k, lineups){
  const upd = { [`plan.${k}`]:lineups[k - 1] };
  for (let p = k + 1; p <= periodCount(g) && !ownPlan(g, p); p++) upd[`plan.${p}`] = { ...lineupFor(g, p) };
  if (!Array.isArray(g.available)) upd.available = availableIds(g);
  await updateDoc(gameRef(g.id), upd);
}

function autoSheetHtml(g){
  const o = UI.auto;
  const hasPlan = Array.from({ length:periodCount(g) }, (_, i) => i + 1).some(p => ownPlan(g, p) && isPeriodPlanned(g, p));
  const r = autoPlan(g, { mode:o.mode, keep:hasPlan && o.keep, seed:o.seed, alt:o.alt });
  // Swaps dragged in the preview change this copy, not the saved lineup.
  const plan = o.plan || r.plan;
  const seg = (field, value, label, on) => `<button class="subtab ${on ? 'on' : ''}" data-action="auto-opt" data-field="${field}" data-value="${value}" aria-pressed="${on}">${label}</button>`;
  let body;
  if (r.error) body = `<p role="alert">${escapeHtml(r.error)}</p>`;
  else {
    const u = o.plan ? null : r.uneven;
    const shiftOf = id => u ? ([...u.up, ...u.down].find(x => x.id === id) || { d:0 }).d : 0;
    const nameList = list => list.map(x => `<b>${escapeHtml(playerName(x.id))}</b>`).join(', ').replace(/, ([^,]*)$/, ' and $1');
    const noun = periodNoun(g, true);
    const warn = u ? `<div class="uneven-warn" role="alert">
        <p><b>Court time is uneven because of shooters.</b> Only ${u.shooters} player${u.shooters === 1 ? '' : 's'} playing chose GS or GA, so to fill the shooting positions
          ${nameList(u.up)} ${u.up.length === 1 ? 'plays' : 'play'} extra ${noun}${u.down.length ? `, and ${nameList(u.down)} ${u.down.length === 1 ? 'plays' : 'play'} fewer` : ''} (marked + and − below).</p>
        <p>To even it out: use this lineup, then swap players on the Lineup tab (for example, put someone else in GA), or add GS or GA as a preferred position for more players in Team &gt; Players and try again.</p>
      </div>` : '';
    const shortWarn = !o.plan && r.shortShooters ? fillInWarnHtml(g, r.shortShooters.fillIns, r.shortShooters.shooters) : '';
    body = `${shortWarn}${warn}${o.plan ? '<p class="edited-note">You\'ve changed this lineup by hand. <b>Try another</b> or changing an option starts again.</p>' : ''}
      <div class="grid-head">${prefsToggleHtml()}</div>
      ${gameGridHtml(g, { lineupOf:p => plan[p], ids:r.ids, avg:{ tot:r.tot, games:r.games, pm:r.pm }, shift:u ? shiftOf : null, drag:true })}
      ${planNoteHtml(g)}
      <p class="hint">Hold a spot and drag to swap. Grey bibs: not a preferred position. Avg mins after: season minutes per game available, including this one.</p>
      ${!o.plan && r.notes.length ? `<ul class="auto-notes">${r.notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>` : ''}`;
  }
  return `<div class="sheet-backdrop" data-action="auto-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="auto-title">
      <div class="sheet-head"><div class="grow"><h3 id="auto-title">Fill lineup for me</h3></div>
        <button class="btn ${isArmed('auto-close') ? 'danger armed' : 'ghost'} small" data-action="auto-close">${isArmed('auto-close') ? 'Discard plan?' : 'Close'}</button></div>
      ${r.error ? '' : `<div class="auto-bar">
        <button class="btn" data-action="auto-use" ${UI.busy ? 'disabled' : ''}>Use this lineup</button>
        <button class="btn ghost" data-action="auto-again">Try another</button>
      </div>`}
      <div class="sheet-body">
        <p style="margin:0.8rem 0 0.5rem">Plans every quarter for fair court time and preferred positions. Players who chose GS or GA shoot first.</p>
        <div class="auto-opt"><span class="label">Prioritise</span>
          <div class="subtabs">${seg('mode', 'top', 'Top preferences', o.mode !== 'variety')}${seg('mode', 'variety', 'Variety', o.mode === 'variety')}</div></div>
        ${hasPlan ? `<div class="auto-opt"><span class="label">Lineup already set</span>
          <div class="subtabs">${seg('keep', '1', 'Keep it, fill the gaps', o.keep)}${seg('keep', '0', 'Start again', !o.keep)}</div></div>` : ''}
        ${body}
        <div class="form-actions" style="margin-top:0.8rem">
          ${r.error ? '' : `<button class="btn ghost" data-action="auto-again">Try another</button>
          <button class="btn" data-action="auto-use" ${UI.busy ? 'disabled' : ''}>Use this lineup</button>`}
        </div>
      </div>
    </div>`;
}
async function useAutoPlan(g){
  const o = UI.auto;
  const hasPlan = Array.from({ length:periodCount(g) }, (_, i) => i + 1).some(p => ownPlan(g, p) && isPeriodPlanned(g, p));
  const r = autoPlan(g, { mode:o.mode, keep:hasPlan && o.keep, seed:o.seed, alt:o.alt });
  if (r.error) return;
  const upd = { plan:o.plan || r.plan };
  if (!Array.isArray(g.available)) upd.available = r.ids;
  await updateDoc(gameRef(g.id), upd);
  UI.auto = null; UI.period = 1;
  toast('Lineup filled. You can still change anyone.');
}

// This game's court time for "Avg mins after": what was actually played
// (including any Adjust court time) for quarters that have started, plus
// full planned quarters still to come.
function gameMsFn(g){
  if ((g.status || 'scheduled') === 'scheduled' || CUR.eventsFor !== g.id || !CUR.loaded.events) return null;
  const st = computeGame(g, CUR.events);
  const pm = periodMs(g);
  const todo = Array.from({ length:periodCount(g) }, (_, i) => i + 1).filter(k => !periodStarted(g, k) && !isGameOver(g));
  return id => ((st.players[id] || {}).ms || 0) + todo.filter(k => Object.values(lineupFor(g, k)).includes(id)).length * pm;
}

// The Lineup tab: the Whole game table (who plays where in every quarter),
// with Fill lineup for me, tap for a suggested change, and press and hold
// to drag and swap. The court diagram stays on the Game tab.
function renderLineupTab(g){
  const avail = byName(availableIds(g));
  const scheduled = (g.status || 'scheduled') === 'scheduled';
  const editable = canEditGames() && !isPractice(g);
  const hasPlan = Array.from({ length:periodCount(g) }, (_, i) => i + 1).some(k => ownPlan(g, k) && isPeriodPlanned(g, k));
  const autoBtn = editable && scheduled
    ? '<button class="btn small" data-action="auto-open">Fill lineup for me</button>' : '';
  const anyPlanned = Array.from({ length:periodCount(g) }, (_, i) => i + 1).some(k => POSITIONS.some(pos => lineupFor(g, k)[pos]));
  const canShareLineup = isManager() && !isPractice(g) && !isGameOver(g) && anyPlanned;
  if (canShareLineup) prepareLineupShare(g);
  const shareBtn = canShareLineup ? '<button class="btn ghost small" data-action="share-lineup">Share lineup</button>' : '';
  const clearBtn = editable && scheduled && hasPlan
    ? `<button class="btn ghost small ${isArmed('clear-lineup') ? 'armed' : ''}" data-action="clear-lineup">${isArmed('clear-lineup') ? 'Confirm clear the whole lineup' : 'Clear lineup'}</button>` : '';
  const live = g.status === 'live' && canScore()
    ? `<p class="follow-note own">${escapeHtml(periodNoun(g, true).replace(/^./, c => c.toUpperCase()))} that have started can't be changed here. To change who's on court now, use Sub Player(s) on the Game tab.</p>` : '';
  // Only once the team uses preferred positions (otherwise every game would warn).
  const fills = editable && CUR.players.some(x => playerPrefs(x).length) ? lineupFillIns(g) : [];
  const shootersPlaying = avail.filter(id => playerPrefs(CUR.players.find(x => x.id === id)).some(pos => SHOOTERS_POS.includes(pos))).length;
  return `${autoBtn || clearBtn || shareBtn ? `<div class="lineup-tools" style="margin:0 0 0.6rem">${autoBtn}${shareBtn}${clearBtn}</div>` : ''}
    ${live}
    ${fillInWarnHtml(g, fills, shootersPlaying)}
    <div class="grid-head"><h3 class="subhead">Whole game</h3>${prefsToggleHtml()}</div>
    ${gameGridHtml(g, { lineupOf:k => lineupFor(g, k), ids:avail,
      tap:k => editable && !periodStarted(g, k),
      avg:isStaff() && !isPractice(g) ? { ...seasonCourtTotals(g.id), pm:periodMs(g), thisMs:gameMsFn(g) } : null })}
    ${!isGameOver(g) && !periodStarted(g, periodCount(g)) ? planNoteHtml(g) : ''}
    <p class="hint">Tap a name for their preferred positions.${editable && g.status !== 'final' ? ' Tap a player\'s spot for suggestions or to pick any spot, or press and hold it and drag onto another spot in the same ' + escapeHtml(periodNoun(g)) + ' to swap (bench spots too).' : ''} Grey bibs aren't one of the player's preferred positions.${isStaff() && !isPractice(g) ? ' "Avg mins after" is season minutes per game available, counting this game' + (scheduled ? ' as planned.' : isGameOver(g) ? '.' : ' (played so far, plus what\'s planned).') : ''}</p>
    ${UI.suggest ? suggestSheetHtml(g) : ''}
    ${UI.auto && autoBtn ? autoSheetHtml(g) : ''}`;
}

function planCountOf(g, counts){
  const n = periodCount(g);
  return id => ({ text:`${counts[id] || 0} of ${n}`, n:counts[id] || 0, zero:!counts[id] });
}

function gamePeriodCounts(g, ids){
  const counts = {};
  ids.forEach(id => counts[id] = 0);
  for (let k = 1; k <= periodCount(g); k++) POSITIONS.forEach(pos => { const id = lineupFor(g, k)[pos]; if (id in counts) counts[id]++; });
  return counts;
}

// A simple netball court, attacking end at the top. Each position's bib
// sits in the area of the court that position plays in.
// Used for planning lineups (before a game and between periods); tapping a
// bib opens the player picker.
// When editable, players can also be dragged between positions, and (if
// avail is given) a bench of players not on court is shown underneath to
// drag onto a position. Dropping a player on the bench empties their spot.
// During play it's read-only; tapAction (if given) makes each bib a button
// for that action instead (no dragging), e.g. to make a substitution.
function courtHtml(plan, editable, g, p, avail, tapAction){
  const tokens = POSITIONS.map(pos => {
    const pid = plan[pos];
    const [x, y] = COURT_SPOTS[pos];
    const name = pid ? playerName(pid) : 'Empty';
    const inner = `<span class="pos-chip ${pid ? POS_ZONE[pos] : 'unfilled'}" aria-hidden="true">${pos}</span>
      <span class="token-name ${pid ? '' : 'empty'} ${isFollowed(pid) ? 'followed' : ''}">${isFollowed(pid) ? STAR + ' ' : ''}${escapeHtml(name)}</span>`;
    const style = `style="left:${x}%; top:${y}%"`;
    if (!editable && tapAction) return `<button class="court-token" ${style} data-action="${tapAction}" data-side="us" data-pos="${pos}"
        aria-label="${POS_NAMES[pos]}, ${escapeHtml(name)}. Make a substitution">${inner}</button>`;
    if (!editable) return `<div class="court-token" ${style} aria-label="${POS_NAMES[pos]}: ${escapeHtml(name)}">${inner}</div>`;
    return `<button class="court-token ${UI.pickPos === pos ? 'picking' : ''}" ${style} data-action="pick-pos" data-pos="${pos}" data-player="${escapeHtml(pid || '')}"
        aria-label="${POS_NAMES[pos]}, ${escapeHtml(name)}. Change who plays ${pos} in ${escapeHtml(periodName(g, p))}">${inner}</button>`;
  }).join('');
  let bench = '';
  if (avail){
    const onCourt = new Set(Object.values(plan).filter(Boolean));
    const ids = avail.filter(id => !onCourt.has(id));
    bench = `<div class="bench-drop" ${editable ? 'data-dnd' : ''}>
        <div class="bench-label">Bench${editable ? ' <span>(drag onto a position)</span>' : ''}</div>
        <div class="chip-wrap">${ids.length ? ids.map(id => editable
          ? `<span class="chip bench-chip" data-player="${escapeHtml(id)}" role="button" aria-label="${escapeHtml(playerName(id))}, on the bench. Drag onto a position">${escapeHtml(playerName(id))}</span>`
          : `<span class="chip ${isFollowed(id) ? 'followed' : ''}">${isFollowed(id) ? STAR + ' ' : ''}${escapeHtml(playerName(id))}</span>`).join('')
          : '<span class="hint">Nobody on the bench.</span>'}</div>
      </div>`;
    // Players who aren't playing this game, so nobody wonders where a name went.
    const out = byName(CUR.players.filter(pl => pl.active !== false && !avail.includes(pl.id)).map(pl => pl.id));
    if (out.length) bench += `<div class="bench-drop unavail-drop">
        <div class="bench-label">Not available${canScore() && !isPractice(g) ? ' <span>(change this on the Players tab)</span>' : ''}</div>
        <div class="chip-wrap">${out.map(id => `<span class="chip">${escapeHtml(playerName(id))}</span>`).join('')}</div>
      </div>`;
  }
  return `<div class="court-wrap">
      <div class="court-end">Attacking end</div>
      <div class="court" role="group" ${editable ? 'data-dnd' : ''} aria-label="Court positions, ${escapeHtml(periodName(g, p))}">
        <svg class="court-lines" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
          <rect class="court-mid" x="0" y="45" width="100" height="45" />
          <rect x="1" y="1" width="98" height="133" rx="1.5" />
          <line x1="1" y1="45" x2="99" y2="45" />
          <line x1="1" y1="90" x2="99" y2="90" />
          <path d="M20 1 A30 30 0 0 0 80 1" />
          <path d="M20 134 A30 30 0 0 1 80 134" />
          <circle cx="50" cy="67.5" r="3" />
        </svg>
        ${tokens}
      </div>
      <div class="court-end">Defending end</div>
    </div>${bench}`;
}

// Bottom sheet listing who can play the chosen position. Bench players
// with the fewest periods so far this game come first.
// countOf(id) gives { text, n (for sorting), zero } for the right-hand figure.
function pickerSheetHtml(g, p, plan, avail, posOf, countOf, note){
  const pos = UI.pickPos;
  const current = plan[pos];
  // Players who prefer this position come first (1st choice, then 2nd,
  // then 3rd), with a star; then the least time in it, as before.
  const prefRank = id => { const r = playerPrefs(CUR.players.find(x => x.id === id)).indexOf(pos); return r < 0 ? 9 : r; };
  const ORD = ['1st', '2nd', '3rd'];
  const row = (id, sub) => {
    const c = countOf(id), r = prefRank(id);
    const pl = CUR.players.find(x => x.id === id);
    return `<button class="pick-row ${id === current ? 'current' : ''} ${r < 9 ? 'prefers' : ''}" data-action="pick-player" data-player="${escapeHtml(id)}">
      <span class="grow"><span class="pname">${r < 9 ? STAR + ' ' : ''}${escapeHtml(playerName(id))}</span>
        <span class="psub">${r < 9 ? `<b>Prefers ${pos} (${ORD[r]} choice)</b> · ` : ''}${sub}</span></span>
      ${prefChipsHtml(pl)}
      <span class="pick-count ${c.zero ? 'zero' : ''}">${escapeHtml(c.text)}</span>
    </button>`;
  };
  const byCount = (a, b) => prefRank(a) - prefRank(b) || countOf(a).n - countOf(b).n || playerName(a).localeCompare(playerName(b));
  const bench = avail.filter(id => !posOf[id]).sort(byCount);
  const onCourt = avail.filter(id => posOf[id] && posOf[id] !== pos).sort(byCount);
  return `<div class="sheet-backdrop" data-action="close-picker"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="pos-chip ${POS_ZONE[pos]}" aria-hidden="true">${pos}</span>
        <div class="grow">
          <h3 id="sheet-title">${POS_NAMES[pos]}</h3>
          <div class="psub">${escapeHtml(periodName(g, p))} · ${current ? 'now ' + escapeHtml(playerName(current)) : 'empty'}</div>
        </div>
        <button class="btn ghost small" data-action="close-picker">Close</button>
      </div>
      <div class="sheet-body">
        ${bench.length ? `<div class="list-label">On the bench</div>${bench.map(id => row(id, 'Bench')).join('')}` : ''}
        ${onCourt.length ? `<div class="list-label">On court (will swap)</div>${onCourt.map(id => row(id, 'Now ' + posOf[id])).join('')}` : ''}
        ${!bench.length && !onCourt.length ? '<div class="empty-state">No other players are marked as playing.</div>' : ''}
        ${current ? `<button class="btn ghost" style="width:100%; margin-top:0.8rem" data-action="pick-player" data-player="">Leave ${pos} empty</button>` : ''}
        <p class="hint">${note}</p>
      </div>
    </div>`;
}

    ${canEditGames() ? `<div class="panel">

        <button class="btn" data-action="game-tab" data-tab="lineup">Assign positions</button>
      </div>` : ''}`;
}

// Minutes on court across this game and every game before it this season.
// Games that have been played count real court time; games not yet played
// count the planned lineup (a full period per planned position).
// For the Game stats tab (which adds the heading and switches). Simple is
// minutes per player; Detailed is minutes in each position.
function seasonTimeHtml(g, detailed){
  // Byes aren't games, so they don't count as games anyone was available for.
  const games = sortGames(CUR.games).filter(x => (!x.archived && !x.bye) || x.id === g.id);
  const upto = games.slice(0, games.findIndex(x => x.id === g.id) + 1);
  const rows = {};
  // Times are kept in milliseconds and shown in minutes. v is the same time
  // in periods, used only to decide whether someone really got on court.
  const ensure = id => rows[id] || (rows[id] = { id, posMs:{}, thisGame:0, ms:0, thisMs:0, games:new Set(), avail:new Set() });
  const add = (id, pos, v, game, ms) => {
    const r = ensure(id);
    r.posMs[pos] = (r.posMs[pos] || 0) + ms;
    r.ms += ms;
    if (v >= 0.05){ r.games.add(game.id); r.avail.add(game.id); } // counts as a game played
    if (game.id === g.id){ r.thisGame += v; r.thisMs += ms; }
  };
  CUR.players.filter(p => p.active !== false).forEach(p => ensure(p.id));
  let playedGames = 0;
  upto.forEach(game => {
    // Available for this game: marked as playing (or got on court, above).
    availableIds(game).forEach(id => ensure(id).avail.add(game.id));
    // This game, once started, counts from its live events (its saved summary
    // only updates at each break), so it matches this game's figures above.
    const started = game.status === 'live' || game.status === 'final';
    const courtTime = started && game.id === g.id && CUR.loaded.events
      ? Object.fromEntries(Object.entries(computeGame(game, CUR.events).players).map(([id, r]) => [id, r.pos || {}]))
      : started && game.summary && game.summary.courtTime;
    if (courtTime){
      playedGames++;
      const pms = periodMs(game);
      Object.entries(courtTime).forEach(([id, byPos]) =>
        Object.entries(byPos).forEach(([pos, ms]) => add(id, pos, ms / pms, game, ms)));
      return;
    }
    for (let k = 1; k <= periodCount(game); k++){
      const plan = planFor(game, k);
      POSITIONS.forEach(pos => { if (plan[pos]) add(plan[pos], pos, 1, game, periodMs(game)); });
    }
  });
  // Whole minutes; under half a minute on court shows as "<1" rather than 0.
  const mins = ms => ms >= 30000 ? wholeMins(ms) : ms > 0 ? '<1' : '0';
  const list = Object.values(rows).sort((a,b) => playerName(a.id).localeCompare(playerName(b.id)));
  const max = Math.max(1, ...list.flatMap(r => POSITIONS.map(pos => r.posMs[pos] || 0)));
  const playing = new Set(availableIds(g));
  const note = playedGames
    ? `${playedGames} of these games ${playedGames === 1 ? 'was' : 'were'} scored live, so ${playedGames === 1 ? 'it counts' : 'they count'} real court time. The rest count the planned lineup (a full ${escapeHtml(periodNoun(g))} each).`
    : `These count the planned lineups (a full ${escapeHtml(periodNoun(g))} each). Games scored live will count real court time instead.`;

  if (!detailed){
    // Simple: whole minutes, lowest average first so whoever is owed time is at the top.
    const avgMs = r => r.avail.size ? r.ms / r.avail.size : 0;
    const simple = list.slice().sort((a, b) => avgMs(a) - avgMs(b) || playerName(a.id).localeCompare(playerName(b.id)));
    const rowsHtml = simple.map(r => `<tr class="${followRow(r.id)}">
        <td>${pnameHtml(r.id)}</td>
        <td>${r.games.size}</td>
        <td class="total">${r.avail.size ? wholeMins(avgMs(r)) : '·'}</td>
        <td class="this ${playing.has(r.id) && r.thisGame < 0.05 ? 'zero-this' : ''}">${playing.has(r.id) ? wholeMins(r.thisMs) : 'out'}</td>
      </tr>`).join('');
    const simpleNote = playedGames
      ? `${playedGames} of these games ${playedGames === 1 ? 'was' : 'were'} scored live, so ${playedGames === 1 ? 'it counts' : 'they count'} real court time. The rest count the planned lineup.`
      : 'These count the planned lineups. Games scored live will count real court time instead.';
    return `<div class="fair-wrap"><table class="fair simple">
        <caption>Times in minutes</caption>
        <thead><tr><th scope="col">Player</th><th scope="col">Games played</th>
          <th scope="col">Avg mins played per game available</th><th scope="col">Mins this game</th></tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="4">No players yet.</td></tr>'}</tbody>
      </table></div>
      <p class="hint">Minutes on court, from the first game of the season up to and including this one (${upto.length} game${upto.length === 1 ? '' : 's'}). The average divides a player's court time by the games they were available for, so games they missed don't pull it down, but games spent on the bench do. "Out" means not playing this game. ${simpleNote}</p>`;
  }

  const body = list.map(r => `<tr>
      <td>${escapeHtml(playerName(r.id))}</td>
      ${POSITIONS.map(pos => {
        const ms = r.posMs[pos] || 0;
        const shade = ms ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * ms / max)}%, transparent)"` : '';
        return `<td ${shade}>${ms ? mins(ms) : '·'}</td>`;
      }).join('')}
      <td class="total">${mins(r.ms)}</td>
      <td class="this ${playing.has(r.id) && r.thisGame < 0.05 ? 'zero-this' : ''}">${playing.has(r.id) ? mins(r.thisMs) : 'out'}</td>
    </tr>`).join('');
  return `<div class="fair-wrap"><table class="fair">
      <caption>Times in minutes</caption>
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}
        <th scope="col">Total mins</th><th scope="col">Mins this game</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 3}">No players yet.</td></tr>`}</tbody>
    </table></div>
    <p class="hint">Minutes each player has had in each position, from the first game of the season up to and including this one (${upto.length} game${upto.length === 1 ? '' : 's'}). Darker means more time. ${note}</p>`;
}

/* ---- Live tab ---- */
// How to change the lineup before a game or between periods (practice games too).
const LINEUP_TIP = 'Tap or drag a bib or name to change the lineup.';
const PLAN_NOTE = 'Planned by a volunteer doing their best to balance lots of expectations. Lineups often change on game day.';
// Shown under every planned lineup, so nobody treats it as a promise.
// Coach/Managers (who make the plan) are told what parents and players see.
function planNoteHtml(g){
  if (g && isPractice(g)) return '';
  return isManager()
    ? '<p class="plan-note">Parents and players see a note that this is a plan by a volunteer and lineups often change on game day.</p>'
    : `<p class="plan-note">${PLAN_NOTE}</p>`;
}
function renderLiveTab(g){
  if (CUR.eventsError) return `<div class="panel" role="alert"><p style="margin:0">${
    String(CUR.eventsError.code).includes('permission-denied') && isOwner()
      ? "Game events can't be loaded because the database's security rules are out of date. Publish the latest firestore.rules in Firebase (Firestore Database > Rules), then refresh."
      : "Game events couldn't be loaded. Check your connection and refresh the page."}</p></div>`;
  if (!CUR.loaded.events) return '<div class="loading-state">Loading game…</div>';

  const st = computeGame(g, CUR.events);
  const L = g.live || {};
  const n = periodCount(g);
  const status = g.status || 'scheduled';
  const scoring = amScorer(g);
  const avail = byName(availableIds(g));
  let body = '';

  if (status === 'scheduled' || !g.live){
    // Before the game: pick the first centre and check the Q1 lineup.
    UI.period = 1;
    const plan = planFor(g, 1);
    const empty = POSITIONS.filter(pos => !plan[pos] || !avail.includes(plan[pos])).length;
    // The Start card sits above the scoreboard, so it's the first thing the scorer sees.
    const startCard = canScore() ? `<div class="form-card">
        <h3>Start the game</h3>
        <div class="field">
          <span class="label" id="fc-label">First centre pass</span>
          <div class="segmented" role="radiogroup" aria-labelledby="fc-label">
            <label><input type="radio" id="fc-us" name="firstCentre" value="us" checked><span>${escapeHtml(teamLabel(g, 'us'))}</span></label>
            <label><input type="radio" id="fc-them" name="firstCentre" value="them"><span>${escapeHtml(teamLabel(g, 'them'))}</span></label>
          </div>
        </div>
        ${empty ? `<p class="hint" style="margin:0">${empty} position${empty === 1 ? ' is' : 's are'} empty in the ${escapeHtml(periodName(g, 1))} lineup. Fill ${empty === 1 ? 'it' : 'them'} below, or start anyway.</p>` : ''}
        <button class="btn go big" data-action="start-game" ${UI.busy ? 'disabled' : ''}>Start ${escapeHtml(periodName(g, 1))}</button>
        <p class="hint" style="margin:0">Tap it when the umpire starts play. The clock starts and you become the scorer.</p>
        <div class="guide-links">
          <button class="btn ghost small" data-action="show-guide">New to scoring? How to score</button>
          ${isPractice(g) || !canPractise() ? '' : '<button class="btn ghost small" data-action="start-practice">Try a practice game</button>'}
        </div>
      </div>` : '';
    body = canScore() ? `<h3 class="subhead">${escapeHtml(periodName(g, 1))} lineup</h3>
      <p class="court-tip">${LINEUP_TIP}</p>
      ${courtHtml(plan, true, g, 1, avail)}${planNoteHtml(g)}`
      : `<div class="placeholder-card">This game hasn't started yet.</div>
      ${askToScoreHtml()}
      <h3 class="subhead">${escapeHtml(periodName(g, 1))} lineup</h3>${courtHtml(plan, false, g, 1)}${planNoteHtml(g)}`;
    if (canScore() && UI.pickPos){
      const posOf = {}; POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });
      body += pickerSheetHtml(g, 1, plan, avail, posOf, planCountOf(g, gamePeriodCounts(g, avail)),
        `Counts show ${escapeHtml(periodNoun(g, true))} planned this game.`);
    }
    return startCard + scoreboardHtml(g, st) + body;
  }

  body += scorerBarHtml(g);
  if (status !== 'final') body += askToScoreHtml();

  if (isInPlay(g)){
    const lineup = st.lineup || {};
    body += livePlayHtml(g, st, scoring);
    // Coach/Managers and Scorers can all make substitutions, not just whoever is scoring.
    if (UI.subSheet && canScore()) body += subSheetHtml(g, st);
    else if (UI.feedFor && scoring) body += feedSheetHtml(g, st);
    else if (UI.statPos && scoring) body += statSheetHtml(g, st);
    else if (UI.pickPos && canScore()){
      UI.pickMode = 'live';
      const posOf = {}; POSITIONS.forEach(pos => { if (lineup[pos]) posOf[lineup[pos]] = pos; });
      body += pickerSheetHtml(g, L.period, lineup, avail, posOf,
        id => { const ms = (st.players[id] || {}).ms || 0; return { text:fmtMins(ms), n:ms, zero:!ms }; },
        'Times show court time so far this game.');
    }
  } else if (!isGameOver(g)){
    // Between periods: the next period's lineup, ready to adjust.
    const next = L.period + 1;
    UI.period = next;
    const plan = startLineup(g, next);
    prepareShare(g, st);
    body += `<p class="big-note">${escapeHtml(breakName(g, L.period))}</p>
      ${scoring ? `<div class="control-row"><button class="btn go" data-action="start-period" ${UI.busy ? 'disabled' : ''}>Start ${escapeHtml(periodName(g, next))}</button></div>` : ''}
      ${breakToolsHtml(g)}
      <p class="hint" style="text-align:center">${scoring ? `Tap Start ${escapeHtml(periodName(g, next))} when the umpire restarts play. ` : ''}${escapeHtml(periodName(g, next))} starts with the centre pass to <b>${escapeHtml(teamLabel(g, periodStartCentre(g, next)))}</b>.${canScore() ? ' ' + LINEUP_TIP : ''}</p>
      ${courtHtml(plan, canScore(), g, next, avail)}${planNoteHtml(g)}`;
    if (scoring) body += undoBarHtml(g);
    if (canScore() && UI.pickPos){
      UI.pickMode = 'plan';
      const posOf = {}; POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });
      body += pickerSheetHtml(g, next, plan, avail, posOf,
        id => { const ms = (st.players[id] || {}).ms || 0; return { text:fmtMins(ms), n:ms, zero:!ms }; },
        'Times show court time so far this game.');
    }
  } else {
    // Full time.
    const final = status === 'final';
    const canFix = canScore() && !final;
    prepareShare(g, st);
    body += `<p class="big-note">${final ? 'Final' : 'Full time'}</p>
      <div class="lineup-tools" style="justify-content:center"><button class="btn small" data-action="share-summary">Share score</button></div>`;
    if (isManager() && !isPractice(g)){
      watchAwards();
      const given = CUR.awards && Object.values(CUR.awards[g.id] || {}).some(ids => ids && ids.length);
      if (CUR.awards && awardsOn(g) && !given) body += `<div class="panel gameday-nudge"><p style="margin:0 0 0.5rem"><b>Give awards for this game?</b> Only Coach/Managers see them.</p>
        <button class="btn small" data-action="game-tab" data-tab="summary">Give awards</button></div>`;
    }
    if (canFix) body += `<div class="panel">
        <p style="margin:0 0 0.6rem">Check the timeline below and fix any mistakes, then finalise to lock the game.</p>
        <button class="btn go" data-action="finalise-game" ${UI.busy ? 'disabled' : ''}>Finalise game</button>
      </div>`;
    if (final && isManager()) body += `<div class="lineup-tools">
        <button class="btn ghost small ${isArmed('unlock-game') ? 'armed' : ''}" data-action="unlock-game">
          ${isArmed('unlock-game') ? 'Confirm unlock for corrections' : 'Unlock for corrections'}</button></div>`;
  }

  // The full-time timeline is for Coach/Managers and Scorers (to check and fix); viewers don't see it.
  if (isGameOver(g) && canScore()) body += timelineHtml(g, true, status !== 'final');
  if (UI.handover === g.id) body += handoverSheetHtml(g);
  return scoreboardHtml(g, st) + body;
}

// The in-play screen: position tiles for recording goals and misses, in
// one of two modes the scorer swipes between. "Player first": tap a
// shooter, then Goal or Miss. "Goal/Miss first": tap Goal or Miss, then who.
function livePlayHtml(g, st, scoring){
  const L = g.live;
  const lineup = st.lineup || {};
  const mode = scoring ? UI.liveMode : 'player';
  const tile = (pos, side, action, opts) => {
    opts = opts || {};
    const pid = side === 'us' ? lineup[pos] : null;
    const shooter = SHOOTERS.includes(pos);
    const cls = `ptile ${side === 'them' ? 'opp' : ''} ${side === 'us' && shooter ? 'shooter' : ''} ${opts.wide ? 'wide' : ''} ${opts.dim ? 'dim' : ''}`;
    const label = side === 'them' ? (pos ? `${teamLabel(g, 'them')} ${pos}` : `${teamLabel(g, 'them')}, team`) : `${POS_NAMES[pos]}, ${pid ? playerName(pid) : 'empty'}`;
    // Tiles are only for the scorer. The other team has one tile with their
    // name (no positions); our shooters show our team name, so it's clear
    // which buttons are ours.
    const inner = side === 'them' ? `<span class="pt-opp">${escapeHtml(teamLabel(g, 'them'))}</span><span class="pt-sub">Other team</span>`
      : `<span class="pt-pos">${pos || 'Team'}</span>
      ${side === 'us' ? `<span class="pt-name ${pid ? '' : 'empty'}">${pid ? escapeHtml(playerName(pid)) : 'Empty'}</span>
        <span class="pt-team">${escapeHtml(teamLabel(g, 'us'))}</span>` : ''}`;
    if (!action) return `<div class="${cls}" aria-label="${escapeHtml(label)}">${inner}</div>`;
    return `<button class="${cls}" data-action="${action}" data-side="${side}" data-pos="${pos}" aria-label="${escapeHtml(label)}" ${opts.disabled ? 'disabled' : ''}>${inner}</button>`;
  };

  let controls = '';
  if (scoring){
    // At 0:00 the End button stands out, with a reminder to add any last shot.
    const timeUp = isTimeUp(g);
    controls = `<div class="mode-row">
        <div class="mode-tabs" role="tablist" aria-label="Scoring mode">
          <button class="mode-tab ${mode === 'event' ? 'on' : ''}" role="tab" aria-selected="${mode === 'event'}" data-action="live-mode" data-mode="event">Goal/Miss first</button>
          <button class="mode-tab ${mode === 'player' ? 'on' : ''}" role="tab" aria-selected="${mode === 'player'}" data-action="live-mode" data-mode="player">Player first</button>
        </div>
      </div>
      ${timeUp ? `<p class="time-up-note" role="status">Time. Add any last goal or miss, then tap End ${escapeHtml(periodName(g, L.period))} at the top.</p>` : ''}`;
  }

  let pane;
  if (mode === 'event'){
    const ev = UI.pendingEvent;
    // With extra stats tracked, they sit under Goal and Miss as smaller
    // buttons, and Step 2 offers every position (only the ones that can
    // have the chosen stat are enabled).
    const usTap = tapExtras(usExtras(g)), themTap = themExtras(g);
    const extras = EXTRA_STATS.filter(k => usTap.includes(k) || themTap.includes(k));
    const shot = ev === 'goal' || ev === 'miss';
    const usOk = pos => ev && (shot ? SHOOTERS.includes(pos) : usTap.includes(ev));
    const themOk = ev && (shot || themTap.includes(ev));
    // A pink frame shows which step is next: Step 1 to start with, then
    // Step 2 once a stat is chosen (and Step 1's heading fades). Both
    // frames are always there (just invisible), so nothing on the screen moves.
    pane = `<div class="step-frame ${ev ? '' : 'active'}">
        <div class="sec-label ${ev ? 'done' : ''}">Step 1: What happened</div>
        <div class="ev-grid ${tracksMiss(g) ? '' : 'one'}">
          <button class="evbtn goal ${ev === 'goal' ? 'on' : ''}" data-action="ef-event" data-stat="goal" aria-pressed="${ev === 'goal'}">Goal</button>
          ${tracksMiss(g) ? `<button class="evbtn miss ${ev === 'miss' ? 'on' : ''}" data-action="ef-event" data-stat="miss" aria-pressed="${ev === 'miss'}">Miss</button>` : ''}
        </div>
        ${extras.length ? `<div class="ev-more">${extras.map(k => `<button class="evbtn small ${ev === k ? 'on' : ''}" data-action="ef-event" data-stat="${k}" aria-pressed="${ev === k}">${escapeHtml(STAT_LABEL[k])}</button>`).join('')}</div>` : ''}
      </div>
      <div class="step-frame ${ev ? 'active' : ''}">
        <div class="sec-label">Step 2: Who did it <span class="hint ${ev ? 'gone' : ''}">(tap ${extras.length ? 'a stat' : tracksMiss(g) ? 'Goal or Miss' : 'Goal'} first)</span></div>
        ${usTap.length ? `<div class="pos-row two">${tile('GS', 'us', 'ef-who', { disabled:!usOk('GS') })}${tile('GA', 'us', 'ef-who', { disabled:!usOk('GA') })}</div>
          <div class="pos-row three">${['WA','C','WD'].map(p => tile(p, 'us', 'ef-who', { disabled:!usOk(p) })).join('')}</div>
          <div class="pos-row two">${tile('GD', 'us', 'ef-who', { disabled:!usOk('GD') })}${tile('GK', 'us', 'ef-who', { disabled:!usOk('GK') })}</div>`
        : `<div class="pos-row two">${tile('GS', 'us', 'ef-who', { disabled:!usOk('GS') })}${tile('GA', 'us', 'ef-who', { disabled:!usOk('GA') })}</div>`}
        <div class="pos-row one">${tile('', 'them', 'ef-who', { disabled:!themOk })}</div>
      </div>
      ${subBtnHtml(g)}`;
  } else if (scoring){
    // The scorer only needs the shooters (subs are under Sub Player(s)).
    pane = tapExtras(usExtras(g)).length
      ? `<div class="sec-label">Who did it</div>
        <div class="pos-row two">${tile('GS', 'us', 'tile')}${tile('GA', 'us', 'tile')}</div>
        <div class="pos-row three">${['WA','C','WD'].map(p => tile(p, 'us', 'tile')).join('')}</div>
        <div class="pos-row two">${tile('GD', 'us', 'tile')}${tile('GK', 'us', 'tile')}</div>
        <div class="pos-row one">${tile('', 'them', 'tile')}</div>
        ${subBtnHtml(g)}<p class="hint">Tap a player (or the other team) to record a stat.</p>`
      : `<div class="sec-label">Who shot</div>
        <div class="pos-row two">${tile('GS', 'us', 'tile')}${tile('GA', 'us', 'tile')}</div>
        <div class="pos-row one">${tile('', 'them', 'tile')}</div>
        ${subBtnHtml(g)}<p class="hint">Tap a shooter (or the other team) to record a goal${tracksMiss(g) ? ' or miss' : ''}.</p>`;
  } else {
    // Everyone else sees who's on court on the court diagram, with the bench.
    // Coach/Managers and Scorers can tap a position to make a substitution.
    pane = `<div class="sec-label">Your team's lineup</div>
      ${courtHtml(lineup, false, g, L.period, byName(availableIds(g)), canScore() ? 'tile' : null)}
      ${canScore() ? subBtnHtml(g) + '<p class="hint">Tap a position, or Sub Player(s), to make a substitution.</p>' : ''}`;
  }
  return `${controls}<div class="swipe-zone" ${scoring ? 'data-swipe' : ''}>${pane}</div>
    ${eventLogHtml(g)}
    ${scoring ? '<div class="float-spacer" aria-hidden="true"></div>' : ''}
    ${scoring ? undoBarHtml(g) : ''}
    ${scoring && voiceSupported() ? `<button class="mic-btn ${UI.voiceListening ? 'on' : ''}" data-action="voice" aria-label="${UI.voiceListening ? 'Listening. Tap to stop' : 'Score by voice'}">${micSvg()}</button>${UI.voiceListening ? `<div class="mic-hint" role="status">Listening... say "GS goal"${tapExtras(usExtras(g)).length ? ' or "WD intercept"' : ''}</div>` : ''}` : ''}`;
}

// Substitutions from either scoring mode, and (for the scorer or a
// Coach/Manager) handing scoring to someone else at any time, not just at breaks.
function subBtnHtml(g){
  const canHand = g && !isPractice(g) && (amScorer(g) || isManager()) && scorerChoices(g).length;
  const sub = '<button class="btn ghost sub-btn" data-action="sub-open">⇄ Sub Player(s)</button>';
  return canHand ? `<div class="sub-row">${sub}<button class="btn ghost sub-btn" data-action="handover-open" data-game="${escapeHtml(g.id)}">Hand over scoring</button></div>` : sub;
}
// The court as it is right now, with the bench. Names can be dragged between
// positions or to and from the bench (each drop is saved straight away as a
// substitution), or a position tapped to pick from a list.
function subSheetHtml(g, st){
  const lineup = st.lineup || {};
  return `<div class="sheet-backdrop" data-action="sub-close"></div>
    <div class="sheet sub-sheet" role="dialog" aria-modal="true" aria-labelledby="sub-title">
      <div class="sheet-head">
        <div class="grow"><h3 id="sub-title">Sub Player(s)</h3><div class="hint">Drag a name to another position or the bench, or tap a position.</div></div>
        <button class="btn small" data-action="sub-close">Done</button>
      </div>
      <div class="sheet-body" style="padding-top:0.6rem">
        ${courtHtml(lineup, true, g, g.live.period, byName(availableIds(g)))}
      </div>
    </div>`;
}

// For team members without a scoring role: how to get one, and a safe
// place to try it in the meantime.
function askToScoreHtml(){
  if (canScore()) return '';
  return `<div class="panel ask-score">
      <p style="margin:0${canPractise() ? ' 0 0.5rem' : ''}"><b>Want to help score?</b> Ask your coach/manager to make you a Scorer. They can do it in Team &gt; Support Crew.</p>
      ${canPractise() ? '<button class="btn ghost small" data-action="start-practice">Try a practice game</button>' : ''}
    </div>`;
}
// A practice game needs someone on the roster to score for.
function canPractise(){ return CUR.players.some(p => p.active !== false); }

// The last few goals and misses, newest first. Anyone who can run the game
// can tap a row to undo that particular entry (not just the latest).
function eventLogHtml(g){
  const pms = periodMs(g);
  const evs = CUR.events.filter(e => !e.undone && (STAT_LABEL[e.type] || e.type === 'oppGoal' || e.type === 'oppMiss' || e.type === 'oppStat'))
    .sort((a,b) => (b.at || 0) - (a.at || 0)).slice(0, 8);
  if (!evs.length) return '';
  const tappable = canScore();
  return `<div class="event-log" aria-label="Latest">
    ${evs.map((e, i) => {
      const opp = e.type === 'oppGoal' || e.type === 'oppMiss' || e.type === 'oppStat';
      const what = e.type === 'goal' || e.type === 'oppGoal' ? 'Goal' : e.type === 'miss' || e.type === 'oppMiss' ? 'Miss'
        : STAT_LABEL[e.type === 'oppStat' ? e.stat : e.type] || 'Stat';
      const badge = opp ? 'Opp' : (e.pos || '?');
      const who = opp ? '' : (e.playerId ? ' · ' + escapeHtml(playerName(e.playerId)) : '');
      const inner = `<span class="log-badge ${opp ? 'opp' : ''}">${escapeHtml(badge)}</span>
          <span class="log-what">${what}${who}</span>
          <span class="log-when">${escapeHtml(periodName(g, e.period))} · ${fmtClock(pms - e.t)}</span>`;
      if (!tappable) return `<div class="log-row ${i === 0 ? 'latest' : ''}">${inner}</div>`;
      const sel = UI.logSel === e.id;
      return `<div class="log-item ${sel ? 'sel' : ''}">
          <button class="log-row ${i === 0 ? 'latest' : ''}" data-action="log-select" data-event="${escapeHtml(e.id)}" aria-expanded="${sel}"
            aria-label="${escapeHtml(eventText(g, e))}. Tap for options">${inner}</button>
          ${sel ? `<div class="log-actions">
              <span>Undo this ${escapeHtml(what.toLowerCase())}?</span>
              <button class="btn danger small" data-action="log-undo" data-event="${escapeHtml(e.id)}">Undo</button>
              <button class="btn ghost small" data-action="log-cancel">Keep</button>
            </div>` : ''}
        </div>`;
    }).join('')}
  </div>`;
}

// Undoes one entry from the log. Goes on the Redo list like any undo.
async function undoEvent(id){
  const e = CUR.events.find(x => x.id === id && !x.undone);
  if (!e) return;
  redoStack.push(id);
  try { await updateDoc(doc(eventsRef(UI.gameId), id), { undone:true }); }
  catch (err){ redoStack.pop(); throw err; }
  toast('Undone: ' + eventText(findGame(UI.gameId), e));
}

// Floating Undo / Redo for the scorer.
function undoBarHtml(g){
  const last = lastUndoable();
  return `<div class="undo-bar">
      <button class="undo-btn" data-action="undo" ${last ? `aria-label="Undo ${escapeHtml(eventText(g, last))}"` : 'disabled aria-label="Undo"'}>${undoSvg()}</button>
      <button class="undo-btn" data-action="redo" ${redoStack.length ? 'aria-label="Redo"' : 'disabled aria-label="Redo"'}>${undoSvg(true)}</button>
    </div>`;
}
function undoSvg(flip){
  return `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" ${flip ? 'style="transform:scaleX(-1)"' : ''}>
    <path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

// Score, clock, period and centre pass, with play/pause for the scorer.
function scoreboardHtml(g, st){
  const L = g.live || {};
  const scoring = amScorer(g);
  let period, phase = '', clock = '';
  if (!g.live || g.status === 'scheduled'){
    period = periodName(g, 1); phase = 'Not started';
    clock = `<div class="clock stopped">${fmtClock(periodMs(g))}</div>`;
  } else if (isGameOver(g)){
    period = g.status === 'final' ? 'Final' : 'Full time';
  } else {
    period = periodName(g, L.period);
    // The scorer's Pause/Resume button already shows whether the clock is
    // running, so no word is needed there (it would crowd the centre pass).
    // Followers have no button, so they still see "Paused".
    phase = !isInPlay(g) ? breakName(g, L.period) : isTimeUp(g) ? 'Time' : (L.phase === 'paused' && !scoring) ? 'Paused' : '';
    clock = `<div class="clock ${L.phase === 'running' ? '' : 'stopped'}" data-clock>${fmtClock(periodMs(g) - elapsedMs(g))}</div>`;
  }
  // Next centre pass: a small netball under the team that takes it. The other
  // team gets an invisible copy so the two scores stay level. For the scorer the
  // ball is a button; switching takes two taps, so a stray tap can't change it.
  const showCp = isInPlay(g) && st.centre;
  const armedCp = scoring && isArmed('swap-centre');
  const cpMark = t => {
    if (!showCp) return '';
    if (st.centre !== t) return `<span class="cp-mark ghost" aria-hidden="true">${cpBallSvg()}</span>`;
    if (!scoring) return `<span class="cp-mark" role="img" aria-label="Next centre pass: ${escapeHtml(teamLabel(g, t))}">${cpBallSvg()}</span>`;
    return `<button class="cp-mark ${armedCp ? 'armed' : ''}" data-action="swap-centre" aria-label="${armedCp
        ? `Confirm switch centre pass to ${escapeHtml(teamLabel(g, otherTeam(t)))}`
        : `Next centre pass: ${escapeHtml(teamLabel(g, t))}. Double tap to switch.`}">${armedCp ? '<span class="cp-switch">Switch?</span>' : cpBallSvg()}</button>`;
  };
  let play = '', help = '';
  // How to score: for the scorer while a period is played and during breaks.
  if (scoring && g.status === 'live' && !isGameOver(g))
    help = '<button class="help-btn" data-action="show-guide" aria-label="How to score"><b aria-hidden="true">?</b><span class="play-label">Help</span></button>';
  if (scoring && isInPlay(g)){
    // No Pause/Resume at 0:00: there's no time left to play.
    play = isTimeUp(g) ? '' : L.phase === 'running'
      ? `<button class="play-btn" data-action="pause-clock" aria-label="Pause clock"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg><span class="play-label">Pause</span></button>`
      : `<button class="play-btn go" data-action="resume-clock" aria-label="Start clock"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span class="play-label">Resume</span></button>`;
  }
  // One block: period and clock on the left (with Pause/Resume under the
  // clock), the score (with the centre pass marker) in the middle, Help on
  // the right.
  return `<div class="sb2">
      <div class="sb2-main">
        <div class="sb2-clock"><span class="sb2-period">${escapeHtml(period)}</span>${clock}${phase ? `<span class="sb2-phase">${phase}</span>` : ''}${play}</div>
        <div class="sb2-score ${showCp ? 'with-cp' : ''}">
          <div class="sb2-team"><span class="sb2-name">${escapeHtml(teamLabel(g, 'us'))}</span><b>${pad2(st.us)}</b>${cpMark('us')}</div>

        </div>
        <div class="sb2-play">${help}</div>
      </div>
    </div>`;
}

function scorerBarHtml(g){
  if (g.status === 'final') return '';
  const who = g.scorerName || 'Nobody';
  if (amScorer(g)) return isInPlay(g) ? '' : `<div class="scorer-bar"><span>You're scoring this game.</span></div>`;
  // Taking over needs a second tap, so two helpers can't grab it from each
  // other by accident.
  const armedTake = isArmed('take-over');
  const takeLabel = !armedTake ? 'Take over scoring'
    : g.scorerUid ? `Confirm take over from ${escapeHtml(who)}` : 'Confirm score this game';
  return `<div class="scorer-bar"><span>${g.scorerUid ? escapeHtml(who) + ' is scoring.' : 'Nobody is scoring.'}</span>

}

// At a break: share the score so far, and (for the scorer or a Coach/Manager)
// an easy way to hand scoring to someone else for the next period.
function breakToolsHtml(g){
  const canHand = !isPractice(g) && (amScorer(g) || isManager()) && scorerChoices(g).length;

// People who could take over scoring: anyone with the Scorer or
// Coach/Manager role, apart from whoever is scoring now.
function scorerChoices(g){
  return CUR.members.filter(m => m.id !== g.scorerUid && (m.roles || []).some(r => r === 'scorer' || r === 'coach'))

}

// Only one person scores a game at a time. This passes it to someone else;

async function handOverScoring(gameId, memberId){

// Undo the scorer's own most recent action (not period starts and ends).
function lastUndoable(){
  return CUR.events.filter(e => !e.undone && e.by === (USER && USER.uid) && e.type !== 'periodEnd' && !e.start)
    .sort((a,b) => (b.at || 0) - (a.at || 0))[0];
}
function eventText(g, e){
  if (STAT_LABEL[e.type]) return `${STAT_LABEL[e.type]}, ${e.playerId ? playerName(e.playerId) : 'unknown'}${e.pos ? ' (' + e.pos + ')' : ''}`;
  if (e.type === 'oppGoal') return `${teamLabel(g, 'them')}${e.pos ? ' ' + e.pos : ''} goal`;
  if (e.type === 'oppMiss') return `${teamLabel(g, 'them')}${e.pos ? ' ' + e.pos : ''} miss`;
  if (e.type === 'oppStat') return `${STAT_LABEL[e.stat] || e.stat}, ${teamLabel(g, 'them')}`;
  if (e.type === 'centre') return `Centre pass to ${teamLabel(g, e.team)}`;
  if (e.type === 'lineup') return 'Lineup change';
  return e.type;
}

// Recent events during play; the full timeline (with corrections) at full time.
function timelineHtml(g, full, editable){
  const pms = periodMs(g);
  let evs = CUR.events.filter(e => !e.undone && e.type !== 'periodEnd' && e.type !== 'lineup');
  if (full) evs.sort((a,b) => (a.period - b.period) || (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  else evs = evs.sort((a,b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  const playerOpts = byName(Array.from(new Set([...availableIds(g), ...CUR.events.filter(e => e.playerId).map(e => e.playerId)])));
  const rows = evs.map(e => {
    const when = `${escapeHtml(periodName(g, e.period))} ${fmtClock(pms - e.t)}`;
    const isOurs = !!STAT_LABEL[e.type];
    let controls = '';
    if (editable){
      const rmKey = 'rm-ev-' + e.id;
      controls = `${isOurs ? `<select class="select-input" data-field="event-player" data-event="${escapeHtml(e.id)}" aria-label="Player for this ${escapeHtml(STAT_LABEL[e.type])}">
          ${playerOpts.map(id => `<option value="${escapeHtml(id)}" ${id === e.playerId ? 'selected' : ''}>${escapeHtml(playerName(id))}</option>`).join('')}
        </select>` : ''}
        <button class="btn danger small ${isArmed(rmKey) ? 'armed' : ''}" data-action="remove-event" data-event="${escapeHtml(e.id)}">
          ${isArmed(rmKey) ? 'Confirm remove' : 'Remove'}</button>`;
    }
    return `<div class="event-row ${isOurs ? '' : 'opp'}"><span class="event-when">${when}</span>
      <span class="event-what grow">${escapeHtml(isOurs && editable ? STAT_LABEL[e.type] + (e.pos ? ' (' + e.pos + ')' : '') : eventText(g, e))}</span>${controls}</div>`;
  }).join('');
  const addForm = editable ? correctionFormHtml(g, playerOpts) : '';
  if (!rows && !addForm) return '';
  return `<h3 class="subhead">${full ? 'Timeline' : 'Latest'}</h3>
    <div class="list-card">${rows || '<div class="empty-state">Nothing recorded yet.</div>'}</div>${addForm}`;
}
