/* ---- Game screen ---- */
function renderGame(){
  const back = `<button class="back-link" data-action="back-to-games">‹ ${CUR.team ? escapeHtml(CUR.team.name) : 'Games'}</button>`;
  if (CUR.gamesError) return back + gamesErrorHtml();
  if (!CUR.team || !CUR.season || !CUR.loaded.members || !CUR.loaded.games || !CUR.loaded.players)
    return back + '<div class="loading-state">Loading…</div>';
  const g = findGame(UI.gameId);
  if (!g) return back + '<div class="empty-state">This game has been deleted.</div>';

  const practice = isPractice(g);
  const tabs = [['live', g.status === 'live' ? 'Live' : 'Game']];
  if (g.status === 'live' || g.status === 'final') tabs.push(['summary','Summary']);
  if (!practice){
    tabs.push(['avail','Players'], ['lineup','Lineup'], ['fair','Fairness']);
    if (canEditGames()) tabs.push(['details','Details']);
  }
  if (!tabs.some(([k]) => k === UI.gameTab)) UI.gameTab = practice ? 'live' : 'lineup';
  watchEvents(g.id);

  let content = '';
  if (UI.gameTab === 'live') content = renderLiveTab(g);
  else if (UI.gameTab === 'summary') content = renderSummaryTab(g);
  else if (UI.gameTab === 'lineup') content = renderLineupTab(g);
  else if (UI.gameTab === 'avail') content = renderAvailTab(g);
  else if (UI.gameTab === 'fair') content = renderFairTab(g);
  else if (UI.gameTab === 'details') content = renderDetailsTab(g);
  if (UI.showGuide) content += guideSheetHtml(g);

  const where = [g.venue, g.court].filter(Boolean).join(', ');
  // While a period is being played, keep the header short so the scorer's
  // controls and the court fit on one phone screen.
  const banner = practice ? practiceBannerHtml() : '';
  if (UI.gameTab === 'live' && isInPlay(g)){
    // The scorer only needs this screen, so the other tabs fold away behind
    // "More" while a period is being played (fewer mis-taps).
    const nav = amScorer(g) && !UI.showTabs
      ? `<div class="more-row"><button class="btn ghost small" data-action="show-tabs" aria-expanded="false">More ▾</button></div>`
      : `<nav class="tabs" aria-label="Game sections">
        ${tabs.map(([k, label]) => `<button class="tab ${UI.gameTab === k ? 'active' : ''}" data-action="game-tab" data-tab="${k}" ${UI.gameTab === k ? 'aria-current="page"' : ''}>${label}</button>`).join('')}
      </nav>`;
    return `<div class="season-head game-head compact"><div class="head-row">${back}${amScorer(g) && !UI.showTabs ? nav : ''}</div><h2>${escapeHtml(gameTitle(g))}</h2></div>
      ${amScorer(g) && !UI.showTabs ? '' : nav}
      ${banner}
      <div class="live-play">${content}</div>`;
  }
  return `<div class="season-head game-head">
      ${back}
      <h2>${escapeHtml(gameTitle(g))}</h2>
      ${practice ? '' : `<div class="season-meta">${g.round ? 'Round ' + escapeHtml(g.round) + ' · ' : ''}${escapeHtml(fmtGameWhen(g))}</div>`}
      <div class="season-meta">${where ? escapeHtml(where) + ' · ' : ''}${escapeHtml(gameFormatLabel(g))}</div>
    </div>
    <nav class="tabs" aria-label="Game sections">
      ${tabs.map(([k, label]) => `<button class="tab ${UI.gameTab === k ? 'active' : ''}" data-action="game-tab" data-tab="${k}" ${UI.gameTab === k ? 'aria-current="page"' : ''}>${label}</button>`).join('')}
    </nav>
    ${banner}
    ${content}`;
}

function renderLineupTab(g){
  const n = periodCount(g);
  if (UI.period > n) UI.period = 1;
  const p = UI.period;
  const plan = lineupFor(g, p);
  const avail = byName(availableIds(g));
  // A period that has started is changed with substitutions on the Game tab,
  // so here it's read-only.
  const started = periodStarted(g, p);
  const editable = canEditGames() && !started;

  const picker = `<div class="period-picker" role="tablist" aria-label="${escapeHtml(periodNoun(g, true))}">
    ${Array.from({ length:n }, (_, i) => i + 1).map(k => `
      <button class="period-btn ${k === p ? 'active' : ''}" data-action="period" data-period="${k}" role="tab" aria-selected="${k === p}"
        aria-label="${escapeHtml(periodName(g, k))}, ${!isPeriodPlanned(g, k) ? 'not planned'
          : followsPeriod(g, k) ? 'same as ' + escapeHtml(periodName(g, followsPeriod(g, k))) : 'planned'}">
        <span class="pdot ${!isPeriodPlanned(g, k) ? 'none' : followsPeriod(g, k) ? 'follow' : ''}" aria-hidden="true"></span>${escapeHtml(periodName(g, k))}
      </button>`).join('')}
  </div>`;

  // Where each player sits this period.
  const posOf = {};
  POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });

  // Periods on court this game per playing player, to keep it even.
  const counts = gamePeriodCounts(g, avail);

  const countsHtml = `<div class="panel"><h4>${escapeHtml(periodNoun(g, true))} on court this game</h4>
    ${avail.length ? `<div class="chip-wrap">${avail.slice().sort((a, b) => counts[a] - counts[b]).map(id =>
      `<span class="chip ${counts[id] ? '' : 'zero'}">${escapeHtml(playerName(id))} <b>${counts[id]}</b></span>`).join('')}</div>`
      : '<span class="hint">No players are marked as playing.</span>'}</div>`;

  // Note when this period has its own changes (the Reset button undoes them),
  // and offer to clear Q1.
  const prevName = p > 1 ? escapeHtml(periodName(g, p - 1)) : '';
  const now = started && g.status === 'live' && g.live.period === p && g.live.phase !== 'ended';
  const followNote = started
    ? `<p class="follow-note own">${now
        ? `${escapeHtml(periodName(g, p))} is under way. This is who's on court now.${canScore() ? ' To make a change, use Substitution on the Game tab.' : ''}`
        : `${escapeHtml(periodName(g, p))} is over. This is who finished it.`}</p>`
    : p > 1 && ownPlan(g, p) && isPeriodPlanned(g, p)
    ? `<p class="follow-note own">${escapeHtml(periodName(g, p))} has its own changes.</p>` : '';
  const dragTip = editable
    ? '<p class="court-tip">Drag names around the court to change positions, or drag someone from the bench onto a position.</p>' : '';
  let tools = '';
  if (editable){
    if (p === 1 && ownPlan(g, 1) && isPeriodPlanned(g, 1)){
      tools = `<button class="btn ghost small ${isArmed('clear-period') ? 'armed' : ''}" data-action="clear-period">
        ${isArmed('clear-period') ? 'Tap again to clear' : 'Clear ' + escapeHtml(periodName(g, 1))}</button>`;
    } else if (p > 1 && ownPlan(g, p)){
      tools = `<button class="btn ghost small ${isArmed('clear-period') ? 'armed' : ''}" data-action="clear-period">
        ${isArmed('clear-period') ? 'Tap again to undo changes' : 'Reset to match ' + prevName}</button>`;
    }
    tools = tools ? `<div class="lineup-tools">${tools}</div>` : '';
  }

  return `${picker}
    ${followNote}
    ${dragTip}
    ${courtHtml(plan, editable, g, p, avail)}
    ${tools}
    ${countsHtml}
    ${editable ? '<p class="hint">You can also tap a position to pick from a list. Dropping someone on another player swaps them. You can still change everything on game day.</p>' : ''}
    ${editable && UI.pickPos ? pickerSheetHtml(g, p, plan, avail, posOf, planCountOf(g, counts),
      `Counts show ${escapeHtml(periodNoun(g, true))} planned this game.`) : ''}`;
}

function planCountOf(g, counts){
  const n = periodCount(g);
  return id => ({ text:`${counts[id] || 0} of ${n}`, n:counts[id] || 0, zero:!counts[id] });
}

function gamePeriodCounts(g, ids){
  const counts = {};
  ids.forEach(id => counts[id] = 0);
  for (let k = 1; k <= periodCount(g); k++) POSITIONS.forEach(pos => { const id = lineupFor(g, k)[pos]; if (id in counts) counts[id]++; });
  return counts;
}

// A simple netball court, attacking end at the top. Each position's bib
// sits in the area of the court that position plays in.
// Used for planning lineups (before a game and between periods); tapping a
// bib opens the player picker.
// When editable, players can also be dragged between positions, and (if
// avail is given) a bench of players not on court is shown underneath to
// drag onto a position. Dropping a player on the bench empties their spot.
function courtHtml(plan, editable, g, p, avail){
  const tokens = POSITIONS.map(pos => {
    const pid = plan[pos];
    const [x, y] = COURT_SPOTS[pos];
    const name = pid ? playerName(pid) : 'Empty';
    const inner = `<span class="pos-chip ${pid ? POS_ZONE[pos] : 'unfilled'}" aria-hidden="true">${pos}</span>
      <span class="token-name ${pid ? '' : 'empty'}">${escapeHtml(name)}</span>`;
    const style = `style="left:${x}%; top:${y}%"`;
    if (!editable) return `<div class="court-token" ${style} aria-label="${POS_NAMES[pos]}: ${escapeHtml(name)}">${inner}</div>`;
    return `<button class="court-token ${UI.pickPos === pos ? 'picking' : ''}" ${style} data-action="pick-pos" data-pos="${pos}" data-player="${escapeHtml(pid || '')}"
        aria-label="${POS_NAMES[pos]}, ${escapeHtml(name)}. Change who plays ${pos} in ${escapeHtml(periodName(g, p))}">${inner}</button>`;
  }).join('');
  let bench = '';
  if (avail){
    const onCourt = new Set(Object.values(plan).filter(Boolean));
    const ids = avail.filter(id => !onCourt.has(id));
    bench = `<div class="bench-drop" ${editable ? 'data-dnd' : ''}>
        <div class="bench-label">Bench${editable ? ' <span>(drag onto a position)</span>' : ''}</div>
        <div class="chip-wrap">${ids.length ? ids.map(id => editable
          ? `<span class="chip bench-chip" data-player="${escapeHtml(id)}" role="button" aria-label="${escapeHtml(playerName(id))}, on the bench. Drag onto a position">${escapeHtml(playerName(id))}</span>`
          : `<span class="chip">${escapeHtml(playerName(id))}</span>`).join('')
          : '<span class="hint">Nobody on the bench.</span>'}</div>
      </div>`;
  }
  return `<div class="court-wrap">
      <div class="court-end">Attacking end</div>
      <div class="court" role="group" ${editable ? 'data-dnd' : ''} aria-label="Court positions, ${escapeHtml(periodName(g, p))}">
        <svg class="court-lines" viewBox="0 0 100 135" preserveAspectRatio="none" aria-hidden="true">
          <rect x="1" y="1" width="98" height="133" rx="1.5" />
          <line x1="1" y1="45" x2="99" y2="45" />
          <line x1="1" y1="90" x2="99" y2="90" />
          <path d="M20 1 A30 30 0 0 0 80 1" />
          <path d="M20 134 A30 30 0 0 1 80 134" />
          <circle cx="50" cy="67.5" r="3" />
        </svg>
        ${tokens}
      </div>
      <div class="court-end">Defending end</div>
    </div>${bench}`;
}

// Bottom sheet listing who can play the chosen position. Bench players
// with the fewest periods so far this game come first.
// countOf(id) gives { text, n (for sorting), zero } for the right-hand figure.
function pickerSheetHtml(g, p, plan, avail, posOf, countOf, note){
  const pos = UI.pickPos;
  const current = plan[pos];
  const row = (id, sub) => {
    const c = countOf(id);
    return `<button class="pick-row ${id === current ? 'current' : ''}" data-action="pick-player" data-player="${escapeHtml(id)}">
      <span class="grow"><span class="pname">${escapeHtml(playerName(id))}</span><span class="psub">${sub}</span></span>
      <span class="pick-count ${c.zero ? 'zero' : ''}">${escapeHtml(c.text)}</span>
    </button>`;
  };
  const byCount = (a, b) => countOf(a).n - countOf(b).n || playerName(a).localeCompare(playerName(b));
  const bench = avail.filter(id => !posOf[id]).sort(byCount);
  const onCourt = avail.filter(id => posOf[id] && posOf[id] !== pos).sort(byCount);
  return `<div class="sheet-backdrop" data-action="close-picker"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="pos-chip ${POS_ZONE[pos]}" aria-hidden="true">${pos}</span>
        <div class="grow">
          <h3 id="sheet-title">${POS_NAMES[pos]}</h3>
          <div class="psub">${escapeHtml(periodName(g, p))} · ${current ? 'now ' + escapeHtml(playerName(current)) : 'empty'}</div>
        </div>
        <button class="btn ghost small" data-action="close-picker">Close</button>
      </div>
      <div class="sheet-body">
        ${bench.length ? `<div class="list-label">On the bench</div>${bench.map(id => row(id, 'Bench')).join('')}` : ''}
        ${onCourt.length ? `<div class="list-label">On court (will swap)</div>${onCourt.map(id => row(id, 'Now ' + posOf[id])).join('')}` : ''}
        ${!bench.length && !onCourt.length ? '<div class="empty-state">No other players are marked as playing.</div>' : ''}
        ${current ? `<button class="btn ghost" style="width:100%; margin-top:0.8rem" data-action="pick-player" data-player="">Leave ${pos} empty</button>` : ''}
        <p class="hint">${note}</p>
      </div>
    </div>`;
}

function renderAvailTab(g){
  const editable = canEditGames();
  const avail = new Set(availableIds(g));
  const players = CUR.players.filter(p => p.active !== false || avail.has(p.id))
    .sort((a,b) => (a.name || '').localeCompare(b.name || ''));
  const rows = players.map(p => {
    const on = avail.has(p.id);
    return `<button class="avail-row ${on ? 'on' : 'off'}" data-action="toggle-avail" data-player="${escapeHtml(p.id)}"
        aria-pressed="${on}" ${editable ? '' : 'disabled'}>
        <span class="tick" aria-hidden="true">${on ? '✓' : ''}</span>
        <span class="pname grow">${escapeHtml(p.name)}</span>
        <span class="hint">${on ? 'Playing' : 'Not playing'}</span>
      </button>`;
  }).join('');
  return `<h3 class="subhead">Who's playing <span class="hint" style="font-family:var(--font-body); text-transform:none">${avail.size} of ${players.length}</span></h3>
    <div class="list-card">${rows || '<div class="empty-state">No players on the roster yet.</div>'}</div>
    ${editable ? `<div class="lineup-tools"><button class="btn ghost small" data-action="avail-all">Everyone's playing</button></div>
      <p class="hint">Unticking a player also takes them out of this game's lineup plan.</p>` : ''}`;
}

// Periods played in each position, across this game and every game
// before it this season. Games that have been played count real court
// time (in periods, so half a quarter shows as 0.5); games not yet
// played count the planned lineup.
function renderFairTab(g){
  const games = sortGames(CUR.games).filter(x => !x.archived || x.id === g.id);
  const upto = games.slice(0, games.findIndex(x => x.id === g.id) + 1);
  const rows = {};
  const ensure = id => rows[id] || (rows[id] = { id, pos:{}, total:0, thisGame:0, games:new Set() });
  const add = (id, pos, v, game) => {
    const r = ensure(id);
    r.pos[pos] = (r.pos[pos] || 0) + v;
    r.total += v;
    if (v >= 0.05) r.games.add(game.id); // counts as a game played
    if (game.id === g.id) r.thisGame += v;
  };
  CUR.players.filter(p => p.active !== false).forEach(p => ensure(p.id));
  let playedGames = 0;
  upto.forEach(game => {
    const played = game.summary && game.summary.courtTime && (game.status === 'live' || game.status === 'final');
    if (played){
      playedGames++;
      const pms = periodMs(game);
      Object.entries(game.summary.courtTime).forEach(([id, byPos]) =>
        Object.entries(byPos).forEach(([pos, ms]) => add(id, pos, ms / pms, game)));
      return;
    }
    for (let k = 1; k <= periodCount(game); k++){
      const plan = planFor(game, k);
      POSITIONS.forEach(pos => { if (plan[pos]) add(plan[pos], pos, 1, game); });
    }
  });
  const fmt = v => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
  const list = Object.values(rows).sort((a,b) => playerName(a.id).localeCompare(playerName(b.id)));
  const max = Math.max(1, ...list.flatMap(r => POSITIONS.map(pos => r.pos[pos] || 0)));
  const playing = new Set(availableIds(g));
  const noun = escapeHtml(periodNoun(g, true));
  const detailed = UI.fairView === 'detailed';
  const toggle = `<div class="segmented fair-toggle" role="tablist" aria-label="Fairness view">
      <label><input type="radio" name="fairView" data-field="fair-view" value="simple" ${detailed ? '' : 'checked'}><span>Simple</span></label>
      <label><input type="radio" name="fairView" data-field="fair-view" value="detailed" ${detailed ? 'checked' : ''}><span>Detailed</span></label>
    </div>`;
  const note = playedGames
    ? `${playedGames} of these game${playedGames === 1 ? ' was' : 's were'} scored live, so ${playedGames === 1 ? 'it counts' : 'they count'} real court time (0.5 means half a ${escapeHtml(periodNoun(g))}). The rest count the planned lineup.`
    : 'These count the planned lineups. Games scored live will count real court time instead.';

  if (!detailed){
    // Simple: just totals, least court time first. All figures are quarters.
    const simple = list.slice().sort((a, b) => a.total - b.total || playerName(a.id).localeCompare(playerName(b.id)));
    const rowsHtml = simple.map(r => {
      const games = r.games.size;
      return `<tr>
        <td>${escapeHtml(playerName(r.id))}</td>
        <td class="total">${fmt(r.total)}</td>
        <td>${games}</td>
        <td>${games ? fmt(r.total / games) : '·'}</td>
        <td class="this ${playing.has(r.id) && r.thisGame < 0.05 ? 'zero-this' : ''}">${playing.has(r.id) ? fmt(r.thisGame) : 'out'}</td>
      </tr>`;
    }).join('');
    return `<h3 class="subhead">Court time so far <span class="hint" style="font-family:var(--font-body); text-transform:none">(in ${noun})</span></h3>
      ${toggle}
      <div class="fair-wrap"><table class="fair simple">
        <thead><tr><th scope="col">Player</th><th scope="col">Season total</th><th scope="col">Games played</th>
          <th scope="col">Average per game played</th><th scope="col">This game</th></tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="5">No players yet.</td></tr>'}</tbody>
      </table></div>
      <p class="hint">All numbers are ${noun} on court, from the first game of the season up to and including this one (${upto.length} game${upto.length === 1 ? '' : 's'}). Average per game played only counts games the player got on court, so missing a game doesn't pull it down. "Out" means not playing this game. ${note}</p>`;
  }

  const body = list.map(r => `<tr>
      <td>${escapeHtml(playerName(r.id))}</td>
      ${POSITIONS.map(pos => {
        const v = r.pos[pos] || 0;
        const shade = v ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * v / max)}%, transparent)"` : '';
        return `<td ${shade}>${v >= 0.05 ? fmt(v) : '·'}</td>`;
      }).join('')}
      <td class="total">${fmt(r.total)}</td>
      <td class="this ${playing.has(r.id) && r.thisGame < 0.05 ? 'zero-this' : ''}">${playing.has(r.id) ? fmt(r.thisGame) : 'out'}</td>
    </tr>`).join('');
  return `<h3 class="subhead">Positions so far <span class="hint" style="font-family:var(--font-body); text-transform:none">(in ${noun})</span></h3>
    ${toggle}
    <div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}
        <th scope="col">Total</th><th scope="col">This game</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 3}">No players yet.</td></tr>`}</tbody>
    </table></div>
    <p class="hint">Number of ${noun} each player has had in each position, from the first game of the season up to and including this one (${upto.length} game${upto.length === 1 ? '' : 's'}). Darker means more often. ${note}</p>`;
}

/* ---- Live tab ---- */
function renderLiveTab(g){
  if (CUR.eventsError) return `<div class="panel" role="alert"><p style="margin:0">${
    String(CUR.eventsError.code).includes('permission-denied') && isAdmin()
      ? "Game events can't be loaded because the database's security rules are out of date. Publish the latest firestore.rules in Firebase (Firestore Database > Rules), then refresh."
      : "Game events couldn't be loaded. Check your connection and refresh the page."}</p></div>`;
  if (!CUR.loaded.events) return '<div class="loading-state">Loading game…</div>';

  const st = computeGame(g, CUR.events);
  const L = g.live || {};
  const n = periodCount(g);
  const status = g.status || 'scheduled';
  const scoring = amScorer(g);
  const avail = byName(availableIds(g));
  let body = '';

  if (status === 'scheduled' || !g.live){
    // Before the game: pick the first centre and check the Q1 lineup.
    UI.period = 1;
    const plan = planFor(g, 1);
    const empty = POSITIONS.filter(pos => !plan[pos] || !avail.includes(plan[pos])).length;
    body = canScore() ? `<div class="form-card">
        <h3>Start the game</h3>
        <div class="field">
          <span class="label" id="fc-label">First centre pass</span>
          <div class="segmented" role="radiogroup" aria-labelledby="fc-label">
            <label><input type="radio" id="fc-us" name="firstCentre" value="us" checked><span>${escapeHtml(teamLabel(g, 'us'))}</span></label>
            <label><input type="radio" id="fc-them" name="firstCentre" value="them"><span>${escapeHtml(teamLabel(g, 'them'))}</span></label>
          </div>
        </div>
        ${empty ? `<p class="hint" style="margin:0">${empty} position${empty === 1 ? ' is' : 's are'} empty in the ${escapeHtml(periodName(g, 1))} lineup. Tap a bib below to fill it, or start anyway.</p>` : ''}
        <button class="btn go big" data-action="start-game" ${UI.busy ? 'disabled' : ''}>Start ${escapeHtml(periodName(g, 1))}</button>
        <p class="hint" style="margin:0">Tap it when the umpire starts play. The clock starts and you become the scorer.</p>
        <div class="guide-links">
          <button class="btn ghost small" data-action="show-guide">New to scoring? How to score</button>
          ${isPractice(g) || !canPractise() ? '' : '<button class="btn ghost small" data-action="start-practice">Try a practice game</button>'}
        </div>
      </div>
      <h3 class="subhead">${escapeHtml(periodName(g, 1))} lineup</h3>
      ${courtHtml(plan, true, g, 1, avail)}`
      : `<div class="placeholder-card">This game hasn't started yet.</div>
      ${askToScoreHtml()}
      <h3 class="subhead">${escapeHtml(periodName(g, 1))} lineup</h3>${courtHtml(plan, false, g, 1)}`;
    if (canScore() && UI.pickPos){
      const posOf = {}; POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });
      body += pickerSheetHtml(g, 1, plan, avail, posOf, planCountOf(g, gamePeriodCounts(g, avail)),
        `Counts show ${escapeHtml(periodNoun(g, true))} planned this game.`);
    }
    return scoreboardHtml(g, st) + body;
  }

  body += scorerBarHtml(g);
  if (status !== 'final') body += askToScoreHtml();

  if (isInPlay(g)){
    const lineup = st.lineup || {};
    body += livePlayHtml(g, st, scoring);
    if (UI.subSheet && scoring) body += subSheetHtml(g, st);
    else if (UI.statPos && scoring) body += statSheetHtml(g, st);
    else if (UI.pickPos && canScore()){
      UI.pickMode = 'live';
      const posOf = {}; POSITIONS.forEach(pos => { if (lineup[pos]) posOf[lineup[pos]] = pos; });
      body += pickerSheetHtml(g, L.period, lineup, avail, posOf,
        id => { const ms = (st.players[id] || {}).ms || 0; return { text:fmtMins(ms), n:ms, zero:!ms }; },
        'Times show court time so far this game.');
    }
  } else if (!isGameOver(g)){
    // Between periods: the next period's lineup, ready to adjust.
    const next = L.period + 1;
    UI.period = next;
    const plan = startLineup(g, next);
    body += `<p class="big-note">End of ${escapeHtml(periodName(g, L.period))}</p>
      ${scoring ? `<div class="control-row"><button class="btn go" data-action="start-period" ${UI.busy ? 'disabled' : ''}>Start ${escapeHtml(periodName(g, next))}</button></div>` : ''}
      <p class="hint" style="text-align:center">${scoring ? `Tap Start ${escapeHtml(periodName(g, next))} when the umpire restarts play. ` : ''}${escapeHtml(periodName(g, next))} starts with the centre pass to <b>${escapeHtml(teamLabel(g, periodStartCentre(g, next)))}</b>.${canScore() ? ' Tap a bib to change the lineup before it starts.' : ''}</p>
      ${courtHtml(plan, canScore(), g, next, avail)}`;
    if (scoring) body += undoBarHtml(g);
    if (canScore() && UI.pickPos){
      UI.pickMode = 'plan';
      const posOf = {}; POSITIONS.forEach(pos => { if (plan[pos]) posOf[plan[pos]] = pos; });
      body += pickerSheetHtml(g, next, plan, avail, posOf,
        id => { const ms = (st.players[id] || {}).ms || 0; return { text:fmtMins(ms), n:ms, zero:!ms }; },
        'Times show court time so far this game.');
    }
  } else {
    // Full time.
    const final = status === 'final';
    const canFix = canScore() && !final;
    body += `<p class="big-note">${final ? 'Final' : 'Full time'}</p>`;
    if (canFix) body += `<div class="panel">
        <p style="margin:0 0 0.6rem">Check the timeline below and fix any mistakes, then finalise to lock the game.</p>
        <button class="btn go" data-action="finalise-game" ${UI.busy ? 'disabled' : ''}>Finalise game</button>
      </div>`;
    if (final && isAdmin()) body += `<div class="lineup-tools">
        <button class="btn ghost small ${isArmed('unlock-game') ? 'armed' : ''}" data-action="unlock-game">
          ${isArmed('unlock-game') ? 'Tap again to unlock for corrections' : 'Unlock for corrections'}</button></div>`;
  }

  body += liveStatsHtml(g, st);
  if (isGameOver(g)) body += timelineHtml(g, true, canScore() && status !== 'final');
  return scoreboardHtml(g, st) + body;
}

// The in-play screen: position tiles for recording goals and misses, in
// one of two modes the scorer swipes between. "Player first": tap a
// shooter, then Goal or Miss. "Goal/Miss first": tap Goal or Miss, then who.
function livePlayHtml(g, st, scoring){
  const L = g.live;
  const lineup = st.lineup || {};
  const mode = scoring ? UI.liveMode : 'player';
  const ms = id => (id && st.players[id] ? st.players[id].ms : 0);
  const tile = (pos, side, action, opts) => {
    opts = opts || {};
    const pid = side === 'us' ? lineup[pos] : null;
    const shooter = SHOOTERS.includes(pos);
    const cls = `ptile ${side === 'them' ? 'opp' : ''} ${side === 'us' && shooter ? 'shooter' : ''} ${opts.wide ? 'wide' : ''} ${opts.dim ? 'dim' : ''}`;
    const label = side === 'them' ? (pos ? `${teamLabel(g, 'them')} ${pos}` : `${teamLabel(g, 'them')}, team`) : `${POS_NAMES[pos]}, ${pid ? playerName(pid) : 'empty'}`;
    // The other team has one tile with their name (no positions).
    const inner = side === 'them' ? `<span class="pt-opp">${escapeHtml(teamLabel(g, 'them'))}</span><span class="pt-sub">Other team</span>`
      : `<span class="pt-pos">${pos || 'Team'}</span>
      ${side === 'us' ? `<span class="pt-name ${pid ? '' : 'empty'}">${pid ? escapeHtml(playerName(pid)) : 'Empty'}</span>
        <span class="pt-time" data-ptime="${escapeHtml(pid || '')}">${pid ? fmtMins(ms(pid)) : ''}</span>` : ''}`;
    if (!action) return `<div class="${cls}" aria-label="${escapeHtml(label)}">${inner}</div>`;
    return `<button class="${cls}" data-action="${action}" data-side="${side}" data-pos="${pos}" aria-label="${escapeHtml(label)}" ${opts.disabled ? 'disabled' : ''}>${inner}</button>`;
  };

  let controls = '';
  if (scoring){
    controls = `<div class="mode-row">
        <div class="mode-tabs" role="tablist" aria-label="Scoring mode">
          <button class="mode-tab ${mode === 'event' ? 'on' : ''}" role="tab" aria-selected="${mode === 'event'}" data-action="live-mode" data-mode="event">Goal/Miss first</button>
          <button class="mode-tab ${mode === 'player' ? 'on' : ''}" role="tab" aria-selected="${mode === 'player'}" data-action="live-mode" data-mode="player">Player first</button>
        </div>
        <button class="help-btn" data-action="show-guide" aria-label="How to score">?</button>
        <button class="btn ghost small ${isArmed('end-period') ? 'armed' : ''}" data-action="end-period">
          ${isArmed('end-period') ? 'Tap again' : 'End ' + escapeHtml(periodName(g, L.period))}</button>
      </div>`;
  }

  let pane;
  if (mode === 'event'){
    const ev = UI.pendingEvent;
    pane = `<div class="sec-label">1. What happened</div>
      <div class="ev-grid">
        <button class="evbtn goal ${ev === 'goal' ? 'on' : ''}" data-action="ef-event" data-stat="goal" aria-pressed="${ev === 'goal'}">Goal</button>
        <button class="evbtn miss ${ev === 'miss' ? 'on' : ''}" data-action="ef-event" data-stat="miss" aria-pressed="${ev === 'miss'}">Miss</button>
      </div>
      <div class="sec-label">2. Who did it${ev ? '' : ' <span class="hint">(choose Goal or Miss first)</span>'}</div>
      <div class="pos-row two">${tile('GS', 'us', 'ef-who', { disabled:!ev })}${tile('GA', 'us', 'ef-who', { disabled:!ev })}</div>
      <div class="pos-row one">${tile('', 'them', 'ef-who', { disabled:!ev })}</div>
      ${subBtnHtml()}`;
  } else {
    const ourAction = scoring || canScore() ? 'tile' : null;
    pane = `<div class="sec-label">Your positions</div>
      <div class="pos-row two">${tile('GS', 'us', ourAction)}${tile('GA', 'us', ourAction)}</div>
      <div class="pos-row three">${tile('WA', 'us', ourAction)}${tile('C', 'us', ourAction)}${tile('WD', 'us', ourAction)}</div>
      <div class="pos-row two">${tile('GD', 'us', ourAction)}${tile('GK', 'us', ourAction)}</div>
      ${scoring ? `<div class="pos-row one">${tile('', 'them', 'tile')}</div>` : ''}
      ${scoring ? subBtnHtml() + '<p class="hint">Tap a shooter (or the other team) to record a goal or miss.</p>'
        : canScore() ? '<p class="hint">Tap a position to make a substitution.</p>' : ''}`;
  }
  return `${controls}<div class="swipe-zone" ${scoring ? 'data-swipe' : ''}>${pane}</div>
    ${eventLogHtml(g)}
    ${scoring ? undoBarHtml(g) : ''}
    ${scoring && voiceSupported() ? `<button class="mic-btn ${UI.voiceListening ? 'on' : ''}" data-action="voice" aria-label="${UI.voiceListening ? 'Listening. Tap to stop' : 'Score by voice'}">${micSvg()}</button>${UI.voiceListening ? '<div class="mic-hint" role="status">Listening... say "GS goal"</div>' : ''}` : ''}`;
}

// Substitutions from either scoring mode: pick the position, then who's on.
function subBtnHtml(){
  return '<button class="btn ghost sub-btn" data-action="sub-open">⇄ Substitution</button>';
}
function subSheetHtml(g, st){
  const lineup = st.lineup || {};
  const tile = pos => `<button class="ptile ${SHOOTERS.includes(pos) ? 'shooter' : ''}" data-action="sub-pos" data-pos="${pos}"
      aria-label="${POS_NAMES[pos]}, ${lineup[pos] ? escapeHtml(playerName(lineup[pos])) : 'empty'}">
      <span class="pt-pos">${pos}</span>
      <span class="pt-name ${lineup[pos] ? '' : 'empty'}">${lineup[pos] ? escapeHtml(playerName(lineup[pos])) : 'Empty'}</span>
    </button>`;
  return `<div class="sheet-backdrop" data-action="sub-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sub-title">
      <div class="sheet-head">
        <div class="grow"><h3 id="sub-title">Substitution</h3><div class="hint">Tap the position that's changing.</div></div>
        <button class="btn ghost small" data-action="sub-close">Cancel</button>
      </div>
      <div class="sheet-body" style="padding-top:0.8rem">
        <div class="pos-row two">${tile('GS')}${tile('GA')}</div>
        <div class="pos-row three">${tile('WA')}${tile('C')}${tile('WD')}</div>
        <div class="pos-row two">${tile('GD')}${tile('GK')}</div>
      </div>
    </div>`;
}

// For team members without a scoring role: how to get one, and a safe
// place to try it in the meantime.
function askToScoreHtml(){
  if (canScore()) return '';
  return `<div class="panel ask-score">
      <p style="margin:0${canPractise() ? ' 0 0.5rem' : ''}"><b>Want to help score?</b> Ask your coach or team admin to make you a Scorer. They can do it in the Helpers tab.</p>
      ${canPractise() ? '<button class="btn ghost small" data-action="start-practice">Try a practice game</button>' : ''}
    </div>`;
}
// A practice game needs someone on the roster to score for.
function canPractise(){ return CUR.players.some(p => p.active !== false); }

// The last few goals and misses, newest first. Anyone who can run the game
// can tap a row to undo that particular entry (not just the latest).
function eventLogHtml(g){
  const pms = periodMs(g);
  const evs = CUR.events.filter(e => !e.undone && (e.type === 'goal' || e.type === 'miss' || e.type === 'oppGoal' || e.type === 'oppMiss'))
    .sort((a,b) => (b.at || 0) - (a.at || 0)).slice(0, 8);
  if (!evs.length) return '';
  const tappable = canScore();
  return `<div class="event-log" aria-label="Latest">
    ${evs.map((e, i) => {
      const opp = e.type === 'oppGoal' || e.type === 'oppMiss';
      const what = e.type === 'goal' || e.type === 'oppGoal' ? 'Goal' : 'Miss';
      const badge = opp ? 'Opp' : (e.pos || '?');
      const who = opp ? '' : (e.playerId ? ' · ' + escapeHtml(playerName(e.playerId)) : '');
      const inner = `<span class="log-badge ${opp ? 'opp' : ''}">${escapeHtml(badge)}</span>
          <span class="log-what">${what}${who}</span>
          <span class="log-when">${escapeHtml(periodName(g, e.period))} · ${fmtClock(pms - e.t)}</span>`;
      if (!tappable) return `<div class="log-row ${i === 0 ? 'latest' : ''}">${inner}</div>`;
      const sel = UI.logSel === e.id;
      return `<div class="log-item ${sel ? 'sel' : ''}">
          <button class="log-row ${i === 0 ? 'latest' : ''}" data-action="log-select" data-event="${escapeHtml(e.id)}" aria-expanded="${sel}"
            aria-label="${escapeHtml(eventText(g, e))}. Tap for options">${inner}</button>
          ${sel ? `<div class="log-actions">
              <span>Undo this ${what.toLowerCase()}?</span>
              <button class="btn danger small" data-action="log-undo" data-event="${escapeHtml(e.id)}">Undo</button>
              <button class="btn ghost small" data-action="log-cancel">Keep</button>
            </div>` : ''}
        </div>`;
    }).join('')}
  </div>`;
}

// Undoes one entry from the log. Goes on the Redo list like any undo.
async function undoEvent(id){
  const e = CUR.events.find(x => x.id === id && !x.undone);
  if (!e) return;
  redoStack.push(id);
  try { await updateDoc(doc(eventsRef(UI.gameId), id), { undone:true }); }
  catch (err){ redoStack.pop(); throw err; }
  toast('Undone: ' + eventText(findGame(UI.gameId), e));
}

// Floating Undo / Redo for the scorer.
function undoBarHtml(g){
  const last = lastUndoable();
  return `<div class="undo-bar">
      <button class="undo-btn" data-action="undo" ${last ? `aria-label="Undo ${escapeHtml(eventText(g, last))}"` : 'disabled aria-label="Undo"'}>${undoSvg()}</button>
      <button class="undo-btn" data-action="redo" ${redoStack.length ? 'aria-label="Redo"' : 'disabled aria-label="Redo"'}>${undoSvg(true)}</button>
    </div>`;
}
function undoSvg(flip){
  return `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" ${flip ? 'style="transform:scaleX(-1)"' : ''}>
    <path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

// Score, clock, period and centre pass, with play/pause for the scorer.
function scoreboardHtml(g, st){
  const L = g.live || {};
  const scoring = amScorer(g);
  let period, phase = '', clock = '';
  if (!g.live || g.status === 'scheduled'){
    period = periodName(g, 1); phase = 'Not started';
    clock = `<div class="clock stopped">${fmtClock(periodMs(g))}</div>`;
  } else if (isGameOver(g)){
    period = g.status === 'final' ? 'Final' : 'Full time';
  } else {
    period = periodName(g, L.period);
    phase = L.phase === 'running' ? 'Playing' : L.phase === 'paused' ? 'Paused' : 'Break';
    clock = `<div class="clock ${L.phase === 'running' ? '' : 'stopped'}" data-clock>${fmtClock(periodMs(g) - elapsedMs(g))}</div>`;
  }
  let centre = '';
  if (isInPlay(g) && st.centre){
    const pill = (t, label) => `<span class="cp ${st.centre === t ? 'on' : ''}">${label}</span>`;
    const inner = `<span class="cp-label">Next Centre Pass</span>${pill('us', 'Us')}${pill('them', 'Them')}`;
    // Switching takes two taps, so a stray tap near the clock can't change it.
    const armedCp = scoring && isArmed('swap-centre');
    centre = scoring
      ? `<button class="cp-wrap ${armedCp ? 'armed' : ''}" data-action="swap-centre" aria-label="${armedCp
          ? `Tap again to switch the centre pass to ${escapeHtml(teamLabel(g, otherTeam(st.centre)))}`
          : `Centre pass: ${escapeHtml(teamLabel(g, st.centre))}. Tap twice to switch.`}">${armedCp
          ? `<span class="cp-confirm">Switch to ${st.centre === 'us' ? 'Them' : 'Us'}? Tap again</span>` : inner}</button>`
      : `<span class="cp-wrap" aria-label="Centre pass: ${escapeHtml(teamLabel(g, st.centre))}">${inner}</span>`;
  }
  let play = '';
  if (scoring && isInPlay(g)){
    play = L.phase === 'running'
      ? `<button class="play-btn" data-action="pause-clock" aria-label="Pause clock"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg><span class="play-label">Pause</span></button>`
      : `<button class="play-btn go" data-action="resume-clock" aria-label="Start clock"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span class="play-label">Resume</span></button>`;
  }
  return `<div class="sb2">
      <div class="sb2-top"><span class="sb2-period">${escapeHtml(period)}</span>${centre}<span class="sb2-phase">${phase}</span></div>
      <div class="sb2-main">
        <div class="sb2-clock">${clock}</div>
        <div class="sb2-score">
          <div class="sb2-team"><span class="sb2-name">${escapeHtml(teamLabel(g, 'us'))}</span><b>${pad2(st.us)}</b></div>
          <span class="sb2-sep" aria-hidden="true"></span>
          <div class="sb2-team"><span class="sb2-name">${escapeHtml(teamLabel(g, 'them'))}</span><b>${pad2(st.them)}</b></div>
        </div>
        <div class="sb2-play">${play}</div>
      </div>
    </div>`;
}

function scorerBarHtml(g){
  if (g.status === 'final') return '';
  const who = g.scorerName || 'Nobody';
  if (amScorer(g)) return isInPlay(g) ? '' : `<div class="scorer-bar"><span>You're scoring this game.</span></div>`;
  // Taking over needs a second tap, so two helpers can't grab it from each
  // other by accident.
  const armedTake = isArmed('take-over');
  const takeLabel = !armedTake ? 'Take over scoring'
    : g.scorerUid ? `Take over from ${escapeHtml(who)}? Tap again` : 'Tap again to score this game';
  return `<div class="scorer-bar"><span>${g.scorerUid ? escapeHtml(who) + ' is scoring.' : 'Nobody is scoring.'}</span>
    ${canScore() ? `<button class="btn small ${armedTake ? 'armed' : ''}" data-action="take-over">${takeLabel}</button>` : ''}</div>`;
}

// Undo the scorer's own most recent action (not period starts and ends).
function lastUndoable(){
  return CUR.events.filter(e => !e.undone && e.by === (USER && USER.uid) && e.type !== 'periodEnd' && !e.start)
    .sort((a,b) => (b.at || 0) - (a.at || 0))[0];
}
function eventText(g, e){
  if (STAT_LABEL[e.type]) return `${STAT_LABEL[e.type]}, ${e.playerId ? playerName(e.playerId) : 'unknown'}${e.pos ? ' (' + e.pos + ')' : ''}`;
  if (e.type === 'oppGoal') return `${teamLabel(g, 'them')}${e.pos ? ' ' + e.pos : ''} goal`;
  if (e.type === 'oppMiss') return `${teamLabel(g, 'them')}${e.pos ? ' ' + e.pos : ''} miss`;
  if (e.type === 'centre') return `Centre pass to ${teamLabel(g, e.team)}`;
  if (e.type === 'lineup') return 'Lineup change';
  return e.type;
}

// A picture-first guide for parents who are scoring: each row shows a
// small copy of what to tap, with a few words beside it.
function guideSheetHtml(g){
  const q2 = escapeHtml(periodName(g, 2));
  const pauseIcon = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';
  const rows = [
    [`<span class="g-num">1</span><span class="g-btn goal">Goal</span><span class="g-btn">Miss</span>`,
      '<b>What happened?</b> Tap Goal or Miss.'],
    [`<span class="g-num">2</span><span class="g-tile shooter">GS</span><span class="g-tile shooter">GA</span><span class="g-tile opp">Opp</span>`,
      `<b>Who did it?</b> Tap our shooter, or ${escapeHtml(teamLabel(g, 'them'))}. Done.`],
    [`<span class="g-round">${undoSvg()}</span>`,
      'Mistake? Tap undo, or tap the entry in the list.'],
    [`<span class="g-round">${pauseIcon}</span>`,
      'Umpire stops play? Tap Pause.'],
    [`<span class="g-btn">⇄ Substitution</span>`,
      'Player swapped? Tap Substitution, then the position, then who came on.'],
    ['<span class="g-pills"><span class="cp on">Us</span><span class="cp">Them</span></span>',
      'Next centre pass wrong? Tap it twice to switch.'],
    [`<span class="g-btn go">Start ${q2}</span>`,
      `Break over? Tap Start ${q2} when the umpire restarts play.`],
    ['<span class="g-btn go">Finalise</span>',
      'Full time? Tap Finalise.'],
    ...(voiceSupported() ? [[`<span class="g-round">${micSvg()}</span>`,
      'Or tap the mic and say "GS goal", "GA miss", "their goal" or "their miss".']] : [])
  ];
  const note = `<p class="hint">Goals matter most. Recording ${escapeHtml(teamLabel(g, 'them'))}'s misses is optional: skip them if you're busy.</p>`;
  return `<div class="sheet-backdrop" data-action="close-guide"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="sheet-head">
        <div class="grow"><h3 id="guide-title">How to score</h3></div>
        <button class="btn ghost small" data-action="close-guide">Close</button>
      </div>
      <div class="sheet-body">
        <div class="guide">${rows.map(([demo, text]) =>
          `<div class="g-row"><div class="g-demo" aria-hidden="true">${demo}</div><p>${text}</p></div>`).join('')}</div>
        ${note}
        <p class="hint">Have to leave? Someone else with the Scorer role can tap Take over scoring.</p>
        <button class="btn big" style="width:100%" data-action="close-guide">Got it</button>
      </div>
    </div>`;
}

// Goal / Miss for a shooter (ours or theirs), in Player first mode.
function statSheetHtml(g, st){
  const pos = UI.statPos, side = UI.statSide || 'us';
  const opp = side === 'them';
  const pid = !opp && st.lineup && st.lineup[pos];
  const title = opp ? `${teamLabel(g, 'them')} ${pos === 'Team' ? '' : pos}`.trim() : (pid ? playerName(pid) : 'Empty');
  const sub = opp ? (pos === 'Team' ? 'Other team' : 'Opposition ' + POS_NAMES[pos]) : POS_NAMES[pos];
  const canShoot = opp || !!pid;
  return `<div class="sheet-backdrop" data-action="close-picker"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span class="pos-chip ${opp ? 'unfilled' : POS_ZONE[pos]}" aria-hidden="true">${pos === 'Team' ? 'T' : pos}</span>
        <div class="grow">
          <h3 id="sheet-title">${escapeHtml(title)}</h3>
          <div class="psub">${escapeHtml(sub)} · ${escapeHtml(periodName(g, g.live.period))}</div>
        </div>
        <button class="btn ghost small" data-action="close-picker">Close</button>
      </div>
      <div class="sheet-body">
        ${canShoot ? `<div class="stat-grid">${STATS.map(s => `<button class="stat-btn ${s.key}" data-action="record-stat" data-stat="${s.key}">${s.label}</button>`).join('')}</div>`
          : `<p class="hint" style="margin-top:0.8rem">Nobody is playing ${pos}.</p>`}
        ${opp ? '' : `<button class="btn ghost" style="width:100%; margin-top:0.8rem" data-action="stat-change-player">Substitution: change ${pos}</button>`}
      </div>
    </div>`;
}

// Folded away during play to keep the scoring screen simple; open by default
// once the game is over. The scorer's choice is remembered per game.
function liveStatsHtml(g, st){
  const ids = new Set([...Object.keys(st.players), ...availableIds(g)]);
  const list = byName(Array.from(ids));
  if (!list.length) return '';
  const open = g.id in UI.statsOpen ? UI.statsOpen[g.id] : isGameOver(g);
  if (!open) return `<div class="lineup-tools"><button class="btn ghost small" data-action="toggle-live-stats" data-game="${escapeHtml(g.id)}" data-open="0">Show stats</button></div>`;
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '·';
  const rows = list.map(id => {
    const r = st.players[id] || { ms:0, goal:0, miss:0 };
    const shots = r.goal + r.miss;
    return `<tr><td>${escapeHtml(playerName(id))}</td><td>${fmtMins(r.ms)}</td>
      <td>${shots ? r.goal + '/' + shots : '·'}</td><td>${pct(r.goal, shots)}</td></tr>`;
  }).join('');
  const oppShots = st.them + st.oppMiss;
  return `<h3 class="subhead">Stats</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Player</th><th scope="col">Court time (mins)</th><th scope="col">Goals</th><th scope="col">%</th></tr></thead>
      <tbody>${rows}
        <tr class="opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td></td><td>${st.oppMiss ? st.them + '/' + oppShots : st.them}</td>
          <td>${st.oppMiss ? pct(st.them, oppShots) : '·'}</td></tr></tbody>
    </table></div>
    <p class="hint">${escapeHtml(teamLabel(g, 'them'))}'s % only counts the misses that were recorded.</p>
    <div class="lineup-tools"><button class="btn ghost small" data-action="toggle-live-stats" data-game="${escapeHtml(g.id)}" data-open="1">Hide stats</button></div>`;
}

// Recent events during play; the full timeline (with corrections) at full time.
function timelineHtml(g, full, editable){
  const pms = periodMs(g);
  let evs = CUR.events.filter(e => !e.undone && e.type !== 'periodEnd' && e.type !== 'lineup');
  if (full) evs.sort((a,b) => (a.period - b.period) || (a.t - b.t) || ((a.at || 0) - (b.at || 0)));
  else evs = evs.sort((a,b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  const playerOpts = byName(Array.from(new Set([...availableIds(g), ...CUR.events.filter(e => e.playerId).map(e => e.playerId)])));
  const rows = evs.map(e => {
    const when = `${escapeHtml(periodName(g, e.period))} ${fmtClock(pms - e.t)}`;
    const isOurs = !!STAT_LABEL[e.type];
    let controls = '';
    if (editable){
      const rmKey = 'rm-ev-' + e.id;
      controls = `${isOurs ? `<select class="select-input" data-field="event-player" data-event="${escapeHtml(e.id)}" aria-label="Player for this ${escapeHtml(STAT_LABEL[e.type])}">
          ${playerOpts.map(id => `<option value="${escapeHtml(id)}" ${id === e.playerId ? 'selected' : ''}>${escapeHtml(playerName(id))}</option>`).join('')}
        </select>` : ''}
        <button class="btn danger small ${isArmed(rmKey) ? 'armed' : ''}" data-action="remove-event" data-event="${escapeHtml(e.id)}">
          ${isArmed(rmKey) ? 'Tap again' : 'Remove'}</button>`;
    }
    return `<div class="event-row ${isOurs ? '' : 'opp'}"><span class="event-when">${when}</span>
      <span class="event-what grow">${escapeHtml(isOurs && editable ? STAT_LABEL[e.type] + (e.pos ? ' (' + e.pos + ')' : '') : eventText(g, e))}</span>${controls}</div>`;
  }).join('');
  const addForm = editable ? correctionFormHtml(g, playerOpts) : '';
  if (!rows && !addForm) return '';
  return `<h3 class="subhead">${full ? 'Timeline' : 'Latest'}</h3>
    <div class="list-card">${rows || '<div class="empty-state">Nothing recorded yet.</div>'}</div>${addForm}`;
}

function correctionFormHtml(g, playerOpts){
  const n = periodCount(g);
  return `<form class="form-card" data-form="add-correction">
      <h3>Add a missed stat</h3>
      <div class="field-row">
        <div class="field"><label for="cf-period">${escapeHtml(periodNoun(g).replace(/^./, c => c.toUpperCase()))}</label>
          <select class="select-input" id="cf-period" name="period">
            ${Array.from({ length:n }, (_, i) => i + 1).map(k => `<option value="${k}">${escapeHtml(periodName(g, k))}</option>`).join('')}
          </select></div>
        <div class="field"><label for="cf-who">Who</label>
          <select class="select-input" id="cf-who" name="who">
            ${playerOpts.map(id => `<option value="${escapeHtml(id)}">${escapeHtml(playerName(id))}</option>`).join('')}
            <option value="opp">${escapeHtml(teamLabel(g, 'them'))}</option>
          </select></div>
        <div class="field"><label for="cf-stat">Stat</label>
          <select class="select-input" id="cf-stat" name="stat">
            ${STATS.map(s => `<option value="${s.key}">${s.label}</option>`).join('')}
          </select></div>
      </div>
      <div class="form-actions"><button type="submit" class="btn" ${UI.busy ? 'disabled' : ''}>Add</button></div>

}

/* ---------------------------------------------------------------------
   Summaries (step 3): one game, and the season to date.
--------------------------------------------------------------------- */
function pctText(goals, shots){ return shots ? Math.round(100 * goals / shots) + '%' : '·'; }
function resultWord(us, them){ return us > them ? 'Won' : us < them ? 'Lost' : 'Drew'; }
function minsText(ms){ return ms ? String(Math.round(ms / 60000)) : '·'; }

// Court time table: minutes per position for each player, plus a total.
// fmt turns milliseconds into what's shown in each cell.
function courtTimeTable(rows, fmt, playingIds){
  const max = Math.max(1, ...rows.flatMap(r => POSITIONS.map(pos => r.pos[pos] || 0)));
  const body = rows.map(r => `<tr class="${playingIds && playingIds.has(r.id) && !r.ms ? 'no-time' : ''}">
      <td>${escapeHtml(playerName(r.id))}</td>
      ${POSITIONS.map(pos => {
        const v = r.pos[pos] || 0;
        const shade = v ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + 30 * v / max)}%, transparent)"` : '';
        return `<td ${shade}>${v ? fmt(v) : '·'}</td>`;
      }).join('')}
      <td class="total">${r.ms ? fmt(r.ms) : '0'}</td>
    </tr>`).join('');
  return `<div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Player</th>${POSITIONS.map(pos => `<th scope="col">${pos}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${POSITIONS.length + 2}">Nobody has been on court yet.</td></tr>`}</tbody>
    </table></div>`;
}

function renderSummaryTab(g){
  if (!CUR.loaded.events) return '<div class="loading-state">Loading…</div>';
  const st = computeGame(g, CUR.events);
  const n = periodCount(g), over = isGameOver(g);
  const res = resultWord(st.us, st.them);

  const head = `<div class="result-card ${over ? res.toLowerCase() : ''}">
      <div class="result-word">${over ? res : 'In progress'}</div>
      <div class="result-score">
        <span>${escapeHtml(teamLabel(g, 'us'))}</span><b>${st.us}</b><i aria-hidden="true">:</i><b>${st.them}</b><span>${escapeHtml(teamLabel(g, 'them'))}</span>
      </div>
      ${g.status === 'live' && over ? '<div class="hint">Full time. Not finalised yet.</div>' : ''}
    </div>`;

  const periods = Array.from({ length:n }, (_, i) => i + 1);
  const cell = (p, side) => st.byPeriod[p] ? st.byPeriod[p][side] : '·';
  const byPeriod = `<h3 class="subhead">Score by ${escapeHtml(periodNoun(g))}</h3>
    <div class="fair-wrap"><table class="fair">
      <thead><tr><th scope="col">Team</th>${periods.map(p => `<th scope="col">${escapeHtml(periodName(g, p))}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>
        <tr><td>${escapeHtml(teamLabel(g, 'us'))}</td>${periods.map(p => `<td>${cell(p, 'us')}</td>`).join('')}<td class="total">${st.us}</td></tr>
        <tr><td>${escapeHtml(teamLabel(g, 'them'))}</td>${periods.map(p => `<td>${cell(p, 'them')}</td>`).join('')}<td class="total">${st.them}</td></tr>
      </tbody>
    </table></div>`;

  // Shooting: who shot, from which positions, and how accurately.
  const shooterPos = {};
  CUR.events.filter(e => !e.undone && (e.type === 'goal' || e.type === 'miss') && e.playerId && e.pos)
    .forEach(e => { (shooterPos[e.playerId] = shooterPos[e.playerId] || new Set()).add(e.pos); });
  const shooters = Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .sort((a, b) => b[1].goal - a[1].goal || playerName(a[0]).localeCompare(playerName(b[0])));
  const ourShots = st.us + shooters.reduce((s, [, r]) => s + r.miss, 0);
  const oppRows = ['GS', 'GA', 'Team'].filter(k => st.opp[k].goal + st.opp[k].miss);
  const shooting = `<h3 class="subhead">Shooting</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Shooter</th><th scope="col">Pos</th><th scope="col">Goals</th><th scope="col">%</th></tr></thead>
      <tbody>
        ${shooters.map(([id, r]) => `<tr><td>${escapeHtml(playerName(id))}</td><td>${escapeHtml(Array.from(shooterPos[id] || []).join(', '))}</td>
          <td>${r.goal}/${r.goal + r.miss}</td><td>${pctText(r.goal, r.goal + r.miss)}</td></tr>`).join('')}
        <tr class="team-total"><td>${escapeHtml(teamLabel(g, 'us'))}</td><td></td><td>${st.us}/${ourShots}</td><td>${pctText(st.us, ourShots)}</td></tr>
        ${oppRows.some(k => k !== 'Team') ? oppRows.map(k => `<tr class="opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td>${k}</td>
          <td>${st.oppMiss ? st.opp[k].goal + '/' + (st.opp[k].goal + st.opp[k].miss) : st.opp[k].goal}</td><td>${st.oppMiss ? pctText(st.opp[k].goal, st.opp[k].goal + st.opp[k].miss) : '·'}</td></tr>`).join('') : ''}
        <tr class="team-total opp"><td>${escapeHtml(teamLabel(g, 'them'))}</td><td></td><td>${st.oppMiss ? st.them + '/' + (st.them + st.oppMiss) : st.them}</td><td>${st.oppMiss ? pctText(st.them, st.them + st.oppMiss) : '·'}</td></tr>
      </tbody>
    </table></div>
    `;

  const playing = new Set(availableIds(g));
  const ids = byName(Array.from(new Set([...Object.keys(st.players).filter(id => st.players[id].ms), ...playing])));
  // Least court time first, so anyone who's missed out stands out.
  const rows = ids.map(id => ({ id, ms:(st.players[id] || {}).ms || 0, pos:(st.players[id] || {}).pos || {} }))
    .sort((a, b) => a.ms - b.ms);
  const benched = rows.filter(r => !r.ms && playing.has(r.id)).length;
  const court = `<h3 class="subhead">Court time</h3>
    ${courtTimeTable(rows, fmtMins, playing)}
    <p class="hint">Minutes and seconds in each position.${benched ? ` ${benched} player${benched === 1 ? ' was' : 's were'} marked as playing but didn't get on court (highlighted).` : ''}</p>`;

  prepareShare(g, st);
  const share = `<div class="lineup-tools" style="justify-content:center">
      <button class="btn" data-action="share-summary">Share result</button>
    </div>`;
  return head + share + byPeriod + shooting + court;
}

/* ---- Sharing a game result ----
   A picture card plus a short text version, for team group chats. Court
   time is deliberately left out of what's shared. The picture is made in
   advance (while the Summary tab is open), because iPhones only allow
   sharing straight after a tap. */
function summaryShareText(g, st){
  const n = periodCount(g), over = isGameOver(g);
  const lines = [`${teamLabel(g, 'us')} ${st.us} : ${st.them} ${teamLabel(g, 'them')}`];
  lines.push([over ? resultWord(st.us, st.them) : 'In progress', g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : '']
    .filter(Boolean).join(' · '));
  const periods = [];
  for (let p = 1; p <= n; p++) if (st.byPeriod[p]) periods.push(`${periodName(g, p)} ${st.byPeriod[p].us}:${st.byPeriod[p].them}`);
  if (periods.length) lines.push(periods.join(' · '));
  const shooters = shareShooters(st);
  if (shooters.length){
    const shots = shooters.reduce((s, x) => s + x.shots, 0);
    lines.push(`Shooting: ${shooters.map(x => `${x.name} ${x.goals}/${x.shots}`).join(', ')} (${st.us}/${shots}, ${pctText(st.us, shots)})`);
  }
  return lines.join('\n');
}

// e.g. "Sat 1 May" (no year or time), for the shared result.
function shareDate(g){
  const d = parseIsoDate(g.date);
  return d ? d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }).replace(/,/g, '') : '';
}

function shareShooters(st){
  return Object.entries(st.players).filter(([, r]) => r.goal + r.miss)
    .map(([id, r]) => ({ name:playerName(id), goals:r.goal, shots:r.goal + r.miss }))
    .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
}

// Draws the result card as a 1080 x 1080 picture and returns it as a PNG.
async function summaryImage(g, st){
  try {
    await Promise.all([
      document.fonts.load('900 100px Archivo'),
      document.fonts.load('700 40px "DM Sans"'),
      document.fonts.load('800 40px "DM Sans"')
    ]);
  } catch(e){ /* falls back to system fonts */ }
  const W = 1080, c = document.createElement('canvas');
  c.width = W; c.height = W;
  const x = c.getContext('2d');
  x.fontStretch = 'extra-condensed'; // narrow Archivo headings, like the app (DM Sans has no narrow width)
  const display = (size, weight) => `${weight || 900} ${size}px Archivo, "Arial Narrow", sans-serif`;
  const body = (size, weight) => `${weight || 700} ${size}px "DM Sans", "Segoe UI", sans-serif`;
  const fit = (text, max) => { let t = String(text); while (t.length > 1 && x.measureText(t).width > max) t = t.slice(0, -2) + '…'; return t; };
  const over = isGameOver(g), res = resultWord(st.us, st.them);

  // Background and header band.
  x.fillStyle = '#F5F5F6'; x.fillRect(0, 0, W, W);
  // Ink band with white text, like the app's top bar.
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, 150);
  // The black and white stripe under the bar.
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 150, W, 12);
  x.fillStyle = '#0B0B0D'; for (let sx = 12; sx < W; sx += 24) x.fillRect(sx, 150, 12, 12);
  // Ball: the same white netball with pink seams as the logo.
  drawBall(x, 95, 75, 42);
  x.fillStyle = '#FFFFFF'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.font = display(58); x.fillText('NETTY PAL', 160, 78);
  x.fillStyle = '#B4B4BC'; x.textAlign = 'right'; x.font = body(34);
  x.fillText(fit([g.round ? 'Round ' + g.round : '', g.date ? shareDate(g) : ''].filter(Boolean).join(' · '), 560), W - 60, 78);

  // Result word.
  x.textAlign = 'center';
  x.fillStyle = !over ? '#C8641C' : res === 'Won' ? '#2E7550' : res === 'Lost' ? '#B3261E' : '#0B0B0D';
  x.font = display(90); x.fillText((over ? res : 'In progress').toUpperCase(), W / 2, 250);

  // Teams and score. Team names are never cut short: long ones get a
  // smaller font, and wrap onto a second line if still too wide.
  const teamName = (name, cx) => {
    const max = 440, text = String(name).toUpperCase();
    let size = 40;
    x.font = body(size, 800);
    while (size > 30 && x.measureText(text).width > max){ size -= 2; x.font = body(size, 800); }
    if (x.measureText(text).width <= max){ x.fillText(text, cx, 370); return; }
    const words = text.split(' '), lines = [''];
    words.forEach(w => {
      const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
      if (x.measureText(tryLine).width <= max || !lines[lines.length - 1]) lines[lines.length - 1] = tryLine;
      else lines.push(w);
    });
    const shown = lines.slice(0, 2);
    if (lines.length > 2) shown[1] = lines.slice(1).join(' ');
    shown.forEach((line, i) => x.fillText(line, cx, 370 + (i - (shown.length - 1) / 2) * (size + 4)));
  };
  x.fillStyle = '#5F5F66';
  teamName(teamLabel(g, 'us'), 290);
  teamName(teamLabel(g, 'them'), 790);
  x.fillStyle = '#0B0B0D'; x.font = display(240);
  x.fillText(String(st.us), 290, 520); x.fillText(String(st.them), 790, 520);
  x.fillStyle = '#A6A6AE'; x.font = display(150); x.fillText(':', W / 2, 505);

  // Score by period.
  const n = periodCount(g), boxW = 200, gap = 20, left = (W - (n * boxW + (n - 1) * gap)) / 2;
  for (let p = 1; p <= n; p++){
    const bx = left + (p - 1) * (boxW + gap);
    x.fillStyle = '#FFFFFF'; x.strokeStyle = '#E1E1E5'; x.lineWidth = 3;
    x.beginPath(); x.roundRect(bx, 660, boxW, 150, 6); x.fill(); x.stroke();
    x.fillStyle = '#C2005E'; x.font = display(44); x.fillText(periodName(g, p).toUpperCase(), bx + boxW / 2, 705);
    x.fillStyle = '#0B0B0D'; x.font = display(64);
    x.fillText(st.byPeriod[p] ? `${st.byPeriod[p].us} : ${st.byPeriod[p].them}` : '-', bx + boxW / 2, 770);
  }

  // Shooters.
  const shooters = shareShooters(st);
  if (shooters.length){
    x.fillStyle = '#5F5F66'; x.font = body(32, 800); x.fillText('SHOOTING', W / 2, 880);
    x.fillStyle = '#0B0B0D'; x.font = body(40);
    const shots = shooters.reduce((s, y) => s + y.shots, 0);
    x.fillText(fit(shooters.map(s => `${s.name} ${s.goals}/${s.shots}`).join('   ·   '), W - 120), W / 2, 940);
    x.fillStyle = '#5F5F66'; x.font = body(32);
    x.fillText(`Team ${st.us}/${shots} (${pctText(st.us, shots)})`, W / 2, 1000);
  }
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('No image')), 'image/png'));
}

function prepareShare(g, st){
  const text = summaryShareText(g, st);
  const key = g.id + '|' + text;
  if (CUR.share && CUR.share.key === key) return;
  const share = { key, text, file:null };
  share.ready = summaryImage(g, st).then(blob => {
    const name = `netty-pal-${nameKey(teamLabel(g, 'us')).replace(/ /g, '-')}-v-${nameKey(teamLabel(g, 'them')).replace(/ /g, '-')}.png`;
    share.file = new File([blob], name, { type:'image/png' });
  }).catch(err => console.warn('Netty Pal: share image', err));
  CUR.share = share;
}

async function shareSummary(g){
  const st = computeGame(g, CUR.events);
  prepareShare(g, st);
  // If the picture is still being made (Share tapped straight away), wait a
  // moment for it; any longer and phones may not allow the share any more.
  if (!CUR.share.file && CUR.share.ready)
    await Promise.race([CUR.share.ready, new Promise(r => setTimeout(r, 1000))]);
  const { text, file } = CUR.share;
  const title = `${teamLabel(g, 'us')} v ${teamLabel(g, 'them')}`;
  // Phones: the share menu, with the picture if the phone allows it.
  if (file && navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], text, title }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  if (navigator.share){
    try { await navigator.share({ title, text }); } catch(e){ if (e.name !== 'AbortError') throw e; }
    return;
  }
  // Computers: copy the text and save the picture.
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch(e){}
  if (file){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast(copied ? `Result copied${file ? ' and picture saved' : ''}. Paste it into a message.` : (file ? 'Picture saved.' : text));
}

// Loads the events of every game played so far this season (only while
// the Stats tab is open), so the season totals are worked out exactly the
// same way as each game's own summary.
function playedGames(){ return sortGames(CUR.games).filter(g => !g.archived && (g.status === 'live' || g.status === 'final')); }
function loadSeasonEvents(force){
  const games = playedGames();
  const key = games.map(g => `${g.id}:${g.status}:${g.summary ? g.summary.us + '-' + g.summary.them : ''}:${g.live ? g.live.period + g.live.phase : ''}`).join('|');
  if (!force && (CUR.seasonEventsKey === key || CUR.seasonEventsLoading)) return;
  CUR.seasonEventsKey = key;
  CUR.seasonEventsLoading = true;
  CUR.seasonEventsError = null;
  const seasonId = UI.seasonId;
  Promise.all(games.map(g => getDocs(eventsRef(g.id)).then(snap => [g.id, snap.docs.map(d => ({ id:d.id, ...d.data() }))])))
    .then(pairs => { if (UI.seasonId !== seasonId) return; CUR.seasonEvents = Object.fromEntries(pairs); })
    .catch(err => { console.warn('Netty Pal: season events', err); CUR.seasonEventsError = err; })
    .finally(() => { CUR.seasonEventsLoading = false; render(); });
}

function renderSeasonStatsTab(){
  if (!CUR.loaded.games || !CUR.loaded.players) return '<div class="loading-state">Loading…</div>';
  loadSeasonEvents(false);
  if (CUR.seasonEventsError) return `<div class="panel" role="alert"><p style="margin:0 0 0.6rem">Couldn't load the season's games.</p>
    <button class="btn small" data-action="reload-stats">Try again</button></div>`;
  if (!CUR.seasonEvents) return '<div class="loading-state">Adding up the season…</div>';

  const finished = playedGames().filter(g => isGameOver(g) && CUR.seasonEvents[g.id]);
  const inProgress = playedGames().filter(g => !isGameOver(g)).length;
  if (!finished.length) return `<div class="empty-state">No games have reached full time yet.${inProgress ? ' A game is in progress: its stats will appear here at full time.' : ' Stats appear here once games are scored.'}</div>`;

  const rec = { w:0, l:0, d:0, gf:0, ga:0, ourShots:0, oppShots:0 };
  const players = {};
  const P = id => players[id] || (players[id] = { id, ms:0, pos:{}, goal:0, miss:0, games:0 });
  const results = finished.map(g => {
    const st = computeGame(g, CUR.seasonEvents[g.id]);
    const r = resultWord(st.us, st.them);
    rec[r === 'Won' ? 'w' : r === 'Lost' ? 'l' : 'd']++;
    rec.gf += st.us; rec.ga += st.them; rec.oppShots += st.them + st.oppMiss;
    Object.entries(st.players).forEach(([id, s]) => {
      const p = P(id);
      p.ms += s.ms; p.goal += s.goal; p.miss += s.miss;
      rec.ourShots += s.goal + s.miss;
      if (s.ms) p.games++;
      Object.entries(s.pos).forEach(([pos, v]) => { p.pos[pos] = (p.pos[pos] || 0) + v; });
    });
    return { g, st, r };
  });

  const recordCard = `<div class="record-grid">
      <div class="rec"><b>${finished.length}</b><span>Played</span></div>
      <div class="rec won"><b>${rec.w}</b><span>Won</span></div>
      <div class="rec lost"><b>${rec.l}</b><span>Lost</span></div>
      <div class="rec"><b>${rec.d}</b><span>Drawn</span></div>
      <div class="rec wide"><b>${rec.gf} : ${rec.ga}</b><span>Goals for : against</span></div>
      <div class="rec"><b>${pctText(rec.gf, rec.ourShots)}</b><span>Our shooting</span></div>
      <div class="rec"><b>${(rec.ga / finished.length).toFixed(1).replace(/\.0$/, '')}</b><span>Opponent goals per game</span></div>
    </div>
    ${inProgress ? `<p class="hint">${inProgress} game${inProgress === 1 ? ' is' : 's are'} in progress and not included yet.</p>` : ''}`;

  const resultsList = `<h3 class="subhead">Results</h3>
    <div class="list-card">${results.slice().reverse().map(({ g, st, r }) => `
      <button class="result-row" data-action="open-game" data-game="${escapeHtml(g.id)}">
        <span class="grow"><span class="pname">${escapeHtml(gameTitle(g))}</span>
          <span class="psub">${g.round ? 'Round ' + escapeHtml(g.round) + ' · ' : ''}${escapeHtml(fmtGameWhen(g))}${g.status === 'final' ? '' : ' · not finalised'}</span></span>
        <span class="result-badge ${r.toLowerCase()}">${r} ${st.us} : ${st.them}</span>
      </button>`).join('')}</div>`;

  const list = Object.values(players).filter(p => p.ms || p.goal + p.miss)
    .sort((a, b) => playerName(a.id).localeCompare(playerName(b.id)));
  const playerTable = `<h3 class="subhead">Players</h3>
    <div class="fair-wrap"><table class="fair stats-table">
      <thead><tr><th scope="col">Player</th><th scope="col">Games</th><th scope="col">Mins</th><th scope="col">Avg mins per game</th><th scope="col">Goals</th><th scope="col">%</th></tr></thead>
      <tbody>${list.map(p => `<tr><td>${escapeHtml(playerName(p.id))}</td><td>${p.games}</td><td>${minsText(p.ms)}</td><td>${p.games ? (p.ms / 60000 / p.games).toFixed(1).replace(/\.0$/, '') : '·'}</td>
        <td>${p.goal + p.miss ? p.goal + '/' + (p.goal + p.miss) : '·'}</td><td>${pctText(p.goal, p.goal + p.miss)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="hint">Games counts games where they got on court. Mins is total court time; the average only counts games they played, so a missed game doesn't pull it down.</p>`;

  const court = `<h3 class="subhead">Court time by position</h3>
    ${courtTimeTable(list, minsText)}
    <p class="hint">Total minutes in each position this season. Darker means more.</p>`;

  return `${recordCard}${resultsList}${playerTable}${court}
    <div class="lineup-tools"><button class="btn ghost small" data-action="reload-stats">Refresh</button></div>`;
}

/* ---------------------------------------------------------------------
   Loading data
--------------------------------------------------------------------- */
async function loadHome(){
  HOME.loaded = false;
  HOME.failed = 0;
  render();
  try {
    const snaps = await getMembershipDocs();
    const items = await Promise.all(snaps.map(async (ms) => {
      try { return await loadHomeItem(ms); }
      catch (err){
        // Keep going with the other teams; this one gets a retry prompt.
        console.warn('Netty Pal: could not load team', err);
        HOME.failed++;
        return null;
      }
    }));
    HOME.items = items.filter(Boolean).sort((a,b) =>
      a.teamName.localeCompare(b.teamName) || b.seasonName.localeCompare(a.seasonName));
  } catch (err){
    console.warn('Netty Pal: could not load teams', err);
    HOME.failed++;
    HOME.items = [];
  }
  HOME.loaded = true;
  render();
}

async function loadHomeItem(ms){
  const { teamId, seasonId } = ms;
  // Our own member record can always be read, so this is a reliable
  // test of whether we still belong to the season.
  const memberSnap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
  if (!memberSnap.exists()){
    // Definitely removed (or left): tidy up our pointer to it.
    await forgetMembershipIfGone(teamId, seasonId);
    return null;
  }
  const [teamSnap, seasonSnap] = await Promise.all([
    getDoc(doc(db, 'teams', teamId)),
    getDoc(doc(db, 'teams', teamId, 'seasons', seasonId))
  ]);
  if (!teamSnap.exists() || !seasonSnap.exists()) return null;
  const team = teamSnap.data(), season = seasonSnap.data();
  return { teamId, seasonId, teamName:team.name, seasonName:season.name, competition:season.competition,
    roles:memberSnap.data().roles || [], isAdmin:team.adminUid === USER.uid };
}

// Only forgets a season once we've confirmed our member record is really
// gone. A temporary error (bad connection, rules being updated) must never
// cost someone their link to a team.
async function forgetMembershipIfGone(teamId, seasonId){
  try {
    const snap = await getDoc(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid));
    if (snap.exists()) return false;
    await deleteDoc(doc(db, 'users', USER.uid, 'memberships', seasonId));
    return true;
  } catch (err){
    console.warn('Netty Pal: membership check failed', err);
    return false;
  }
}

async function getMembershipDocs(){
  const snap = await getDocs(collection(db, 'users', USER.uid, 'memberships'));
  return snap.docs.map(d => d.data());
}

function closeSeason(){
  stopEvents();
  CUR.unsubs.forEach(u => u());
  CUR = { team:null, season:null, members:[], players:[], games:[], unsubs:[], loaded:{},
    events:[], eventsFor:null, eventsUnsub:null };
}

function openSeason(teamId, seasonId){
  closeSeason();
  PRACTICE = null;
  UI = { ...UI, view:'season', teamId, seasonId, tab:'games', form:null, gameId:null };
  saveNav();
  render();
  const seasonRef = doc(db, 'teams', teamId, 'seasons', seasonId);
  let leaving = false;
  const lostAccess = async (err) => {
    console.warn('Netty Pal: season listener', err);
    if (leaving || UI.view === 'home' || UI.seasonId !== seasonId) return;
    if (!String(err && err.code).includes('permission-denied')){ fail(err); return; }
    leaving = true;
    const gone = await forgetMembershipIfGone(teamId, seasonId);
    toast(gone ? "You're no longer a member of that season."
      : "Couldn't load that team just now. Please try again in a moment.", true);
    goHome();
  };
  CUR.unsubs.push(onSnapshot(doc(db, 'teams', teamId), (snap) => {
    CUR.team = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(seasonRef, (snap) => {
    CUR.season = snap.exists() ? { id:snap.id, ...snap.data() } : null; render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'members'), (snap) => {
    CUR.members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.members = true;
    // If an admin removed us while we're looking at the season, leave.
    if (USER && !CUR.members.some(m => m.id === USER.uid)) lostAccess({ code:'permission-denied' });
    else render();
  }, lostAccess));
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'players'), (snap) => {
    CUR.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.players = true;
    render();
  }, lostAccess));
  // A problem reading games (for example security rules that haven't been
  // updated for a new feature yet) is shown on the Games tab rather than
  // throwing the user out of the whole team.
  CUR.unsubs.push(onSnapshot(collection(seasonRef, 'games'), (snap) => {
    CUR.games = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    CUR.loaded.games = true;
    CUR.gamesError = null;
    render();
  }, (err) => {
    console.warn('Netty Pal: games listener', err);
    CUR.gamesError = err;
    render();
  }));
}

--------------------------------------------------------------------- */
function memberProfile(){
  return { name: USER.displayName || USER.email || 'Unknown', email: USER.email || '', photoURL: USER.photoURL || '' };
}

// Picks a code nobody else is using. The security rules only allow a
// code to be created, never overwritten, so a clash can't hijack a team.
async function uniqueCode(){
  for (let i = 0; i < 6; i++){
    const code = randomCode();
    const snap = await getDoc(doc(db, 'joinCodes', code));
    if (!snap.exists()) return code;
  }
  throw new Error("Couldn't create a unique season code. Please try again.");
}

function readSeasonFields(fd){
  const mins = parseInt(fd.get('periodMinutes'), 10);
  return {
    name: String(fd.get('seasonName') || '').trim(),
    competition: String(fd.get('competition') || '').trim(),
    format: fd.get('format') === 'halves' ? 'halves' : 'quarters',
    periodMinutes: (mins >= 1 && mins <= 30) ? mins : DEFAULT_PERIOD_MINUTES
  };
}

// Writes a new season, its code, and makes the current user a member with
// both roles. Used by "create team" and "new season".
function addSeasonToBatch(batch, teamId, seasonId, code, fields){
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId), { ...fields, joinCode:code, createdAt:serverTimestamp() });
  batch.set(doc(db, 'teams', teamId, 'seasons', seasonId, 'members', USER.uid),

// Puts a player in a position for the selected period. If they were
// already somewhere else that period, whoever was in the target position
// moves into their old spot (a swap), so nobody is ever in two places.
// If the period was following an earlier one, it gets its own copy of that
// lineup first, with the change applied, and later periods follow it.
// base is the lineup to start from if it isn't the plan (between periods of
// a live game, the next period starts from the actual lineup).
async function setPlanSlot(pos, pid, base){
  const g = findGame(UI.gameId);
  if (!g) return;
  const p = UI.period;
  const next = { ...(base || planFor(g, p)) };
  if (pid){
    const from = POSITIONS.find(other => other !== pos && next[other] === pid);
    if (from){ if (next[pos]) next[from] = next[pos]; else delete next[from]; }
    next[pos] = pid;
  } else {
    delete next[pos];
  }
  await updateDoc(gameRef(g.id), { [`plan.${p}`]: next });
}

// Q1: empty it. Later periods: drop their own changes so they follow the
// period before again.
async function clearPeriod(){
  const g = findGame(UI.gameId);
  if (!g) return;
  await updateDoc(gameRef(g.id), { [`plan.${UI.period}`]: UI.period === 1 ? {} : deleteField() });
}

async function toggleAvail(pid){
  const g = findGame(UI.gameId);
  if (!g) return;
  const avail = new Set(availableIds(g));
  const updates = {};
  if (avail.has(pid)){
    avail.delete(pid);
    // Take them out of every period of this game's plan too.
    Object.entries(g.plan || {}).forEach(([k, slots]) => {
      Object.entries(slots || {}).forEach(([pos, id]) => { if (id === pid) updates[`plan.${k}.${pos}`] = deleteField(); });
    });
  } else {
    avail.add(pid);
  }
  updates.available = Array.from(avail);
  await updateDoc(gameRef(g.id), updates);
}
